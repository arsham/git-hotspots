name: Validation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run validation gate
        run: zig build validate

      - name: Run Tree-sitter build proof
        run: zig build tree-sitter-build-proof

      - name: Run Tree-sitter symbol proof
        run: zig build tree-sitter-symbol-proof

      - name: Run Tree-sitter Go build proof
        run: zig build tree-sitter-go-build-proof
