design:
  rough_shape:
    - Add a local release packaging surface, likely a Zig build step and/or
      small shell helper, that builds a native Linux release binary and
      assembles a release archive under an ignored output directory such as
      dist/.
    - "Add an Arch/AUR-compatible package directory for local dogfood. Default
      assumption: a git-hotspots-bin-style package consumes the generated
      release archive locally; source-building AUR packaging can be split later
      if Arsham prefers."
    - "Update public docs and validation checks so packaging claims stay
      precise: dogfood/local only, no published GitHub Release, no published AUR
      package, no upload automation, and Linux only for the initial pass."
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Local Linux release archive
      goal: Create a local-only command path that builds and assembles a native Linux
        release archive for git-hotspots without publishing it.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, tools/, .gitignore, README.md/doc references that
          mention source-build-only status."
        - "In scope: native Linux release-mode binary build, archive layout,
          redistributable notices, ignored output directory, actionable local
          errors."
        - "Out of scope: GitHub Release creation, uploads, signing, SBOMs,
          checksums beyond any simple local manifest chosen during
          implementation, cross-platform binaries, CI release automation."
        - "Protected: existing zig build, zig build test, zig build validate,
          --version output, local-first/no-network defaults, public OSS
          framing."
        - "Dependencies: none."
        - "Validation/evidence: run the release command, unpack the archive, run
          git-hotspots --version and --help from the unpacked binary, and prove
          no tracked generated artefacts are left behind."
        - "Review focus: archive contents are minimal and redistributable,
          command names are clear, and failure modes do not imply publishing."
        - "Escalate if: implementation needs network access, remote release
          metadata, credential handling, a versioning scheme change, or
          non-Linux support."
        - "Done boundary: release archive can be rebuilt locally on Linux and
          the unpacked binary passes version/help smoke checks."
      verification_commands:
        - zig build test
        - zig build validate
        - release archive command chosen by implementation
        - unpack archive and run git-hotspots --version plus --help
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Local AUR-compatible package setup
      goal: Add Arch/AUR package files and local dogfood instructions so Arsham can
        build and optionally install git-hotspots locally before any AUR
        publication.
      owner_phase: runner
      execution_context:
        - "Anchors: packaging/aur/ or packaging/arch/, release archive output
          from P1, docs/user-guide.md, README.md, man/git-hotspots.1 if install
          paths affect documented usage."
        - "In scope: PKGBUILD and related local files, package metadata,
          license/man-page installation, makepkg-oriented local build/install
          instructions, package smoke checks when Arch tooling is available."
        - "Out of scope: publishing to AUR, maintaining an AUR remote, source
          package split, non-Arch packages, dependency manager installation
          claims for public users."
        - "Protected: package setup must remain local/dogfood-labelled until
          publication is explicitly added; no remote fetch or upload by
          default."
        - "Dependencies: P1 release archive contract, unless Arsham chooses a
          source-building AUR package before execution."
        - "Validation/evidence: run makepkg metadata checks such as makepkg
          --printsrcinfo when available; build the package locally when
          available; inspect package contents or run installed binary smoke
          tests where safe; otherwise record manual unavailable-tool evidence."
        - "Review focus: package metadata is honest, reproducible enough for
          dogfood, and not presented as published AUR availability."
        - "Escalate if: package naming must be decided between git-hotspots and
          git-hotspots-bin, local package install would overwrite a user-managed
          binary, or root/system package installation is required for
          validation."
        - "Done boundary: local package can be built or its metadata validated
          on Arch Linux, with clear install/uninstall dogfood instructions."
      verification_commands:
        - makepkg --printsrcinfo from package directory when available
        - makepkg -f when available and safe
        - pacman -Qp built package when available
        - git-hotspots --version from installed or package-extracted binary
    - id: P3
      depends_on:
        - P1
        - P2
      status: planned
      title: Documentation and validation boundary
      goal: Update public docs, man page, and validation expectations so dogfood
        packaging is discoverable but not overclaimed.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, docs/developer-guide.md,
          man/git-hotspots.1, tools/validate.sh, tests/integration.sh if
          help/install claims change."
        - "In scope: source-vs-dogfood install wording, local binary archive
          instructions, local AUR package instructions, out-of-scope future
          publishing/platform notes, validation guardrail updates."
        - "Out of scope: marketing launch copy, hosted product strategy,
          pricing, public AUR/GitHub publication announcements."
        - "Protected: hotspots remain investigation prompts; runtime remains
          local-first; docs must not claim published binaries, package-manager
          availability, release tags, or automated publishing until those
          exist."
        - "Dependencies: P1 and P2 final command names and artefact paths."
        - "Validation/evidence: zig build validate, docs grep/validation checks,
          and a privacy-safe packaging smoke evidence note."
        - "Review focus: public-facing wording is polished, precise, and
          consistent across README, user guide, developer guide, man page, and
          validation script."
        - "Escalate if: docs need to promise a platform, package manager,
          release tag, or publishing workflow not implemented by P1/P2."
        - "Done boundary: all public docs and validation surfaces agree on local
          Linux dogfood status and supported commands."
      verification_commands:
        - zig build validate
        - rg -n packaged README.md docs/user-guide.md docs/developer-guide.md
          man/git-hotspots.1 tools/validate.sh
  output_contract:
    storage: Generated artefacts stay under ignored local build output such as dist/
      or zig-out/; durable packaging definitions and docs stay in tracked
      repository paths.
    artefacts:
      - native Linux release archive containing git-hotspots and redistributable
        notices
      - AUR-compatible package files for local makepkg use
      - documentation for local build, package, install, and smoke validation
    prohibited_content:
      - GitHub tokens or API calls
      - AUR publishing credentials or submission automation
      - absolute local paths in committed docs or evidence
      - network fetches or telemetry in default package/release commands
      - claims that binaries or AUR packages are already published
    consumers:
      - Arsham dogfooding on Linux
      - future manual GitHub Release upload flow
      - future AUR publishing feature
      - Flow verifier/reviewer
