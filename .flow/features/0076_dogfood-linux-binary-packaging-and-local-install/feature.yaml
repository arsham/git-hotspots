schema: flow-feature.v1
feature:
  id: "0076"
  slug: dogfood-linux-binary-packaging-and-local-install
  title: Dogfood Linux binary packaging and local install
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: git-hotspots is currently source-buildable but has no dogfood
    release/package path. Arsham wants a Linux-only way to build release
    binaries and an AUR-style local package setup before any public GitHub
    Release or AUR publication.
  outcome: The repository contains a documented, local-only Linux dogfood
    packaging path that can build a release-ready git-hotspots binary archive
    and an Arch/AUR-compatible package for local installation, while making
    publication, multi-platform support, signing, and hosted automation explicit
    future work.
  acceptance:
    - A local Linux release artefact command or script builds a release-mode
      git-hotspots binary archive suitable for later manual GitHub Release
      upload, including required redistributable notices such as LICENSE and
      third-party notices.
    - Generated release/package artefacts are local build outputs and ignored by
      default; the implementation does not call GitHub APIs, upload files,
      publish to AUR, fetch remote release data, emit telemetry, or add hosted
      release automation.
    - An AUR-compatible Arch Linux package setup exists in the repository for
      dogfood use and documents how Arsham can build and install it locally with
      standard Arch tooling while it remains unpublished.
    - The installed package exposes git-hotspots on PATH and preserves the
      existing version/help behaviour; when package tooling is unavailable, the
      documented smoke test has an explicit manual fallback.
    - "README.md, docs/user-guide.md, docs/developer-guide.md,
      man/git-hotspots.1, and validation guidance describe the status honestly:
      source build remains the public default, dogfood binaries/AUR packaging
      are local/unpublished, and future publishing/platform work is out of
      scope."
    - Validation proves existing source-build behaviour still works and adds
      packaging evidence for release archive creation plus AUR package
      metadata/build checks on Linux when local tools are available.
