schema: flow-feature.v1
feature:
  id: "0061"
  slug: inspect-only-typescript-tsx-symbol-line-history-evidence
  title: Inspect-only TypeScript/TSX symbol line-history evidence
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: TypeScript/TSX inspect symbols exist, but current-line Git evidence is
    not yet attached to those inspected symbol ranges.
  outcome: Attach provider-neutral current-line Git evidence to inspect-only
    TypeScript/TSX symbols without claiming true symbol history, lineage,
    ownership, quality, or type-aware semantics.
  acceptance:
    - Enable `--inspect <ts-or-tsx-path> --symbols --symbol-line-history` for
      `.ts`, `.tsx`, `.mts`, and `.cts` where symbols are available.
    - Reuse existing optional line-history fields and provider-neutral
      current-line blame/range model.
    - Preserve plain TypeScript/TSX symbol output without
      `--symbol-line-history`.
    - Preserve existing no-provider and Zig/Go/Python/JavaScript symbol and
      line-history behaviours.
    - Degrade safely for shallow, partial, dirty inspected file, unsupported,
      empty, invalid, unavailable, symlink, too-large, and missing-current
      cases.
    - Do not add true symbol history, `git log -L`, type checking,
      tsconfig/package/module analysis, ownership/risk/quality/developer
      metrics, cache, network, telemetry, upload, or remote enrichment.
planning:
  state: ready
  summary: Attach existing current-line Git evidence to inspect-only
    TypeScript/TSX symbols, following the JavaScript line-history precedent
    while preserving current-only caveats and all protected outputs.
  brief_sync:
    status: updated
    reason: Supports B001 provider expansion by adding opt-in current-line evidence
      for TypeScript/TSX symbols while preserving deterministic Git evidence as
      product truth.
    checked_at: 2026-05-25T21:45:40.608Z
