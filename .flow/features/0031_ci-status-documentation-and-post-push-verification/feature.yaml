design:
  rough_shape:
    - Verify GitHub Actions Validation run status for latest pushed master.
    - Add a small CI/local-validation note to CONTRIBUTING or README only if
      useful.
    - Keep workflow and runtime unchanged.
  packets:
    - id: P1
      title: CI status verification and minimal docs
      goal: Verify pushed CI success and add the smallest useful public documentation
        clarification.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: .github/workflows/ci.yml, CONTRIBUTING.md, README.md, GitHub
          Actions run list."
        - "In scope: verify pushed GitHub Actions success; add minimal public
          documentation note if useful."
        - "Out of scope: badges, release automation, package publishing,
          artifacts, cache, coverage, CodeQL, schedule, matrix, secrets,
          deployment, workflow broadening, runtime code changes."
        - "Protected: local validation remains source of truth; README remains
          polished and visitor-facing; repo contains no
          monetisation/SaaS/commercial strategy."
        - "Dependencies: Feature 0030 must have been pushed and a GitHub Actions
          Validation run must be observable."
        - "Validation/evidence: GitHub run status check, git diff --check, zig
          build validate, changed-path inspection, prohibited-claim scan."
        - "Review focus: CI evidence is real/current; docs are minimal and
          accurate; no public clutter or workflow broadening was added."
        - "Escalate if: GitHub run is missing/pending/failed, GitHub access is
          unavailable, workflow fix is required, or docs need a badge/release
          promise."
        - "Done boundary: successful GitHub run evidence recorded, docs/no-docs
          decision justified, validation green, and git status clean."
      anchors:
        - .github/workflows/ci.yml
        - CONTRIBUTING.md
        - README.md
      in_scope:
        - Verify public CI status.
        - Minimal docs clarification.
      out_of_scope:
        - Workflow behaviour changes beyond a concrete reshaped fix.
        - Release, package, artifact, cache, coverage, matrix, secret,
          telemetry, or deployment changes.
        - Runtime product changes.
      protected_surfaces:
        - public README polish
        - local-first OSS boundary
        - minimal CI scope
      dependencies:
        - "0030"
      validation:
        - gh run list --repo arsham/git-hotspots --limit 5 --json
          databaseId,status,conclusion,workflowName,headBranch,headSha,event,createdAt,url
        - git diff --check
        - zig build validate
      review_focus:
        - public CI evidence
        - docs minimality
        - no workflow broadening
      escalate_if:
        - CI run is missing, pending, or failed.
        - Documentation would require a badge or release promise.
        - Workflow correction is needed.
      done_boundary: CI verification and docs/no-docs decision are durable, validation
        passes, and repo is clean.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
