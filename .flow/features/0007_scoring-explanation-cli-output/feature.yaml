design:
  rough_shape:
    - Add a static explanation renderer/helper, preferably in `src/report.zig`
      or a small dedicated module, with unit tests for exact key snippets.
    - Extend CLI parser with a boolean `--explain` mode that exits before repo
      analysis and rejects combinations with analysis flags.
    - Add `fixtures/expected/explain.txt` and integration tests for repeated
      deterministic output, stdout-only success, and clear invalid-combination
      errors.
    - Extend `tools/validate.sh` with explain golden/determinism and
      allowlist-aware prohibited-claim scans.
    - Update README with a compact `How to read scores` section mirroring the
      CLI explanation without overclaiming.
    - Do not modify `src/scoring.zig`, `src/git.zig`, score formulas, ranking
      order, filter semantics, table/JSON/Markdown report schemas, or existing
      report goldens except where validation commands add explicit explain
      outputs.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Scoring explanation contract
      goal: Add deterministic static explanation text that matches the existing
        scoring/confidence/caveat/filter semantics without changing analysis
        behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: src/scoring.zig, src/git.zig, src/report.zig or a small
          explanation module, tests/integration.sh."
        - "In scope: explanation content for score components, total=sum,
          confidence thresholds, caveat classes, include/exclude scope filters,
          and non-claims."
        - "Out of scope: scoring formula changes, confidence threshold changes,
          Git collection/filtering changes, report schema changes, per-repo
          explanation mode, machine-readable explanation schema."
        - "Protected: no changes to score(), confidence(), lessThan(), Git
          analysis, scope filtering, co-change expansion, table/JSON/Markdown
          report outputs, or privacy posture."
        - "Dependencies: completed scoring/report/filter baseline from Features
          0002-0006."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; unit or integration assertions for key exact explanation
          snippets."
        - "Review focus: explanation matches current code, especially
          churn/recency/cochange caps and confidence thresholds, and does not
          overclaim risk, quality, bugs, or developer performance."
        - "Escalate if: accurate explanation requires changing scoring, adding
          data to the model, or committing to a JSON explanation schema."
        - "Done boundary: static explanation text exists and is testable, but
          CLI exposure may wait for P2."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Standalone CLI exposure
      goal: Expose the static explanation as `git-hotspots --explain`, rejecting
        analysis-flag combinations and preserving existing default/report
        behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, fixtures/expected/explain.txt,
          tests/integration.sh."
        - "In scope: parse `--explain`, document it in help, exit before repo
          analysis, reject combinations with analysis flags, add deterministic
          golden output and repeated-output diff."
        - "Out of scope: explain subcommands, `--format` variants for explain,
          per-repo explanation, report schema additions, default verbosity
          changes."
        - "Protected: `git-hotspots` default remains table analysis; `--help`,
          invalid format, and existing table/json/markdown outputs remain stable
          except help text mentioning `--explain`."
        - "Dependencies: P1 explanation content exists."
        - "Validation/evidence: zig build; zig build test; zig build run --
          --help; `git-hotspots --explain` golden diff; invalid combination
          stderr tests; repeated explain output diff."
        - "Review focus: standalone mode works outside Git repos, succeeds with
          stdout only, and cannot accidentally run Git analysis or leak repo
          paths."
        - "Escalate if: CLI needs subcommands, format-specific explain output,
          or breaking parser behaviour."
        - "Done boundary: users can run `--explain` safely and
          deterministically."
      verification_commands:
        - zig build
        - zig build test
        - zig build run -- --help
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Validation and public docs hardening
      goal: Make explain output part of canonical validation and document score
        interpretation in public README without overclaiming.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, tests/integration.sh, README.md,
          fixtures/expected/explain.txt."
        - "In scope: add `zig build validate` rungs for explain
          golden/determinism and allowlist-aware prohibited-claim scan; add
          README `How to read scores` section."
        - "Out of scope: docs site, man page, templates, configurable scoring,
          provider/cache docs, commercial/hosted strategy, release/CI work."
        - "Protected: README stays visitor-facing and OSS-safe; validation
          summaries stay privacy-safe and do not print raw private reports."
        - "Dependencies: P2 CLI exposure exists."
        - "Validation/evidence: zig build validate; close-out mode with sibling
          repo or explicit privacy-safe skip reason; git diff --check; flow
          validate --target feature:0007 --format json."
        - "Review focus: validation catches explanation drift and positive
          prohibited claims while allowing safe negated disclaimers."
        - "Escalate if: prohibited-claim scanning becomes too brittle,
          validation needs new external tools, or docs need broader product
          positioning."
        - "Done boundary: future validation protects the explanation output and
          public docs mirror the current semantics."
      verification_commands:
        - zig build validate
        - git diff --check
  output_contract:
    cli_flag: --explain
    mode: standalone static stdout; no repo analysis required
    invalid_combinations:
      - --repo
      - --limit
      - --format
      - --since
      - --include-prefix
      - --exclude-prefix
    format: plain text with stable headings; no JSON schema or machine-readable
      explanation contract yet
    required_topics:
      - investigation-prompt framing
      - score formula components
      - confidence thresholds
      - caveats
      - scope filters
      - limitations and non-claims
    deferred:
      - explain subcommand
      - per-repo explanation mode
      - JSON explanation schema
      - configurable weights
      - score redesign
      - man page/docs site
      - interactive tutorial
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
