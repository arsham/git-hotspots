feature:
  id: "0007"
  slug: scoring-explanation-cli-output
  title: Scoring explanation CLI output
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Reports expose score components and caveats, but the CLI does not
    provide a self-contained explanation of what the current score, confidence
    labels, caveats, and scope filters mean. Users need a deterministic local
    explanation so they can interpret reports without guessing or treating
    scores as bug predictions, quality ratings, or developer judgements.
  outcome: Add a standalone static `--explain` CLI output that describes current
    scoring semantics, confidence thresholds, caveats, scope filters,
    limitations, and non-claims without requiring repo analysis or changing
    analysis/report behaviour.
  acceptance:
    - "`git-hotspots --explain` exits 0 and writes deterministic static
      explanation text to stdout without requiring a Git repository."
    - "`--explain` is standalone: combining it with analysis flags such as
      `--repo`, `--limit`, `--format`, `--since`, `--include-prefix`, or
      `--exclude-prefix` fails clearly on stderr."
    - Help text documents `--explain` and existing analysis options remain
      otherwise unchanged.
    - Existing table, JSON, and Markdown report outputs remain byte-stable
      except for unrelated generated timestamps or explicitly documented fixture
      updates; Feature 0007 does not change Git analysis, scoring, filtering,
      ranking, tie-breakers, or report schemas.
    - "Explanation text matches current `src/scoring.zig`: frequency =
      change_count * 10; churn = min(churn / 25, 40); recency = max(0, 20 -
      age_days) with 20 for HEAD timestamp; cochange = min(cochange_total * 2,
      20); total is the sum."
    - "Explanation text matches current confidence thresholds: high requires at
      least 3 changes and no caveats; medium requires at least 2 changes; low
      otherwise."
    - Explanation text describes current caveat classes, including shallow
      history, partial/promisor history, dirty worktree, binary/non-text churn,
      large commits, and deleted/not-present-at-HEAD paths.
    - "Explanation text describes scope filters: include/exclude prefixes are
      literal repo-relative prefixes, filters apply before
      aggregation/scoring/co-change/limit, and excludes win over includes."
    - Explanation text states hotspots are local Git-history investigation
      prompts, not bug predictions, objective code-quality ratings, maintainer
      judgement, developer rankings, productivity analytics, AI/LLM judgement,
      or technical-debt scores.
    - "`zig build validate` includes explain-output golden/determinism and
      prohibited-claim validation; close-out also runs normal validation and
      Flow validation when available."
