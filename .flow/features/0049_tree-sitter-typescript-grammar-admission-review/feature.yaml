      title: TypeScript grammar admission review document
      goal: Add one docs-only admission review for tree-sitter-typescript that records
        upstream identity, provenance, license, compatibility, scanner, TS/TSX
        scope, query, monorepo, and future validation gates before source
        import.
      owner_phase: runner
      depends_on: []
      status: pending
      execution_context:
        - "Anchors: docs/tree-sitter-typescript-grammar-admission.md,
          docs/tree-sitter-multi-language-query-strategy.md,
          docs/tree-sitter-javascript-grammar-admission.md,
          docs/tree-sitter-python-grammar-admission.md"
        - "In scope: one documentation-only TypeScript grammar admission review
          with candidate identity, immutable revision/checksum gates,
          license/notice, generated parser/scanner provenance for TypeScript and
          TSX where applicable, core ABI compatibility, BOM/excluded file
          classes, source-size/build-impact, TS/TSX scope decision, query
          fixture gates, monorepo path behaviour, Node-as-context-only language
          boundary, and decision state"
        - "Out of scope: third_party/tree-sitter-typescript import,
          source/build/test/fixture changes, build.zig.zon, CI changes, provider
          registry, CLI flags, report schema changes, scoring, cache, runtime
          TypeScript provider behaviour, custom user queries,
          package.json/tsconfig/workspace/dependency analysis, LSP,
          release/package work"
        - "Protected: local-first behaviour, no network/telemetry/upload/remote
          enrichment, no background provider execution, no bug
          prediction/code-quality scoring/developer ranking/maintainer
          judgement, existing Zig/Go/Python provider behaviour"
        - "Dependencies: Feature 0034 language strategy is complete and
          identifies TypeScript as a future candidate subject to admission
          gates; JavaScript admission should be shaped first in the queue"
        - "Validation/evidence: git diff --check; zig build validate; docs-only
          changed-path scan; no tree-sitter-typescript source import scan;
          prohibited-claim/privacy/local-first scan over changed docs"
        - "Review focus: admission gates are concrete enough to shape the next
          TypeScript source-import feature without overclaiming TypeScript
          runtime support"
        - "Escalate if: implementation requires source import, build/runtime
          changes, provider registry, CLI/report schema changes, custom query
          execution, package/module/tsconfig analysis, LSP integration, Node
          provider identity, or unsupported public TypeScript support claims"
        - "Done boundary: admission document exists, no protected surfaces
          changed, validation passes, and future import/runtime sequencing is
          explicit"
      anchors:
        - docs/tree-sitter-typescript-grammar-admission.md
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/tree-sitter-javascript-grammar-admission.md
        - docs/tree-sitter-python-grammar-admission.md
      in_scope:
        - One docs-only TypeScript grammar admission review document.
        - Future TypeScript source-import and provider validation gates.
        - Explicit TypeScript runtime deferral and decision state.
      out_of_scope:
        - TypeScript grammar import or vendored source changes.
        - Runtime TypeScript provider, CLI, report schema, scoring, cache, CI,
          release, or package changes.
        - Custom query execution, LSP, package/module/tsconfig analysis, or
          workspace discovery.
      protected_surfaces:
        - Runtime CLI behaviour and report schema.
        - File-level Git evidence truth.
        - Local-first and privacy boundaries.
        - Existing Zig, Go, and Python provider behaviour.
        - Third-party vendored source state.
      validation_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for docs-only scope
        - no tree-sitter-typescript source import scan
        - prohibited-claim and privacy scan over changed docs
      review_focus:
        - TypeScript admission gates are concrete.
        - No runtime support is claimed.
        - Future sequencing is explicit.
        - Node is context only, not a provider.
        - Public repo boundaries are preserved.
      escalation_triggers:
        - Source import or build changes are needed.
        - Runtime TypeScript provider behaviour is needed.
        - Public docs imply TypeScript support exists.
        - Admission facts cannot be stated without unsupported guesses.
      done_boundary: One docs-only TypeScript admission artefact is committed and
        independently reviewable.
