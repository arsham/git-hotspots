schema: flow-feature.v1
feature:
  id: "0049"
  slug: tree-sitter-typescript-grammar-admission-review
  title: Tree-sitter TypeScript grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: TypeScript and TSX are high-value Tree-sitter candidates, but they add
    type-only constructs, declarations, enums, decorators, TSX, multiple
    extensions, and possible multi-parser upstream layout. The repository needs
    a separate admission record before tree-sitter-typescript source import or
    runtime provider work.
  outcome: Add a documentation-only TypeScript grammar admission review that
    records upstream identity, TS/TSX scope, license, generated parser/scanner,
    Tree-sitter core compatibility, BOM, source-size, query, fixture, monorepo,
    and validation gates.
  acceptance:
    - Add docs/tree-sitter-typescript-grammar-admission.md as the single public
      admission review artefact.
    - The document records candidate upstream identity for
      tree-sitter-typescript, immutable revision or blocker, checksum
      requirement, proposed vendored path, BOM expectations, excluded file
      classes, and Tree-sitter core compatibility requirements.
    - The document records whether TSX is admitted with TypeScript or deferred;
      if deferred, .tsx remains unsupported until a later shaped feature.
    - The document records license and notice gates, generated parser and
      scanner provenance gates for TypeScript and TSX where applicable,
      local-first build supply-chain gates, source-size and build-impact gates,
      query fixture expectations, and no-provider stability gates for future
      TypeScript work.
    - The document states TypeScript runtime support is not implemented and
      current runtime Tree-sitter support remains Zig, Go, and Python only.
    - The document frames future TypeScript symbols as optional, current-only,
      inspect-oriented, additive, caveated provider evidence.
    - The document records Node as runtime context only, not a provider or
      parser identity.
    - The document records monorepo behaviour as inspect-path-only and
      extension-based; it must not imply package.json, tsconfig, workspace,
      bundler, dependency graph, module resolution, LSP, or repo-wide scanning.
    - No third_party, source, test, fixture, build, CI, CLI, report schema,
      scoring, cache, provider runtime, provider registry, release, package,
      network, telemetry, or background behaviour changes are made.
