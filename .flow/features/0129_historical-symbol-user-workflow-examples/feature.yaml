    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The historical-symbol surface now has stronger fixture and validation
          proof for fallback pressure and aggregate-bound behaviour, but users
          still need concise workflow examples that show how to interpret the
          evidence without overclaiming. Current documentation explains the
          concepts, yet it does not provide a compact walkthrough that connects
          historical symbol rows, fallback pressure, aggregate-bound caveats,
          and the relationship-evidence boundary in one investigation flow.
      - source_ref: prd.md#outcome[1]
        text: "Add public documentation examples that help a source-build user interpret
          --historical-symbols output as deterministic local evidence. The
          examples must remain evidence-only: they must not imply bug
          prediction, code-quality scoring, dependency truth, ownership
          analysis, complete call-graph semantics, or provider certainty."
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add or prove sufficient public examples for interpreting historical
      symbol rows, fallback pressure, aggregate-bound caveats, and the
      relationship-evidence boundary as deterministic local evidence.
    acceptance:
      - Public docs explain historical-symbol workflow interpretation from file
        evidence to historical-symbol rows and caveats.
      - Fallback row count, fallback hunk pressure, and aggregate-bound caveats
        are described without nearest-symbol guessing or semantic certainty
        claims.
      - Historical-symbol and relationship evidence are described as independent
        evidence streams, not dependency truth or complete call-graph truth.
      - Runtime behaviour, CLI flags, JSON schema, fixture goldens, scoring,
        provider admission, release/tag/package/remote/network/telemetry/cache
        behaviour stay unchanged.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify public examples preserve evidence-only framing
      - verify historical-symbol and relationship evidence remain independent
      - verify fallback pressure and aggregate-bound wording matches validation
        truth
  decision_budget:
    allowed_local_decisions:
      - docs wording placement that preserves meaning
      - validation-anchor addition for new durable wording
      - tracked no-change proof if examples are already sufficient
    deferred_reconcile_triggers:
      - minor docs wording trade-off worth reviewer visibility
      - validation guard omitted because no durable anchor changed
    hard_planner_escalation_triggers:
      - runtime behaviour change
      - CLI or JSON schema change
      - fixture golden data change
      - scoring or provider admission change
      - release tag package remote network telemetry or cache change
      - examples require private raw output or absolute local paths
    protected_surfaces:
      - runtime behaviour
      - CLI flags and options
      - JSON schema and report fields
      - ranking scoring and confidence
      - historical-symbol attribution semantics
      - relationship provider semantics
      - provider admission
      - fixture golden data
      - release tag package remote network telemetry cache behavior
      - privacy-safe project-relative examples
  fallback_path: deferred_reconcile_decision
  notes: null
