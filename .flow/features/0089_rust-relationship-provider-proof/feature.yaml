    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Rust has existing local Tree-sitter parser and current-symbol proof
          surfaces, and it is valuable for real-repo relationship evidence. Rust
          relationship extraction is also easy to overclaim because modules,
          traits, macros, generics, and method resolution require semantic
          knowledge that a syntax-only provider cannot prove.
      - source_ref: prd.md#outcome[1]
        text: Add bounded local Rust relationship provider support using the existing
          provider-neutral relation model and aggregation/report surfaces. The
          output remains opt-in behind --symbols --symbol-relationships,
          additive, deterministic, caveated, local-first, and evidence-only.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add Rust relationship provider support for retained ranked-file
      candidates behind the existing --symbols --symbol-relationships opt-in
      report, preserving deterministic local evidence, explicit Rust caveats,
      and no scoring effect.
    acceptance:
      - Rust relation extraction reuses the shared relation model, aggregation,
        and report surfaces.
      - Supported relation kinds include contains, reference, call,
        import_include, unresolved, and unknown where Rust Tree-sitter evidence
        supports them honestly.
      - Macros, trait resolution, method receiver type, module/crate resolution,
        generics, and dynamic dispatch remain caveated or unresolved unless
        syntactic evidence is sufficient.
      - Default output remains unchanged and --symbol-relationships still
        requires --symbols.
      - Docs, man page, help/explain/capability claims, fixtures, and validation
        are updated only to accurately reflect Rust relationship support.
      - JSON, Markdown, and table golden fixtures remain deterministic and
        privacy-safe when public output changes.
      - Rust provider proofs, zig build test, zig build validate, Flow
        validation, and privacy-safe real-repo or skip evidence are recorded.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build tree-sitter-rust-build-proof
      - zig build tree-sitter-rust-query-proof
      - zig build tree-sitter-rust-symbol-proof
      - zig build test
      - zig build validate
      - flow validate --target feature:0089
      - flow validate --target brief:B002
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces:
      - default output
      - new CLI flags
      - new report schema family
      - scoring/ranking
      - network/telemetry
      - Cargo/rust-analyzer dependency
      - macro or trait certainty claims
  fallback_path: deferred_reconcile_decision
  notes: null
