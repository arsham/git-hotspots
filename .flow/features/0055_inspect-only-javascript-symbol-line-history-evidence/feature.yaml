        - "Escalate if: existing line-history schema is insufficient, evidence
          requires git log -L or author data, dirty/shallow handling cannot stay
          honest, or TypeScript/TSX support becomes necessary."
        - "Done boundary: JavaScript inspected symbols support current-line
          evidence; no broader JS/Node/TS analysis is added."
