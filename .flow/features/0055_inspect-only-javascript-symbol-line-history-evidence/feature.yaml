          provider output, fixtures/expected, tests, docs/help/explain where
          needed."
        - "In scope: JavaScript current-line range evidence for .js/.mjs/.cjs
          and admitted .jsx, degraded cases, deterministic goldens,
          privacy/prohibited scans, real-repo smoke."
        - "Out of scope: git log -L, true symbol history/lineage,
