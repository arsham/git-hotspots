          JavaScript without --symbol-line-history stays stable."
        - "Dependencies: Feature 0054 inspect-only JavaScript symbol output
          complete."
        - "Validation/evidence: full validation ladder; JavaScript line-history
          goldens; repeated determinism; no-flag stability;
          shallow/partial/dirty cases; sibling-local-repo close-out smoke or
          honest no-safe-JS note."
        - "Review focus: line evidence is current-line Git evidence at HEAD,
          deterministic, caveated, privacy-safe, and not ownership/risk/history
