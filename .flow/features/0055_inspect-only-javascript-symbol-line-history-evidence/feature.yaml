    - Extend existing provider-neutral symbol-line-history path to JavaScript
      symbols.
    - Add deterministic table, JSON, Markdown, edge-case, and no-flag stability
      goldens.
    - Keep evidence caveated as current-line Git evidence only.
    - Preserve existing provider behaviours and default outputs.
