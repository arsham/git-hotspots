schema: flow-feature.v1
feature:
  id: "0055"
  slug: inspect-only-javascript-symbol-line-history-evidence
  title: JavaScript symbol line-history evidence
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0054 adds inspect-only JavaScript symbols, but JavaScript
    inspected symbols do not yet receive the provider-neutral current-line Git
    evidence available for Zig, Go, and Python symbols.
  outcome: The existing symbol-line-history path adds current-line Git evidence
    for inspected JavaScript symbols while avoiding true symbol history,
    authorship, Node/package analysis, and TypeScript/TSX claims.
  acceptance:
    - Support git-hotspots --inspect path.js --symbols --symbol-line-history for
      successful JavaScript symbols on .js, .mjs, .cjs, and admitted .jsx files.
    - Reuse the existing current-line blame/range model and existing optional
      line-history output fields.
    - Frame evidence as current-line Git evidence at HEAD, not true symbol
      history, ownership, risk, quality, ranking, authorship, or git log -L.
    - Preserve JavaScript symbol output without --symbol-line-history and
      existing Zig/Go/Python line-history behaviour.
    - Handle shallow, partial, dirty, unsupported, empty, invalid, unavailable,
      symlink, too-large, generated/minified, JSX, export/CommonJS, anonymous,
      and rename-alias cases deterministically.
    - Add deterministic JavaScript line-history goldens and
      privacy/prohibited-claim scans.
    - Do not add TypeScript/TSX support, Node/package/workspace/module analysis,
      cache, LSP, custom queries, network, telemetry, upload, or remote
      enrichment.
