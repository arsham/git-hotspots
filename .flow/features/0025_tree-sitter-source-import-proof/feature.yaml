  acceptance_contract:
    outcome: Import pinned Tree-sitter core and tree-sitter-zig source files under
      auditable third_party paths with complete provenance, license, notice,
      source-size, offline-validation, and no-provider stability proof, while
      stopping before compile/link/runtime/provider behavior.
    acceptance:
      - "Operator-approved boundary: vendored source files may be added under
        third_party, but no parser compile/link/runtime/provider behavior is
        allowed."
      - Tree-sitter core and tree-sitter-zig sources are imported only from
        pinned public upstream identities recorded in the PRD.
      - Each vendored component has copied MIT license text and a complete
        PROVENANCE.md.
      - A repo-level third-party notice or attribution artefact records public
        upstream attribution and repo-relative vendored paths.
      - Imported file manifests and excluded file classes are recorded; whole
        upstream repositories, submodules, package-manager wrappers, and
        unrelated bindings are not imported by default.
      - tree-sitter-zig src/parser.c provenance is reproduced, verified, or
        justified as a pinned upstream generated artefact with known blob, size,
        tag, and caveat.
      - Source-size and build-impact evidence is recorded, including parser.c
        size and largest vendored files.
      - zig build validate and close-out validation pass without build-time
        network, submodules, global parser packages, or system Tree-sitter
        dependencies.
      - Existing no-provider table, JSON, Markdown, and inspect outputs remain
        byte-stable.
      - No build.zig.zon, build.zig C compile/link path, parser runtime,
        provider registry,
        CLI/report/schema/scoring/cache/network/telemetry/background behavior is
        added.
      - Committed docs and evidence contain no private paths, private repo
        names, raw private output, raw parser stderr, commercial strategy,
        predictive defect claims, quality scoring, developer ranking, or
        maintainer judgement.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - find third_party -type f | LC_ALL=C sort
      - git ls-files -s | awk '$1=="160000"{print; bad=1} END{exit bad?1:0}'
      - test ! -f .gitmodules
      - test ! -f build.zig.zon
      - zig build validate
      - zig build validate -Dcloseout=true -Dsmoke-repo=<operator-local-repo>
        -Dsmoke-label=sibling-local-repo
      - git diff --name-status
      - git diff --name-only -- src tests fixtures/expected build.zig
        build.zig.zon tools/validate.sh
      - find third_party/tree-sitter-core third_party/tree-sitter-zig -type f
        -print0 | xargs -0 wc -c
      - wc -c third_party/tree-sitter-zig/*/src/parser.c
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
