design:
  rough_shape:
    - Import pinned Tree-sitter core source inputs under
      third_party/tree-sitter-core.
    - Import pinned tree-sitter-zig grammar/generated source inputs under
      third_party/tree-sitter-zig.
    - Add per-component license and PROVENANCE.md files plus a repo-level
      third-party notice artefact.
    - Record source-size, build-impact, local-only, no-provider-output, and
      privacy evidence.
    - Stop before parser compilation, provider runtime,
      CLI/report/schema/scoring/cache changes, CI, or release packaging.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Source identity BOM and provenance plan
      goal: Select and record exact source identities, file manifests, excluded
        classes, license/notice targets, and generated parser provenance basis.
      depends_on: []
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: docs/tree-sitter-vendoring-readiness.md;
          docs/tree-sitter-dependency-vendoring-plan.md;
          docs/provider-symbol-evidence-contract.md."
        - "In scope: finalise BOM, source identity, checksum, import paths,
          excluded classes, notice target, and parser.c provenance basis."
        - "Out of scope: source import without complete manifest/provenance
          plan; compile/link/runtime/provider behavior."
        - "Protected: no build.zig.zon; no build.zig compile/link path; no
          CLI/report/schema/scoring/cache changes."
        - "Dependencies: Features 0023 and 0024 source identities and readiness
          gates."
        - "Validation/evidence: record repo-relative manifest/provenance
          evidence in committed docs/provenance files; expected observation is
          complete public source identity and no private paths."
        - "Review focus: provenance honesty, license/notice target, minimal core
          file-set, generated parser basis, no unresolved close-out caveats."
        - "Escalate if: canonical source identity, checksums, minimal core
          file-set, or parser.c provenance cannot be represented honestly."
        - "Done boundary: reviewer can inspect planned import identity and
          provenance before or with source import."
      verification_commands:
        - git diff --check
    - id: P2
      title: Vendored source import and attribution artefacts
      goal: Add the approved pinned source files, component licenses, PROVENANCE.md
        files, and repo-level third-party notice artefact without build/runtime
        integration.
      depends_on:
        - P1
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: third_party/tree-sitter-core/; third_party/tree-sitter-zig/;
          THIRD_PARTY_NOTICES.md or justified equivalent."
        - "In scope: copy approved public source files, license files,
          provenance files, notice/attribution artefact, and BOM manifests."
        - "Out of scope: build graph changes, parser wrapper, provider registry,
          CLI flags, report fields, scoring, cache, tests for provider
          behavior."
        - "Protected: no submodules; no .gitmodules; no build.zig.zon; no
          package-manager lockfiles; no global/system parser dependency."
        - "Dependencies: P1 manifest and provenance decisions."
        - "Validation/evidence: git diff --name-status; find third_party -type f
          | LC_ALL=C sort; git ls-files -s submodule scan; protected path scan."
        - "Review focus: imported files match manifest; MIT licenses preserved;
          notice text public and repo-relative; source import remains
          non-runtime."
        - "Escalate if: source retrieval fails, license text is unclear,
          parser.c provenance is unresolved, size threshold triggers, or import
          needs runtime/build integration."
        - "Done boundary: source files and attribution artefacts are committed
          and auditable with no protected runtime changes."
      verification_commands:
        - git diff --check
        - find third_party -type f | LC_ALL=C sort
        - git ls-files -s | awk '$1=="160000"{print; bad=1} END{exit bad?1:0}'
        - test ! -f .gitmodules
        - test ! -f build.zig.zon
    - id: P3
      title: Measurement no-provider stability and close-out evidence
      goal: Prove source-size/build-impact evidence, offline validation, no-provider
        output stability, privacy, and local-first boundaries.
      depends_on:
        - P2
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh only if extra local validation gates are
          needed; otherwise validation artefacts and committed provenance docs."
        - "In scope: source-size measurements, validation timing evidence,
          no-provider output parity, privacy/no-network scans, close-out smoke."
        - "Out of scope: adding parser/provider behavior to make validation
          pass; modifying fixture expected outputs for provider fields;
          CI/release work."
        - "Protected: existing no-provider table, JSON, Markdown, and inspect
          outputs must remain byte-stable."
        - "Dependencies: P2 imported source files and attribution artefacts."
        - "Validation/evidence: run the full PRD validation ladder including
          close-out smoke with sibling-local-repo and summarize only
          privacy-safe bounded evidence."
        - "Review focus: offline/local-only proof, no-provider byte stability,
          source-size thresholds, protected path scans, and privacy scans."
        - "Escalate if: validation requires network/global packages, no-provider
          output changes, private paths appear, parser size thresholds trigger,
          or build time materially worsens."
        - "Done boundary: all source-import gates are proven and the feature can
          close without parser runtime or provider behavior."
      verification_commands:
        - git diff --check
        - zig build validate
        - zig build validate -Dcloseout=true -Dsmoke-repo=<operator-local-repo>
          -Dsmoke-label=sibling-local-repo
        - git diff --name-status
        - git diff --name-only -- src tests fixtures/expected build.zig
          build.zig.zon tools/validate.sh
        - find third_party/tree-sitter-core third_party/tree-sitter-zig -type f
          -print0 | xargs -0 wc -c
        - wc -c third_party/tree-sitter-zig/*/src/parser.c
