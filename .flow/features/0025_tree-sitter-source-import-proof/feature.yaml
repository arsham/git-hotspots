schema: flow-feature.v1
feature:
  id: "0025"
  slug: tree-sitter-source-import-proof
  title: Tree-sitter source import proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Tree-sitter Zig provider work needs pinned local source inputs, but the
    repo must not add parser runtime, build-time fetches, or unclear license and
    provenance obligations.
  outcome: Import pinned Tree-sitter core and tree-sitter-zig source files under
    auditable third_party paths with complete provenance, license, notice,
    source-size, offline-validation, and no-provider stability proof, while
    stopping before compile/link/runtime/provider behavior.
  acceptance:
    - "Operator-approved boundary: vendored source files may be added under
      third_party, but no parser compile/link/runtime/provider behavior is
      allowed."
    - Tree-sitter core and tree-sitter-zig sources are imported only from pinned
      public upstream identities recorded in the PRD.
    - Each vendored component has copied MIT license text and a complete
      PROVENANCE.md.
    - A repo-level third-party notice or attribution artefact records public
      upstream attribution and repo-relative vendored paths.
    - Imported file manifests and excluded file classes are recorded; whole
      upstream repositories, submodules, package-manager wrappers, and unrelated
      bindings are not imported by default.
    - tree-sitter-zig src/parser.c provenance is reproduced, verified, or
      justified as a pinned upstream generated artefact with known blob, size,
      tag, and caveat.
    - Source-size and build-impact evidence is recorded, including parser.c size
      and largest vendored files.
    - zig build validate and close-out validation pass without build-time
      network, submodules, global parser packages, or system Tree-sitter
      dependencies.
    - Existing no-provider table, JSON, Markdown, and inspect outputs remain
      byte-stable.
    - No build.zig.zon, build.zig C compile/link path, parser runtime, provider
      registry, CLI/report/schema/scoring/cache/network/telemetry/background
      behavior is added.
    - Committed docs and evidence contain no private paths, private repo names,
      raw private output, raw parser stderr, commercial strategy, predictive
      defect claims, quality scoring, developer ranking, or maintainer
      judgement.
planning:
  state: ready
  summary: Import pinned local Tree-sitter source inputs as an auditable
