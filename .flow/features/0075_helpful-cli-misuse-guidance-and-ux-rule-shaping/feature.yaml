design:
  rough_shape:
    - Use the direct binary for exact application stderr assertions and include
      one `zig build run -- --symbols` smoke because Zig wraps non-zero
      application exits with build failure text.
    - Introduce or refine parser errors only for CLI misuse UX; do not add new
      runtime modes, provider scope, scoring changes, interactivity,
      completions, packaging, cache, network, or telemetry.
    - "Keep helpful diagnostics concise: first line cause, optional `Try: ...`
      or `Use: ...` recovery line, and full usage only for broad unknown/invalid
      cases where concise recovery is unavailable."
    - "Treat documentation and agent guidance as part of the UX contract, not
      afterthoughts: public docs explain valid command shapes while AGENTS.md
      tells future agents what to preserve when CLI behaviour changes."
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Baseline misuse matrix
      goal: Enumerate and run current valid, invalid, and edge CLI flag combinations
        before changing behaviour, recording exit status and application stderr
        expectations.
      owner_phase: runner
      execution_context:
        - "Anchors: src/cli.zig, src/app.zig, tests/integration.sh,
          tools/validate.sh, existing help/docs/man surfaces."
        - "In scope: matrix for --symbols, --symbol-line-history,
          --symbol-limit, --inspect, --limit, --format, --scope, --repo, unknown
          flags, --explain/--version combinations, --help precedence, and order
          variants."
        - "Out of scope: code changes beyond temporary local observation; broad
          provider/report behaviour changes."
        - "Protected: direct-binary stderr is the application contract; zig
          build run smoke is secondary wrapper evidence."
        - "Dependencies: none."
        - "Validation/evidence: build direct binary, run matrix commands, record
          privacy-safe summary of exit status and stderr class; no absolute
          paths or raw private repo output."
        - "Review focus: matrix is broad enough to prevent fixing only the
          reported --symbols case."
        - "Escalate if: matrix reveals ambiguous intended semantics or a
          proposed change would alter successful analysis/report contracts."
        - "Done boundary: baseline matrix is captured in tests or durable notes
          before diagnostic changes are made."
      verification_commands:
        - zig build
        - ./zig-out/bin/git-hotspots --symbols
        - ./zig-out/bin/git-hotspots --symbol-line-history
        - ./zig-out/bin/git-hotspots --symbol-limit 1
        - ./zig-out/bin/git-hotspots --inspect src/app.zig --symbol-line-history
        - ./zig-out/bin/git-hotspots --inspect src/app.zig --symbol-limit 1
        - ./zig-out/bin/git-hotspots --format xml
        - ./zig-out/bin/git-hotspots --scope
        - zig build run -- --symbols
    - id: P2
      depends_on:
        - P1
      status: done
      title: Actionable CLI diagnostics
      goal: Improve parser/app diagnostic specificity and recovery guidance for
        invalid CLI usage while preserving existing valid behaviour and flag
        semantics.
      owner_phase: runner
      execution_context:
        - "Anchors: src/cli.zig owns parsing/help; src/app.zig owns parser error
          stderr mapping; tests/integration.sh owns executable invalid-combo
          assertions."
        - "In scope: add/refine error variants and stderr text for recoverable
          misuse, especially symbol dependencies, missing values, invalid enum
          values, unknown flags, and standalone command combinations."
        - "Out of scope: new analysis modes, repo-wide symbols, interactive
          suggestions, shell completion, network, telemetry, package/install
          work, provider semantic expansion."
        - "Protected: --help/-h high precedence; --explain and --version
          standalone restrictions; successful report formats and provider
          evidence semantics."
        - "Dependencies: P1 baseline matrix."
        - "Validation/evidence: focused integration assertions for each changed
          diagnostic plus existing successful report golden tests."
        - "Review focus: messages are concise, deterministic, recovery-oriented,
          privacy-safe, and do not imply unsupported capabilities."
        - "Escalate if: a helpful suggestion would require changing product
          semantics rather than explaining current valid usage."
        - "Done boundary: changed diagnostics are implemented and covered by
          direct-binary assertions."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P3
      depends_on:
        - P2
      status: done
      title: Docs and agent UX rules
      goal: Align public docs/help/manual/developer guidance and add durable agent
        rules so future CLI functionality changes preserve misuse UX contracts.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, docs/developer-guide.md,
          man/git-hotspots.1, AGENTS.md, tools/validate.sh help/doc greps."
        - "In scope: update changed CLI wording and troubleshooting guidance;
          add a concise AGENTS.md rule about updating misuse matrix, actionable
          diagnostics, docs/help/manual/tests, and privacy/local-first
          boundaries for added/changed/removed/refactored CLI behaviour."
        - "Out of scope: public roadmap/process detail in README,
          commercial/hosted claims, broad repo maps in AGENTS.md."
        - "Protected: README stays visitor-facing; AGENTS.md contains actionable
          guardrails only; public docs avoid bug prediction, maintainer
          judgement, telemetry, network, and private-output leakage."
        - "Dependencies: P2 final message wording."
        - "Validation/evidence: markdown/manual/help anchors and validate greps
          pass; no banned private or product-claim text appears."
        - "Review focus: docs explain user-facing command shapes; AGENTS.md
          changes future agent behaviour without becoming documentation
          inventory."
        - "Escalate if: a proposed AGENTS rule lacks durable evidence or
          duplicates existing parent guidance without narrowing it."
        - "Done boundary: docs and AGENTS are aligned with the final CLI UX and
          validation protects the alignment."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build validate
    - id: P4
      depends_on:
        - P3
      status: done
      title: Final validation and smoke evidence
      goal: Run full local validation plus privacy-safe real-repository smoke checks
        and record evidence suitable for verification and close-out.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, tests/integration.sh, this repository,
          one suitable sibling/local repo when available."
        - "In scope: full validation, original reported command smoke,
          direct-binary misuse smoke, successful analysis smoke on this repo and
          one privacy-safe sibling/local repo label."
        - "Out of scope: committing absolute local paths, raw private reports,
          remotes, author identities, commit messages, source snippets, or
          private repo names."
        - "Protected: local-first deterministic runtime; no network fetch or
          telemetry; report output contracts remain stable."
        - "Dependencies: P3 docs/rules alignment."
        - "Validation/evidence: `zig build validate`; `zig build run --
          --symbols` shows helpful app diagnostic before Zig wrapper; real repo
          smoke summaries use privacy-safe labels only."
        - "Review focus: evidence is fresh, reproducible, and sufficient for
          implementation close-out."
        - "Escalate if: sibling/local repo smoke is unavailable, validation
          requires network, or unrelated failures appear."
        - "Done boundary: validation evidence is recorded and repository is
          ready for independent verification."
      verification_commands:
        - zig build validate
        - zig build run -- --symbols
  output_contract:
    artifacts:
      - updated CLI diagnostics/help text where needed
      - CLI misuse matrix captured in tests or a checked-in privacy-safe
