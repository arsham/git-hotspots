schema: flow-feature.v1
feature:
  id: "0075"
  slug: helpful-cli-misuse-guidance-and-ux-rule-shaping
  title: Helpful CLI misuse guidance and UX rule shaping
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Invalid CLI usage currently often gives terse or generic diagnostics.
    The reported case, `--symbols` without `--inspect PATH`, states the
    constraint but does not provide a concrete recovery path, and other parser
    failures can collapse to broad `invalid arguments` plus full help. Future
    CLI refactors need durable UX rules so added, changed, or removed
    functionality keeps misuse guidance, docs, and tests aligned.
  outcome: Users who misuse flags receive concise, actionable, deterministic
    stderr that explains the cause and the next valid command shape when
    recoverable. The project gains a repeatable misuse matrix and agent-facing
    rules so future CLI changes preserve helpful diagnostics, documentation
    alignment, and local-first privacy boundaries without expanding provider or
    analysis scope.
  acceptance:
    - A deterministic CLI misuse matrix covers symbol dependency errors, missing
      option values, invalid enum values, unknown flags, standalone command
      combinations, help precedence, and order-sensitive variants before
      behaviour changes are implemented.
    - Invalid CLI diagnostics include the immediate cause and, when unambiguous,
      a valid command shape or concrete example without requiring the user to
      inspect full help output.
    - "`--symbols` without `--inspect PATH` remains invalid but guides users
      toward `git-hotspots --inspect <path> --symbols` or an equivalent concrete
      example."
    - "`--symbol-line-history` and `--symbol-limit N` keep their existing
      dependency semantics on `--inspect PATH --symbols`, including positive
      integer validation for symbol limit."
    - Missing values, invalid enum values, and unknown flags are reported with
      specific, concise parser diagnostics where the parser can identify the
      flag family.
    - "`--help` and `-h` remain standalone, repository-independent,
      high-precedence commands that exit 0 even when other flags are present."
    - README, docs/user-guide.md, docs/developer-guide.md, man/git-hotspots.1,
      terminal help, tests/integration.sh, and tools/validate.sh stay aligned
      with changed user-facing wording.
    - Root AGENTS.md or a narrower justified AGENTS.md records durable CLI UX
      rules for future added, changed, removed, or refactored functionality
      without duplicating ordinary documentation.
    - Successful analysis, inspect, symbol, JSON, Markdown, and table report
      output contracts remain unchanged unless explicitly required and
      regression-tested.
    - Implementation preserves OSS/publicity, deterministic local-first
      behaviour, no network/telemetry/background upload, no repo-wide symbol
      scanning, and hotspot-as-investigation-prompt framing.
