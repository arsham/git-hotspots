  acceptance_contract:
    outcome: Users who misuse flags receive concise, actionable, deterministic
      stderr that explains the cause and the next valid command shape when
      recoverable. The project gains a repeatable misuse matrix and agent-facing
      rules so future CLI changes preserve helpful diagnostics, documentation
      alignment, and local-first privacy boundaries without expanding provider
      or analysis scope.
    acceptance:
      - A deterministic CLI misuse matrix covers symbol dependency errors,
        missing option values, invalid enum values, unknown flags, standalone
        command combinations, help precedence, and order-sensitive variants
        before behaviour changes are implemented.
      - Invalid CLI diagnostics include the immediate cause and, when
        unambiguous, a valid command shape or concrete example without requiring
        the user to inspect full help output.
      - "`--symbols` without `--inspect PATH` remains invalid but guides users
        toward `git-hotspots --inspect <path> --symbols` or an equivalent
        concrete example."
      - "`--symbol-line-history` and `--symbol-limit N` keep their existing
        dependency semantics on `--inspect PATH --symbols`, including positive
        integer validation for symbol limit."
      - Missing values, invalid enum values, and unknown flags are reported with
        specific, concise parser diagnostics where the parser can identify the
        flag family.
      - "`--help` and `-h` remain standalone, repository-independent,
        high-precedence commands that exit 0 even when other flags are present."
      - README, docs/user-guide.md, docs/developer-guide.md, man/git-hotspots.1,
        terminal help, tests/integration.sh, and tools/validate.sh stay aligned
        with changed user-facing wording.
      - Root AGENTS.md or a narrower justified AGENTS.md records durable CLI UX
        rules for future added, changed, removed, or refactored functionality
        without duplicating ordinary documentation.
      - Successful analysis, inspect, symbol, JSON, Markdown, and table report
        output contracts remain unchanged unless explicitly required and
        regression-tested.
      - Implementation preserves OSS/publicity, deterministic local-first
        behaviour, no network/telemetry/background upload, no repo-wide symbol
        scanning, and hotspot-as-investigation-prompt framing.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build
      - ./zig-out/bin/git-hotspots --symbols
      - ./zig-out/bin/git-hotspots --symbol-line-history
      - ./zig-out/bin/git-hotspots --symbol-limit 1
      - ./zig-out/bin/git-hotspots --inspect src/app.zig --symbol-line-history
      - ./zig-out/bin/git-hotspots --inspect src/app.zig --symbol-limit 1
      - ./zig-out/bin/git-hotspots --format xml
      - ./zig-out/bin/git-hotspots --scope
      - zig build run -- --symbols
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
