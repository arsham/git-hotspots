schema: flow-feature.v1
feature:
  id: "0030"
  slug: ci-validation-workflow
  title: CI validation workflow
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The project now has non-trivial Zig validation, vendored Tree-sitter
    sources, and inspect-only symbol evidence, but the public repository has no
    CI signal that the validation contract passes for contributors or publicity
    readers.
  outcome: Add a minimal GitHub Actions workflow that runs the public validation
    gate on push and pull request without release automation, uploads, cache,
    telemetry, or product behaviour changes.
  acceptance:
    - A single GitHub Actions workflow validates the project on push and pull
      request.
    - The workflow uses full checkout history because git-hotspots is
      Git-history-sensitive.
    - The workflow uses Zig 0.16.0.
    - The workflow runs `zig build validate`.
    - The workflow runs `zig build tree-sitter-build-proof` and `zig build
      tree-sitter-symbol-proof`.
    - The workflow has least-privilege read-only repository permissions.
    - The workflow contains no release, package, artifact-upload, cache,
      coverage, telemetry, secret, or publish steps.
    - Local validation remains green after adding the workflow.
planning:
  state: ready
  summary: Minimal public CI validation only. CI proves the public/default
