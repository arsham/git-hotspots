design:
  rough_shape:
    - Add `.github/workflows/ci.yml` or equivalent minimal validation workflow.
    - Use checkout with full history and Zig 0.16.0.
    - Run canonical validation and explicit Tree-sitter proof steps.
    - Avoid all release/publish/upload/cache/matrix scope.
  packets:
    - id: P1
      title: Minimal GitHub Actions validation workflow
      goal: Add one minimal GitHub Actions workflow for public validation.
      status: planned
      depends_on: []
      owner_phase: runner
      execution_context:
        - "Anchors: `.github/workflows/ci.yml`, `build.zig`,
          `tools/validate.sh`, `README.md`, `CONTRIBUTING.md`."
        - "In scope: add one workflow on push/pull_request that checks out full
          history, uses Zig 0.16.0, and runs validation/proof commands."
        - "Out of scope: release automation, packaging, artifacts, cache,
          coverage, matrix, badges, secrets, telemetry, runtime behaviour
          changes."
        - "Protected: local-first runtime defaults, public OSS framing, existing
          validation semantics, no sibling/local repo data in CI."
        - "Dependencies: existing `zig build validate`,
          `tree-sitter-build-proof`, and `tree-sitter-symbol-proof` steps."
        - "Validation/evidence: run `git diff --check`, `zig build validate`,
          `zig build tree-sitter-build-proof`, `zig build
          tree-sitter-symbol-proof`; inspect workflow YAML for scope and
          permissions."
        - "Review focus: minimal triggers, full checkout history, Zig 0.16.0,
          read-only permissions, no prohibited CI behaviours."
        - "Escalate if: Zig setup requires an unacceptable unpinned third-party
          action, CI needs secrets, validation is too slow/flaky, or workflow
          scope expands."
        - "Done boundary: workflow exists, local gates pass, and reviewer can
          prove no prohibited CI scope was added."
      verification_commands:
        - git diff --check
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
