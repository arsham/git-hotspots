  acceptance_contract:
    outcome: A privacy-safe audit document identifies real relationship-output noise
      patterns, acceptable caveats, and small successor implementation targets
      while preserving all runtime and report semantics.
    acceptance:
      - docs/relationship-output-noise-audit.md exists and contains sampled
        relationship-output evidence, classifications, and prioritized follow-up
        targets.
      - The audit samples table, JSON, and Markdown relationship outputs across
        admitted provider lanes where practical, with explicit skip reasons for
        any missing lane or surface.
      - Findings distinguish actionable provider-neutral repair targets from
        acceptable syntax-only caveats and avoid call-graph, dependency,
        ownership, code-quality, developer-metric, or bug-prediction claims.
      - No CLI flags, public report schema, scoring, ranking, provider
        admission, cache, network, telemetry, release, tag, remote, or
        package-publish behaviour changes in this feature.
      - Fresh validation evidence is recorded for git diff --check, zig build
        test, and zig build validate.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify audit evidence against PRD requirements
      - verify forbidden surfaces did not change
  decision_budget:
    allowed_local_decisions:
      - safe audit document wording inside
        docs/relationship-output-noise-audit.md
      - privacy-safe command sampling and bounded count summaries
    deferred_reconcile_triggers:
      - minor audit taxonomy wording trade-off worth reviewer visibility
      - fixture or lane skip reason that stays inside PRD acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - runtime or report behavior change
      - provider admission matrix change
      - tag remote release or package side effect
      - need to implement dedup filtering caveat rendering or provider changes
    protected_surfaces:
      - runtime behavior
      - CLI flags
      - public report schema
      - scoring and ranking
      - provider admission matrix
      - cache behavior
      - network and telemetry behavior
      - release state
      - tags and remotes
      - package artifacts
  fallback_path: deferred_reconcile_decision
  notes: null
