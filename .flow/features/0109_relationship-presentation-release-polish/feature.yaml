  acceptance_contract:
    outcome: Release-facing docs and validation describe the completed relationship
      presentation workflow coherently, without changing runtime behaviour, CLI
      flags, JSON schema, provider semantics, scoring, ranking, release state,
      or package surfaces.
    acceptance:
      - README, user guide, man page, help/validation surfaces are reviewed for
        the combined relationship presentation workflow.
      - Wording changes, if any, are narrow, factual, local-first, and
        evidence-only.
      - Validation guards any updated public wording or examples.
      - No runtime, CLI, JSON schema, provider, scoring, ranking, cache,
        network, telemetry, release, tag, remote, package, or publish behaviour
        changes.
      - If a surface needs no change, close-out records that it was checked and
        intentionally left unchanged.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - confirm docs/man/help validation guards changed claims or no-change
        evidence is durable
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
      - docs wording tightening that stays factually equivalent to current output
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
      - surface checked and intentionally left unchanged
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - runtime or public output behaviour change required to make docs coherent
    protected_surfaces:
      - runtime behaviour
      - CLI flags and options
      - JSON schema and fields
      - report data semantics
      - relationship provider algorithms and admission
      - scoring ranking confidence and caps
      - cache network telemetry release tag remote package and publish behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
