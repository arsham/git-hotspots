design:
  rough_shape:
    - Select and import a pinned tree-sitter-javascript source set under
      third_party/tree-sitter-javascript/<revision>/.
    - Add provenance, license/notice, imported manifest, and source-import
      evidence artefacts.
    - Prove offline/local validation, JSX source admission state, and
      no-provider output stability.
    - Explicitly defer JavaScript build proof, extraction proof, queries,
      provider runtime, CLI/report/schema, scoring, cache, TypeScript/TSX,
      Node/package/workspace analysis, and CI changes.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: JavaScript source identity and provenance import
      goal: Select the immutable tree-sitter-javascript source identity, import a
        narrow vendored file set, and add provenance, manifest, license, notice,
        and JSX admission evidence.
      owner_phase: runner
      execution_context:
        - "Anchors: third_party/tree-sitter-javascript/<revision>/,
          THIRD_PARTY_NOTICES.md,
          docs/tree-sitter-javascript-grammar-admission.md,
          docs/tree-sitter-javascript-source-import-evidence.md."
        - "In scope: select immutable tree-sitter-javascript tag/full commit,
          copy a narrow source set, copy license/notice, add PROVENANCE.md, add
          IMPORTED_FILES.tsv, and update THIRD_PARTY_NOTICES.md."
        - "In scope: record generated parser/scanner provenance using either
          reproducible pinned inputs or verified pinned upstream artefact
          basis."
        - "In scope: prove scanner presence or absence and justify any required
          scanner helper headers."
        - "In scope: prove whether JSX is admitted for the selected JavaScript
          revision; defer .jsx if not locally proven."
        - "Out of scope: build.zig, build.zig.zon, parser compile/link proof,
          JavaScript runtime provider, provider registry,
          CLI/report/schema/scoring/cache changes, query fixtures,
          CI/release/package changes, TypeScript/TSX, Node provider identity,
          package/workspace/module analysis."
        - "Protected: existing Zig, Go, and Python Tree-sitter provider
          behaviour, no-provider report bytes, local-first/no-network build
          path, OSS/publicity boundary, privacy-safe evidence."
        - "Dependencies: Feature 0048 admission review is complete; Tree-sitter
          core v0.26.9 is already vendored from Feature 0025."
        - "Validation/evidence: changed-path scan; license/notice copy proof;
          provenance identity proof; generated parser/scanner provenance proof;
          BOM narrowness proof; JSX admission or deferral proof."
        - "Review focus: source import is narrow, reviewable, pinned,
          license-safe, local-only, and does not imply JavaScript runtime
          support."
        - "Escalate if: immutable revision/checksum cannot be selected, license
          is unclear, generated parser/scanner provenance cannot be proven, BOM
          expands into bindings/package-manager artefacts, JSX cannot be decided
          honestly, or a core update is required."
        - "Done boundary: vendored source tree and provenance/notice/evidence
          artefacts exist, with no build/runtime/provider changes."
      verification_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for source-import-only scope
        - provenance/license/BOM scan
        - generated parser/scanner provenance check
        - no-provider output stability check
