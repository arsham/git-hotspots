schema: flow-feature.v1
feature:
  id: "0050"
  slug: tree-sitter-javascript-source-import-proof
  title: JavaScript Tree-sitter source import proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0048 admitted tree-sitter-javascript only conditionally; the
    repository still lacks pinned JavaScript grammar source, license/notice
    proof, generated parser/scanner provenance, BOM, JSX admission proof, size,
    compatibility, and no-provider stability evidence.
  outcome: A narrow pinned tree-sitter-javascript source import is committed with
    provenance, notices, source-size evidence, JSX admission state, and
    no-provider stability proof, while JavaScript build/runtime/provider
    behaviour remains deferred.
  acceptance:
    - Import a narrow pinned tree-sitter-javascript source set under
      third_party/tree-sitter-javascript/<revision>/.
    - Record exact upstream source identity, selected immutable revision,
      archive or checkout basis, checksum or per-file manifest evidence, and
      vendored path.
    - Preserve upstream license/notice text and update THIRD_PARTY_NOTICES.md
      with public repo-relative attribution.
    - Add PROVENANCE.md, IMPORTED_FILES.tsv, and a source-import evidence
      document covering generated parser/scanner provenance, BOM/exclusions,
      Tree-sitter core compatibility, JSX admission state, source-size
      measurements, offline validation, and no-provider output stability.
    - Stop as blocked rather than closing if immutable revision, license/notice,
      generated parser/scanner provenance, core compatibility, BOM narrowness,
      JSX decision, or no-provider stability cannot be proven.
    - Do not add JavaScript build/link proof, runtime provider behaviour,
      provider registry entries, CLI flags, report schema fields, scoring
      changes, cache changes, test fixtures, CI changes, TypeScript/TSX support,
      Node provider identity, release or package work.
planning:
  state: ready
  summary: Shape a narrow tree-sitter-javascript source import and provenance
    proof, following the Python/Go source-import precedent while explicitly
    deferring JavaScript build/runtime/provider work.
