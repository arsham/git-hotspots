schema: flow-feature.v1
feature:
  id: "0018"
  slug: rename-aware-file-lineage
  title: Rename-aware file lineage
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: The file-level hotspot engine already asks Git for rename detection and
    normalizes rename rows to the newer path, but historical changes before a
    rename can still remain under earlier path rows. This splits evidence for
    renamed files, makes inspect-by-current-path incomplete, and hides an
    important limitation for users who rely on Git history as investigation
    evidence.
  outcome: "Git-detected file renames are represented as conservative file
    lineages: accepted in-scope old-path history is folded into the canonical
    current path row, old accepted aliases do not appear as duplicate ranked
    rows, and reports disclose deterministic lineage metadata and caveats
    without claiming symbol or semantic move tracking."
  acceptance:
    - Simple Git-detected renames aggregate accepted in-scope old-path churn,
      change counts, recency inputs, bounded evidence commits, and co-change
      evidence into the canonical current path row.
    - Old paths that are fully absorbed into an accepted lineage are not emitted
      as separate ranked result rows; deleted or non-current lineages continue
      to carry the existing deleted/not-present caveat when the canonical path
      is absent at HEAD.
    - Lineage aggregation is limited to local Git rename edges emitted by the
      existing --find-renames=40% history stream; content similarity, copies,
      splits, merges, symbol moves, and provider-derived lineage are explicitly
      out of scope.
    - "Scope filters remain honest: an observed path contribution is included
      only when that observed path passes the active scope/include/exclude
      filters, and a rename edge is accepted only when both old and new paths
      pass those filters. Excluded or outside-include old-path evidence must not
      leak into an included current path."
    - --inspect current/path returns the aggregated lineage row. --inspect
      old/path resolves to the canonical row only when old/path is an accepted
      in-scope lineage alias and reports requested_path as old/path and
      matched_path as the canonical path; otherwise it fails with the existing
      clear not-found behaviour.
    - Co-change evidence uses canonical lineage paths for accepted aliases,
      avoids old/current self co-changes, avoids duplicate co-change pairs, and
      remains bounded and deterministic.
    - JSON output adds deterministic lineage metadata without removing existing
      fields; Markdown shows lineage details in the row evidence area; table
      output visibly indicates lineage presence without dumping noisy alias
      lists.
    - Reports disclose caveats when renames are detected or lineage is partial
      due to scope, shallow, partial, or deleted history. They must not imply
      perfect rename history, semantic ownership, bug prediction, code quality
      scoring, or developer ranking.
    - Validation covers simple rename, braced rename, chained rename,
      rename-plus-edit, deleted-after-rename, scope-crossing rename, inspect by
      current and alias, co-change canonicalisation, table/JSON/Markdown
      determinism, progress stability, and privacy-safe real-repo smoke with
      sibling-local-repo.
planning:
  state: ready
  summary: Implement bounded current-path file lineage from local Git rename edges
    only. This is a correctness slice for file-level evidence, not a provider,
    cache, similarity, copy-detection, or scoring-redesign feature.
  brief_sync:
    status: updated
    reason: "Feature 0018 remains aligned with B001: deterministic local-first Git
      evidence, OSS/publicity boundary, and hotspots as investigation prompts.
      It adds bounded Git-detected file lineage without providers, cache,
      semantic move claims, or runtime network behaviour."
    checked_at: 2026-05-22T22:47:17.766Z
  brief_alignment:
