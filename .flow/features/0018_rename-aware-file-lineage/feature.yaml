    role: primary
    summary: Feature 0018 is a primary correctness slice under B001. It preserves
      deterministic local-first file-level Git evidence while adding bounded
      rename-aware lineage and explicit caveats without providers, cache, or
      semantic ownership claims.
    checked_at: 2026-05-22T22:47:25.575Z
