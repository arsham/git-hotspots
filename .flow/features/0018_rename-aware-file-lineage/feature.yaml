    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The current engine already runs git log --numstat --find-renames=40% and
          normalizes rename rows to the newer path. Older commits before the
          rename can still aggregate under the old path. This splits evidence
          for renamed files, weakens --inspect current/path, and makes reports
          less faithful to Git's own rename evidence.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 1 refs outside default requirement rows.
  acceptance_contract:
    outcome: "Git-detected file renames are represented as conservative file
      lineages: accepted in-scope old-path history is folded into the canonical
      current path row, old accepted aliases do not appear as duplicate ranked
      rows, and reports disclose deterministic lineage metadata and caveats
      without claiming symbol or semantic move tracking."
    acceptance:
      - Simple Git-detected renames aggregate accepted in-scope old-path churn,
        change counts, recency inputs, bounded evidence commits, and co-change
        evidence into the canonical current path row.
      - Old paths that are fully absorbed into an accepted lineage are not
        emitted as separate ranked result rows; deleted or non-current lineages
        continue to carry the existing deleted/not-present caveat when the
        canonical path is absent at HEAD.
      - Lineage aggregation is limited to local Git rename edges emitted by the
        existing --find-renames=40% history stream; content similarity, copies,
        splits, merges, symbol moves, and provider-derived lineage are
        explicitly out of scope.
      - "Scope filters remain honest: an observed path contribution is included
        only when that observed path passes the active scope/include/exclude
        filters, and a rename edge is accepted only when both old and new paths
        pass those filters. Excluded or outside-include old-path evidence must
        not leak into an included current path."
      - --inspect current/path returns the aggregated lineage row. --inspect
        old/path resolves to the canonical row only when old/path is an accepted
        in-scope lineage alias and reports requested_path as old/path and
        matched_path as the canonical path; otherwise it fails with the existing
        clear not-found behaviour.
      - Co-change evidence uses canonical lineage paths for accepted aliases,
        avoids old/current self co-changes, avoids duplicate co-change pairs,
        and remains bounded and deterministic.
      - JSON output adds deterministic lineage metadata without removing
        existing fields; Markdown shows lineage details in the row evidence
        area; table output visibly indicates lineage presence without dumping
        noisy alias lists.
      - Reports disclose caveats when renames are detected or lineage is partial
        due to scope, shallow, partial, or deleted history. They must not imply
        perfect rename history, semantic ownership, bug prediction, code quality
        scoring, or developer ranking.
      - Validation covers simple rename, braced rename, chained rename,
        rename-plus-edit, deleted-after-rename, scope-crossing rename, inspect
        by current and alias, co-change canonicalisation, table/JSON/Markdown
        determinism, progress stability, and privacy-safe real-repo smoke with
        sibling-local-repo.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build test
      - git diff --check
      - zig build validate
      - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
