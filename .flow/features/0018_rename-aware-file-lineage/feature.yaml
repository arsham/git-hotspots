context:
  roadmap_item_id: null
  detached_reason: "Detached intake for the next correctness slice after project
    scope default: handle file renames so evidence for renamed files is not
    split across old and current paths when Git provides an unambiguous rename
    edge."
  depends_on_feature_ids:
    - "0016"
    - "0017"
  blocked_by: []
design:
  rough_shape:
    - Extend the streaming Git log parser so rename numstat rows produce
      explicit rename-edge information before path normalization erases the old
      path.
    - Maintain a conservative alias/canonical mapping for accepted in-scope Git
      rename edges while aggregating file stats, evidence, and co-change inputs
      under canonical paths.
    - Add additive lineage metadata to result rows for prior paths, rename
      count, and partial/truncated caveats, then render it deterministically in
      JSON, Markdown, and table outputs.
    - Update fixtures and validation so existing behaviour remains deterministic
      while renamed files no longer split accepted in-scope history across old
      and current rows.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Lineage contract and fixture semantics
      goal: Define and fixture the exact rename-lineage semantics before changing
        aggregation behaviour.
      depends_on: []
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: tools/setup-fixtures.sh, tests/integration.sh,
          fixtures/expected/*, src/git.zig parser tests."
        - "In scope: deterministic fixture histories for simple rename, braced
          rename, chained rename, rename plus edit, deleted-after-rename,
          scope-crossing rename, co-change before/after rename, and inspect
          current/alias cases."
        - "Out of scope: runtime cache, providers, tree-sitter/LSP/ctags,
          similarity detection, copy detection, symbol/function lineage,
          CI/release work."
        - "Protected: existing project scope default, include/exclude
          validation, local-only Git execution, no raw private repo evidence, no
          author/commit-message output."
        - "Dependencies: Features 0016 streaming parser and 0017 project scope
          default remain intact."
        - "Validation/evidence: add or update tests/goldens that currently prove
          split rename identity, then make expected semantics explicit before
          engine changes; proof lives in tests and fixtures."
        - "Review focus: old-path inspect behaviour and scope-vs-lineage
          ordering are explicit and testable."
        - "Escalate if: fixture design requires ambiguous copy/split/merge
          semantics, git non-local operations, or a breaking JSON schema
          removal."
        - "Done boundary: fixtures and expected behaviours fully describe
          accepted lineage semantics and non-goals."
      verification_commands:
        - zig build test
        - git diff --check
    - id: P2
      title: Core rename-lineage aggregation engine
      goal: Aggregate accepted Git rename aliases into canonical file rows while
        preserving scoring inputs and scope honesty.
      depends_on:
        - P1
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: src/git.zig and src/model.zig."
        - "In scope: parser rename-edge capture, alias/canonical path mapping,
          aggregation of counts/churn/recency/evidence, canonical co-change
          paths, old/current self-cochange prevention, inspect alias
          resolution."
        - "Out of scope: scoring formula changes, Git command expansion beyond
          local history stream, cache/database, provider API, source snippets,
          commit messages, author metrics."
        - "Protected: deterministic sorting, project/all scope semantics,
          include/exclude precedence, --since, --progress stderr-only behaviour,
          deleted-file caveat behaviour."
        - "Dependencies: P1 fixture semantics."
        - "Validation/evidence: unit tests for alias mapping and parser chunk
          boundaries plus integration fixture parity."
        - "Review focus: accepted aliases fold exactly once; rename-plus-edit is
          counted once; excluded/outside-include old paths do not contribute."
        - "Escalate if: alias cycles, multi-edge ambiguity, or scope-crossing
          behaviour cannot be represented conservatively without broad
          redesign."
        - "Done boundary: core analysis produces canonical rows and inspect
          behaviour matching the P1 contract."
      verification_commands:
        - zig build test
        - zig build validate
        - git diff --check
    - id: P3
      title: Lineage report surfaces and docs
      goal: Expose lineage metadata and caveats deterministically across JSON,
        Markdown, table output, help/docs, and validation goldens.
      depends_on:
        - P2
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: src/report.zig, src/model.zig, README.md,
          fixtures/expected/*, tests/integration.sh, tools/validate.sh."
        - "In scope: additive JSON lineage metadata, Markdown lineage evidence
          text, compact table lineage indicator/caveat, README wording about
          rename-aware file lineage and limitations."
        - "Out of scope: schema version bump unless additive fields cannot
          satisfy the requirement, HTML output, templates, prompt systems,
          public third-party case studies."
        - "Protected: existing report fields remain present, deterministic
          output, Markdown escaping, privacy scans, OSS/publicity framing, no
          bug/quality/developer ranking claims."
        - "Dependencies: P2 core aggregation."
        - "Validation/evidence: golden JSON/Markdown/table checks and semantic
          assertions for lineage metadata, caveats, and absence of leaked
          excluded paths."
        - "Review focus: reports are useful and honest without implying perfect
          or semantic lineage."
        - "Escalate if: report clarity requires a breaking schema change or raw
          path dumps beyond accepted in-scope aliases."
        - "Done boundary: all user-visible surfaces disclose lineage correctly
          and deterministically."
      verification_commands:
        - zig build validate
        - git diff --check
    - id: P4
      title: Close-out validation and real-repo evidence
      goal: Run the full validation ladder and record privacy-safe evidence that
        lineage behaviour is stable on fixtures, this repo, and
        sibling-local-repo.
      depends_on:
        - P3
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh close-out mode, docs or feature evidence
          notes only if needed, Flow run handoff evidence."
        - "In scope: default validation, close-out validation with the approved
          sibling repo, privacy/prohibited-claim scans, deterministic repeated
          output proof, and real-repo smoke summaries using labels only."
        - "Out of scope: committing raw sibling reports, private paths, remotes,
          authors, commit messages, source snippets, release notes, GitHub
          Actions, or benchmarking claims."
        - "Protected: local-first/no-network runtime, no telemetry, no
          auto-fetch, shallow/partial caveat honesty, clean worktree after
          validation."
        - "Dependencies: P3 complete."
        - "Validation/evidence: zig build test, zig build validate, git diff
          --check, close-out validate with sibling-local-repo; proof lives in
          runner/review handoff and validation summaries."
        - "Review focus: all close-out-required rows are independently
          reproducible and privacy-safe."
        - "Escalate if: real-repo smoke exposes private data, validation
          requires network, or lineage claims outrun fixture evidence."
        - "Done boundary: delegated reviewer can close out without relying on
          chat context or raw private output."
      verification_commands:
        - zig build test
        - zig build validate
        - git diff --check
        - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
          -Dsmoke-label=sibling-local-repo
