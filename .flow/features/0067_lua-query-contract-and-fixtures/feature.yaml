  slug: lua-query-contract-and-fixtures
  title: Lua query contract and fixtures
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Lua build proof does not define supported symbol captures,
    dynamic-language caveats, or fixture coverage. Runtime symbols would be
    unsafe without a project-owned Lua query contract first.
  outcome: A deterministic Lua query contract and fixture corpus define supported
    captures, symbol-kind mapping, ranges, ordering, caveats, provider/query
    version metadata, and proof evidence without exposing runtime Lua symbols.
  acceptance:
    - Define project-owned Lua query captures for stable inspect-oriented syntax.
    - Cover .lua paths, local/global/table/colon-method functions, stable
      assigned anonymous functions, module-table syntax, comments/strings,
      dynamic/metatable cases, generated Lua, embedded DSLs, empty/invalid
      files, unsupported paths, and monorepo-style paths.
    - Record capture names, supported subset, symbol-kind mapping, ranges,
      ordering, provider/query versions, caveats, and validation evidence in
      docs/tree-sitter-lua-query-contract.md.
    - Preserve no runtime Lua provider output, provider registry, custom user
      queries, report schema, scoring, cache, LuaRocks/package/module analysis,
      LSP, network, telemetry, upload, or remote enrichment.
    - Stop rather than inventing runtime/module meaning for ambiguous dynamic
      Lua patterns.
