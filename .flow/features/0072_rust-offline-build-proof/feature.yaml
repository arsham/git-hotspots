intent:
  problem: Rust source import alone does not prove the vendored parser and scanner
    can compile and link offline against the existing Tree-sitter core.
  outcome: Add a deterministic offline Rust parser/scanner build proof target and
    evidence while preserving absent Rust runtime support and all default output
    boundaries.
  acceptance:
    - Add a deterministic offline build proof for the selected Rust parser and
      scanner sources imported by Feature 0071.
    - Use only vendored, repository-local inputs and the existing Tree-sitter
      core; do not update the core in this feature.
    - Add public evidence at docs/tree-sitter-rust-build-proof.md.
    - Do not add Rust runtime provider output, provider registry, CLI behaviour,
      report schema, scoring, cache, query fixtures, extraction, CI, package,
      release, Cargo, crate graph, module analysis, macro expansion, type
      checking, LSP, network, telemetry, upload, or remote enrichment.
    - Preserve existing provider outputs and no-provider outputs.
