schema: flow-feature.v1
feature:
  id: "0070"
  slug: lua-current-line-history-evidence
  title: Lua current-line history evidence
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Inspect-only Lua symbols need the same current-line Git evidence as
    other providers, but the feature must not claim true symbol history,
    ownership, blame, module understanding, package understanding, or risk
    scoring.
  outcome: Lua inspect-only symbols can include deterministic current-line Git
    evidence with scoped caveats, matching existing provider semantics while
    preserving local-first product truth and output stability.
  acceptance:
    - Attach current-line Git evidence to Lua inspect-only symbols using the
      existing line-history mechanism.
    - Preserve current-only semantics and avoid true-history, ownership, author
      ranking, maintainer judgement, quality scoring, risk prediction, module,
      package, type, or dependency claims.
    - Cover missing Git history, shallow history, untracked files, unsupported
      paths, parse failures, empty/invalid files, generated Lua, dynamic
      patterns, metatables, and ambiguous module-table patterns.
    - Preserve JSON, Markdown, and table line-history output conventions and
      existing provider/no-provider output stability.
    - Do not fetch remotes, add network/telemetry/upload/remote enrichment, or
      change scoring, cache, package/module analysis, LuaRocks, LSP, or default
      reports.
