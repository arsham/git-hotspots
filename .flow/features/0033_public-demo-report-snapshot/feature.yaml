          status. It must not commit or print raw private reports or temporary
          absolute paths.
        required_for_close_out: true
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
  acceptance_contract:
    outcome: A privacy-safe public Markdown demo snapshot from this repository shows
      project-scope hotspot evidence with careful investigation-prompt framing.
    acceptance:
      - Commit one public demo snapshot document generated from this repository
        only.
      - The snapshot source command is recorded and uses project scope, Markdown
        output, and repo-relative paths.
      - The generated report is captured from a clean detached source commit so
        the snapshot does not carry dirty-worktree caveats caused by Flow
        shaping state.
      - The document frames hotspots as local Git-history investigation prompts,
        not bug predictions, quality scores, risk labels, maintainer judgement,
        developer ranking, ownership, or productivity analysis.
      - The snapshot contains no private/sibling/third-party raw output,
        absolute paths, remotes, author identities, emails, commit messages,
        source snippets, private labels, or commercial/SaaS/pricing/sales
        content.
      - Project-scope excluded prefixes may appear only in scope metadata or
        explanatory text, not as result paths, evidence headings, co-change
        paths, or inspected paths.
      - No runtime, source, fixture, build, provider, scoring, cache, CI,
        release, or package behaviour changes are made.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands: []
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
