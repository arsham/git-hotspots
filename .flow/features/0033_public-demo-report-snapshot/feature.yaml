design:
  rough_shape:
    - Add docs/demo-report.md as a static public demo snapshot from this
      repository only.
    - Prefer a clean project-scope Markdown command over private, sibling,
      third-party, or scope-all examples.
    - Use a wrapper with exact command and a bounded generated report section,
      or an exact generated snapshot with equivalent command context.
    - Keep README changes to at most a small discoverability link if useful.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
  packets:
    - id: P1
      title: Public demo snapshot documentation
      goal: Add one privacy-safe, deterministic public demo snapshot document
        generated from this repository.
      owner_phase: runner
      depends_on: []
      status: pending
      execution_context:
        - "Anchors: docs/demo-report.md, README.md only if a small
          discoverability link is useful."
        - "In scope: generate or capture one bounded Markdown demo snapshot from
          this public repository using --scope project, --limit 10, and --format
          markdown."
        - "In scope: record the exact command shape and source commit used for
          the snapshot."
        - "In scope: add short how-to-read framing that says rows are
          investigation prompts, not judgements."
        - "Out of scope:
          source/runtime/build/test/fixture/provider/cache/scoring/CI/release/p\
          ackage changes."
        - "Out of scope: private, sibling, or third-party raw report output;
          --scope all demo output; broad README marketing rewrite; badges."
        - "Protected: local-first/no-network framing, project-relative paths, no
          overclaiming, no author/maintainer/developer judgement."
        - "Dependencies: Feature 0032 is complete; current CLI supports
          project-scope Markdown reports."
        - "Validation/evidence: git diff --check; zig build validate;
          deterministic regeneration diff from a clean detached clone at the
          recorded source commit; privacy/prohibited-claim scan over changed
          docs."
        - "Review focus: the snapshot is reproducible, public-safe, bounded, and
          framed as evidence for where to inspect first."
        - "Escalate if: snapshot generation requires source/test/build changes,
          includes dirty-worktree caveats, includes private or machine-local
          data, or needs claims beyond current alpha capability."
        - "Done boundary: docs/demo-report.md exists, validates against
          regenerated output, contains no prohibited content, and no protected
          surfaces changed."
      anchors:
        - docs/demo-report.md
        - README.md
      in_scope:
        - One docs-only public demo snapshot from this repository.
        - Exact command/source-commit context for the snapshot.
        - Optional tiny README link if useful for discoverability.
      out_of_scope:
        - Runtime, source, build, fixture, provider, cache, scoring, CI,
          release, or package changes.
        - Private/sibling/third-party raw output.
        - --scope all output or broad public case study.
      protected_surfaces:
        - Local-first and no-network guarantees.
        - Non-judgemental hotspot framing.
        - Existing public README positioning.
      validation_commands:
        - git diff --check
        - zig build validate
        - deterministic regeneration diff for docs/demo-report.md
        - privacy and prohibited-claim scan over changed docs
      review_focus:
        - deterministic generated snapshot
        - no private or absolute path leakage
        - no quality, bug, risk, ownership, productivity, or developer ranking
          claims
        - no Flow/process clutter beyond project-scope metadata
      escalation_triggers:
        - Desired demo needs code or validation changes.
        - Snapshot is dirty, non-deterministic, or private-data-bearing.
        - Operator wants sibling or third-party raw report output committed.
      done_boundary: One public-safe demo snapshot is committed and independently reviewable.
