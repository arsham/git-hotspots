schema: flow-feature.v1
feature:
  id: "0033"
  slug: public-demo-report-snapshot
  title: Public demo report snapshot
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Visitors cannot yet see a polished, committed example of git-hotspots
    output without installing and running the tool.
  outcome: A privacy-safe public Markdown demo snapshot from this repository shows
    project-scope hotspot evidence with careful investigation-prompt framing.
  acceptance:
    - Commit one public demo snapshot document generated from this repository
      only.
    - The snapshot source command is recorded and uses project scope, Markdown
      output, and repo-relative paths.
    - The generated report is captured from a clean detached source commit so
      the snapshot does not carry dirty-worktree caveats caused by Flow shaping
      state.
    - The document frames hotspots as local Git-history investigation prompts,
      not bug predictions, quality scores, risk labels, maintainer judgement,
      developer ranking, ownership, or productivity analysis.
    - The snapshot contains no private/sibling/third-party raw output, absolute
      paths, remotes, author identities, emails, commit messages, source
      snippets, private labels, or commercial/SaaS/pricing/sales content.
    - Project-scope excluded prefixes may appear only in scope metadata or
      explanatory text, not as result paths, evidence headings, co-change paths,
      or inspected paths.
    - No runtime, source, fixture, build, provider, scoring, cache, CI, release,
      or package behaviour changes are made.
planning:
  state: ready
  summary: Produce one docs-only public demo snapshot from the public git-hotspots
    repo, generated from a clean detached commit and validated as deterministic,
    privacy-safe, and non-judgemental.
