schema: flow-feature.v1
feature:
  id: "0063"
  slug: tree-sitter-rust-grammar-admission-review
  title: Tree-sitter Rust grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Rust is a high-value Tree-sitter candidate and part of the original
    project context, but Rust syntax and symbol semantics are materially more
    complex than the currently supported provider languages. The repository
    needs an admission record before any tree-sitter-rust source import or
    runtime provider work.
  outcome: Add a documentation-only Rust grammar admission review that records
    upstream identity, Rust scope, license, generated parser and scanner
    provenance, Tree-sitter core compatibility, BOM, source-size, query,
    fixture, monorepo, and validation gates.
  acceptance:
    - Add docs/tree-sitter-rust-grammar-admission.md as the single public
      admission review artefact.
    - The document records candidate upstream identity for tree-sitter-rust,
      immutable revision or blocker, checksum requirement, proposed vendored
      path, BOM expectations, excluded file classes, and Tree-sitter core
      compatibility requirements.
    - The document records license and notice gates, generated parser and
      scanner provenance gates, local-first build supply-chain gates,
      source-size and build-impact gates, query fixture expectations, and
      no-provider stability gates for future Rust work.
    - The document states Rust runtime support is not implemented and current
      runtime Tree-sitter support remains limited to already implemented
      inspect-only languages.
    - The document frames future Rust symbols as optional, current-only,
      inspect-oriented, additive, caveated provider evidence.
    - The document records monorepo behaviour as inspect-path-only and
      extension-based; it must not imply Cargo.toml, workspace, crate graph,
      dependency graph, macro expansion, type checking, LSP, or repo-wide
      scanning.
    - No third_party, source, test, fixture, build, CI, CLI, report schema,
      scoring, cache, provider runtime, provider registry, release, package,
      network, telemetry, or background behaviour changes are made.
