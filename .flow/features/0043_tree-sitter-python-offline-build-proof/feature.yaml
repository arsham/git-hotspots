schema: flow-feature.v1
feature:
  id: "0043"
  slug: tree-sitter-python-offline-build-proof
  title: Tree-sitter Python offline build proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Python grammar source is imported, but its parser and scanner have not
    been compiled or linked against the vendored Tree-sitter core in this
    repository.
  outcome: A non-product local/offline Python build proof target compiles, links,
    and parses a tiny in-memory Python snippet while Python runtime/provider
    behaviour remains deferred.
  acceptance:
    - Add a dedicated non-product Python build proof target expected as `zig
      build tree-sitter-python-build-proof`.
    - Compile and link only vendored Tree-sitter core plus vendored Python
      parser/scanner sources and local include paths.
    - Parse a tiny in-memory Python snippet and assert stable root behaviour and
      cleanup.
    - Preserve existing Zig and Go Tree-sitter proof targets and no-provider
      output byte stability.
    - Record public privacy-safe offline build proof evidence and CI coverage
      decision.
    - Do not add Python symbol extraction, query contract, runtime provider,
      CLI/report/schema/scoring/cache/CI release/package behaviour, parser
      generation, or network/global tool dependency.
planning:
  state: ready
  summary: Shape the next Python Tree-sitter slice as an isolated offline build
    proof, matching the Go sequencing precedent.
