design:
  rough_shape:
    - Replace the .flow/-only project-scope preset with a fixed helper-owned
      list of root literal built-in exclude prefixes.
    - Preserve existing include/exclude semantics by treating project built-ins
      as deterministic effective exclude prefixes, deduped with user-provided
      excludes.
    - Update help, README, --explain, fixtures, and expected outputs so the
      effective prefix list is visible and no stale .flow/-only language
      remains.
    - Prove --scope all keeps full evidence, while omitted scope and --scope
      project remain byte-for-byte equivalent.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Project preset exclusion update
      goal: Expand project-scope built-in exclusions to the approved finite prefix
        list and prove report, inspect, lineage, and documentation parity.
      depends_on: []
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig if helper naming changes,
          src/git.zig protected filtering behaviour, src/report.zig protected
          scope metadata, src/explain.zig, README.md, tests/integration.sh,
          tools/validate.sh, fixtures/expected/*, tools/setup-fixtures.sh."
        - "In scope: built-in project prefixes .flow/, .zig-cache/, zig-out/,
          target/, node_modules/, dist/, build/, coverage/; deterministic dedupe
          with explicit --exclude-prefix; help/docs/explain/golden updates;
          fixture coverage for scope, inspect, co-change, progress, and
          rename-lineage interactions."
        - "Out of scope: .gitignore import, globs/pathspecs/regex, config files,
          dynamic generated/vendor classifiers, vendor/ or third_party/
          exclusions, fixtures/docs/lockfile exclusions, cache, providers,
          scoring changes, report schema redesign, CI/release, network, or
          telemetry."
        - "Protected: --scope all remains full local Git-history evidence with
          no built-in project excludes; project scope is a convenience default,
          not a correctness claim; hotspots remain investigation prompts."
        - "Dependencies: Features 0017 project scope default and 0018
          rename-aware lineage remain intact."
        - "Validation/evidence: zig build test; zig build validate; git diff
          --check; fixture/golden parity for omitted scope equals --scope
          project, project equals explicit approved excludes, and --scope all
          preserves hidden-path evidence; close-out smoke with
          sibling-local-repo."
        - "Review focus: exact prefix list/order, no excluded path leakage,
          --scope all parity, inspect hidden-path behaviour, rename-lineage
          scope honesty, docs/help/explain disclosure, and privacy/prohibited
          claim scans."
        - "Escalate if: the prefix list expands beyond the approved finite root
          list, implementation needs dynamic classifiers/config, --scope all
          parity breaks, scoring/report schema changes are needed, or docs imply
          scoped output is more correct than all local evidence."
        - "Done boundary: default/project reports use the approved prefix list,
          --scope all restores full evidence, all outputs disclose effective
          scope, validation and real-repo smoke pass, and the repo is clean."
      verification_commands:
        - zig build test
        - zig build validate
        - git diff --check
        - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
          -Dsmoke-label=sibling-local-repo
