feature:
  id: "0019"
  slug: better-project-scope-exclusions
  title: Better project-scope exclusions
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The default project scope currently excludes only .flow/. That keeps
    this repository's Flow process state from dominating first-run reports, but
    it does not handle a small set of common tracked generated or dependency
    output directories that can make project-focused reports noisy in real
    repositories.
  outcome: Project scope uses a finite disclosed list of root literal built-in
    exclude prefixes for common generated/dependency output directories, while
    --scope all remains the full local Git-history evidence universe and reports
    continue to disclose effective scope and omission counts.
  acceptance:
    - Omitted --scope continues to behave exactly like --scope project.
    - "--scope project applies exactly these built-in root literal prefixes, in
      this documented order: .flow/, .zig-cache/, zig-out/, target/,
      node_modules/, dist/, build/, coverage/."
    - --scope all applies no built-in project exclusions and preserves the full
      local tracked-path evidence universe.
    - Built-in prefixes are deduplicated with explicit --exclude-prefix values,
      and excludes continue to win over includes.
    - Filtering happens before aggregation, scoring, co-change evidence,
      rename-lineage folding, ranking, --inspect, progress-compatible rendering,
      and output limiting.
    - Project/default output does not leak approved excluded prefixes through
      result paths, co-change paths, inspect matches, lineage aliases, Markdown
      headings, evidence text, table rows, JSON rows, or validation summaries.
    - --scope all can show and inspect the approved excluded paths when local
      Git history contains them.
    - Cross-prefix rename cases remain scope-honest and carry partial-lineage
      caveats when kept rows lose excluded rename-edge evidence.
    - Table, JSON, Markdown, help, README, and --explain disclose the expanded
      project-scope prefix list and retain the --scope all escape hatch.
    - Documentation states project scope is a convenience default, not more
      correct than full local Git-history evidence.
    - No .gitignore import, globs, pathspecs, regexes, config files, dynamic
      classifiers, broad vendor/docs/fixtures exclusions, providers, cache,
      scoring redesign, CI, release packaging, network behaviour, or telemetry
      behaviour is added.
planning:
  state: ready
  summary: Expand the default project-scope preset from .flow/ only to a finite
