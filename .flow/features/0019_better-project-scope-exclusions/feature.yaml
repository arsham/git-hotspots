    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The default project scope is now the first-run experience for
          git-hotspots. It currently excludes only .flow/, which keeps this
          repository's Flow process state from dominating reports but leaves
          other common generated or dependency output directories to appear when
          they are tracked in a repository. Users can exclude those paths
          explicitly, but first-run project-focused reports should handle a
          small set of widely recognised root generated/dependency directories
          without introducing dynamic classification or hidden judgement.
      - source_ref: prd.md#outcome[1]
        text: --scope project uses a finite, deterministic list of root literal built-in
          exclude prefixes. The list is disclosed in help, --explain, README
          text, and report scope metadata. --scope all remains the full local
          Git-history evidence universe with no built-in project excludes.
      - source_ref: prd.md#outcome[2]
        text: "Approved project-scope built-in exclude prefixes:"
      - source_ref: prd.md#outcome[3]
        text: .flow/
      - source_ref: prd.md#outcome[4]
        text: .zig-cache/
      - source_ref: prd.md#outcome[5]
        text: zig-out/
      - source_ref: prd.md#outcome[6]
        text: target/
      - source_ref: prd.md#outcome[7]
        text: node_modules/
      - source_ref: prd.md#outcome[8]
        text: dist/
      - source_ref: prd.md#outcome[9]
        text: build/
      - source_ref: prd.md#outcome[10]
        text: coverage/
      - source_ref: prd.md#outcome[11]
        text: These are convenience exclusions for project-focused reports, not claims
          that excluded files are unimportant or less correct as evidence.
