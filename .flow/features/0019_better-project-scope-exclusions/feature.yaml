  acceptance_contract:
    outcome: Project scope uses a finite disclosed list of root literal built-in
      exclude prefixes for common generated/dependency output directories, while
      --scope all remains the full local Git-history evidence universe and
      reports continue to disclose effective scope and omission counts.
    acceptance:
      - Omitted --scope continues to behave exactly like --scope project.
      - "--scope project applies exactly these built-in root literal prefixes,
        in this documented order: .flow/, .zig-cache/, zig-out/, target/,
        node_modules/, dist/, build/, coverage/."
      - --scope all applies no built-in project exclusions and preserves the
        full local tracked-path evidence universe.
      - Built-in prefixes are deduplicated with explicit --exclude-prefix
        values, and excludes continue to win over includes.
      - Filtering happens before aggregation, scoring, co-change evidence,
        rename-lineage folding, ranking, --inspect, progress-compatible
        rendering, and output limiting.
      - Project/default output does not leak approved excluded prefixes through
        result paths, co-change paths, inspect matches, lineage aliases,
        Markdown headings, evidence text, table rows, JSON rows, or validation
        summaries.
      - --scope all can show and inspect the approved excluded paths when local
        Git history contains them.
      - Cross-prefix rename cases remain scope-honest and carry partial-lineage
        caveats when kept rows lose excluded rename-edge evidence.
      - Table, JSON, Markdown, help, README, and --explain disclose the expanded
        project-scope prefix list and retain the --scope all escape hatch.
      - Documentation states project scope is a convenience default, not more
        correct than full local Git-history evidence.
      - No .gitignore import, globs, pathspecs, regexes, config files, dynamic
        classifiers, broad vendor/docs/fixtures exclusions, providers, cache,
        scoring redesign, CI, release packaging, network behaviour, or telemetry
        behaviour is added.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build test
      - zig build validate
      - git diff --check
      - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
