design:
  rough_shape:
    - Add a small internal Zig module for provider envelopes, provider states,
      confidence, caveats, and current-symbol evidence.
    - Import the module only enough for unit tests/build coverage; do not
      execute providers from the CLI.
    - Add synthetic unit tests for path safety, deterministic ordering, and
      provider state modelling.
    - Update docs/provider-symbol-evidence-contract.md with a short
      implementation-seam note and defer real tree-sitter Zig parsing to the
      next feature.
  packets:
    - id: P1
      title: Provider and symbol evidence seam
      goal: Add minimal internal provider and current-symbol evidence primitives plus
        synthetic tests without adding provider runtime behaviour.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: src/provider.zig or equivalent new internal module,
          src/main.zig test import seam if needed,
          docs/provider-symbol-evidence-contract.md, build.zig,
          tests/integration.sh, tools/validate.sh."
        - "In scope: internal Zig types/helpers for provider envelope,
          freshness, failure state, confidence, caveats, local provenance,
          current symbol range evidence, deterministic ordering, and path safety
          tests."
        - "Out of scope: tree-sitter dependency, Zig grammar, parser runtime,
          provider registry, plugin lifecycle, CLI flags, config, report schema
          changes, cache, scoring/ranking changes, network, telemetry, source
          snippets, author metrics, and historical symbol lineage."
        - "Protected: existing CLI behaviour and no-provider table/JSON/Markdown
          outputs must remain unchanged; file-level Git evidence remains product
          truth."
        - "Dependencies: Feature 0020 provider contract and B001 local-first OSS
          constraints."
        - "Validation/evidence: git diff --check; zig build test; zig build
          validate; checks proving no build dependency, CLI flag, report schema,
          scoring, cache, network, telemetry, or runtime provider execution was
          added; close-out smoke with sibling-local-repo when available."
        - "Review focus: seam is useful for a later tree-sitter Zig provider but
          does not harden a broad framework or imply symbol evidence exists in
          reports today."
        - "Escalate if: implementation needs real parser integration,
          C/linker/dependency work, schema changes, scoring changes, source
          snippets, provider execution from CLI, or any hidden default provider
          behaviour."
        - "Done boundary: internal seam, synthetic tests, docs mapping, and
          validation evidence are complete; tree-sitter implementation remains a
          separate future feature."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
