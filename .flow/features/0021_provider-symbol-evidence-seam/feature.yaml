    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The provider contract is documented, but the runtime has no minimal
          internal seam for optional provider evidence. Jumping directly to a
          tree-sitter Zig dependency would combine dependency/build risk,
          report-shape decisions, symbol modelling, and parser correctness in
          one feature.
      - source_ref: prd.md#problem[2]
        text: We need a small implementation boundary that turns the provider contract
          into safe internal Zig model primitives before the first real provider
          is wired in.
      - source_ref: prd.md#outcome[1]
        text: Add a minimal provider/symbol evidence seam that can be used by a later
          tree-sitter Zig spike, while keeping current CLI behaviour and
          file-level Git-history reports unchanged when no provider evidence
          exists.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add a minimal provider and current-symbol evidence seam that future
      providers can use, while keeping current file-level CLI reports unchanged
      when no provider evidence exists.
    acceptance:
      - Minimal internal provider evidence model represents provider name, kind,
        version, contract version, config fingerprint, input identity,
        freshness, failure state, confidence, caveats, and local-only
        provenance.
      - Minimal current-symbol evidence model represents repo-relative path,
        symbol name, kind, current range, provider association, confidence, and
        caveats without implying historical symbol lineage.
      - Synthetic unit tests cover deterministic ordering, state values, unsafe
        path rejection, caveat behaviour, current-only semantics, and absence of
        source snippets or private machine paths.
      - No tree-sitter dependency, grammar source, provider registry, CLI flag,
        report schema change, cache, scoring change, ranking change, network
        access, telemetry, or background analysis is added.
      - Existing no-provider table, JSON, and Markdown outputs remain unchanged
        and `zig build validate` passes.
      - Provider documentation is updated only as needed to map the contract to
        the internal seam and keep future tree-sitter Zig work bounded.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
