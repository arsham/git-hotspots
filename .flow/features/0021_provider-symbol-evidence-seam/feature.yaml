schema: flow-feature.v1
feature:
  id: "0021"
  slug: provider-symbol-evidence-seam
  title: Provider symbol evidence seam
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: The provider contract is documented, but the runtime has no minimal
    internal seam for optional provider evidence. Jumping directly to
    tree-sitter would combine dependency, report-shape, symbol modelling, and
    parser correctness risk in one feature.
  outcome: Add a minimal provider and current-symbol evidence seam that future
    providers can use, while keeping current file-level CLI reports unchanged
    when no provider evidence exists.
  acceptance:
    - Minimal internal provider evidence model represents provider name, kind,
      version, contract version, config fingerprint, input identity, freshness,
      failure state, confidence, caveats, and local-only provenance.
    - Minimal current-symbol evidence model represents repo-relative path,
      symbol name, kind, current range, provider association, confidence, and
      caveats without implying historical symbol lineage.
    - Synthetic unit tests cover deterministic ordering, state values, unsafe
      path rejection, caveat behaviour, current-only semantics, and absence of
      source snippets or private machine paths.
    - No tree-sitter dependency, grammar source, provider registry, CLI flag,
      report schema change, cache, scoring change, ranking change, network
      access, telemetry, or background analysis is added.
    - Existing no-provider table, JSON, and Markdown outputs remain unchanged
      and `zig build validate` passes.
    - Provider documentation is updated only as needed to map the contract to
      the internal seam and keep future tree-sitter Zig work bounded.
planning:
  state: ready
  summary: Reshaped from immediate tree-sitter integration to a prerequisite
    provider/symbol evidence seam. Implement minimal internal Zig model
    primitives and synthetic tests only; defer tree-sitter Zig parsing to a
    later feature.
  brief_sync:
    status: updated
    reason: B001 establishes deterministic local-first file-level Git evidence and
      providers as optional later enrichers. Feature 0021 creates the small
      runtime seam needed before a real tree-sitter provider.
    checked_at: 2026-05-23T02:58:45.166Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Feature 0021 follows the provider contract from Feature 0020 by adding
      only an internal provider/symbol seam while preserving file-level Git
      evidence as product truth and excluding runtime tree-sitter work.
    checked_at: 2026-05-23T02:58:45.166Z
