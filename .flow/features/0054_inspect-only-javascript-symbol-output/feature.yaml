schema: flow-feature.v1
feature:
  id: "0054"
  slug: inspect-only-javascript-symbol-output
  title: Inspect-only JavaScript symbol output
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: JavaScript source import, build, query, and extraction proofs are
    complete, but inspect-only Tree-sitter symbols are still exposed only for
    Zig, Go, and Python files.
  outcome: JavaScript current-symbol evidence is exposed through the existing
    opt-in inspect-only symbols flow while defaults, file-level Git evidence,
    scoring, and existing providers remain stable.
  acceptance:
    - Support git-hotspots --inspect path.js --symbols for resolved .js, .mjs,
      .cjs, and admitted .jsx files.
    - Reuse the existing symbols output envelope and provider metadata shape.
    - Keep JavaScript symbols current working-tree evidence only; do not affect
      score, rank, confidence, lineage, co-change, scope, or default analysis.
    - Preserve existing no-provider, Zig, Go, and Python symbol outputs except
      explicitly planned language-neutral wording.
    - Document JavaScript inspect-only support in README, --help, and --explain
      without claiming symbol history, Node/package/workspace/module analysis,
      TypeScript/TSX, or repo-wide scanning.
    - Add deterministic table, JSON, Markdown, edge-case, privacy, and real-repo
      smoke validation.
    - Do not add new flags, symbol-line-history, scoring/cache changes,
      TypeScript/TSX support, Node provider identity, package/workspace
      analysis, LSP, custom queries, network, telemetry, or remote enrichment.
planning:
  state: ready
  summary: Shape inspect-only JavaScript symbol output as the first user-visible
    JavaScript provider feature, after internal extraction proof.
