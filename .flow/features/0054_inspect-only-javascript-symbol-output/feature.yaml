design:
  rough_shape:
    - Add runtime JavaScript provider module using the proven extraction
      contract.
    - Dispatch inspect --symbols by resolved inspected extension for JavaScript
      paths only.
    - Add output goldens and semantic checks for JavaScript symbols and edge
      cases.
    - Update docs/help/explain to list Zig, Go, Python, and JavaScript
      inspect-only symbols.
    - Keep symbol line-history deferred.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Inspect-only JavaScript symbol output
      goal: Expose JavaScript current symbols through the existing inspect-only output
        envelope without changing default analysis or existing providers.
      owner_phase: runner
      execution_context:
        - "Anchors: src tree-sitter provider modules, CLI inspect symbols path,
          fixtures/expected, tests, README.md, help/explain text, docs for
          JavaScript evidence."
        - "In scope: runtime JavaScript extraction module, extension dispatch
          for .js/.mjs/.cjs and admitted .jsx, output goldens, docs/help/explain
          updates, validation evidence."
        - "Out of scope: new CLI flags, symbol-line-history, report schema
          expansion beyond existing symbols envelope, scoring/cache/default
          analysis changes, TypeScript/TSX, Node/package/workspace/module
          analysis, custom queries, LSP."
        - "Protected: file-level Git evidence remains product truth; existing
          no-provider and Zig/Go/Python symbol outputs stay stable unless
          explicitly language-neutral; no provider execution outside inspect
          --symbols."
        - "Dependencies: Feature 0053 JavaScript symbol extraction proof
          complete."
        - "Validation/evidence: full validation ladder; JavaScript symbol
          success and degraded goldens; repeated determinism; semantic JSON
          checks; privacy/prohibited scans; sibling-local-repo close-out smoke."
        - "Review focus: output is inspect-only, deterministic, privacy-safe,
          current-only, and does not imply Node, package, TypeScript, or
          symbol-history support."
        - "Escalate if: schema expansion is needed, JavaScript output changes
          scoring/default reports, existing provider goldens drift unexpectedly,
          or symbol-line-history behaviour must change."
        - "Done boundary: JavaScript inspect-only symbols are user-visible and
          documented; line-history remains deferred."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-javascript-symbol-proof
        - git diff --check
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
