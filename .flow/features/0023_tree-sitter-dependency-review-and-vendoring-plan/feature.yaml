  acceptance_contract:
    outcome: Produce a documentation-only dependency review, bill-of-materials
      candidate, and vendoring go/no-go plan for a future Tree-sitter Zig
      provider while preserving current runtime, build, validation, and report
      behaviour.
    acceptance:
      - A new dependency review document records candidate upstreams, immutable
        revisions, source archive or checkout identities, checksums when
        available or generated, license/SPDX information, notice obligations,
        generated-source provenance, expected vendoring layout, update policy,
        and source-install impact for Tree-sitter core and a Zig grammar source.
      - The document compares system packages, build-time fetches, Tree-sitter
        CLI shell-out, vendored pinned local sources, and deferral, and rejects
        non-local or non-portable product runtime paths unless a later feature
        explicitly reshapes them.
      - The document ends with a clear go, conditional-go, or no-go
        recommendation for the next feature and lists blockers or evidence
        required before any vendored-source import or offline build proof.
      - The document defines acceptance requirements for a later vendored-source
        import and a later offline build/provider runtime proof, including no
        build-time network, no global parser dependency, license/notice
        handling, byte-stable no-provider outputs, and opt-in inspect-oriented
        provider behaviour.
      - This feature changes only documentation and Flow state; it does not add
        vendored sources, build.zig.zon, C build/linking, parser runtime,
        provider registry, CLI flags, report schema fields, scoring/ranking
        changes, cache, source/test/fixture changes, network runtime, telemetry,
        upload, remote enrichment, or background analysis.
      - Validation passes and scans prove the documentation contains no private
        paths, private remotes, raw parser stderr, raw private reports, author
        identities, hosted/pricing/sales strategy, bug-prediction claims,
        code-quality scoring claims, developer ranking, or maintainer judgement.
