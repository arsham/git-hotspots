design:
  rough_shape:
    - Create a focused dependency review and vendoring plan document for
      Tree-sitter core and a Zig grammar source.
    - Record exact candidate upstream URLs, immutable revisions/tags, source
      identities, checksums when available, license/SPDX details, notices,
      generated-source provenance, vendoring layout, and update policy.
    - Compare system package, build-time fetch, CLI shell-out, vendored local
      sources, and deferral strategies against
      local-first/offline/source-install constraints.
    - End with a go, conditional-go, or no-go decision for the next feature and
      a precise acceptance contract for vendored-source import or offline build
      proof.
    - Keep this feature documentation-only and preserve all current
      runtime/build/report behaviour.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Dependency review and vendoring go/no-go record
      goal: Produce the documentation-only Tree-sitter dependency review, BOM
        candidate, vendoring plan, and next-feature go/no-go recommendation
        without adding parser/build/runtime behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: docs/tree-sitter-zig-provider-spike.md,
          docs/provider-symbol-evidence-contract.md, new
          docs/tree-sitter-dependency-vendoring-plan.md, build.zig, README.md,
          src/provider.zig."
        - "In scope: public upstream dependency research, candidate immutable
          revisions or tags, source archive/checksum notes, license/SPDX and
          notice obligations, generated grammar provenance, expected vendoring
          layout, update policy, source-size/build-risk notes, strategy
          comparison, future validation matrix, and go/conditional-go/no-go
          recommendation."
        - "Out of scope: vendored Tree-sitter or grammar sources, generated C
          files, build.zig.zon, build.zig C compilation/linking, parser
          wrapper/runtime, provider registry, CLI flags, report schema fields,
          scoring/ranking changes, cache, source/test/fixture changes, CI,
          release packaging, network runtime, telemetry, upload, remote
          enrichment, or background analysis."
        - "Protected: current dependency-free source install, no-provider
          table/JSON/Markdown outputs, local-first runtime defaults, file-level
          Git evidence as product truth, provider contract, and OSS/publicity
          boundary."
        - "Dependencies: Feature 0020 provider contract, Feature 0021 provider
          symbol seam, Feature 0022 tree-sitter feasibility record, and B001
          local-first capability brief."
        - "Validation/evidence: git diff --check; zig build validate;
          changed-path scan proving docs plus Flow only; no-runtime/dependency
          scan; no-network scan; privacy/prohibited-claim scan over the new
          document."
        - "Review focus: exactness of upstream/license/provenance facts, clear
          separation of facts from decisions, adequacy of future
          vendoring/offline-build contract, and proof that no
          runtime/build/provider behaviour changed."
        - "Escalate if: exact revisions or licenses cannot be determined,
          generated-source provenance is unclear, upstream terms are
          incompatible, vendoring would require build-time network/global
          packages/submodules, or implementation pressure requires
          build/runtime/report/schema/scoring changes."
        - "Done boundary: dependency review document exists, next feature
          recommendation is explicit, current validation passes, changed paths
          stay documentation/Flow only, and all no-runtime/privacy/local-first
          scans pass."
      verification_commands:
        - git diff --check
        - zig build validate
        - "changed-path scan: docs plus Flow only; no
          src/tests/fixtures/tools/build.zig/build.zig.zon/third_party/parser-s\
          ource changes"
        - "no-runtime/dependency scan: no tree-sitter sources, grammar sources,
          C build/linking, parser runtime, provider registry,
          CLI/report/scoring/cache changes"
        - privacy/prohibited scan over
          docs/tree-sitter-dependency-vendoring-plan.md
