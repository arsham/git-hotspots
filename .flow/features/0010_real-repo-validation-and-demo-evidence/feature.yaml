design:
  rough_shape:
    - Create a privacy-safe real-repo validation note, likely
      `docs/real-repo-validation.md`, describing commands, evidence policy, and
      this-repo demo observations.
    - Generate this-repo demo evidence from a clean worktree with
      `--exclude-prefix .flow/`, using table/JSON/Markdown as needed and
      committing only bounded, non-judgemental excerpts or summaries.
    - Run the same existing CLI on an operator-provided sibling/local repo and
      commit only label/count/caveat/timing/category summaries.
    - Do not add new CLI behaviour unless validation exposes a separately shaped
      bug.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
  packets:
    - id: P1
      title: Evidence contract and demo policy
      goal: Establish the exact evidence policy, commands, and privacy/publicity
        boundaries for real-repo validation.
      depends_on: []
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors:
          .flow/features/0010_real-repo-validation-and-demo-evidence/prd.md,
          docs/real-repo-validation.md if created."
        - "In scope: define command set, safe evidence fields, public this-repo
          demo boundary, sibling summary-only boundary, and close-out evidence
          requirements."
        - "Out of scope: scoring changes, CLI behaviour changes, providers,
          cache, CI, release, packaging, network, telemetry, upload, public
          third-party case studies, or private raw report publication."
        - "Protected: project-memory privacy rules; public claims remain
          investigation-prompt framing; no raw sibling repo paths, names,
          reports, authors, remotes, commit messages, or source snippets."
        - "Dependencies: completed Features 0002-0009 and operator-approved
          `.flow/` exclusion for this-repo demo."
        - "Validation/evidence: manual read-through against project memory and
          PRD; expected observation is an evidence policy that a fresh
          runner/reviewer can apply without chat context; durable proof location
          is docs/real-repo-validation.md and runner handoff."
        - "Review focus: the policy prevents leaks and judgemental framing while
          still collecting usefulness evidence."
        - "Escalate if: execution needs a named private repo in committed
          artefacts, a public third-party case study, raw private output, or new
          runtime behaviour."
        - "Done boundary: evidence policy is durable enough to run this repo and
          sibling smoke safely."
      verification_commands:
        - git diff --check
    - id: P2
      title: This-repo demo evidence
      goal: Produce and document a small public-safe demo from this repo only, using
        the existing CLI and approved `.flow/` exclusion.
      depends_on:
        - P1
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: docs/real-repo-validation.md, README.md only if a tiny link
          or summary is justified."
        - "In scope: run this repo with unscoped and scoped commands; include
          `--exclude-prefix .flow/`; verify table, JSON, and Markdown; record
          version, command, clean/dirty state, result counts, caveats, scope
          counts, and 1-2 non-judgemental usefulness/noise observations."
        - "Out of scope: publishing full raw reports unless they are from this
          repo, privacy-scanned, small, and framed as sample output; no
          third-party repo naming or excerpts."
        - "Protected: no Flow process exposition in README; no claim that top
          files are bad, buggy, low quality, or maintained poorly."
        - "Dependencies: clean worktree or explicit explanation of dirty caveat;
          P1 evidence policy."
        - "Validation/evidence: run `zig build validate`; run
          `./zig-out/bin/git-hotspots --repo . --exclude-prefix .flow/ --limit
          10 --format json`; run table and Markdown equivalents; verify no
          `.flow/` result/cochange paths; record bounded counts only."
        - "Review focus: demo is useful, reproducible, scope-disclosed, and not
          judgemental."
        - "Escalate if: useful demo requires hiding scope metadata, editing
          scoring, or publishing private/process-heavy output."
        - "Done boundary: this-repo demo evidence is committed in a
          privacy-safe, public-safe form."
      verification_commands:
        - zig build validate
        - git diff --check
    - id: P3
      title: Sibling repo smoke summary
      goal: Validate the CLI on one operator-provided local/sibling repo and record
        only privacy-safe summary evidence.
      depends_on:
        - P1
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: docs/real-repo-validation.md or Flow run evidence; no raw
          sibling reports committed."
        - "In scope: run close-out validation with `-Dsmoke-repo=<operator-path>
          -Dsmoke-label=sibling-local-repo`; run table/JSON/Markdown command
          shapes if needed; record safe label, result count, caveat count, dirty
          flag, scope-active flag, elapsed time, and categorical
          usefulness/noise observations."
        - "Out of scope: committing sibling repo name, absolute path, raw
          output, remote URL, author identity, commit messages, source snippets,
          or org-specific structure."
        - "Protected: no clone/fetch/pull to prepare the repo; use only the
          provided local Git worktree."
        - "Dependencies: operator provided a local/sibling repo path for
          execution-time use; do not persist the actual path in committed
          artefacts."
        - "Validation/evidence: `zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-path> -Dsmoke-label=sibling-local-repo`;
          expected observation is pass with privacy-safe summary. Durable proof
          location is runner handoff and committed summary without private
          names/paths."
        - "Review focus: sibling evidence proves real-repo viability without
          leaking private structure."
        - "Escalate if: provided repo is missing, not a Git worktree, too small
          to be meaningful, requires network access, or output cannot be
          summarised safely."
        - "Done boundary: sibling smoke is completed or the feature is
          explicitly reshaped with an approved skip reason."
      verification_commands:
        - zig build validate
        - git diff --check
    - id: P4
      title: Close-out validation and hygiene
      goal: Prove the evidence artefacts are safe, current, and useful enough to guide
        the next product feature.
      depends_on:
        - P2
        - P3
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: docs/real-repo-validation.md, README.md if touched, Flow run
          evidence."
        - "In scope: final validation, prohibited-claim scan, privacy scan, git
          status, and concise next-feature observations from evidence."
        - "Out of scope: selecting a new implementation feature as a commitment;
          release/GitHub Release/CI work; history rewrite unless a specific leak
          is found and operator explicitly approves."
        - "Protected: committed artefacts must not contain private repo names,
          absolute paths, raw private reports, emails, remote URLs, author
          identities, source snippets, or positive bug/quality/developer-ranking
          claims."
        - "Dependencies: P2 and P3 complete."
        - "Validation/evidence: `zig build validate`; close-out validation with
          sibling repo; `git diff --check`; `git status --short --branch`; scans
          for prohibited claims and private path/URL/email patterns; review doc
          size for raw report dumps."
        - "Review focus: close-out evidence is enough to decide the next product
          slice from real data, not assumptions."
        - "Escalate if: validation fails, evidence implies scoring/noise changes
          are required before docs can be honest, or privacy scan finds unsafe
          content."
        - "Done boundary: Feature 0010 leaves a clean repo with privacy-safe
          real-repo validation evidence and explicit candidate next seams, not a
          roadmap commitment."
      verification_commands:
        - zig build validate
        - git diff --check
