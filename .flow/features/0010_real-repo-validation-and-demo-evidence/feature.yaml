schema: flow-feature.v1
feature:
  id: "0010"
  slug: real-repo-validation-and-demo-evidence
  title: Real-repo validation and demo evidence
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The public alpha CLI is now published, but its usefulness has only been
    proven by fixtures, this-repo validation, and smoke checks. Before adding
    broader features, we need privacy-safe real-repository evidence that
    file-level reports are understandable, useful, and not dominated by
    avoidable noise.
  outcome: Produce a narrow validation-and-demo evidence slice using the existing
    CLI on this repo and one operator-provided local/sibling repo, committing
    only privacy-safe summaries and this-repo demo material so the next product
    feature is chosen from evidence rather than assumption.
  acceptance:
    - This repo is exercised from a clean worktree with unscoped and scoped
      commands, including `--exclude-prefix .flow/`, JSON, Markdown, table, and
      `--explain` where relevant.
    - Public demo material, if committed, is generated only from this public
      repo, uses repo-relative paths, records the exact command and version,
      excludes `.flow/` as approved, and frames hotspots as investigation
      prompts rather than judgements.
    - One operator-provided local or sibling Git worktree is exercised with
      privacy-safe label `sibling-local-repo`, or execution stops before
      dispatch until such a path is provided; no raw sibling reports are
      committed.
    - Committed sibling evidence contains only safe labels, command shapes,
      pass/fail summaries, bounded result/caveat/scope counts, elapsed timing,
      and 1-2 categorical usefulness/noise observations without private paths,
      repo names, authors, remotes, commit messages, source snippets, or raw
      reports.
    - "Evidence checks cover usefulness basics: reports have non-empty results
      where expected, positive scores, confidence/caveat fields, evidence
      commits, Markdown sections, JSON validity, and scoped output without
      `.flow/` leakage."
    - "Evidence checks record performance and scale basics: tool version,
      Git/Zig versions when relevant, analysed commit count, tracked-file count,
      elapsed time, dirty flag, caveat count, and whether reports stay within
      small-output bounds."
    - No scoring, Git traversal, provider, cache, package/release, CI, network,
      telemetry, upload, remote enrichment, author/developer metric,
      commercial/SaaS, or hosted-product behaviour is added.
    - Docs and committed evidence do not claim bug prediction, objective
      code-quality scoring, technical-debt scoring, maintainer judgement,
      developer ranking, productivity analytics, or third-party OSS blame.
    - Close-out evidence includes `zig build validate`, close-out validation
      with the operator-provided sibling repo, `git diff --check`,
      docs/prohibited-claim scan, privacy scan of committed demo/evidence
      artefacts, and clean git status.
planning:
  state: ready
  summary: Evidence-first validation feature. Public raw demo is limited to this
    repo with `.flow/` explicitly excluded as approved. A second local/sibling
    repo is required before dispatch because Arsham chose to provide it;
    committed evidence for that repo must be summary-only and privacy-safe.
  brief_sync:
    status: unchanged
    reason: Feature 0010 validates the current B001 capability with real-repo
      evidence; B001 remains current.
    checked_at: 2026-05-22T16:12:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Feature 0010 tests whether deterministic file-level hotspot reports are
      useful on real repositories without expanding runtime truth or public
      claims.
    checked_at: 2026-05-22T16:12:00.000Z
