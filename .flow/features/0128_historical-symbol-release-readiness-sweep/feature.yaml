  acceptance_contract:
    outcome: A tracked readiness proof or docs/validation-only correction confirms
      historical-symbol release-facing surfaces are coherent, evidence-only, and
      aligned with current fixture and synthetic proof truth.
    acceptance:
      - Historical-symbol public surfaces are inspected and either confirmed
        release-ready or corrected with docs/validation-only changes.
      - Checked-in fixture non-exceeded truth remains distinct from synthetic
        aggregate-bound exceeded proof.
      - No runtime behaviour, CLI/schema, scoring, ranking, provider admission,
        fixture golden data, release/tag/package/remote/network/telemetry/cache
        behaviour changes.
      - Validation includes git diff --check, zig build test, and zig build
        validate.
      - If stale historical-symbol release wording is found, only docs or
        validation-anchor fixes are allowed; if no stale wording is found,
        execution must produce a tracked no-change readiness proof.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
      - tools/flow-closeout-check.sh --smoke-skip-reason <privacy-safe reason if
        no second repo>
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify release-facing historical-symbol surfaces against dispatch
        comparison basis
      - verify changed or intentionally unchanged README user guide man page
        CHANGELOG and historical-symbol docs
      - verify git diff --check zig build test zig build validate and close-out
        smoke evidence
  decision_budget:
    allowed_local_decisions:
      - docs wording correction inside historical-symbol release-readiness scope
      - validation-anchor update inside historical-symbol release-readiness scope
      - tracked no-change readiness proof when surfaces are aligned
    deferred_reconcile_triggers:
      - minor docs wording adjustment that stays evidence-only
      - no-change proof instead of docs edits
      - validation command substitution with equivalent coverage
    hard_planner_escalation_triggers:
      - runtime behaviour change
      - CLI/schema/report field change
      - fixture golden data change
      - provider admission change
      - release/tag/package/remote side effect
      - network/telemetry/cache behaviour change
      - semantic lineage ownership bug prediction code-quality dependency or
        developer-performance claim
    protected_surfaces:
      - runtime behaviour
      - CLI flags/options
      - JSON schema/report fields
      - scoring/ranking/confidence
      - provider admission
      - fixture golden data
      - release/tag/package/remote mutation
      - network access
      - telemetry
      - cache behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
