design:
  rough_shape: []
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Inspect selection data contract
      goal: Add internal exact-path inspect selection from the full scoped evidence
        universe without changing scoring or Git aggregation truth.
      owner_phase: runner
      execution_context:
        - "Anchors: src/model.zig, src/git.zig, src/main.zig, with
          src/scoring.zig protected."
        - "In scope: config field for inspect path, exact repo-relative path
          validation, selection after scope/filter/aggregation/ranking and
          before limit truncation, clear not-found errors."
        - "Out of scope: subcommands, fuzzy/pathspec/glob matching, multi-file
          inspect, score changes, Git traversal redesign, source snippets,
          authors, commit messages, providers, cache."
        - "Protected: scoring formulas and tie-breaks, include/exclude
          semantics, co-change calculation, existing normal report results and
          goldens."
        - "Validation/evidence: unit and integration cases for valid exact
          paths, invalid paths, below-top-N target with limit rejection or
          independence, scoped in/out targets, renamed path target, and no score
          drift."
        - "Review focus: target selection cannot happen after normal limit
          truncation and cannot happen before co-change evidence is computed."
        - Escalate if implementation needs a new scoring model, a query
          language, source-aware inspection, or broader path matching.
        - "Done boundary: valid inspect targets produce one selected result from
          the full scoped analysis and invalid/not-found paths fail clearly."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: done
      title: CLI rendering and output contract
      goal: Expose --inspect PATH through existing formats and make output
        deterministic, privacy-safe, and inspect-specific where needed.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/report.zig, fixtures/expected/*,
          tests/integration.sh."
        - "In scope: help/parser updates, invalid combinations with --explain
          and --version, table/JSON/Markdown output with one result row,
          additive inspect metadata for JSON/Markdown/table where needed."
        - "Out of scope: new output format, bespoke narrative advice,
          source/diff/commit-message output, report schema breakage for normal
          ranked reports."
        - "Protected: default report outputs and JSON schema version for
          non-inspect runs remain stable unless the PRD explicitly allows an
          additive inspect-only field."
        - "Validation/evidence: exact goldens for successful inspect on
          fixtures/basic across JSON, Markdown, and table; deterministic
          repeated diffs; JSON validity; Markdown escaping for weird paths."
        - "Review focus: inspect row matches full analysis row under same scope
          and reports remain investigation prompts, not quality or risk
          judgements."
        - Escalate if renderer needs data unavailable in model.Result or if
          normal reports would need breaking schema changes.
        - "Done boundary: --inspect works in all existing formats and normal
          report behaviour is unchanged."
      verification_commands:
        - zig build
        - zig build test
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
          --format json
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
          --format markdown
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
          --format table
    - id: P3
      depends_on:
        - P2
      status: done
      title: Validation docs and real-repo smoke
      goal: Make inspect part of the canonical validation ladder and public docs
        without widening product scope.
      owner_phase: runner
      execution_context:
        - "Anchors: tests/integration.sh, tools/validate.sh, README.md, optional
          privacy-safe note in docs/real-repo-validation.md if useful."
        - "In scope: inspect fixtures/goldens, validate rungs, this-repo inspect
          smoke using public repo-relative paths and .flow/ exclusion, close-out
          sibling smoke as label/count summary only."
        - "Out of scope: public third-party case studies, CI/release/package
          work, provider/cache plans, raw private reports, private paths or repo
          names."
        - "Protected: README remains visitor-facing and Flow/process-light; docs
          keep hotspots as investigation prompts, not predictions or rankings."
        - "Validation/evidence: zig build validate, close-out validation with
          sibling-local-repo or approved safe skip reason, git diff --check,
          prohibited-claim/privacy scans, git status clean."
        - "Review focus: committed docs and validation summaries reveal no
          private sibling structure and do not overclaim what inspect proves."
        - Escalate if useful validation requires raw private output,
          network/fetch/telemetry, or claims beyond deterministic Git-history
          evidence.
        - "Done boundary: canonical validation proves inspect
          parity/errors/privacy and docs explain the command honestly."
      verification_commands:
        - zig build validate
        - zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-provided-local-repo>
          -Dsmoke-label=sibling-local-repo or approved safe skip reason
        - git diff --check
        - git status --short --branch
  output_contract:
    cli_surface: git-hotspots [analysis flags] --inspect PATH --format table|json|markdown
    path_contract: PATH is an exact repo-relative Git path using slash separators.
      Reject empty, absolute, drive-rooted, parent-segment, and
      control-character paths. Do not implement glob, fuzzy, pathspec, or
      gitignore semantics.
    selection_timing: Apply include/exclude scope filters, aggregate Git history,
      compute co-change evidence, score and rank all in-scope files, then select
      the exact inspect target before normal limit truncation.
    output: Reuse table, JSON, and Markdown with exactly one result row. Add
      inspect-specific metadata where needed; normal report output remains
      stable.
    not_found: Valid target with no matching scoped Git-history evidence exits
      non-zero with clear stderr and no judgemental wording.
    non_goals:
      - subcommand parser
      - symbol or function inspection
      - source snippets
      - diffs or patches
      - commit messages
      - authors or blame
      - providers
      - cache
      - network
      - telemetry
      - scoring redesign
      - CI or release work
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
