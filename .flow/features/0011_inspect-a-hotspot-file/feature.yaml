  acceptance_contract:
    outcome: Add an exact repo-relative --inspect PATH analysis flag that emits a
      one-file hotspot drilldown in the existing table, JSON, and Markdown
      formats from the same local Git-history evidence model. Normal ranked
      reports remain stable, and inspect output stays local-first, privacy-safe,
      and framed as investigation evidence.
    acceptance:
      - --inspect PATH is documented in help and README as an exact
        repo-relative file drilldown flag.
      - --inspect PATH accepts existing --repo, --since, --include-prefix,
        --exclude-prefix, and --format table|json|markdown analysis options.
      - --inspect PATH is rejected with --explain and --version using clear
        stderr.
      - Inspect path validation rejects empty, absolute POSIX, Windows
        drive-rooted, leading backslash, parent-segment, and control-character
        paths.
      - Inspect selection happens after scope filtering, aggregation, co-change
        calculation, scoring, and ranking, but before normal --limit truncation,
        so a valid below-top-N target remains inspectable.
      - --limit is rejected when --inspect is present, so users do not infer
        that limit can hide or reshape the inspected target.
      - Successful inspect output contains exactly one result row in table,
        JSON, and Markdown formats.
      - Inspect JSON includes additive metadata to identify requested path,
        matched path, and rank in the scoped evidence universe while preserving
        normal report JSON compatibility.
      - The inspected result matches the equivalent row from full JSON analysis
        under the same repo, range, and scope for score breakdown, changes,
        churn, recency, current size, cochanges, confidence, caveats, and
        bounded evidence commits.
      - If the inspect target has no matching Git-history evidence in the
        selected scope, the command exits non-zero with a clear non-judgemental
        message and no panic.
      - Include/exclude scope filters affect inspect consistently; targets
        outside include scope or excluded by prefix do not leak into results or
        co-change evidence.
      - Deleted, binary, renamed, unicode, spaces, glob-like, tab-escaped, and
        markdown-special paths render safely and preserve existing caveats.
      - Existing normal table, JSON, Markdown, --explain, --version,
        prefix-filter, and fixture golden outputs remain stable except
        intentional help/docs updates.
      - No scoring formula, Git traversal semantics, report ranking, confidence
        thresholds, network posture, telemetry posture, provider/cache
        behaviour, author metrics, or source-content exposure changes.
      - zig build validate covers inspect fixture goldens, determinism, error
        cases, privacy scans, and real-repo smoke with this repo plus configured
        close-out sibling path or explicit safe skip reason.
      - Committed evidence and docs do not contain private repo paths, raw
        sibling reports, author identities, remotes, commit messages, source
        snippets, hosted/commercial plans, bug-prediction claims, code-quality
        scores, developer rankings, or productivity analytics.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
        --format json
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
        --format markdown
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --inspect src/app.txt
        --format table
      - zig build validate
      - zig build validate -Dcloseout=true
        -Dsmoke-repo=<operator-provided-local-repo>
        -Dsmoke-label=sibling-local-repo or approved safe skip reason
      - git diff --check
      - git status --short --branch
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
