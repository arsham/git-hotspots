schema: flow-feature.v1
feature:
  id: "0011"
  slug: inspect-a-hotspot-file
  title: Inspect a hotspot file
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Current hotspot reports identify which files have concentrated change
    pressure, but users must scan a top-N report to understand one selected
    file. They need a deterministic single-file drilldown that reuses existing
    evidence without source snippets, authors, providers, cache, or diagnostic
    overclaims.
  outcome: Add an exact repo-relative --inspect PATH analysis flag that emits a
    one-file hotspot drilldown in the existing table, JSON, and Markdown formats
    from the same local Git-history evidence model. Normal ranked reports remain
    stable, and inspect output stays local-first, privacy-safe, and framed as
    investigation evidence.
  acceptance:
    - --inspect PATH is documented in help and README as an exact repo-relative
      file drilldown flag.
    - --inspect PATH accepts existing --repo, --since, --include-prefix,
      --exclude-prefix, and --format table|json|markdown analysis options.
    - --inspect PATH is rejected with --explain and --version using clear stderr.
    - Inspect path validation rejects empty, absolute POSIX, Windows
      drive-rooted, leading backslash, parent-segment, and control-character
      paths.
    - Inspect selection happens after scope filtering, aggregation, co-change
      calculation, scoring, and ranking, but before normal --limit truncation,
      so a valid below-top-N target remains inspectable.
    - --limit is rejected when --inspect is present, so users do not infer that
      limit can hide or reshape the inspected target.
    - Successful inspect output contains exactly one result row in table, JSON,
      and Markdown formats.
    - Inspect JSON includes additive metadata to identify requested path,
      matched path, and rank in the scoped evidence universe while preserving
      normal report JSON compatibility.
    - The inspected result matches the equivalent row from full JSON analysis
      under the same repo, range, and scope for score breakdown, changes, churn,
      recency, current size, cochanges, confidence, caveats, and bounded
      evidence commits.
    - If the inspect target has no matching Git-history evidence in the selected
      scope, the command exits non-zero with a clear non-judgemental message and
      no panic.
    - Include/exclude scope filters affect inspect consistently; targets outside
      include scope or excluded by prefix do not leak into results or co-change
      evidence.
    - Deleted, binary, renamed, unicode, spaces, glob-like, tab-escaped, and
      markdown-special paths render safely and preserve existing caveats.
    - Existing normal table, JSON, Markdown, --explain, --version,
      prefix-filter, and fixture golden outputs remain stable except intentional
      help/docs updates.
    - No scoring formula, Git traversal semantics, report ranking, confidence
      thresholds, network posture, telemetry posture, provider/cache behaviour,
      author metrics, or source-content exposure changes.
    - zig build validate covers inspect fixture goldens, determinism, error
      cases, privacy scans, and real-repo smoke with this repo plus configured
      close-out sibling path or explicit safe skip reason.
    - Committed evidence and docs do not contain private repo paths, raw sibling
      reports, author identities, remotes, commit messages, source snippets,
      hosted/commercial plans, bug-prediction claims, code-quality scores,
      developer rankings, or productivity analytics.
planning:
  state: ready
  summary: Feature 0011 adds a bounded inspect mode. The chosen surface is
    --inspect PATH, not a subcommand, to keep the current CLI parser small while
    using product-facing inspect language. Inspect selects one exact path after
    include/exclude scope filtering, aggregation, scoring, co-change
    calculation, and ranking, but before normal limit truncation.
  brief_sync:
    status: updated
    reason: "Feature 0011 remains within B001: deterministic local-first file-level
      evidence, agent-readable outputs, no
      providers/cache/network/telemetry/author metrics, and hotspots framed as
