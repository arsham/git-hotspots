design:
  rough_shape:
    - Add or update a public provider capability matrix covering Zig, Go,
      Python, JavaScript, TypeScript, and TSX.
    - Align README, CLI help, and explain text around inspect-only symbols,
      current-line evidence, unsupported boundaries, and local-first behaviour.
    - Add focused validation that checks documentation-facing capability claims
      against current inspect behaviour without adding provider runtime scope.
    - Keep the feature documentation and validation only; do not add new
      language support, provider semantics, cache, scoring, telemetry, or remote
      behaviour.
  packets:
    - id: P1
      title: Provider capability documentation and validation matrix
      goal: Consolidate the documented provider capability surface and add a
        validation matrix that protects existing inspect-only semantics.
      depends_on: []
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, src/main.zig help text, src/explain.zig,
          tests/integration.sh, tools/validate.sh, fixtures/expected/*explain*,
          fixtures/expected/*symbols*, docs/ if a dedicated capability document
          is useful."
        - "In scope: capability matrix for Zig, Go, Python, JavaScript,
          TypeScript, and TSX; wording that distinguishes symbols from
          current-line evidence; validation that docs-facing claims match
          existing inspect behaviour."
        - "Out of scope: new providers, new language support, symbol extraction
          changes, line-history behaviour changes, default report changes,
          schema expansion, scoring/ranking/confidence changes, cache, CI
          expansion beyond local validation, release packaging,
          Node/package/tsconfig/LSP analysis, network, telemetry, upload, or
          remote enrichment."
        - "Protected: deterministic local-first defaults, existing
          JSON/Markdown/table bytes except intentional docs/help/explain
          fixtures, existing provider outputs, existing unsupported-language
          behaviour, OSS/publicity boundary, privacy-safe evidence."
        - "Dependencies: JavaScript and TypeScript/TSX provider lanes through
          Feature 0061 are done; no dependency on future provider admissions."
        - "Validation/evidence: git diff --check, zig fmt --check build.zig src
          tests when touched, zig build test, zig build validate, targeted
          inspect/help/explain golden checks, capability-matrix validation for
          supported and unsupported languages, privacy/prohibited-claims scan."
        - "Review focus: documentation matches current behaviour exactly, uses
          no overclaims, and validation prevents matrix drift without changing
          product semantics."
        - "Escalate if: accurate wording requires runtime behaviour changes,
          schema expansion, new provider semantics, type-aware package analysis,
          or a capability claim that current code cannot prove."
        - "Done boundary: docs/help/explain and validation are aligned, all
          checks pass, and runtime/product semantics are unchanged."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
        - targeted inspect/help/explain golden checks
        - capability-matrix validation for supported and unsupported languages
        - privacy and prohibited-claims scan
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
