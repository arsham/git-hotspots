schema: flow-feature.v1
feature:
  id: "0062"
  slug: provider-capability-documentation-consolidation
  title: Provider capability documentation consolidation
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Users can now inspect symbols for Zig, Go, Python, JavaScript,
    TypeScript, and TSX, but the public documentation, help, explain text, and
    validation story are spread across feature-specific additions. That makes it
    harder to understand which provider capabilities are available, which are
    inspect-only, which include current-line evidence, and which behaviours are
    intentionally absent.
  outcome: A concise provider capability surface documents supported languages,
    inspect-only symbol evidence, current-line history availability, unsupported
    boundaries, and validation coverage without changing runtime semantics.
  acceptance:
    - Public docs include a compact provider capability matrix for supported
      languages and symbol evidence modes.
    - CLI help, README, and explain language consistently describe symbol
      evidence as opt-in inspect evidence and distinguish current-line evidence
      from true symbol history.
    - Validation or test coverage proves the documented capability matrix stays
      aligned with current inspect behaviour for supported and unsupported
      languages.
    - Existing runtime outputs, default reports, scoring, ranking, confidence,
      cache behaviour, provider extraction, line-history evidence, and language
      support do not change except for documentation or validation text needed
      to reflect existing behaviour.
    - Public artefacts avoid private absolute paths, raw private report dumps,
      developer-performance framing, bug prediction, quality scoring, ownership
      claims, telemetry, upload, or remote enrichment claims.
