schema: flow-feature.v1
feature:
  id: "0017"
  slug: project-scope-as-default
  title: Project scope as default
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Unflagged git-hotspots reports currently default to all tracked
    Git-history paths. In this repository and real-repo evidence,
    workflow/process metadata can dominate the first-run report, making the
    default less useful for public alpha users.
  outcome: Unflagged analysis defaults to project scope during alpha, excluding
    only .flow/ by the existing project preset, while explicit --scope all
    preserves the old full-evidence universe.
  acceptance:
    - Unflagged analysis reports selected_scope=project and applies the existing
      project preset, currently only .flow/.
    - Explicit --scope all preserves the old all-tracked-path evidence universe
      and remains documented as the full local Git-history mode.
    - Explicit --scope project remains accepted and is equivalent to omitted
      --scope for table, JSON, Markdown, inspect, and progress stdout.
    - No new project exclusions, path classifiers, gitignore import, config
      files, cache, providers, scoring changes, report schema additions,
      network, telemetry, CI, or release packaging are added.
    - Default/project reports do not include .flow/ result paths or co-change
      paths; explicit --scope all can include .flow/ when those paths rank or
      are inspected.
    - Help, README, and explain text plainly disclose project scope as the alpha
      default and --scope all as the full-evidence escape hatch without implying
      scoped evidence is more correct.
    - Validation proves default/project/all parity, inspect interactions, prefix
      interactions, since/progress stability, deterministic outputs, and
      privacy-safe real-repo smoke with sibling-local-repo.
planning:
  state: ready
  summary: Change the alpha default evidence universe from all to project, with
    clear disclosure and an explicit --scope all escape hatch. This is a
    deliberate alpha breaking default change, not a scoring or provider change.
  brief_sync:
    status: updated
    reason: "Feature 0017 remains aligned with B001: deterministic local-first Git
      evidence, OSS/publicity boundary, and hotspots as investigation prompts.
      It changes only the alpha default evidence universe from all to project
      while preserving --scope all as full local Git evidence."
    checked_at: 2026-05-22T21:52:46.157Z
  brief_alignment:
    status: aligned
    role: primary
    summary: Feature 0017 is a primary product-behaviour slice under B001. It keeps
      deterministic local evidence and OSS/publicity boundaries while making the
      existing project scope preset the alpha default with explicit --scope all
      full-evidence escape hatch.
    checked_at: 2026-05-22T21:53:05.525Z
