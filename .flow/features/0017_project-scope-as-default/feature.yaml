  acceptance_contract:
    outcome: Unflagged analysis defaults to project scope during alpha, excluding
      only .flow/ by the existing project preset, while explicit --scope all
      preserves the old full-evidence universe.
    acceptance:
      - Unflagged analysis reports selected_scope=project and applies the
        existing project preset, currently only .flow/.
      - Explicit --scope all preserves the old all-tracked-path evidence
        universe and remains documented as the full local Git-history mode.
      - Explicit --scope project remains accepted and is equivalent to omitted
        --scope for table, JSON, Markdown, inspect, and progress stdout.
      - No new project exclusions, path classifiers, gitignore import, config
        files, cache, providers, scoring changes, report schema additions,
        network, telemetry, CI, or release packaging are added.
      - Default/project reports do not include .flow/ result paths or co-change
        paths; explicit --scope all can include .flow/ when those paths rank or
        are inspected.
      - Help, README, and explain text plainly disclose project scope as the
        alpha default and --scope all as the full-evidence escape hatch without
        implying scoped evidence is more correct.
      - Validation proves default/project/all parity, inspect interactions,
        prefix interactions, since/progress stability, deterministic outputs,
        and privacy-safe real-repo smoke with sibling-local-repo.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build test
      - git diff --check
      - zig build validate
      - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
