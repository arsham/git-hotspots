design:
  rough_shape:
    - Change the config/parser default scope from all to project while
      preserving explicit all and project flags.
    - Update tests and fixtures so unflagged output equals explicit project
      scope, and explicit --scope all preserves the old full evidence behaviour.
    - Update README/help/explain wording and close-out validation to make the
      alpha default change visible and privacy-safe.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Default contract switch
      goal: Make omitted --scope resolve to project while preserving explicit --scope
        all as the old full-evidence mode.
      depends_on: []
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: src/model.zig and src/main.zig."
        - "In scope: config/parser default, help text, parser unit tests for
          default project, explicit all, explicit project, invalid/missing/
          repeated/case-mismatched scope, duplicate excludes, and include/
          exclude interactions."
        - "Out of scope: new exclusions, config/default preference storage,
          scoring, providers, cache, CI, release packaging."
        - "Protected: literal prefix validation, excludes-win precedence,
          inspect timing, local-first/no-network behaviour, standalone --explain
          and --version."
        - "Dependencies: Feature 0012 scope preset semantics and Feature 0016
          streaming semantics remain intact."
        - "Review focus: the default change is intentional, minimal, disclosed,
          and limited to .flow/ exclusion."
        - "Escalate if: implementation needs broad project classifiers,
          gitignore import, generated/vendor taxonomies, scoring changes, schema
          changes, or hidden config."
        - "Done boundary: CLI parse/config state correctly represents new
          default and old full-evidence behaviour remains reachable with --scope
          all."
      verification_commands:
        - zig build test
        - git diff --check
    - id: P2
      title: Output parity and fixture update
      goal: Prove unflagged output equals explicit project scope while explicit
        --scope all preserves old all-scope evidence.
      depends_on:
        - P1
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: tests/integration.sh, tools/validate.sh,
          fixtures/expected/*, src/report.zig, src/model.zig if metadata wording
          requires it."
        - "In scope: update goldens and assertions for table, JSON, Markdown,
          inspect, progress stdout, since, include/exclude, and explicit all
          fixtures."
        - "Out of scope: report schema additions, raw omitted path lists, timing
          fields, new public benchmark claims."
        - "Protected: table/JSON/Markdown schema stability, deterministic
          ordering, scoring values except changed evidence universe, co-change
          filtering, privacy."
        - "Dependencies: P1 default contract switch."
        - "Review focus: compatibility escape hatch works; default/project
          equivalence is exact except intentional metadata where applicable."
        - "Escalate if: fixture parity cannot be proven, explicit all cannot
          preserve old evidence, or default/project leaks excluded paths."
        - "Done boundary: all existing validation paths agree with the new
          default contract."
      verification_commands:
        - zig build test
        - zig build validate
        - git diff --check
    - id: P3
      title: Docs and close-out validation
      goal: Update public docs and run standard plus close-out validation with
        privacy-safe real-repo evidence.
      depends_on:
        - P2
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, src/explain.zig, tools/validate.sh, validation
          output, real-repo smoke evidence."
        - "In scope: update README/help/explain references to the new default
          and run close-out validation with sibling-local-repo."
        - "Out of scope: new release, CI, screenshots, public third-party case
          study, provider/cache features."
        - "Protected: OSS/publicity boundary, investigation-prompt framing,
          no-commercial-content rule, no bug-prediction or developer-ranking
          language."
        - "Dependencies: P1 and P2 complete."
        - "Review focus: public docs plainly disclose default project scope and
          explicit all scope without overclaiming correctness."
        - "Escalate if: docs imply scoped reports are more correct than full Git
          history, expose private sibling evidence, or introduce unsupported
          roadmap/commercial claims."
        - "Done boundary: CLI, reports, docs, tests, and close-out evidence all
          agree on project scope as the alpha default."
      verification_commands:
        - zig build test
        - zig build validate
        - git diff --check
        - zig build validate -Dcloseout=true -Dsmoke-repo=<approved-local-repo>
          -Dsmoke-label=sibling-local-repo
