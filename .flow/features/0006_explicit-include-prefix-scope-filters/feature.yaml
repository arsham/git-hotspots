  acceptance_contract:
    outcome: Add repeatable `--include-prefix PATH` filters with the same
      repo-relative literal prefix contract as `--exclude-prefix`. Includes
      narrow the evidence universe, excludes remove from it, and
      table/JSON/Markdown reports disclose the active scope and bounded counts.
    acceptance:
      - The CLI accepts repeatable `--include-prefix PATH` arguments using the
        same repo-relative literal prefix validation rules as
        `--exclude-prefix`.
      - Default output remains unfiltered when no include or exclude prefixes
        are supplied.
      - "Effective scope is flag-order independent: includes narrow candidates
        when present, excludes remove matching paths, and excludes win over
        includes."
      - Filtering happens before aggregation, scoring, co-change expansion,
        result limiting, table output, JSON output, and Markdown output.
      - Out-of-include paths and excluded paths do not appear in result rows,
        co-change rows, Markdown evidence sections, or validation summaries.
      - Table, JSON, and Markdown disclose include prefixes, exclude prefixes,
        filter-active state, and bounded include/exclude counts without raw
        omitted-path dumps.
      - Empty include-scoped reports exit successfully and remain explainable in
        table, JSON, and Markdown.
      - Validation covers include-only, repeated include, include plus exclude
        precedence, no-match include, literal glob semantics, braced rename
        normalization, Git-quoted tab normalization, invalid prefixes, and
        this-repo `src/` smoke.
      - README/help document literal repo-relative include/exclude semantics and
        state that scoped reports change the evidence universe without making
        bug prediction, quality scoring, or developer-ranking claims.
      - The feature does not add default scopes, globs, pathspecs, regex,
        `.gitignore` import, config files, providers, cache, network, telemetry,
        author metrics, release/CI automation, hosted/commercial content, or
        scoring formula changes beyond scoped input.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build validate
      - git diff --check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
