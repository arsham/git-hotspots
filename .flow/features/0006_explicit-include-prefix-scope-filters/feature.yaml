design:
  rough_shape:
    - Extend CLI parsing/help with repeatable `--include-prefix PATH` while
      keeping `--exclude-prefix` unchanged.
    - Refactor shared prefix validation if useful so include and exclude reject
      the same invalid forms.
    - Add include_prefixes and include-scope counts to Config/Scope/Analysis
      deinit paths.
    - Apply the predicate `(no includes OR path matches any include) AND NOT
      path matches any exclude` before per-file aggregation and co-change
      expansion.
    - Render include metadata in table, JSON, and Markdown from the shared
      Analysis model.
    - Extend fixtures/goldens/integration tests and `zig build validate` for
      include semantics and privacy-safe real-repo smoke.
    - Update README examples with `--include-prefix src/` and `--include-prefix
      src/ --exclude-prefix src/generated/`.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: End-to-end include-prefix runtime scope
      goal: Implement repeatable `--include-prefix PATH` across CLI parsing,
        config/model, Git analysis filtering, and table/JSON/Markdown scope
        metadata.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig, src/git.zig, src/report.zig,
          tests/integration.sh, tools/setup-fixtures.sh, fixtures/expected/*."
        - "In scope: parse and validate include prefixes, store normalized
          prefixes, apply include narrowing before aggregation/co-change
          expansion, keep exclude wins semantics, and render scope metadata in
          all formats."
        - "Out of scope: default scopes, globs, pathspec/gitignore import,
          config files, providers, cache, network, telemetry, author metrics,
          release/CI, commercial content, and scoring redesign."
        - "Protected: no-flag default remains all tracked paths; existing
          exclude-only goldens and semantics remain stable except intentional
          additive scope metadata if needed."
        - "Dependencies: Feature 0004 exclude-prefix behavior and Feature 0005
          Markdown renderer are complete."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; fixture commands for include-only, repeated include,
          include+exclude, empty include, literal glob, invalid include
          prefixes, rename normalization, and quoted tab paths."
        - "Review focus: filtering happens before aggregation and co-change
          expansion; out-of-include paths cannot leak into results or cochanges;
          metadata is deterministic and privacy-safe."
        - "Escalate if: matching requires globs/pathspecs/config/default scopes,
          output schema changes become breaking, or implementation touches
          scoring/Git collection beyond scoped candidate selection."
        - "Done boundary: runtime include scope works end-to-end in table, JSON,
          and Markdown with targeted fixture tests."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Validation and public docs hardening
      goal: Extend canonical validation, real-repo smoke, and README/help
        documentation for include-prefix scope controls.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, tools/validate.sh, tests/integration.sh,
          fixtures/expected/*."
        - "In scope: add `zig build validate` assertions for include semantics,
          table/json/markdown real-repo smoke with `--include-prefix src/`,
          privacy-safe evidence summaries, and visitor-facing README examples."
        - "Out of scope: Flow/process clutter in README, raw private outputs,
          package/release/CI work, new dependencies, provider/cache work,
          commercial/hosted strategy."
        - "Protected: docs keep hotspots framed as investigation prompts;
          validation summaries use labels and bounded counts only."
        - "Dependencies: P1 runtime behavior exists."
        - "Validation/evidence: zig build validate; close-out mode with sibling
          repo or explicit privacy-safe skip reason; git diff --check; flow
          validate --target feature:0006 --format json."
        - "Review focus: canonical validation catches include-scope regressions;
          README accurately explains literal prefix semantics and
          evidence-universe caveat."
        - "Escalate if: validation needs private artefacts, network/fetch
          behaviour, raw omitted path dumps, or new external tools."
      verification_commands:
        - zig build validate
        - git diff --check
  output_contract:
    cli_flags:
      - --include-prefix PATH (repeatable; repo-relative literal prefix; no glob
        semantics)
      - --exclude-prefix PATH remains repeatable and wins over include
    scope_predicate: kept = (include_prefixes empty OR
      starts_with_any(include_prefixes)) AND NOT
      starts_with_any(exclude_prefixes)
    json_scope_fields:
      - filters_active
      - include_prefixes
      - exclude_prefixes
      - included_path_count or equivalent
      - included_change_count or equivalent
      - out_of_scope_path_count
      - out_of_scope_change_count
      - excluded_path_count
      - excluded_change_count
    privacy: Only project-relative prefixes and bounded counts are reported; no raw
      omitted path lists, absolute paths, author identities, remotes, or private
      report dumps.
    deferred:
      - default source scope
      - globs/pathspec/gitignore semantics
      - config files
      - scope DSL
      - provider-generated classification
      - raw filtered path lists
