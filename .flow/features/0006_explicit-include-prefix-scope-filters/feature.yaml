schema: flow-feature.v1
feature:
  id: "0006"
  slug: explicit-include-prefix-scope-filters
  title: Explicit include-prefix scope filters
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The CLI supports explicit exclude-prefix filtering, but users cannot
    focus hotspot analysis on selected repo subtrees such as `src/` without
    post-processing reports. Focused reports need an equally explicit
    include-prefix control that preserves deterministic local evidence and
    avoids hidden defaults or a scope DSL.
  outcome: Add repeatable `--include-prefix PATH` filters with the same
    repo-relative literal prefix contract as `--exclude-prefix`. Includes narrow
    the evidence universe, excludes remove from it, and table/JSON/Markdown
    reports disclose the active scope and bounded counts.
  acceptance:
    - The CLI accepts repeatable `--include-prefix PATH` arguments using the
      same repo-relative literal prefix validation rules as `--exclude-prefix`.
    - Default output remains unfiltered when no include or exclude prefixes are
      supplied.
    - "Effective scope is flag-order independent: includes narrow candidates
      when present, excludes remove matching paths, and excludes win over
      includes."
    - Filtering happens before aggregation, scoring, co-change expansion, result
      limiting, table output, JSON output, and Markdown output.
    - Out-of-include paths and excluded paths do not appear in result rows,
      co-change rows, Markdown evidence sections, or validation summaries.
    - Table, JSON, and Markdown disclose include prefixes, exclude prefixes,
      filter-active state, and bounded include/exclude counts without raw
      omitted-path dumps.
    - Empty include-scoped reports exit successfully and remain explainable in
      table, JSON, and Markdown.
    - Validation covers include-only, repeated include, include plus exclude
      precedence, no-match include, literal glob semantics, braced rename
      normalization, Git-quoted tab normalization, invalid prefixes, and
      this-repo `src/` smoke.
    - README/help document literal repo-relative include/exclude semantics and
      state that scoped reports change the evidence universe without making bug
      prediction, quality scoring, or developer-ranking claims.
    - The feature does not add default scopes, globs, pathspecs, regex,
      `.gitignore` import, config files, providers, cache, network, telemetry,
      author metrics, release/CI automation, hosted/commercial content, or
      scoring formula changes beyond scoped input.
