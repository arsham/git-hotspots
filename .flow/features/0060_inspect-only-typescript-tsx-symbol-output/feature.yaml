      - Keep TypeScript/TSX symbols current-only and non-scoring; no line
        history, lineage, package, module, tsconfig, type-checking, LSP, default
        report, schema, cache, or telemetry changes.
      - Record public evidence and privacy-safe close-out validation.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - zig build validate
      - zig build tree-sitter-typescript-symbol-proof
      - zig build tree-sitter-tsx-symbol-proof
      - TypeScript/TSX inspect JSON/Markdown/table golden checks
      - existing provider byte-stability checks
      - zig build validate -Dcloseout=true -Dsmoke-repo=<local-sibling-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - prove protected output byte stability and inspect-only runtime boundary
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - type checking or tsconfig/package/module analysis required
      - schema expansion required
      - line-history behaviour required
      - default output drift
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
