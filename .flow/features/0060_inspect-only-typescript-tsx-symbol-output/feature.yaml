schema: flow-feature.v1
feature:
  id: "0060"
  slug: inspect-only-typescript-tsx-symbol-output
  title: Inspect-only TypeScript/TSX symbol output
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: TypeScript/TSX extraction proofs exist, but inspected TypeScript and
    TSX files still have no opt-in runtime symbol output.
  outcome: Expose current TypeScript/TSX symbols only through the existing
    inspect-only symbol flow while preserving file-level Git evidence as product
    truth.
  acceptance:
    - Add inspect-only TypeScript/TSX provider support for `.ts`, `.tsx`,
      `.mts`, and `.cts` where deterministic.
    - Reuse the existing `symbols` output envelope for JSON, Markdown, and table
      output.
    - Dispatch by the resolved inspected matched path and parse only that one
      file.
    - Preserve no-provider and existing Zig/Go/Python/JavaScript symbol output
      byte stability.
    - Keep TypeScript/TSX symbols current-only and non-scoring; no line history,
      lineage, package, module, tsconfig, type-checking, LSP, default report,
      schema, cache, or telemetry changes.
    - Record public evidence and privacy-safe close-out validation.
planning:
  state: ready
  summary: Runtime inspect-only exposure for TypeScript/TSX symbols, following the
    JavaScript inspect-output precedent while protecting default reports and all
    package/type-analysis surfaces.
  brief_sync:
    status: updated
    reason: Supports B001 provider expansion by exposing TypeScript/TSX symbols only
      as opt-in inspect evidence while preserving deterministic Git evidence as
      product truth.
    checked_at: 2026-05-25T21:20:49.978Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Follow-up provider implementation slice for B001. It exposes
      TypeScript/TSX current symbols only through inspect output and defers line
      history, package/workspace, tsconfig, type checking, LSP, telemetry, and
      remote enrichment.
    checked_at: 2026-05-25T21:20:54.396Z
