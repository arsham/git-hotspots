schema: flow-feature.v1
feature:
  id: "0059"
  slug: typescript-tsx-symbol-extraction-proof
  title: TypeScript/TSX symbol extraction proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: "TypeScript/TSX build and query proofs do not prove extraction
    semantics: turning parsed trees and query captures into deterministic
    current-symbol evidence with correct ranges, ordering, caveats, and failure
    behaviour."
  outcome: An internal non-product TypeScript/TSX symbol extraction proof maps the
    project-owned query contracts into the existing provider symbol evidence
    shape while runtime output remains absent.
  acceptance:
    - Add dedicated proof targets expected as zig build
      tree-sitter-typescript-symbol-proof and zig build
      tree-sitter-tsx-symbol-proof.
    - Use vendored local Tree-sitter core, TypeScript/TSX parser/scanner
      sources, and the Feature 0058 project-owned query contracts.
    - Extract bounded current-symbol subsets covering TypeScript and TSX
      functions, classes, methods, constants/variables, interfaces, type
      aliases, enums, namespaces, exports, anonymous cases, and TSX components
      where deterministic.
    - Prove deterministic range, ordering, symbol-kind mapping, current-only
      caveats, and degraded cases.
    - Preserve no-provider and existing Zig/Go/Python/JavaScript symbol output
      byte stability.
    - Record public evidence at
      docs/tree-sitter-typescript-symbol-extraction-proof.md.
    - Do not expose runtime TypeScript/TSX symbols, provider registry wiring,
      CLI/report/schema/scoring/cache changes,
      Node/package/workspace/module/tsconfig/LSP analysis, custom queries, or
      symbol history.
