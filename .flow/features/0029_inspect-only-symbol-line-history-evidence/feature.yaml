    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Feature 0028 can show current Zig function symbols for one inspected hot
          file, but it does not yet answer whether the current lines inside
          those symbols carry Git change evidence. Users still have to manually
          connect current symbols to the file's historical pressure.
      - source_ref: prd.md#problem[2]
        text: We want to provide a small bridge from current symbols to Git evidence
          without claiming true symbol history. The old Rust experiment's
          function-history path was expensive and semantically risky; this
          feature must avoid recreating that trap.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add a separate opt-in `--symbol-line-history` flag, valid only with
      `--inspect PATH --symbols`, that reports privacy-safe current-line Git
      evidence for current Zig function ranges while preserving file-level Git
      evidence as product truth.
    acceptance:
      - "`--symbol-line-history` is accepted only with `--inspect PATH
        --symbols`."
      - Invalid `--symbol-line-history` combinations exit non-zero with stable
        stderr.
      - Plain `--symbols` outputs remain byte-for-byte stable unless the new
        flag is present.
      - Default reports, plain inspect reports, and no-provider outputs remain
        byte-stable when the new flag is absent.
      - Line-history evidence is computed only for the inspected matched
        in-scope Zig file.
      - Implementation runs at most one local blame process for the inspected
        matched file, not one process per symbol.
      - Blame parsing whitelists commit/range/timestamp fields only and never
        renders or stores authors, emails, messages, source lines, raw diffs,
        raw blame output, remotes, previous filenames, private repo names, or
        absolute local paths.
      - Output labels the data as current-line Git evidence, not symbol history
        or symbol lineage.
      - File score, rank, confidence, co-change, rename-lineage, scope, and
        inclusion semantics are unchanged.
      - Dirty inspected files, shallow history, partial history, unsupported
        files, symlinks, missing files, invalid Zig, and blame failures preserve
        file evidence and degrade with caveats.
      - JSON includes additive per-symbol current-line history evidence only
        when the new flag is present.
      - Table and Markdown disclose current-line Git evidence without implying
        scoring, ranking, risk, quality, ownership, or true symbol history.
      - Validation covers fixture goldens, degraded states, byte-stability,
        privacy scans, prohibited-claim scans, Tree-sitter proof commands,
        this-repo smoke, and sibling-local-repo close-out smoke.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - git diff --check
      - zig build
      - zig build validate
      - zig build tree-sitter-build-proof
      - zig build tree-sitter-symbol-proof
      - zig build validate -Dcloseout=true
        -Dsmoke-repo=<operator-provided-local-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: true
    route_matrix: *a2
    resolution_matrix: *a3
    operator_examples: *a4
    mandatory_reviewer_questions: *a1
    reviewer_questions: *a1
  ownership:
    reviewer_expectations:
      - verify line-history semantics against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - prove privacy, byte-stability, and degraded-state requirements
      - Did we prove inclusion on real provider wire for all active routes?
      - Did we prove all required target-resolution cases?
      - Did we prove operator-provided example cases with deterministic tests?
      - prove privacy
      - byte-stability
      - and degraded-state requirements
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
