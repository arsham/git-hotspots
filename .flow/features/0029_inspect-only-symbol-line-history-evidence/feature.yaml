schema: flow-feature.v1
feature:
  id: "0029"
  slug: inspect-only-symbol-line-history-evidence
  title: Inspect-only symbol line-history evidence
  lane: standard
  status: shaping
  autonomy_default: ask
intent:
  problem: Current inspect-only Tree-sitter Zig symbols show function ranges in a
    hot file, but they do not connect those current ranges to any Git evidence.
    Users need a bounded bridge from current symbols to local history without
    implying true symbol lineage, function history, ownership, quality scoring,
    or bug prediction.
  outcome: Add a separate opt-in `--symbol-line-history` flag, valid only with
    `--inspect PATH --symbols`, that reports privacy-safe current-line Git
    evidence for current Zig function ranges while preserving file-level Git
    evidence as product truth.
  acceptance:
    - "`--symbol-line-history` is accepted only with `--inspect PATH --symbols`."
    - "Invalid `--symbol-line-history` combinations exit non-zero with stable stderr."
    - "Plain `--symbols` outputs remain byte-for-byte stable unless the new flag is present."
    - "Default reports, plain inspect reports, and no-provider outputs remain byte-stable when the new flag is absent."
    - "Line-history evidence is computed only for the inspected matched in-scope Zig file."
    - "Implementation runs at most one local blame process for the inspected matched file, not one process per symbol."
    - "Blame parsing whitelists commit/range/timestamp fields only and never renders or stores authors, emails, messages, source lines, raw diffs, raw blame output, remotes, previous filenames, private repo names, or absolute local paths."
    - "Output labels the data as current-line Git evidence, not symbol history or symbol lineage."
    - "File score, rank, confidence, co-change, rename-lineage, scope, and inclusion semantics are unchanged."
    - "Dirty inspected files, shallow history, partial history, unsupported files, symlinks, missing files, invalid Zig, and blame failures preserve file evidence and degrade with caveats."
    - "JSON includes additive per-symbol current-line history evidence only when the new flag is present."
    - "Table and Markdown disclose current-line Git evidence without implying scoring, ranking, risk, quality, ownership, or true symbol history."
    - "Validation covers fixture goldens, degraded states, byte-stability, privacy scans, prohibited-claim scans, Tree-sitter proof commands, this-repo smoke, and sibling-local-repo close-out smoke."
planning:
  state: ready
  summary: Guarded current-line evidence slice. The feature adds a separate
    opt-in `--symbol-line-history` flag for `--inspect PATH --symbols` only,
    preserving existing symbol output stability and avoiding symbol-history or
    scoring claims.
  brief_sync:
    status: unchanged
    reason: Feature 0029 is a bounded optional provider/Git-evidence enrichment
      under B001. B001 already captures local-first deterministic evidence,
      provider caution, and the rule that provider evidence must not replace Git
      history truth. No brief text change is needed.
    checked_at: 2026-05-23T21:02:00Z
  brief_alignment:
    status: aligned
    role: primary
    summary: "Inspect-only current-line Git evidence advances the optional
      provider-enrichment capability while preserving B001 constraints: local
      deterministic evidence, no network/telemetry, no scoring replacement, no
      developer ranking, and explicit caveats."
    checked_at: 2026-05-23T21:02:00Z
