design:
  rough_shape:
    - Add a separate `--symbol-line-history` flag requiring `--inspect PATH
      --symbols`.
    - Parse local blame output through a Git-owned whitelist seam without
      exposing raw blame data.
    - Attach current-line Git evidence to existing current Zig symbol rows only
      when requested.
    - Preserve byte-stable default, inspect, and plain `--symbols` outputs.
    - Validate privacy, degraded states, and real-repo close-out evidence.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Blame parser and line-history model
      goal: Add an internal privacy-safe current-line blame parser and model for
        symbol range aggregation without any CLI/report output changes.
      depends_on: []
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: src/git.zig, src/model.zig, src/provider.zig, tests, fixture
          setup if parser fixtures are needed."
        - "In scope: whitelist parser for `git blame --incremental`-style
          output, current-line evidence model, deterministic aggregation by
          symbol line range, bounded commit evidence, dirty/partial/degraded
          states."
        - "Out of scope: CLI flags, report rendering, scoring/ranking changes,
          true symbol history, `git log -L`, authors/messages/snippets, cache,
          network, telemetry, provider registry."
        - "Protected: existing Git analysis semantics, existing symbol output
          bytes, privacy boundaries, file-level evidence truth."
        - "Dependencies: Feature 0028 is complete and provides current Zig
          symbol ranges."
        - "Validation/evidence: unit tests for parser privacy, range
          aggregation, deterministic ordering, malformed input, missing
          timestamps, and unblamable lines."
        - "Review focus: raw blame output is never rendered/logged,
          author/email/message/source fields are ignored, and data model cannot
          express ownership or scoring."
        - "Escalate if: implementation needs authors, commit messages, raw
          diffs, `git log -L`, previous filenames, symbol lineage, per-symbol
          score/rank, cache, or network."
        - "Done boundary: internal parser/model tests pass and no CLI/report
          output changes are introduced by this packet."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - git diff --check
    - id: P2
      title: Inspect-only runtime and report output
      goal: Add `--symbol-line-history` for `--inspect PATH --symbols` only and render
        additive current-line Git evidence in JSON, table, and Markdown.
      depends_on:
        - P1
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/git.zig, src/model.zig, src/report.zig,
          src/tree_sitter_zig.zig, tests/integration.sh, fixtures/expected."
        - "In scope: CLI parser/errors, one blame process per inspected matched
          file, per-symbol current-line evidence attachment, JSON/table/Markdown
          rendering, degraded states, fixture goldens."
        - "Out of scope: automatic line history under plain `--symbols`, default
          provider execution, all-file parsing, symbol scoring/ranking,
          historical symbol lineage, source snippets, authors/messages, cache."
        - "Protected: plain `--symbols` byte stability, no-provider byte
          stability, file score/rank/confidence/cochange/lineage/scope
          semantics, no raw private output."
        - "Dependencies: P1 complete."
        - "Validation/evidence: success and degraded fixture goldens for
          table/JSON/Markdown, invalid flag combination checks, determinism by
          repeated command diff."
        - "Review focus: output wording says current-line Git evidence only,
          JSON schema is additive, degraded states preserve inspected file
          evidence, and privacy scans cover new fields."
        - "Escalate if: UX needs a different flag shape, output requires
          schema-breaking changes to existing symbols without the new flag, or
          blame cannot be bounded safely."
        - "Done boundary: requested flag works for supported fixtures, invalid
          combinations fail clearly, and unchanged routes remain byte-stable."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - git diff --check
    - id: P3
      title: Validation docs and close-out evidence
      goal: Update documentation and validation gates for current-line evidence, then
        prove privacy-safe close-out on fixtures, this repo, and
        sibling-local-repo.
      depends_on:
        - P2
      status: done
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, fixtures/expected, tests/integration.sh,
          tools/validate.sh, docs if needed."
        - "In scope: docs/help/explain wording, prohibited-claim scan updates,
          privacy scans, real-repo smoke evidence summaries, close-out
          validation."
        - "Out of scope: release, CI, broad provider docs, cache docs,
          hosted/commercial content, external case studies."
        - "Protected: public framing as investigation prompts, no
          bug/quality/developer ranking claims, no raw sibling repo evidence or
          absolute local paths."
        - "Dependencies: P2 complete."
        - "Validation/evidence: full validation ladder plus close-out smoke with
          `sibling-local-repo`; committed evidence uses labels and bounded
          counts only."
        - "Review focus: docs do not call this symbol history/lineage,
          validation catches banned claims and privacy leaks, and real-repo
          smoke is label-only."
        - "Escalate if: docs require broader provider positioning, examples need
          raw private output, or validation cannot prove privacy."
        - "Done boundary: validation passes, docs are accurate,
          privacy/prohibited scans cover new surface, and close-out evidence is
          durable."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - git diff --check
        - zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-provided-local-repo>
          -Dsmoke-label=sibling-local-repo
