  acceptance_contract:
    outcome: At most one deterministic, evidence-safe historical fallback-pressure
      improvement, or a durable no-change proof if no safe case exists.
    acceptance:
      - The inspected fallback-pressure case and decision are durable and
        reviewable.
      - At most one evidence-safe attribution improvement is implemented, or a
        no-change proof explains why none is safe now.
      - No nearest-symbol guessing, adjacency attribution, semantic lineage,
        dependency truth, scoring, ranking, or ownership claims are introduced.
      - If behaviour changes, focused fixture/golden coverage proves reduced
        fallback hunk pressure and preserved caveats.
      - Provider budget semantics from 0122/0123 remain intact.
      - Validation includes git diff --check, zig build test, and zig build
        validate.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify evidence-safe attribution or no-change proof
      - verify fallback pressure is not hidden by row-count wording
      - verify provider budget semantics from 0122/0123 remain intact
      - verify no protected surfaces drifted
  decision_budget:
    allowed_local_decisions:
      - select one deterministic safe fallback-pressure case
      - choose no-change proof branch if no safe case exists
      - exact fixture/golden wording if behaviour changes
      - tracked proof artifact location for no-change branch
    deferred_reconcile_triggers:
      - P1 selects no-change proof branch
      - P2 updates focused goldens/docs metadata
      - minor test helper trade-off inside protected surfaces
    hard_planner_escalation_triggers:
      - safe improvement requires nearest-symbol guessing or adjacency
        attribution
      - JSON schema or CLI change would be required
      - provider admission or scoring changes would be required
      - more than one fallback-pressure case is needed
      - timeout or unavailable seam is introduced
    protected_surfaces:
      - historical attribution semantics
      - JSON schema
      - CLI flags
      - provider admission
      - scoring/ranking
      - release/tag/package/remote/network/telemetry/cache behaviour
      - timeout/unavailable seams
      - nearest-symbol guessing or adjacency attribution
  fallback_path: deferred_reconcile_decision
  notes: null
