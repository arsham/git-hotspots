      - source_ref: prd.md#problem[1]
        text: Historical-symbol output now distinguishes fallback row count from
          fallback hunk pressure, and provider budget semantics are guarded. The
          next product risk is whether avoidable fallback hunk pressure remains
          in cases where revision-local symbol evidence is available and safe to
          use.
