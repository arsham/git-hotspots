design:
  rough_shape:
    - Inspect fixture and real-repo historical fallback pressure using current
      validation/dogfood evidence.
    - Select at most one case where a hunk intersects deterministic
      revision-local symbol evidence but currently falls back.
    - If such a case exists, make the smallest attribution improvement and
      update focused tests/goldens/docs metadata.
    - If no such case exists, deliver a no-change proof in docs or validation
      comments without runtime changes.
    - Do not add timeout/unavailable seams or alter provider admission, CLI,
      schema, scoring, ranking, cache, network, telemetry, release, tag,
      package, or remote behaviour.
