design:
  rough_shape:
    - Extend `model.Format` and CLI help/parser with `markdown`.
    - Add `report.renderMarkdown(writer, analysis)` using only `model.Analysis`.
    - Add Markdown escaping helpers for table cells, headings, paths, caveats,
      and evidence text.
    - Add `fixtures/expected/basic.md` and `fixtures/expected/scope-filtered.md`.
    - Extend integration tests and `tools/validate.sh` so Markdown is part of
      canonical validation and real-repo smoke.
    - Update README with a concise Markdown example and supported-format list.
  packets:
    - id: P1
      title: Markdown renderer contract
      goal: Add deterministic Markdown rendering from existing `model.Analysis`.
      depends_on: []
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: src/report.zig and renderer unit tests."
        - "In scope: renderMarkdown(writer, analysis), Markdown escaping
          helpers, required report sections, preserved result order, existing
          model fields only."
        - "Out of scope: CLI exposure, scoring changes, Git collection changes,
          provider/cache work, templates, prompts, file output."
        - "Protected: renderer must not reach into Git/scoring logic or include
          absolute roots, authors, remotes, source snippets, or private dumps."
        - "Dependencies: Feature 0002 analysis model, Feature 0004 scope
          metadata."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; unit tests for escaping and stable section snippets."
        - "Review focus: deterministic, privacy-safe Markdown with provenance,
          caveats, scope, ranked rows, and evidence."
        - "Escalate if: Markdown requires data not present in model.Analysis or
          would change score/Git/scope semantics."
        - "Done boundary: renderer compiles, tests pass, and is ready for CLI
          plumbing."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      title: CLI format plumbing
      goal: Expose Markdown as `--format markdown` while preserving existing formats.
      depends_on:
        - P1
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: src/model.zig, src/main.zig, src/report.zig,
          tests/integration.sh."
        - "In scope: Format.markdown, CLI parser branch, usage text, render
          switch, targeted fixture smoke."
        - "Out of scope: --output, templates, prompt flags, agent flags, config
          files, and table/JSON behaviour changes."
        - "Protected: default remains table; invalid format handling remains
          clear; existing JSON/table fixtures stay stable."
        - "Dependencies: P1 renderer exists."
        - "Validation/evidence: zig build; zig build test; zig build run --
          --help; targeted Markdown commands for basic and scoped fixtures."
        - "Review focus: CLI surface is exactly one new format value and does
          not widen product scope."
        - "Escalate if: CLI scope expands beyond format selection."
        - "Done boundary: users can run --format markdown and existing formats
          still work."
      verification_commands:
        - zig build
        - zig build test
        - zig build run -- --help
    - id: P3
      title: Validation, fixtures, and public docs
      goal: Cover Markdown in canonical validation and document it publicly.
      depends_on:
        - P2
      status: planned
      owner_phase: runner
      execution_context:
        - "Anchors: fixtures/expected/basic.md,
          fixtures/expected/scope-filtered.md, tests/integration.sh,
          tools/validate.sh, README.md."
        - "In scope: golden Markdown fixture diffs, repeated-output diff,
          semantic assertions, privacy checks, table/JSON/Markdown real-repo
          smoke, README example."
        - "Out of scope: Flow/process clutter in README, raw private smoke
          outputs, release/CI work, commercial/hosted language, providers,
          cache, templates, prompt generation."
        - "Protected: README remains polished and OSS-facing; validation summary
          uses labels/counts only and no absolute/private paths."
        - "Dependencies: P2 CLI plumbing exists."
        - "Validation/evidence: zig build validate; zig build test; git diff
          --check; close-out mode with sibling/local repo or explicit skip
          reason."
        - "Review focus: Markdown is deterministic and privacy-safe; scoped
          Markdown does not leak excluded paths; docs do not overclaim."
        - "Escalate if: golden Markdown becomes too brittle and needs
          semantic-only reshaping or validation requires new external tools."
        - "Done boundary: zig build validate is sufficient to catch Markdown
          export regressions."
      verification_commands:
        - zig build validate
        - zig build test
        - git diff --check
