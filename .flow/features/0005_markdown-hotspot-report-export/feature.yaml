  acceptance_contract:
    outcome: Add `--format markdown` as a stdout renderer over the existing
      `model.Analysis` evidence model, with deterministic sections for run
      summary, scope, caveats, ranked hotspots, and per-result evidence. Extend
      validation and docs so Markdown is covered by the canonical local gate.
    acceptance:
      - The CLI accepts `--format markdown` alongside `table` and `json`; the
        default format remains `table`, and invalid formats still fail clearly.
      - Markdown rendering uses the existing `model.Analysis` and does not
        recompute or change Git collection, scoring, co-change, filtering, or
        JSON/table behaviour.
      - Markdown includes title, framing disclaimer, run summary, scope,
        caveats, top-hotspots table, and per-result evidence sections.
      - Markdown output is deterministic for the same fixture/options and
        covered by exact golden files plus repeated-output diffs.
      - Markdown safely renders paths and table cells containing spaces, tabs,
        unicode, pipes, backticks, brackets, heading/list-like text, and
        glob-like literals without raw control-character leakage.
      - Scoped Markdown reports disclose filters and excluded counts, and do not
        include excluded `.flow/` result rows or co-change paths.
      - Empty scoped reports, shallow/partial history, dirty worktrees, deleted
        files, and binary caveats remain explainable in Markdown.
      - "`zig build validate` covers Markdown golden diffs, semantic assertions,
        privacy scans, and table/JSON/Markdown real-repo smoke summaries."
      - README/help document Markdown as an output format without Flow process
        clutter, prompt-generation claims, bug prediction, quality scoring,
        developer ranking, hosted/commercial content, or provider/cache
        promises.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - zig build run -- --help
      - zig build validate
      - git diff --check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
