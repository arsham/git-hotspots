intent:
  problem: Feature 0056 imported pinned TypeScript and TSX Tree-sitter sources
    with provenance, but the repository still lacks an offline proof that those
    parser/scanner sources compile and link against the existing vendored
    Tree-sitter core.
  outcome: TypeScript and TSX parser/scanner sources compile and link through a
    deterministic offline build proof, with evidence that existing
    runtime/default outputs remain unchanged and TypeScript/TSX provider
    behaviour remains deferred.
  acceptance:
    - Add a deterministic offline build proof for vendored TypeScript
      parser/scanner sources.
    - Add a deterministic offline build proof for vendored TSX parser/scanner
      sources.
    - Use only repository-local vendored inputs and the existing Tree-sitter
      core compatibility boundary.
    - Record public evidence covering source paths, compile/link proof,
      validation ladder, no-provider stability, and privacy-safe real-repository
      smoke validation.
    - Do not add TypeScript/TSX runtime provider registration, query fixtures,
      symbol extraction, inspect output, line-history,
      CLI/report/schema/scoring/cache changes,
      Node/package/workspace/module/tsconfig analysis, LSP, CI, release,
      network, telemetry, upload, or remote enrichment.
    - Stop as blocked rather than closing if TypeScript or TSX compile/link
      proof requires a Tree-sitter core update or additional unshaped upstream
      BOM.
