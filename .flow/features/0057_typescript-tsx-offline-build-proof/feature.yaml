design:
  rough_shape:
    - Add or extend a proof-only build target that compiles and links TypeScript
      and TSX parser/scanner sources from
      third_party/tree-sitter-typescript/v0.23.2/.
    - Keep TypeScript and TSX proofs independently identifiable so review can
      prove both grammar families.
    - Add a build-proof evidence document with commands, source paths,
      no-provider stability, privacy-safe smoke validation, and explicit
      deferred surfaces.
    - Preserve default runtime behaviour and avoid
      provider/query/extraction/inspect/schema/scoring/cache drift.
