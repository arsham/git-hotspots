design:
  rough_shape:
    - Add one Python grammar admission review document.
    - Keep the feature documentation-only and use it to gate later tree-sitter-python source import.
    - Explicitly defer Python source import, build proof, extraction proof, runtime provider output, custom queries, LSP, and package/import analysis.
