  slug: tree-sitter-python-grammar-admission-review
  title: Tree-sitter Python grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Python is the next Tree-sitter language candidate after Go, but the repository has no Python grammar admission record proving upstream identity, license, generated parser or scanner provenance, compatibility, source-size, or query readiness.
  outcome: Add a documentation-only Python grammar admission review that records the gates and decision state required before any future tree-sitter-python source import or runtime provider work.
  acceptance:
    - "Add `docs/tree-sitter-python-grammar-admission.md` as the single public admission review artefact."
    - "The document records candidate upstream identity, immutable revision or blocker, checksum requirement, proposed vendored path, BOM expectations, excluded file classes, and Tree-sitter core compatibility requirements."
    - "The document records license/notice, generated parser and scanner provenance, local-first build supply-chain, source-size, build-impact, query, fixture, and no-provider stability gates for future Python work."
    - "The document states that Python runtime support is not implemented and current runtime Tree-sitter support remains Zig and Go only."
    - "The document preserves file-level Git evidence as product truth and frames future Python symbols as optional, current-only, inspect-oriented, additive, caveated provider evidence."
    - "The document defines Python-specific query and fixture expectations for modules, classes, functions, methods, constants, decorators, nested definitions, indentation errors, dynamic assignments, generated files, empty files, invalid files, and unsupported paths."
    - "The document records monorepo behaviour as inspect-path-only and extension-based; it must not imply package, venv, workspace, pyproject, dependency graph, import resolution, notebook, or repo-wide scanning."
    - "No third_party, source, test, fixture, build, CI, CLI, report schema, scoring, cache, provider runtime, provider registry, release, package, network, telemetry, or background behaviour changes are made."
