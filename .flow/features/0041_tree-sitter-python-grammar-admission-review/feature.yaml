    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
  packets:
    - id: P1
      title: Python grammar admission review document
      goal: Add one docs-only admission review for tree-sitter-python that records upstream identity, provenance, license, compatibility, scanner, query, monorepo, and future validation gates before source import.
      owner_phase: runner
      depends_on: []
      status: pending
      execution_context:
        - "Anchors: docs/tree-sitter-python-grammar-admission.md, docs/tree-sitter-multi-language-query-strategy.md, docs/tree-sitter-go-grammar-admission.md, docs/tree-sitter-go-source-import-evidence.md"
        - "In scope: one documentation-only Python grammar admission review with candidate identity, immutable revision/checksum gates, license/notice, generated parser/scanner provenance, core ABI compatibility, BOM/excluded file classes, source-size/build-impact, query fixture gates, monorepo path behaviour, and decision state"
        - "Out of scope: third_party/tree-sitter-python import, source/build/test/fixture changes, build.zig.zon, CI changes, provider registry, CLI flags, report schema changes, scoring, cache, runtime Python provider behaviour, custom user queries, LSP, release/package work"
        - "Protected: local-first behaviour, no network/telemetry/upload/remote enrichment, no background provider execution, no bug prediction/code-quality scoring/developer ranking/maintainer judgement, existing Zig and Go provider behaviour"
        - "Dependencies: Feature 0034 language strategy is complete and identifies Python as the next candidate after Go subject to admission gates"
        - "Validation/evidence: git diff --check; zig build validate; docs-only changed-path scan; no tree-sitter-python source import scan; prohibited-claim/privacy/local-first scan over changed docs"
        - "Review focus: admission gates are concrete enough to shape the next Python source-import feature without overclaiming Python runtime support"
        - "Escalate if: implementation requires source import, build/runtime changes, provider registry, CLI/report schema changes, custom query execution, package/import analysis, LSP integration, notebook support, or unsupported public Python support claims"
        - "Done boundary: admission document exists, no protected surfaces changed, validation passes, and future import/runtime sequencing is explicit"
      anchors:
        - docs/tree-sitter-python-grammar-admission.md
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/tree-sitter-go-grammar-admission.md
        - docs/tree-sitter-go-source-import-evidence.md
      in_scope:
        - One docs-only Python grammar admission review document.
        - Future Python source-import and provider validation gates.
        - Explicit Python runtime deferral and decision state.
      out_of_scope:
        - Python grammar import or vendored source changes.
        - Runtime Python provider, CLI, report schema, scoring, cache, CI, release, or package changes.
        - Custom query execution, LSP, notebook handling, or import resolution.
      protected_surfaces:
        - Runtime CLI behaviour and report schema.
        - File-level Git evidence truth.
        - Local-first and privacy boundaries.
        - Existing Zig and Go provider behaviour.
        - Third-party vendored source state.
      validation_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for docs-only scope
        - no tree-sitter-python source import scan
        - prohibited-claim and privacy scan over changed docs
      review_focus:
        - Python admission gates are concrete.
        - No runtime support is claimed.
        - Future sequencing is explicit.
        - Public repo boundaries are preserved.
      escalation_triggers:
        - Source import or build changes are needed.
        - Runtime Python provider behaviour is needed.
        - Public docs imply Python support exists.
        - Admission facts cannot be stated without unsupported guesses.
      done_boundary: One docs-only Python admission artefact is committed and independently reviewable.
