      - treat runner evidence as untrusted until independently checked
      - verify cross-lane caveat audit evidence and no-churn option
      - run credible docs and validation gates
  decision_budget:
    allowed_local_decisions:
      - no-action audit outcome if no defects are found
      - docs-only classification wording inside dispatched scope
    deferred_reconcile_triggers:
      - minor classification ambiguity worth reviewer visibility
      - no-change evidence pass
    hard_planner_escalation_triggers:
      - runtime/provider/schema/CLI/scoring change
      - forced churn without evidence
      - release/tag/remote/package/publish side effect
    protected_surfaces:
      - runtime behaviour
      - CLI flags/options
      - JSON schema/report fields
      - provider algorithms/admission
      - relationship semantics/caps
      - scoring/ranking/confidence
      - cache/network/telemetry/release/tag/remote/package/publish behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
