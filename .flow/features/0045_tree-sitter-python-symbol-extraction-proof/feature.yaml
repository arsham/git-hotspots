  slug: tree-sitter-python-symbol-extraction-proof
  title: Tree-sitter Python symbol extraction proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Python build and query contract proofs do not yet prove extraction into
    the provider symbol evidence shape with deterministic ownership, ranges,
    ordering, and caveats.
  outcome: An internal non-product Python symbol extraction proof maps Python
    fixtures into provider-compatible current symbol evidence while runtime
    output remains deferred.
  acceptance:
    - Add a dedicated internal proof target expected as `zig build
      tree-sitter-python-symbol-proof`.
    - Use vendored Tree-sitter core, vendored Python parser/scanner, and the
      project-owned Python query contract.
    - Map supported Python symbols into provider.CurrentSymbolEvidence or a
      directly compatible internal shape.
    - Prove deterministic ranges, ordering, caveats, degraded cases, and
      privacy-safe failure behaviour.
    - Preserve no-provider output and existing Zig/Go symbol output byte
      stability.
    - Do not add user-facing Python symbols, provider registry wiring,
      CLI/report/schema/scoring/cache, line-history, custom queries,
      package/import/venv/notebook/LSP analysis, parser generation, or
      network/global tool dependency.
planning:
  state: ready
  summary: Shape Python symbol extraction as an internal proof after the query
    contract and before user-facing inspect output.
