  acceptance_contract:
    outcome: Add a narrow non-product build proof that compiles and links the
      vendored Tree-sitter core and tree-sitter-zig parser from local files
      only, runs a tiny in-memory Zig parse smoke, records evidence, and
      preserves all normal no-provider CLI outputs and product boundaries.
    acceptance:
      - A dedicated proof step such as `zig build tree-sitter-build-proof`
        compiles and links local vendored Tree-sitter core and tree-sitter-zig
        sources.
      - Normal `zig build` continues to build/install only the existing
        `git-hotspots` executable and does not include Tree-sitter provider
        runtime.
      - The proof uses only repo-local vendored files under
        `third_party/tree-sitter-core/v0.26.9` and
        `third_party/tree-sitter-zig/v1.1.2`.
      - No `build.zig.zon`, package manager, pkg-config, system Tree-sitter,
        global Tree-sitter CLI, submodule, build-time network, or parser
        generation is introduced.
      - A tiny non-product smoke parses an in-memory Zig snippet and asserts
        only parser setup/root-node basics.
      - No provider registry, CLI flag, report/schema/scoring/cache behaviour,
        symbol output, real-repo parsing, telemetry, upload, remote enrichment,
        or background analysis is added.
      - Existing no-provider table, JSON, Markdown, and inspect outputs remain
        byte-stable.
      - Documentation records build proof commands, Zig version, target, local
        source files/include paths, timing/size evidence, parity evidence,
        offline/local-only scans, and privacy-safe close-out smoke.
      - "`zig build validate`, the explicit proof step, and close-out validation
        with `sibling-local-repo` pass."
      - Committed evidence contains no private paths, private repo names, raw
        sibling output, raw parser stderr, author identities, commercial
        strategy, bug-prediction claims, quality scoring, developer ranking, or
        maintainer judgement.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build tree-sitter-build-proof
      - zig build
      - git diff --check
      - zig build test
      - zig build validate
      - zig fmt --check build.zig src tests
      - zig build validate -Dcloseout=true -Dsmoke-repo=<operator-local-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
