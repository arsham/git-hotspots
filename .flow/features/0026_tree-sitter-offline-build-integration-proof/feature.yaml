        - "In scope: parse a tiny in-memory Zig snippet, assert parser
          setup/root basics, cleanup/deinit, integrate proof into validation if
          overhead is acceptable or record separate mandatory close-out
          command."
        - "Out of scope: symbol extraction, CurrentSymbolEvidence emission,
          provider envelope output, real-repo file parsing, parser diagnostics
          in user reports."
        - "Protected: existing table/JSON/Markdown/inspect outputs and fixture
          expected outputs; no report schema or CLI changes."
        - "Dependencies: P1 build proof target."
        - "Validation/evidence: zig build test; zig build validate; explicit
