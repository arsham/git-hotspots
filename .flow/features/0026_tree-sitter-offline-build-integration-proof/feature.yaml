feature:
  id: "0026"
  slug: tree-sitter-offline-build-integration-proof
  title: Tree-sitter offline build integration proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Vendored Tree-sitter sources are present, but the project has not yet
    proven they can compile and link offline through the local Zig build without
    becoming product runtime or weakening source-install/local-first behaviour.
  outcome: Add a narrow non-product build proof that compiles and links the
    vendored Tree-sitter core and tree-sitter-zig parser from local files only,
    runs a tiny in-memory Zig parse smoke, records evidence, and preserves all
    normal no-provider CLI outputs and product boundaries.
  acceptance:
    - A dedicated proof step such as `zig build tree-sitter-build-proof`
      compiles and links local vendored Tree-sitter core and tree-sitter-zig
      sources.
    - Normal `zig build` continues to build/install only the existing
      `git-hotspots` executable and does not include Tree-sitter provider
      runtime.
    - The proof uses only repo-local vendored files under
      `third_party/tree-sitter-core/v0.26.9` and
      `third_party/tree-sitter-zig/v1.1.2`.
    - No `build.zig.zon`, package manager, pkg-config, system Tree-sitter,
      global Tree-sitter CLI, submodule, build-time network, or parser
      generation is introduced.
    - A tiny non-product smoke parses an in-memory Zig snippet and asserts only
      parser setup/root-node basics.
    - No provider registry, CLI flag, report/schema/scoring/cache behaviour,
      symbol output, real-repo parsing, telemetry, upload, remote enrichment, or
      background analysis is added.
    - Existing no-provider table, JSON, Markdown, and inspect outputs remain
      byte-stable.
    - Documentation records build proof commands, Zig version, target, local
      source files/include paths, timing/size evidence, parity evidence,
      offline/local-only scans, and privacy-safe close-out smoke.
    - "`zig build validate`, the explicit proof step, and close-out validation
      with `sibling-local-repo` pass."
    - Committed evidence contains no private paths, private repo names, raw
      sibling output, raw parser stderr, author identities, commercial strategy,
      bug-prediction claims, quality scoring, developer ranking, or maintainer
      judgement.
planning:
  state: ready
  summary: Prove offline compile/link viability for the vendored Tree-sitter core
    and Zig grammar through an isolated non-product build/test proof. Preserve
