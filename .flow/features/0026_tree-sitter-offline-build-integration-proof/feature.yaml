design:
  rough_shape:
    - Add an explicit non-product Tree-sitter build proof step.
    - Compile/link vendored Tree-sitter core and tree-sitter-zig parser from
      repo-local third_party paths only.
    - Add a tiny in-memory Zig parse smoke for parser setup/root basics.
    - Record build proof evidence and preserve no-provider output parity.
    - Stop before CLI/report/schema/scoring/cache/provider runtime or symbol
      output.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Offline build proof target
      goal: Add an explicit non-product build proof that compiles and links the
        vendored Tree-sitter core and Zig grammar from repo-local sources only.
      depends_on: []
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig; third_party/tree-sitter-core/v0.26.9;
          third_party/tree-sitter-zig/v1.1.2;
          docs/tree-sitter-source-import-evidence.md."
        - "In scope: named build proof step, local vendored C source
          compile/link, repo-relative include paths, libc link if needed,
          no-product install boundary."
        - "Out of scope: provider runtime, provider registry, CLI flags, report
          fields, scoring, cache, build.zig.zon, package fetches, system parser
          packages, parser generation."
        - "Protected: normal git-hotspots executable/runtime; no-provider output
          bytes; vendored provenance/license/notice identity."
        - "Dependencies: Features 0023, 0024, and 0025 source identity,
          provenance, and vendored source import."
        - "Validation/evidence: zig build tree-sitter-build-proof; zig build;
          git diff --check; scans for build.zig.zon, submodules, pkg-config,
          global tree-sitter CLI, package managers, network commands."
        - "Review focus: proof target isolation, local-only vendored inputs, no
          product runtime integration, portable Zig 0.16.0 build approach."
        - "Escalate if: C compile/link needs non-local inputs, system packages,
          package managers, generated sources, runtime provider semantics, or
          unresolved duplicate/missing symbols."
        - "Done boundary: proof target builds from local vendored files and
          normal zig build remains product-runtime unchanged."
      verification_commands:
        - zig build tree-sitter-build-proof
        - zig build
        - git diff --check
    - id: P2
      title: Tiny parse smoke and validation integration
      goal: Add a tiny internal parser smoke and validation coverage without
        user-visible provider output or normal report changes.
      depends_on:
        - P1
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig; tests/ or dedicated proof source;
          tools/validate.sh only if needed for canonical proof coverage."
        - "In scope: parse a tiny in-memory Zig snippet, assert parser
          setup/root basics, cleanup/deinit, integrate proof into validation if
          overhead is acceptable or record separate mandatory close-out
          command."
        - "Out of scope: symbol extraction, CurrentSymbolEvidence emission,
          provider envelope output, real-repo file parsing, parser diagnostics
          in user reports."
        - "Protected: existing table/JSON/Markdown/inspect outputs and fixture
          expected outputs; no report schema or CLI changes."
        - "Dependencies: P1 build proof target."
        - "Validation/evidence: zig build test; zig build validate; explicit
          proof command evidence; byte-stable output parity for representative
          no-provider table, JSON, Markdown, and inspect outputs."
        - "Review focus: test-only/non-product boundary, deterministic smoke,
          cleanup/deinit, validation coverage, no-provider output stability."
        - "Escalate if: smoke needs provider runtime/report semantics, parser
          diagnostics leak private data, validation overhead is material, or
          no-provider bytes change."
        - "Done boundary: tiny parse smoke proves parser setup while product
          output remains unchanged."
      verification_commands:
        - zig build test
        - zig build validate
        - zig build tree-sitter-build-proof
    - id: P3
      title: Evidence privacy and close-out proof
      goal: Record bounded build-proof evidence, local-only scans, timing/size
        observations, parity proof, and close-out smoke.
      depends_on:
        - P2
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: docs/tree-sitter-offline-build-proof.md or justified
          equivalent; tools/validate.sh if validation summaries need updates."
        - "In scope: document proof commands, Zig version/target, vendored
          source files/include paths, timing/size evidence, offline scans,
          no-provider parity, sibling-local-repo close-out summary."
        - "Out of scope: public claims that symbol evidence exists; release/CI;
          parser/provider runtime; broader platform matrix beyond local target."
        - "Protected: privacy-safe evidence only; no absolute sibling path,
          private repo name, raw sibling report, raw parser stderr, remotes,
          author identities, or source snippets in docs."
        - "Dependencies: P1 and P2 proof target and smoke."
        - "Validation/evidence: full validation ladder, close-out validation
          with sibling-local-repo, protected path scan, local-only scan, privacy
          and prohibited-claim scan."
        - "Review focus: evidence honesty, local-first/offline proof,
          no-provider byte stability, no product overclaiming, exact
          stop-before-runtime boundary."
        - "Escalate if: private data appears, validation requires network/global
          tools, build time or size materially regresses, or docs imply symbol
          hotspot support."
        - "Done boundary: all close-out rows are proven and Feature 0026 can
          close as a build proof only."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - git diff --check
        - zig build validate -Dcloseout=true -Dsmoke-repo=<operator-local-repo>
          -Dsmoke-label=sibling-local-repo
