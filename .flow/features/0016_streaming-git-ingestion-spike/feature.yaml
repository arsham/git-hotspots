design:
  rough_shape:
    - Refactor current git log parsing so history records can be consumed
      incrementally.
    - Stream git log stdout into the same aggregation semantics instead of
      buffering all stdout first.
    - Keep reports and scoring unchanged.
    - Expose only bounded phase timing through existing opt-in progress stderr.
  packets:
    - id: P1
      title: Streaming Git log ingestion parity
      goal: Replace all-at-once git log stdout buffering with streaming ingestion
        while preserving output parity.
      depends_on: []
      owner_phase: runner
      status: planned
      execution_context:
        - "Anchors: src/git.zig, existing parser/aggregation helpers,
          tests/integration.sh, fixtures/expected."
        - "In scope: child-process stdout streaming for git history, parser seam
          tests, fixture parity, and preserving current Git error fidelity."
        - "Out of scope: cache, scoring changes, report schema changes,
          providers, network, telemetry, release/CI, broad CLI parser rewrites."
        - "Protected: table/JSON/Markdown outputs, scoring/ranking/co-change
          semantics, scope/include/exclude/inspect behaviour, Git range
          semantics, and privacy boundaries."
        - "Dependencies: Feature 0015 decision and all current CLI/report
          semantics through Feature 0014."
        - "Validation/evidence: zig build test, fixture output diffs, targeted
          parser boundary coverage, and git diff --check."
        - "Review focus: streaming parser correctness, memory ownership, chunk
          boundaries, path normalization, rename/quoted-path handling, and Git
          failure handling."
        - "Escalate if: streaming needs broad rewrites, output schema changes,
          changed Git arguments, or whole-history buffering remains the only
          safe path."
        - "Done boundary: existing fixture outputs remain stable and analysis no
          longer requires retaining the full Git log output before parsing."
    - id: P2
      title: Phase timing evidence and close-out validation
      goal: Add privacy-safe phase evidence and close-out validation after streaming
        parity is proven.
      depends_on:
        - P1
      owner_phase: runner
