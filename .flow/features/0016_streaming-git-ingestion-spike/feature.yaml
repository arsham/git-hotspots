schema: flow-feature.v1
feature:
  id: "0016"
  slug: streaming-git-ingestion-spike
  title: Streaming Git ingestion spike
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Large-repository runs currently collect full git log history output
    before parsing, which keeps cache tempting before we have a safe ingestion
    and measurement seam.
  outcome: Stream git history ingestion into the existing evidence model and
    record privacy-safe phase evidence without changing report semantics or
    adding cache.
  acceptance:
    - Main git history ingestion no longer needs to retain the full git log
      --numstat stdout payload before parsing.
    - Existing table, JSON, and Markdown outputs remain stable for fixtures
      unless a documented bug fix requires an intentional fixture update.
    - Streaming preserves scoring, ranking, confidence, caveats, co-change,
      scope filtering, include/exclude, inspect, since, shallow/partial,
      dirty-worktree, and error semantics.
    - Parser or ingestion tests cover chunk boundaries, CRLF, binary numstat,
      malformed/blank lines, braced renames, quoted tab paths, and unicode
      paths.
    - Progress and phase timing remain opt-in stderr-only and never change
      table, JSON, or Markdown stdout.
    - Close-out includes privacy-safe this-repo and sibling-local-repo
      validation evidence.
planning:
  state: ready
  summary: Implement a narrow streaming git log ingestion seam plus privacy-safe
