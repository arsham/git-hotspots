      execution_context:
        - "Anchors: src/git.zig, src/main.zig,
          docs/performance-cache-decision.md or
          docs/streaming-git-ingestion-spike.md, tools/validate.sh."
        - "In scope: bounded phase timing, stdout/stderr separation validation,
          privacy-safe this-repo and sibling-local-repo evidence."
        - "Out of scope: public benchmark claims, persistent instrumentation
          state, report schema timing fields, cache, benchmark harness
          expansion, providers, CI, release packaging."
        - "Protected: deterministic stdout, privacy boundaries, local-first
          defaults, and cache-as-future-optimisation framing."
        - "Dependencies: P1 complete and output parity preserved."
        - "Validation/evidence: zig build validate, close-out smoke with
          sibling-local-repo, stdout/stderr separation checks,
          privacy/prohibited-content scan over changed docs."
        - "Review focus: progress privacy, phase evidence usefulness, absence of
          schema changes, and no overclaim that streaming solves large-repo
          performance."
        - "Escalate if: evidence requires raw private output, new public timing
          schema, cache implementation, or persistent measurement state."
        - "Done boundary: durable close-out evidence records what changed, what
          was measured, what remains unknown, and whether cache remains
          deferred."
