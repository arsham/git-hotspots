    briefs:
      - id: B002
        title: Symbol-aware hotspot intelligence
        summary: "Capability brief for symbol-aware hotspot intelligence: extend
          git-hotspots beyond file-level evidence to identify historically
          active code symbols (functions, methods, types, modules, or other
          language-provider symbols) from local Git history using a
          language-agnostic pipeline. The capability must stay deterministic,
          local-first, and performant, while making new language support
          automatically benefit from the same history attribution, scoring,
          explanation, and future relationship analysis surfaces."
        desired_capability:
          - Report hotspot evidence at symbol granularity, not just file
            granularity, so users can investigate historically volatile
            functions, methods, types, modules, or provider-defined symbols.
          - "Use a normalized symbol-provider contract: language-specific
            providers only expose symbol identity, kind, file path, source
            range/span, and optional nesting/context; the Git-history
            attribution, scoring, output, and explanation pipeline remains
            language-agnostic."
          - Attribute local Git history to symbols by intersecting changed
            ranges, file revisions, and symbol spans in a deterministic way,
            with enough evidence for users to understand why a symbol appears
            hot.
          - Design the symbol model so future enrichers can ask which symbols
            are referenced by, used by, or related to hot places without
            redesigning hotspot evidence from scratch.
          - "Keep runtime defaults local-first: no network, telemetry, remote
            enrichment, or non-deterministic service dependency for symbol
            hotspot analysis."
        why:
          - File-level hotspots are useful but too coarse when a large file
            contains one volatile function or type and many stable neighbours.
          - A language-agnostic symbol pipeline prevents each future language
            provider from needing bespoke hotspot scoring and history-search
            logic.
          - Symbol-level evidence gives agents and humans a more precise
            investigation prompt while preserving the project rule that hotspots
            are evidence, not blame, predictions, or code-quality scores.
          - Future relationship analysis, such as symbols used by hot places,
            needs stable symbol identities and relation-ready output contracts
            from the beginning.
        in_scope:
          - Capability-level planning for extracting or receiving symbols
            through providers, normalizing symbol records, and mapping
            Git-history changes onto those records.
          - "Performance-sensitive history traversal strategy: batch Git
            queries, stream/limit revision data, parse only relevant file
            revisions where possible, and avoid naive full-repository reparsing
            for every commit."
          - "Deterministic evidence fields for symbol hotspots: churn/change
            frequency/recency/confidence/explanation inputs at symbol level,
            with links back to file path, symbol kind, range/source context, and
            relevant commits or changed hunks where feasible."
          - "Language-extensibility rule: adding a new symbol provider should
            make that language eligible for symbol hotspot reports without
            changing the scoring, history attribution, CLI report, or export
            logic except for provider registration and provider-specific tests."
          - "Forward-compatible seams for reference/use analysis: symbol
            identifiers, nesting/ownership, and relation-provider hooks should
            be planned even if reference graph support is deferred."
        out_of_scope:
          - Predicting bugs, judging code quality, ranking developers, or
            treating symbol hotspots as accusations rather than investigation
            prompts.
          - Network-backed code intelligence, hosted enrichment, telemetry, or
            remote index upload by default.
          - Implementing full semantic reference graphs, call graphs, or
            cross-language dependency intelligence in the first symbol-hotspot
            slice; those are future enrichers that should consume stable symbol
            evidence.
          - Requiring cache as product truth. Caches may improve performance
            later, but symbol analysis must have a correct no-cache path.
          - Browser-visible UI design is out of scope for this brief unless a
            future feature adds visual symbol hotspot exploration; if that
            happens, UX tone, visual constraints, and approval decisions must be
            captured in feature/PRD artefacts.
        durable_decisions:
          - Treat symbol hotspots as an extension of deterministic Git-history
            evidence, not as semantic judgement or prediction.
          - "Make the core symbol-hotspot pipeline provider-neutral: providers
            supply symbols; the shared engine maps history to symbols and
            produces common reports/exports."
          - Design for performance from the first feature by avoiding per-commit
            whole-tree parsing and by batching Git/history work.
          - Plan relation-aware output seams now, but defer reference/use
            analysis until after symbol hotspot evidence is trustworthy.
          - No feature-level PRD or implementation packet is created yet from
            this intake; the next shaping step should decide whether to create a
            feature for the first symbol-provider/history-attribution slice and
            push detailed acceptance and packet plans into feature.yaml/prd.md.
          - "First implementation slice selected during shaping for feature
            0078: project-level current-symbol hotspot evidence over retained
            ranked file hotspots using existing current symbol providers and
            optional HEAD current-line Git evidence. This deliberately is not
            true historical hunk-to-symbol attribution, symbol rename/move
            lineage, reference/use analysis, scoring replacement, cache, or
            provider plugin infrastructure; those remain later capability work
            after current-symbol evidence is trustworthy."
          - "Successor architecture spike selected for feature 0079: define true
            historical hunk-to-symbol attribution before runtime implementation.
            The spike is architecture-only and should produce
            docs/historical-symbol-attribution-architecture.md, comparing
            approaches and selecting a deterministic no-checkout local pipeline
            over historical blobs, changed hunks, and revision-local provider
            symbols. It deliberately does not add a user-facing historical
            symbol engine, scoring changes, semantic lineage, reference
            analysis, cache truth, or remote/provider dependencies."
          - "Successor batch selected after feature 0080: feature 0081 is the
            prerequisite internal pipeline integration that wires historical
            hunk attribution into bounded ranked-file analysis without public
            output drift; feature 0082 is the primary user-facing opt-in
            historical symbol hotspot report that should execute serially after
            0081 and update CLI/report/docs/tests/validation together.
            Reference/use analysis remains deferred until the public historical
            symbol report contract is stable."
          - "Successor architecture spike selected for feature 0083: define
            symbol relationship evidence before runtime implementation. The
            spike is documentation-only and should produce
            docs/symbol-relationship-architecture.md, comparing provider
            approaches and defining relation endpoints, kinds, confidence,
            caveats, deterministic aggregation, performance limits, and a narrow
            local-first implementation successor. It deliberately does not add
            relation runtime analysis, CLI/report output, scoring changes, cache
            truth, dependencies, or public claim expansion."
          - "Relation evidence successor batch selected: 0084 internal relation
            provider proof, then 0085 internal relation aggregation integration,
            then 0086 opt-in public symbol relationship report. The batch
            remains serial: 0085 depends on 0084, and 0086 depends on 0084 and
            0085. Public relation output must wait until internal provider and
            aggregation proof are closed. Relation evidence stays local-first,
            deterministic, caveated, evidence-only, and must not alter
            file/symbol scoring or imply call-graph truth, dependency proof,
            ownership, code-quality judgement, developer metrics, or bug
            prediction."
          - "Relation provider expansion batch selected after feature 0086: 0087
            records the provider expansion strategy and admission rubric, 0088
            adds TypeScript/TSX/JavaScript relationship provider proof, 0089
            adds Rust relationship provider proof, and 0090 hardens the provider
            relationship capability matrix and validation. The batch remains
            serial: 0088 depends on 0087, 0089 depends on 0088, and 0090 depends
            on 0089. Public relationship claims must remain opt-in,
            deterministic, local-first, caveated, evidence-only, and must not
            imply call-graph truth, type-aware dependency proof, ownership,
            code-quality judgement, developer metrics, bug prediction, scoring
            changes, cache truth, network access, or telemetry."
          - "Feature 0090 closed the public provider capability decision:
            current symbols, current-line history, and historical-symbol hunk
            attribution use the Zig, Go, Python, JavaScript, Lua, Rust,
            TypeScript, and TSX provider lanes, with file-level fallback for
            unsupported historical blobs; symbol-relationship evidence is public
            only for Python, JavaScript, Rust, TypeScript, and TSX. Zig, Go,
            Lua, and unsupported current files have no public relationship
            provider. Documentation, help/explain text, man page, integration
            checks, and validation anchors must stay aligned with that matrix
            until a later feature explicitly admits another relationship lane."
          - "Provider hardening and remaining-language relationship batch
            selected after feature 0090: 0091 creates a shared relation provider
            conformance harness; 0092 adds internal Go relationship provider
            proof; 0093 adds internal Lua relationship provider proof; 0094
            evaluates and, if safe, adds internal Zig relationship provider
            proof or records a no-admit outcome; 0095 is the only public-surface
            refresh and may admit Go, Lua, or Zig relationship support only from
            closed proof evidence. The batch is serial: 0092 depends on 0091,
            0093 depends on 0092, 0094 depends on 0093, and 0095 depends on
            0094. Public claims remain local-first, deterministic, caveated,
            evidence-only, and must not imply call-graph truth, dependency
            proof, type checking, ownership, code-quality judgement, developer
            metrics, bug prediction, scoring changes, cache truth, network
            access, or telemetry."
