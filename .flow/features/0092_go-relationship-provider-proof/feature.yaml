intent:
  problem: Go has current symbol support but no relationship provider; adding it
    directly to public output without the conformance harness and a later matrix
    admission would risk overclaiming package, method, interface, and build-tag
    semantics.
  outcome: An internal Go syntax-only relationship provider proof emits
    provider-neutral candidates with Go-specific caveats and validation
    evidence, while public claims remain unchanged until the matrix refresh.
  acceptance:
    - Go relation extraction emits bounded syntax-only contains, imports, calls
      or selectors, unresolved, and unknown evidence through the shared relation
      contract.
    - Go-specific caveats prevent claims about package resolution, type
      checking, build tags, cgo, interfaces, method sets, or semantic dependency
      proof.
    - Conformance, fixture, integration, and validation evidence prove
      deterministic behaviour without changing file or symbol ranking.
    - Public CLI/report/docs/help/man capability claims remain unchanged in this
      feature.
