design:
  rough_shape:
    - Add isolated proof source/test and build.zig step for
      tree-sitter-javascript-build-proof.
    - Compile vendored core and JavaScript parser/scanner with repo-local
      include paths only.
    - Record JSX proof or deferral, CI decision, validation, no-provider
      stability, and privacy-safe close-out evidence.
    - Keep product runtime and user-visible outputs unchanged.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: JavaScript offline parser build proof
      goal: Prove that the imported JavaScript parser and scanner compile, link, and
        parse local in-memory JavaScript/JSX inputs without product runtime
        wiring.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, tests/tree_sitter_javascript_build_proof.zig or
          equivalent, third_party/tree-sitter-javascript/<revision>/,
          docs/tree-sitter-javascript-offline-build-proof.md,
          .github/workflows/ci.yml if CI is updated."
        - "In scope: add tree-sitter-javascript-build-proof, compile local
          core/parser/scanner sources, parse tiny JavaScript input, prove JSX
          input only if admitted, record evidence."
        - "Out of scope: JavaScript query contract, symbol extraction, runtime
          provider, provider registry, CLI/report/schema/scoring/cache changes,
          TypeScript/TSX, Node/package/workspace analysis, parser generation,
          package managers, network fetches."
        - "Protected: existing Zig/Go/Python proof targets, no-provider outputs,
          product build install shape, local-first validation, privacy-safe
          evidence."
        - "Dependencies: Feature 0050 source import complete."
        - "Validation/evidence: zig build validate; existing Tree-sitter proof
          targets; dedicated JavaScript build proof; git diff --check; close-out
          smoke."
        - "Review focus: proof target remains non-product, uses only vendored
          local inputs, and honestly records JSX support or deferral."
        - "Escalate if: parser/scanner cannot compile, additional source files
          are needed beyond 0050 BOM, core update is required, CI overhead is
          material, or no-provider outputs change."
        - "Done boundary: proof target and evidence doc exist; JavaScript
          runtime output is still absent."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build validate
        - zig build tree-sitter-javascript-build-proof
        - git diff --check
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
