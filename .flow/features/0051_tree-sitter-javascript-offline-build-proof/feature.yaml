schema: flow-feature.v1
feature:
  id: "0051"
  slug: tree-sitter-javascript-offline-build-proof
  title: JavaScript offline build proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Feature 0050 will import pinned tree-sitter-javascript sources, but the
    repository still needs an isolated proof that the selected JavaScript parser
    and scanner compile, link, and parse locally with the existing vendored
    Tree-sitter core before query or runtime work proceeds.
  outcome: A dedicated non-product JavaScript build proof compiles local vendored
    sources, parses tiny JavaScript and admitted JSX inputs, records evidence,
    and leaves runtime provider behaviour deferred.
  acceptance:
    - Add a dedicated non-product proof target expected as zig build
      tree-sitter-javascript-build-proof.
    - Compile local vendored Tree-sitter core plus tree-sitter-javascript parser
      and any required scanner source only.
    - Parse a tiny in-memory JavaScript snippet and assert stable parse
      behaviour and cleanup.
    - If JSX was admitted by Feature 0050, parse a tiny JSX snippet; otherwise
      record JSX deferral without claiming support.
    - Preserve existing Zig, Go, Python, and no-provider behaviour and proof
      targets.
    - Record public evidence at
      docs/tree-sitter-javascript-offline-build-proof.md.
    - Do not add JavaScript query/extraction/runtime output, provider registry,
      CLI/report/schema/scoring/cache changes, TypeScript/TSX support,
      Node/package/workspace analysis, parser generation, network,
      package-manager, or global CLI dependency.
planning:
  state: ready
  summary: Shape JavaScript offline build proof as the build-risk gate after
    source import and before query/extraction/runtime work.
