schema: flow-feature.v1
feature:
  id: "0032"
  slug: symbol-evidence-summary-and-sorting
  title: Symbol evidence summary and sorting
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Inspect-only symbol reports can emit many symbols, burying the most
    useful current-line Git evidence in human table and Markdown output.
  outcome: Human symbol reports summarize total, shown, and omitted counts and
    show current-line evidence first in deterministic human output while JSON
    remains complete.
  acceptance:
    - Human table and Markdown symbol sections disclose total, shown, omitted,
      active limit, and sort basis.
    - Human symbol rows are ordered by current-line Git evidence fields only
      when --symbol-line-history is present.
    - JSON symbols.items remains complete and is not truncated by the default
      display cap or --symbol-limit.
    - --symbol-limit N is documented as a human display limit valid only with
      --inspect PATH --symbols.
    - Existing non-symbol, plain inspect, and no-provider outputs remain
      byte-stable when new controls are absent.
    - Output avoids rank, score, risk, quality, ownership, productivity, bug
      prediction, symbol history, and symbol lineage claims.
    - Validation covers over-limit, exact-limit, zero-symbol, unsupported,
      degraded, tie, unicode, and Markdown-sensitive cases.
planning:
  state: ready
  summary: Human-readable symbol output should become summary-first and easier to
    read without truncating complete JSON symbols.items or implying symbol
    ranking/scoring.
  brief_sync:
    status: updated
    reason: Improves optional provider export readability while preserving
      file-level Git evidence as product truth.
    checked_at: 2026-05-23T23:45:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Keeps provider evidence opt-in, local-only, deterministic, and
      carefully caveated; no commercial or hosted scope.
    checked_at: 2026-05-23T23:45:00.000Z
