schema: flow-feature.v1
feature:
  id: "0024"
  slug: tree-sitter-vendored-source-import-proof
  title: Tree-sitter vendoring readiness proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0023 recorded a conditional-go for future Tree-sitter
    vendoring, but actual source import still lacks concrete provenance, notice,
    source-size, build-impact, and close-out gates. Importing the large
    generated Zig parser or Tree-sitter core before those gates are concrete
    would create supply-chain and source-install risk without user-visible
    runtime value.
  outcome: Produce a documentation-only vendoring readiness artefact that turns
    the 0023 conditional-go into concrete provenance, notice, measurement, and
    go/no-go gates for a later source-import feature, while preserving current
    dependency-free runtime and build behaviour.
  acceptance:
    - A new readiness artefact at docs/tree-sitter-vendoring-readiness.md
      defines the future PROVENANCE.md template, notice/attribution template,
      source-size and build-impact measurement plan, canonical source decision
      states, and import close-out gate for Tree-sitter core and
      tree-sitter-zig.
    - The artefact explicitly states that 0024 is a readiness gate, not a
      vendored-source import, and separates known facts, decisions, blockers,
      and future requirements.
    - The artefact records the known 0023 size facts, including the large Zig
      generated parser, and names future measurement commands and thresholds or
      planner-review triggers before source import can close.
    - The artefact recommends the next feature as source import, further proof,
      or no-go, with concrete blockers if source import is not ready.
    - This feature changes only documentation and Flow state; it does not add
      third_party sources, parser sources, generated C, build.zig.zon, build.zig
      compilation or linking changes, runtime provider behaviour,
      CLI/report/schema/scoring/cache/provider-registry changes, tests,
      fixtures, network runtime, telemetry, upload, remote enrichment, or
      background analysis.
    - Validation passes and scans prove the documentation contains no private
      paths, private remotes, raw private output, source snippets, raw parser
      stderr, author identities, hosted/pricing/sales strategy, bug-prediction
      claims, code-quality scoring claims, developer ranking, or maintainer
      judgement.
planning:
  state: ready
  summary: Shape 0024 as a docs-only Tree-sitter vendoring readiness proof, not
    source import. It should define templates and gates that make the next
    import feature safe, while deferring vendored sources, build graph changes,
    parser runtime, provider behaviour, and report semantics.
  brief_sync:
    status: updated
    reason: B001 keeps providers optional and local-first. Feature 0024 prepares
      safe vendoring gates for a future optional tree-sitter provider without
      changing runtime product truth.
    checked_at: 2026-05-23T05:50:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Feature 0024 is a provider-readiness follow-up that preserves
      file-level Git evidence as product truth and local-first defaults while
      preparing dependency gates for a future parser import.
    checked_at: 2026-05-23T05:50:00.000Z
