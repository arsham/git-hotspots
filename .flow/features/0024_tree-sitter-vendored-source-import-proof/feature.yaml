design:
  rough_shape:
    - Create docs/tree-sitter-vendoring-readiness.md as a readiness gate for the
      future vendored-source import.
    - Define future PROVENANCE.md and notice templates for Tree-sitter core and
      tree-sitter-zig.
    - Record known candidate size facts and the future source-size/build-impact
      measurement commands and thresholds.
    - Record canonical source decision states and exact blockers before import.
    - Preserve current runtime/build/report behaviour and defer source import to
      a later feature.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Vendoring readiness gate and templates
      goal: Produce the docs-only vendoring readiness artefact, including provenance
        and notice templates, source-size/build-impact gate, and go/no-go
        recommendation for the future source-import feature.
      owner_phase: runner
      execution_context:
        - "Anchors: docs/tree-sitter-dependency-vendoring-plan.md,
          docs/tree-sitter-zig-provider-spike.md,
          docs/provider-symbol-evidence-contract.md, new
          docs/tree-sitter-vendoring-readiness.md, .flow/features/0024*/prd.md."
        - "In scope: documentation-only readiness artefact; PROVENANCE.md
          template; notice/attribution template; source-size facts from 0023;
          future measurement commands and thresholds; canonical source decision
          states; explicit go/conditional-go/no-go next-feature recommendation."
        - "Out of scope: third_party source import, Tree-sitter core source,
          tree-sitter-zig grammar source, generated C, build.zig.zon, build.zig
          C build/link changes, parser runtime, provider registry, CLI flags,
          report schema, scoring/ranking, cache, tests, fixtures, CI, release
          packaging, network runtime, telemetry, upload, remote enrichment, or
          background analysis."
        - "Protected: current dependency-free source install, no-provider
          table/JSON/Markdown/inspect output, local-first runtime defaults,
          file-level Git evidence as product truth, provider contract, and
          OSS/publicity boundary."
        - "Dependencies: Feature 0020 provider contract, Feature 0021 symbol
          seam, Feature 0022 feasibility record, Feature 0023 dependency review,
          and B001 local-first capability brief."
        - "Validation/evidence: git diff --check; zig build validate;
          changed-path scan proving docs plus Flow only; no
          third_party/build/src parser-source scan; no-network scan;
          privacy/prohibited-claim scan over the new artefact."
        - "Review focus: whether the readiness gate is concrete enough for a
          future source-import feature, whether actual source import was
          correctly deferred, and whether license/provenance/size/offline-build
          risks are represented honestly."
        - "Escalate if: execution needs to add third_party sources, build graph
          changes, parser runtime, provider behaviour, network workflows,
          private paths, commercial content, or unreviewed source/provenance
          claims."
        - "Done boundary: readiness artefact exists; current validation passes;
          changed paths stay docs/Flow only; protected runtime/build surfaces do
          not change; next feature recommendation and blockers are explicit."
      verification_commands:
        - git diff --check
        - zig build validate
        - "changed-path scan: docs plus Flow only; no
          third_party/src/tests/fixtures/tools/build.zig/build.zig.zon changes"
        - "no-runtime/dependency scan: no parser sources, generated C, C
          build/linking, parser runtime, provider registry,
          CLI/report/scoring/cache changes"
        - "no-network scan: no fetch/upload/telemetry/remote enrichment,
          submodule, curl, wget, git clone, npm, npx, pnpm, yarn, or build-time
          fetch workflow added"
        - privacy/prohibited scan over docs/tree-sitter-vendoring-readiness.md
