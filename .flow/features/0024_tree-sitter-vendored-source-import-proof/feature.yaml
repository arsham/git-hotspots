design:
  rough_shape:
    - Create docs/tree-sitter-vendoring-readiness.md as a readiness gate for the
      future vendored-source import.
    - Define future PROVENANCE.md and notice templates for Tree-sitter core and
      tree-sitter-zig.
    - Record known candidate size facts and the future source-size/build-impact
      measurement commands and thresholds.
    - Record canonical source decision states and exact blockers before import.
    - Preserve current runtime/build/report behaviour and defer source import to
      a later feature.
