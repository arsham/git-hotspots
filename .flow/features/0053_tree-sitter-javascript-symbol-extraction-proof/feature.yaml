schema: flow-feature.v1
feature:
  id: "0053"
  slug: tree-sitter-javascript-symbol-extraction-proof
  title: JavaScript symbol extraction proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: "JavaScript build and query proofs will not prove extraction semantics:
    turning parsed trees and query captures into deterministic current-symbol
    evidence with correct ranges, ordering, caveats, and failure behaviour."
  outcome: An internal non-product JavaScript symbol extraction proof maps the
    project-owned query contract into the existing provider symbol evidence
    shape while runtime output remains absent.
  acceptance:
    - Add a dedicated proof target expected as zig build
      tree-sitter-javascript-symbol-proof.
    - Use vendored local Tree-sitter core, JavaScript parser/scanner, and the
      Feature 0052 project-owned query contract.
    - Extract a bounded current-symbol subset covering functions, classes,
      methods, constants/variables, ESM exports, CommonJS exports, anonymous
      cases, and JSX components when admitted.
    - Prove deterministic range, ordering, symbol-kind mapping, current-only
      caveats, and degraded cases.
    - Preserve no-provider and existing Zig/Go/Python symbol output byte
      stability.
    - Record public evidence at
      docs/tree-sitter-javascript-symbol-extraction-proof.md.
    - Do not expose runtime JavaScript symbols, provider registry wiring,
      CLI/report/schema/scoring/cache changes, TypeScript/TSX support,
      Node/package/workspace/module/LSP analysis, custom queries, or symbol
      history.
