        - "Anchors: JavaScript query asset and fixtures,
          tests/tree_sitter_javascript_symbol_proof.zig or equivalent,
          provider.CurrentSymbolEvidence,
          docs/tree-sitter-javascript-symbol-extraction-proof.md."
        - "In scope: extraction mapping, ranges, ordering, symbol kinds,
          caveats, degraded cases, evidence doc, proof target."
        - "Out of scope: CLI/runtime provider output, provider registry,
          report/schema/scoring/cache, symbol-line-history, TypeScript/TSX,
          Node/package/workspace/module/LSP analysis, custom user queries."
        - "Protected: existing no-provider and Zig/Go/Python symbol outputs
          remain stable; JavaScript support is not user-facing yet."
        - "Dependencies: Feature 0052 query contract and fixtures complete."
        - "Validation/evidence: zig build validate; existing proof targets;
          JavaScript build/query/symbol proofs; git diff --check."
        - "Review focus: extraction semantics match the query contract and use
          current-only evidence with privacy-safe caveats."
        - "Escalate if: query captures do not support deterministic extraction,
          symbol kinds need schema expansion, JSX cannot be handled honestly, or
          runtime output changes are needed."
        - "Done boundary: internal proof and evidence doc exist; JavaScript
          runtime output still absent."
      verification_commands:
