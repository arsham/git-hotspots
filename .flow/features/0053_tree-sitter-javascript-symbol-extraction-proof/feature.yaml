design:
  rough_shape:
    - Add internal JavaScript extraction proof target.
    - Map query captures into provider.CurrentSymbolEvidence or compatible proof
      shape.
    - Cover supported, caveated, unsupported, invalid, generated/minified, JSX,
      export/CommonJS, anonymous, unsafe, and Markdown-sensitive cases.
    - Keep CLI/runtime output deferred.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: JavaScript symbol extraction proof
      goal: Prove deterministic internal JavaScript current-symbol extraction
        semantics without user-facing runtime output.
      owner_phase: runner
