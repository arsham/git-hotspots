schema: flow-feature.v1
feature:
  id: "0047"
  slug: inspect-only-python-symbol-line-history-evidence
  title: Inspect-only Python symbol line-history evidence
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Inspect-only Python symbols would expose current symbols, but Python
    users still could not request current-line Git evidence for those symbol
    ranges.
  outcome: The existing opt-in symbol-line-history path supports inspected Python
    symbols as current-line Git evidence without claiming true symbol history or
    ownership analytics.
  acceptance:
    - Enable `git-hotspots --inspect path.py --symbols --symbol-line-history`
      for successful Python symbols.
    - Reuse the existing provider-neutral current-line blame/range model and
      existing optional fields.
    - Preserve Python symbol output without line-history and existing Zig/Go
      line-history behaviour.
    - Add deterministic Python line-history goldens and
      dirty/shallow/partial/degraded/privacy cases.
    - Frame evidence as current-line Git evidence at HEAD, not symbol history,
      ownership, risk, quality, ranking, or lineage.
    - Do not add `git log -L`, package/import/venv/notebook/LSP analysis,
      repo-wide scans, custom queries, scoring/cache, raw blame/diffs, authors,
      or commit messages.
