          - "Relationship precision follow-up selected for feature 0104: run a
            docs-only relationship output noise audit before changing
            provider-neutral aggregation, filtering, deduplication, caveat
            wording, or public documentation. The audit must sample existing
            public --symbol-relationships outputs, classify actionable noise
            versus acceptable syntax-only caveats, recommend bounded successor
            slices, and preserve CLI flags, report schema, scoring, ranking,
            provider admission, release state, tags, remotes, package artefacts,
            network behaviour, telemetry, and cache semantics."
          - "Relationship presentation successor selected for feature 0106: add
            provider-neutral human-only uncertainty summaries for
            --symbol-relationships table and Markdown output. The slice should
            summarise relation kind counts, unresolved/unknown totals, and
            display-limit versus provider-cap omissions while preserving JSON
