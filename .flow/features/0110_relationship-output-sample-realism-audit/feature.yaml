intent:
  problem: Existing relationship fixtures and goldens were built through staged
    provider and presentation work. Before further runtime changes, we need to
    know whether those samples still represent realistic relationship output
    from this repository and a privacy-safe local sibling.
  outcome: A privacy-safe docs-only audit compares real relationship output with
    fixture/golden coverage and recommends the next slice, if any, without
    changing runtime behaviour or public contracts.
  acceptance:
    - Audit document exists at docs/relationship-output-sample-realism-audit.md.
    - Audit includes this-repo dogfood evidence and either one sibling/local
      sample or explicit privacy-safe skip reason.
    - Audit compares real output against fixtures/goldens for relation kinds,
      unknown/unresolved volume, omissions, caveats, and duplicate-looking
      records.
    - Audit records only privacy-safe labels, bounded counts, categorical
      observations, and project-relative command shapes.
    - Audit recommends concrete successor slices only when evidence supports
      them.
    - No runtime, CLI, JSON schema, report field, provider, scoring, ranking,
      cache, network, telemetry, release, tag, remote, package, or publish
      behaviour changes.
