            scoring/ranking/confidence, provider admission, relationship
            semantics, cache/network/telemetry behaviour, release state, tags,
            remotes, and packages. Deduplication and provider admission remain
            separate slices."
          - "Shape 0108 as a tests-only deduplication guardrail successor from
            the relationship output noise audit: preserve duplicate-looking
            relationship records when relation kind or evidence basis differs;
            no production deduplication, JSON schema, provider algorithm,
            scoring, ranking, CLI, release, remote, package, network, telemetry,
            or cache changes."
          - "Shape 0109 as a docs/validation release-polish successor after
