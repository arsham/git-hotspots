  acceptance_contract:
    outcome: A privacy-safe docs-only audit compares real relationship output with
      fixture/golden coverage and recommends the next slice, if any, without
      changing runtime behaviour or public contracts.
    acceptance:
      - Audit document exists at
        docs/relationship-output-sample-realism-audit.md.
      - Audit includes this-repo dogfood evidence and either one sibling/local
        sample or explicit privacy-safe skip reason.
      - Audit compares real output against fixtures/goldens for relation kinds,
        unknown/unresolved volume, omissions, caveats, and duplicate-looking
        records.
      - Audit records only privacy-safe labels, bounded counts, categorical
        observations, and project-relative command shapes.
      - Audit recommends concrete successor slices only when evidence supports
        them.
      - No runtime, CLI, JSON schema, report field, provider, scoring, ranking,
        cache, network, telemetry, release, tag, remote, package, or publish
        behaviour changes.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify audit evidence is privacy-safe and successor recommendations are
        evidence-backed
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
      - privacy-safe sibling sampling skip reason when no safe repository is
        available
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
      - audit recommends no further relationship-output work
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - runtime or public contract change required by audit findings
      - privacy-safe evidence boundary cannot be satisfied
    protected_surfaces:
      - runtime behaviour
      - CLI flags and options
      - JSON schema and report fields
      - relationship provider algorithms and admission
      - relationship semantics and caps
      - scoring ranking and confidence
      - cache network telemetry release tag remote package and publish behaviour
      - raw private reports absolute paths remotes author identities emails
        parser diagnostics and commit messages
  fallback_path: deferred_reconcile_decision
  notes: null
