design:
  rough_shape:
    - Treat --help as an existing surface to improve and validate, not a new
      parser feature.
    - Add a checked-in roff man page at man/git-hotspots.1 and keep it
      install-agnostic.
    - Add docs/user-guide.md for task-oriented learning and
      docs/developer-guide.md for contributor implementation boundaries.
    - Use README and CONTRIBUTING as entry points that point to deeper docs
      instead of duplicating every option in prose.
    - Extend validation narrowly so key flags, local-first/prohibited-claim
      language, and docs/man surfaces do not drift.
    - Keep all examples local and project-relative; do not commit private smoke
      output, absolute local paths, remotes, or author identities.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Help surface and CLI learning cues
      goal: Tighten existing terminal help so first-run users understand common
        commands, option boundaries, and local-first caveats without changing
        CLI parsing or analysis semantics.
      owner_phase: runner
      execution_context:
        - "Anchors: src/cli.zig, src/app.zig, tests/integration.sh,
          tools/validate.sh, fixtures/expected/explain.txt if wording alignment
          requires it."
        - "In scope: improve existing --help/-h text, option grouping, brief
          examples, local-first/no-telemetry caveat, investigation-prompt
          framing, and validation greps for key help claims."
        - "Out of scope: new flags, subcommands, shell completions, interactive
          help, docs site, packaging/install integration, report schema changes,
          provider behaviour, scoring, network, telemetry, upload, or hosted
          service scope."
        - "Protected: --help and -h remain standalone and repo-independent;
          --progress --help writes no stderr progress; existing
          invalid-combination parser contracts remain intact; hotspots remain
          investigation prompts, not bug predictions or quality/developer
          rankings."
        - "Dependencies: none; this packet may run before or with docs packets
          but must not rely on packaging work."
        - "Validation/evidence: git diff --check; zig fmt --check build.zig src
          tests when Zig/test files change; zig build test; targeted --help, -h,
          --progress --help smoke; updated integration/validate help greps; no
          prohibited claims in changed help text."
        - "Review focus: help stays concise, accurate, easy to scan, and aligned
          with README/man/docs while preserving existing parser behaviour."
        - "Escalate if: making help accurate requires new runtime behaviour, new
          flags, subcommands, output schema changes, or packaging decisions."
        - "Done boundary: terminal help passes targeted checks, remains
          repo-independent, and records no unsupported claims."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests when Zig/test files change
        - zig build test
        - targeted --help, -h, and --progress --help smoke
        - updated integration and validation help checks
        - prohibited-claim scan for changed help text
    - id: P2
      depends_on:
        - P1
      status: done
      title: User guide and checked-in man page
      goal: Add source-controlled user documentation and a man page that teach common
        workflows and caveats without adding packaging or install integration.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, man/git-hotspots.1,
          tools/validate.sh, docs/planning-handoff.md only if stale public entry
          references must be updated."
        - "In scope: source-build first run, examples for table/json/markdown,
          scope/include/exclude guidance, inspect and symbols examples,
          --explain, privacy/local-first caveats, shallow/partial history
          caveats, provider boundaries, troubleshooting, and README links to
          deeper docs."
        - "Out of scope: package-manager installation, generated man-page
          pipeline, release automation, shell completions, docs hosting,
          screenshots, case studies, benchmark claims, remote examples,
          commercial/hosted strategy, or private repository report dumps."
        - "Protected: examples use project-relative paths or placeholders;
          public docs avoid author identities, absolute local paths, remotes,
          bug prediction, objective quality scoring, maintainer judgement,
          ownership, or developer ranking."
        - "Dependencies: P1 establishes current help wording; if P1 changes
          option wording, this packet must align man/user docs before
          completion."
        - "Validation/evidence: git diff --check; markdown formatting review;
          man page presence and section checks; docs greps for key flags and
          local-first caveats; validation docs/man drift checks; zig build
          validate after implementation."
        - "Review focus: docs are easier to learn from than the current README,
          avoid duplicating unnecessary option prose, and stay honest about
          alpha/source-build status."
        - "Escalate if: user documentation requires packaging, install
          destinations, release tags, hosted service assumptions, network
          behaviour, or unproven capability claims."
        - "Done boundary: user guide and man page exist, are linked from README,
          pass validation checks, and preserve public project boundaries."
      verification_commands:
        - git diff --check
        - markdown formatting review for README.md and docs/user-guide.md
        - man page presence and required-section checks
        - docs/man key-claim drift checks
        - zig build validate
    - id: P3
      depends_on:
        - P1
        - P2
      status: done
      title: Developer guide and validation guardrails
      goal: Add concise contributor-facing documentation and validation safeguards so
        future help/docs/man changes preserve architecture, privacy, and claim
        boundaries.
      owner_phase: runner
      execution_context:
        - "Anchors: CONTRIBUTING.md, docs/developer-guide.md, tools/validate.sh,
          tests/integration.sh, README.md, man/git-hotspots.1."
        - "In scope: document module ownership, argument/help ownership,
          report/provider boundaries, validation ladder, when validate-all is
          needed, docs drift rules, prohibited public claims,
          local-first/no-network guardrails, and add validation coverage for new
          docs/man paths."
        - "Out of scope: architecture rewrite, plugin framework, provider
          roadmap, cache design, CI/release policy expansion, package
          publishing, docs generator dependencies, broad refactors, or
          implementation features unrelated to docs/help accessibility."
        - "Protected: CONTRIBUTING remains concise; developer guide does not
          become a commercial roadmap or internal planning dump; validation
          stays local and deterministic with no new network/toolchain
          dependencies beyond existing project requirements."
        - "Dependencies: P1 and P2 create the surfaces whose drift/privacy
          checks need to be protected."
        - "Validation/evidence: git diff --check; sh -n tools/*.sh tests/*.sh if
          shell scripts change; zig build test; zig build validate; validation
          proof that docs/user-guide.md, docs/developer-guide.md, and
          man/git-hotspots.1 are scanned for prohibited claims/privacy and
          required help/man anchors."
        - "Review focus: contributor guidance is actionable, minimal, and
          consistent with existing module boundaries and Flow/project
          constraints."
        - "Escalate if: validation needs external tools, generated docs
          dependencies, CI/publishing work, or a broader architecture decision."
        - "Done boundary: developer guide exists, CONTRIBUTING links to it,
          validation protects new docs/man surfaces, and full local validation
          passes."
      verification_commands:
        - git diff --check
        - sh -n tools/*.sh tests/*.sh when shell scripts change
        - zig build test
        - zig build validate
        - docs/man prohibited-claim and privacy scan proof
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
    required_packet_fields:
      - id
