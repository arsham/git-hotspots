    supporting_context:
      - source_ref: prd.md#problem[1]
        text: git-hotspots has a useful alpha CLI, but its learning path is too dense
          for new users and future contributors. The repository already has
          --help, README usage examples, and CONTRIBUTING architecture notes,
          yet there is no checked-in man page, no task-oriented user guide, no
          concise developer guide, and no feature-specific validation contract
          that keeps help, docs, and manual claims in sync as options grow.
      - source_ref: prd.md#problem[2]
        text: "This creates three risks:"
      - source_ref: prd.md#problem[3]
        text: first-time users must read a long README to learn common workflows;
      - source_ref: prd.md#problem[4]
        text: contributors may not know which files own CLI help, reports, providers,
          and validation; and
      - source_ref: prd.md#problem[5]
        text: public docs, terminal help, and future man-page text may drift or
          accidentally overclaim beyond deterministic local Git-history
          evidence.
      - source_ref: prd.md#outcome[1]
        text: "Create a bounded documentation and help surface that makes the existing
          alpha CLI easier to learn from the terminal and repository:"
      - source_ref: prd.md#outcome[2]
        text: concise terminal help for common first-run understanding;
      - source_ref: prd.md#outcome[3]
        text: a checked-in man page;
      - source_ref: prd.md#outcome[4]
        text: a task-oriented user guide;
      - source_ref: prd.md#outcome[5]
        text: a contributor-oriented developer guide; and
      - source_ref: prd.md#outcome[6]
        text: deterministic validation that protects key help/docs/man claims.
      - source_ref: prd.md#outcome[7]
        text: The feature must not add packaging, release automation, hosted service
          strategy, commercial strategy, telemetry, upload, remote enrichment,
          provider behaviour, cache behaviour, scoring changes, report schema
          changes, or new runtime analysis semantics.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 12 refs outside default requirement rows.
  acceptance_contract:
    outcome: "A bounded documentation and help surface makes git-hotspots easy to
      learn from the terminal and repository: concise --help, source-controlled
      man page, user/developer docs, and validation that protects local-first,
      evidence-first claims without adding packaging, release, provider, cache,
      telemetry, network, or hosted scope."
    acceptance:
      - --help and -h remain standalone terminal help, include the supported
        option surface, local-first/no-telemetry boundary, and
        investigation-prompt framing, and do not require a Git repository.
      - A checked-in man page documents synopsis, options, examples, report
        semantics, privacy/local-first caveats, provider boundaries, exit
        expectations, and related docs without adding install or packaging
        integration.
      - A concise user guide gives source-build, first-run, common workflows,
        inspect/symbol examples, scope/filter guidance, output-format guidance,
        and troubleshooting/caveat notes using project-relative examples.
      - A concise developer guide records repo structure, argument/help
        ownership, report/provider boundaries, validation commands,
        documentation drift rules, and public-claim guardrails without expanding
        architecture scope.
      - README and CONTRIBUTING remain polished entry points and link to deeper
        docs instead of becoming longer catch-all manuals.
      - Validation covers help/man/docs presence and key claim consistency,
        includes new docs/man paths in prohibited-claim or privacy scans, and
        preserves existing deterministic validation behaviour.
      - No runtime analysis semantics, scoring, report schemas, provider
        extraction, cache, release packaging, CI policy, network access,
        telemetry, upload, hosted service, commercial strategy, bug-prediction,
        code-quality scoring, ownership, or developer-ranking claims are added.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig fmt --check build.zig src tests when Zig/test files change
      - zig build test
      - targeted --help, -h, and --progress --help smoke
      - updated integration and validation help checks
      - prohibited-claim scan for changed help text
      - markdown formatting review for README.md and docs/user-guide.md
      - man page presence and required-section checks
      - docs/man key-claim drift checks
      - zig build validate
      - sh -n tools/*.sh tests/*.sh when shell scripts change
      - docs/man prohibited-claim and privacy scan proof
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify docs/man/help claims are local-first, evidence-first, and free of
        prohibited public framing
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - documentation claim requires unsupported runtime behaviour
      - packaging, release, network, telemetry, upload, hosted, or commercial
        scope appears necessary
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: "Judge review selected one cohesive documentation/accessibility feature
    with three serial packets: help wording, user guide/man page, and developer
    guide/validation guardrails. Keep implementation docs/help-only and avoid
    packaging, release, provider, cache, hosted, telemetry, network, commercial,
    bug-prediction, quality-score, ownership, or developer-ranking scope."
