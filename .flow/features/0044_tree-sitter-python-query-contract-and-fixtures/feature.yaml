schema: flow-feature.v1
feature:
  id: "0044"
  slug: tree-sitter-python-query-contract-and-fixtures
  title: Tree-sitter Python query contract and fixtures
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Python parser build proof will not define which Python symbols are
    supported, how query captures map to provider evidence, or which fixtures
    prove deterministic semantics.
  outcome: A project-owned Python query contract and fixture corpus define
    supported captures, mapping, ranges, ordering, caveats, and validation
    without exposing runtime Python symbols.
  acceptance:
    - Define a project-owned Python symbol query contract with capture names and
      supported subset.
    - Cover modules, classes, functions, methods, constants/assignments,
      decorators, nested definitions, invalid/partial, generated, empty,
      unsupported, Unicode, and Markdown-sensitive cases.
    - Record range, ordering, symbol-kind mapping, provider/query version, and
      caveat semantics.
    - Add public evidence at docs/tree-sitter-python-query-contract.md.
    - Preserve no-provider and existing Zig/Go symbol output byte stability.
    - Do not add user-facing Python symbols, provider registry wiring, custom
      user query execution, package/import/venv/notebook/LSP analysis, parser
      generation, or network/global tool dependency.
