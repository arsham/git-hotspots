  decision_budget:
    allowed_local_decisions:
      - documentation wording inside dispatched scope
      - validation guardrails that do not change runtime behaviour
    deferred_reconcile_triggers:
      - minor evidence-wording trade-off that stays inside acceptance
      - checked-but-unchanged public surfaces
    hard_planner_escalation_triggers:
      - dependency/call-graph/ownership/bug-prediction claim
      - runtime/provider/schema/CLI/scoring change
      - release/tag/remote/package/publish side effect
    protected_surfaces:
      - runtime behaviour
      - CLI flags/options
      - JSON schema/report fields
      - provider algorithms/admission
      - relationship/historical attribution semantics/caps
      - scoring/ranking/confidence
      - cache/network/telemetry/release/tag/remote/package/publish behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
