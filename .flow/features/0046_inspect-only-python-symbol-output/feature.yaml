schema: flow-feature.v1
feature:
  id: "0046"
  slug: inspect-only-python-symbol-output
  title: Inspect-only Python symbol output
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Python internal extraction can prove symbols, but users inspecting
    Python files still cannot request current Python symbol evidence through the
    CLI.
  outcome: Inspect-only `.py` symbol output reuses the existing symbols envelope
    while preserving file-level Git evidence as product truth and leaving
    line-history deferred.
  acceptance:
    - Add inspect-only Python symbol provider dispatch for `git-hotspots
      --inspect path.py --symbols`.
    - Reuse the existing symbols envelope with Python provider metadata,
      deterministic items, caveats, and privacy-safe failures.
    - Preserve no-provider outputs plus existing Zig and Go symbol outputs
      unless explicitly planned as language-neutral wording.
    - Add JSON, Markdown, and table goldens plus
      unsupported/degraded/determinism cases for Python symbols.
    - Update README/help/explain to state inspect-only Tree-sitter symbols
      support Zig, Go, and Python as current working-tree enrichment only.
    - Do not add Python line-history, repo-wide scanning,
      package/import/venv/pyproject/notebook/LSP analysis, scoring/cache, custom
      queries, or new flags.
