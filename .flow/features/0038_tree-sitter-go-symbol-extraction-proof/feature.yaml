schema: flow-feature.v1
feature:
  id: "0038"
  slug: tree-sitter-go-symbol-extraction-proof
  title: Tree-sitter Go symbol extraction proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The Go parser now compiles and parses through an isolated proof, but Go
    symbol extraction semantics, ranges, ordering, mapping, and degraded states
    are not yet proven.
  outcome: Add an internal non-product Tree-sitter Go symbol extraction proof that
    maps a bounded Go symbol subset into the existing provider symbol evidence
    shape while preserving all current CLI and report behaviour.
  acceptance:
    - Dedicated command `zig build tree-sitter-go-symbol-proof` exists and
      passes.
    - The proof uses vendored local Tree-sitter core and tree-sitter-go parser
      sources only.
    - The proof uses direct AST traversal first; no Tree-sitter query files or
      custom query execution are added.
    - The proof extracts package, top-level functions, methods, struct and
      interface type specs, and top-level const/var names when feasible.
    - Symbol ranges use deterministic one-based inclusive line ranges from the
      enclosing Go declaration node.
    - Symbol ordering is deterministic and source-order based for the proof.
    - Symbol kind mapping stays within the existing provider model and uses
      caveats for structs, interfaces, and constants where needed.
    - Empty, invalid, unsupported, unsafe-path, generated-file, build-tag, and
      cgo-adjacent cases are covered or caveated without raw diagnostics.
    - Existing Zig and Go build proof targets still pass.
    - No user-facing Go symbols, provider registry, CLI/report/schema/scoring,
      cache, network, telemetry, or parser-generation behaviour is added.
    - No-provider outputs and existing Zig symbol outputs remain stable.
    - Public evidence documents supported subset, range/order semantics,
      validation, and that Go runtime symbol output is not implemented yet.
planning:
  state: ready
  summary: Prove Go symbol extraction semantics internally before exposing Go
    symbols to users. This mirrors the Zig sequence of source import, build
    proof, internal extraction proof, then user-facing inspect output.
  brief_sync:
    status: updated
    reason: Supports B001 provider-as-optional-enricher direction while keeping
      file-level Git evidence as product truth.
    checked_at: 2026-05-24T15:30:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: This is a prerequisite provider implementation slice for the B001
      local-first hotspot intelligence capability; it adds no product-facing Go
      output.
    checked_at: 2026-05-24T15:30:00.000Z
