design:
  rough_shape:
    - Add an isolated `zig build tree-sitter-go-symbol-proof` target.
    - Use direct AST traversal over in-memory Go fixtures.
    - Extract a bounded top-level symbol subset into provider-compatible
      current-symbol evidence.
    - Prove deterministic range, order, caveat, and failure semantics.
    - Preserve no-provider output stability and existing Zig symbol behaviour.
    - Explicitly defer Go user-facing symbol output to a later feature.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
  packets:
    - id: P1
      title: Internal Go extraction proof
      goal: Add a non-product Go symbol extraction proof target that extracts a
        bounded Go symbol subset from in-memory fixtures using vendored local
        Tree-sitter sources and direct AST traversal.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: build.zig, tests/tree_sitter_go_symbol_proof.zig or
          equivalent, src/provider.zig, third_party/tree-sitter-go/v0.25.0,
          third_party/tree-sitter-core/v0.26.9"
        - "In scope: add `zig build tree-sitter-go-symbol-proof`; compile/link
          local core lib.c and Go parser.c for proof; extract package, top-level
          functions, methods, struct/interface type specs, top-level const/var
          names when feasible; use provider-compatible current-symbol evidence"
        - "Out of scope: user-facing Go `--symbols`,
          CLI/report/schema/scoring/cache changes, provider registry, Go
          package/module analysis, custom queries, LSP, parser generation,
          network/package-manager/global Tree-sitter input"
        - "Protected: installed product CLI runtime, existing no-provider
          outputs, existing Zig symbol outputs, provider public semantics,
          file-level Git evidence as product truth"
        - "Dependencies: Feature 0037 Go offline build proof and existing
          provider.CurrentSymbolEvidence seam"
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; zig build; zig build validate; zig build
          tree-sitter-build-proof; zig build tree-sitter-symbol-proof; zig build
          tree-sitter-go-build-proof; zig build tree-sitter-go-symbol-proof; git
          diff --check"
        - "Review focus: proof remains internal/non-product; direct traversal
          semantics are explicit; mapping/range/order/caveats are deterministic;
          no runtime/report drift"
        - "Escalate if: Go symbol subset requires provider enum expansion,
          receiver-qualified naming contract, query framework, parser
          generation, package-manager input, or user-facing output"
        - "Done boundary: proof target passes; supported subset and edge cases
          are tested; no-provider and Zig symbol outputs remain stable"
      anchors:
        - build.zig
        - tests/tree_sitter_go_symbol_proof.zig
        - src/provider.zig
        - third_party/tree-sitter-go/v0.25.0/
        - third_party/tree-sitter-core/v0.26.9/
      in_scope:
        - Dedicated internal Go symbol proof target.
        - Direct AST traversal over in-memory Go fixtures.
        - Provider-compatible current-symbol evidence.
        - Deterministic range and order semantics.
      out_of_scope:
        - User-facing Go symbols.
        - CLI, report, schema, scoring, cache, runtime provider, registry, CI
          release, package, LSP, or parser-generation changes.
      protected_surfaces:
        - src/main.zig user-facing routes
        - src/report.zig report schema and renderers except tests if needed
        - fixtures/expected/**
        - product CLI/report/scoring/cache behaviour
      validation_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - zig build tree-sitter-go-build-proof
        - zig build tree-sitter-go-symbol-proof
        - git diff --check
      review_focus:
        - Go extraction semantics are deterministic and bounded.
        - Existing provider shape is used honestly.
        - No user-facing Go output or report drift was introduced.
      escalation_triggers:
        - Required symbol kinds cannot be represented without changing the
          provider enum.
        - Method receiver naming requires a new public contract.
        - Direct traversal cannot prove deterministic semantics.
        - Proof requires network, package manager, global Tree-sitter, or parser
          generation.
      done_boundary: Internal Go symbol proof passes and existing validation remains
        green with no runtime/provider/report drift.
    - id: P2
      title: Evidence docs and close-out proof
      goal: Record public, privacy-safe evidence for the Go extraction proof,
        supported subset, range/order semantics, validation commands, and the
        explicit non-runtime boundary.
      owner_phase: runner
      depends_on:
        - P1
      status: planned
      execution_context:
        - "Anchors: docs/tree-sitter-go-symbol-extraction-proof.md, build.zig,
          tests/tree_sitter_go_symbol_proof.zig"
        - "In scope: record supported subset, direct traversal boundary,
          range/order semantics, symbol-kind mapping, caveats, validation
          commands, local/offline proof, and no-runtime Go support statement"
        - "Out of scope: raw sibling paths/output, private repo details, parser
          stderr dumps, source snippets from private repos, Go runtime support
          claims"
        - "Protected: OSS/publicity framing, local-first defaults, no bug
          prediction/code-quality/developer-ranking claims"
        - "Dependencies: P1 proof target must pass before evidence is final"
        - "Validation/evidence: changed-path scan; prohibited dependency scan;
          privacy/prohibited-claim scan; close-out smoke with sibling-local-repo
          label; Flow validation"
        - "Review focus: evidence is concise, public-safe, repo-relative, and
          does not imply Go user-facing provider support is implemented"
        - "Escalate if: evidence needs private data, no-provider output drift
          appears, or docs imply Go symbols are available in CLI output"
        - "Done boundary: evidence doc complete; close-out rows are
          independently reviewable; feature ready for delegated review"
      anchors:
        - docs/tree-sitter-go-symbol-extraction-proof.md
        - build.zig
        - tests/tree_sitter_go_symbol_proof.zig
      in_scope:
        - Public proof evidence document.
        - Privacy-safe validation and close-out summaries.
        - Explicit deferral of user-facing Go symbols.
      out_of_scope:
        - Raw private output or paths.
        - Runtime Go support claims.
      protected_surfaces:
        - README public claims unless a narrow correction is required.
        - CONTRIBUTING and CI behaviour unless proof target is intentionally
          added.
      validation_commands:
        - git diff --check
        - zig build validate
        - zig build tree-sitter-go-symbol-proof
        - zig build validate -Dcloseout=true -Dsmoke-repo=<local-sibling-path>
          -Dsmoke-label=sibling-local-repo
      review_focus:
        - Evidence proves the internal proof and does not overclaim product
          support.
        - Sibling evidence is label-only.
      escalation_triggers:
        - Docs need to claim Go CLI support.
        - Evidence requires private or raw parser output.
        - CI inclusion decision changes validation cost materially.
      done_boundary: Evidence and close-out validation are complete, public-safe, and
        independently reviewable.
