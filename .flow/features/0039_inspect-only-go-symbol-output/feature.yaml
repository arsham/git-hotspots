schema: flow-feature.v1
feature:
  id: "0039"
  slug: inspect-only-go-symbol-output
  title: Inspect-only Go symbol output
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Go parser source import, offline build proof, and internal Go symbol
    extraction proof are complete, but users inspecting a hot Go file cannot yet
    request current Go symbols through the CLI.
  outcome: Add narrow inspect-only Go symbol output through the existing
    `--inspect PATH --symbols` flow while preserving file-level Git evidence as
    product truth and avoiding repo-wide provider execution.
  acceptance:
    - "`git-hotspots --inspect path.go --symbols` emits current working-tree Go
      symbols for the resolved inspected Go file only."
    - Go provider output uses the existing `symbols` envelope in table, JSON,
      and Markdown.
    - The implementation adds a reusable runtime Go extraction module with owned
      symbol data and deinitialisation parity with the Zig provider.
    - The product build avoids duplicate Tree-sitter core linkage while
      supporting Zig and Go symbol providers.
    - Supported Go subset covers package clauses, top-level functions, methods,
      struct/interface type specs, top-level const names, and top-level var
      names with documented caveats.
    - Go line-history, symbol history, symbol lineage, scoring, ranking, package
      analysis, build-tag evaluation, cgo analysis, dependency graph, LSP,
      custom queries, cache, network, and telemetry remain out of scope.
    - No-provider outputs and existing Zig symbol outputs remain stable except
      for approved language-neutral wording that does not change schema or
      semantics.
    - Human output names the actual symbol kind and does not hardcode
      Zig/function wording for Go symbols.
    - README, help, and explain text accurately describe inspect-only Zig and Go
      symbol support without overclaiming.
    - Validation covers Go success, unsupported, empty, invalid, unavailable,
      generated/build-tag/cgo caveat, rename-alias, two-file inspect-only,
      privacy, and real-repo smoke cases.
planning:
  state: ready
  summary: Expose Go symbols as a bounded opt-in inspect enrichment now that Go
    source import, build proof, and internal extraction proof are complete.
    Include a hidden runtime/build-safety packet before user-facing output.
  brief_sync:
    status: updated
    reason: Supports B001 provider-as-optional-enricher direction while preserving
      deterministic file-level Git evidence as product truth.
    checked_at: 2026-05-24T16:55:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Follow-up provider implementation slice for B001. It adds opt-in
      current Go symbol enrichment only for inspected files.
    checked_at: 2026-05-24T16:55:00.000Z
