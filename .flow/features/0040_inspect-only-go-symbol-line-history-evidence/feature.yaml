design:
  rough_shape:
    - Reuse existing `git.attachCurrentLineHistory` for Go symbols after
      successful inspected Go symbol extraction.
    - Keep current-line evidence semantics exactly aligned with Feature 0029.
    - Replace Go no-line-history assertions with Go line-history success,
      degraded, stability, and privacy coverage.
    - Update user-facing wording from Zig-only line-history support to Zig-or-Go
      current-line evidence where accurate.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
  packets:
    - id: P1
      title: Go line-history proof contract and fixtures
      goal: Prove how current-line Git evidence maps to Go symbol ranges before wiring
        the user-visible path.
      owner_phase: runner
      depends_on: []
      status: done
      execution_context:
        - "Anchors: src/main.zig, src/git.zig, src/tree_sitter_go.zig,
          src/provider.zig, tools/setup-fixtures.sh, tests/integration.sh,
          fixtures/expected"
        - "In scope: decide and test current-line evidence for all supported Go
          symbols, including package/module, functions, methods, type specs,
          grouped const/var names, caveated generated/build-tag/cgo examples,
          and degraded states"
        - "Out of scope: true symbol history, git log -L, package/build-tag/cgo
          analysis, provider registry, symbol scoring/ranking, cache, network,
          telemetry, repo-wide provider execution"
        - "Protected: existing Zig line-history semantics, no-provider outputs,
          plain Go --symbols output when line-history flag is absent, file-level
          scoring/ranking/lineage/confidence"
        - "Dependencies: Feature 0039 Go symbol output and existing
          provider-neutral current-line history model"
        - "Validation/evidence: Go line-history JSON/Markdown/table goldens;
          repeated-output checks; dirty inspected/dirty unrelated;
          shallow/partial;
          unsupported/empty/invalid/unavailable/missing-current/symlink/too-lar\
          ge cases"
        - "Review focus: current-line evidence is not described as symbol
          history; caveats are present for Go range limitations; privacy
          boundaries are preserved"
        - "Escalate if: Go ranges need new schema fields, package/build context,
          receiver-qualified naming, raw blame details, or broader provider
          architecture"
        - "Done boundary: fixture contract proves Go current-line evidence
          semantics and degraded states without user-visible implementation
          drift beyond planned goldens"
      anchors:
        - src/main.zig
        - src/git.zig
        - src/tree_sitter_go.zig
        - src/provider.zig
        - tests/integration.sh
        - tools/setup-fixtures.sh
        - fixtures/expected/
      in_scope:
        - Go current-line evidence fixture contract.
        - Degraded and privacy cases.
      out_of_scope:
        - Runtime provider expansion beyond inspected Go file.
        - True symbol history, package analysis, cache, scoring, and registry
          work.
      protected_surfaces:
        - Existing no-provider outputs.
        - Existing Zig symbol and line-history outputs.
        - Plain Go symbol outputs without the line-history flag.
      validation_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - zig build tree-sitter-go-build-proof
        - zig build tree-sitter-go-symbol-proof
        - git diff --check
      review_focus:
        - Fixture evidence proves the intended Go current-line semantics.
        - Caveats and privacy are sufficient.
      escalation_triggers:
        - New schema fields or package/build context becomes necessary.
        - Evidence would require authors, commit messages, raw blame, snippets,
          or diffs.
      done_boundary: Go current-line evidence cases are specified and represented in
        validation fixtures.
    - id: P2
      title: User-visible Go current-line evidence wiring
      goal: Enable `--symbol-line-history` for inspected Go symbols using the existing
        provider-neutral blame attachment path.
      owner_phase: runner
      depends_on:
        - P1
      status: done
      execution_context:
        - "Anchors: src/main.zig, src/report.zig, src/explain.zig, README.md,
          tests/integration.sh, fixtures/expected"
        - "In scope: attach line history after successful Go or Zig symbol
          extraction when `--inspect PATH --symbols --symbol-line-history` is
          requested; update help/explain/README wording; add Go
          table/JSON/Markdown success goldens"
        - "Out of scope: Go line-history without --symbols,
          package/build-tag/cgo analysis, symbol scoring/ranking, true symbol
          lineage, git log -L, provider registry, cache, network, telemetry"
        - "Protected: no-provider output bytes, plain Go --symbols bytes when
          flag absent except approved stable fixture isolation, existing Zig
          output bytes, file-level evidence semantics"
        - "Validation/evidence: full validation ladder, Go line-history fixture
          diffs, no-flag stability checks, privacy/prohibited scans including
          new Go outputs, close-out smoke with this repo and sibling-local-repo
          label"
        - "Review focus: user-facing wording says current-line Git evidence, not
          Go symbol history; sibling smoke honestly reports if no tracked Go
          files are available"
        - "Escalate if: real-repo Go smoke is unavailable and fixture evidence
          is insufficient for a claim, or if output changes outside the approved
          flag path"
        - "Done boundary: Go line-history output is available only through the
          approved flag combination and close-out validation passes"
      anchors:
        - src/main.zig
        - src/report.zig
        - src/explain.zig
        - README.md
        - tests/integration.sh
        - fixtures/expected/
      in_scope:
        - Runtime flag wiring for inspected Go symbols.
        - Documentation and golden updates.
        - Close-out validation evidence.
      out_of_scope:
        - Any broader history, ranking, provider registry, cache, package, LSP,
          or runtime expansion.
      protected_surfaces:
        - Existing default reports.
        - Existing Zig symbol and line-history output semantics.
        - Plain Go symbol output without line-history.
      validation_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-sibling-repo> -Dsmoke-label=sibling-local-repo
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - zig build tree-sitter-go-build-proof
        - zig build tree-sitter-go-symbol-proof
        - git diff --check
      review_focus:
        - Output compatibility and no-provider stability.
        - Go current-line evidence caveats and privacy.
        - Real-repo smoke statement is honest and bounded.
      escalation_triggers:
        - Non-flag outputs change unexpectedly.
        - Go line-history requires new fields or raw Git details.
        - Validation cannot prove privacy/no-network/no-toolchain boundaries.
      done_boundary: Feature is ready for delegated review when all validation
        commands pass and durable evidence proves required rows.
