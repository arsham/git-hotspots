  acceptance_contract:
    outcome: Enable current-line Git evidence for inspected Go symbols by reusing
      the existing provider-agnostic blame/range path while preserving the
      current semantics as evidence at HEAD, not symbol history.
    acceptance:
      - "`git-hotspots --inspect path.go --symbols --symbol-line-history`
        attaches current-line Git evidence to supported Go symbols for the
        resolved in-scope inspected file."
      - The evidence uses current matched file line ranges at HEAD and does not
        claim historical symbol lineage, `git log -L` tracing, ownership, risk,
        quality, or developer performance.
      - Plain Go `--symbols` output without `--symbol-line-history` remains
        byte-stable except for explicitly approved wording or fixture isolation
        changes.
      - Existing Zig `--symbols --symbol-line-history` behaviour and no-provider
        outputs remain stable.
      - Go symbol kinds and caveats remain those accepted by Feature 0039;
        grouped const/var names, package symbols, generated/build-tag/cgo
        caveats, and bare method names stay honestly caveated.
      - Dirty inspected Go files degrade without inventing pseudo-commit
        evidence, while dirty unrelated files do not block current-line evidence
        for the inspected path.
      - Shallow and partial repository states add explicit current-line evidence
        caveats and never auto-fetch.
      - Unsupported, empty, invalid, missing-current, unavailable,
        symlink/non-regular, and too-large Go cases degrade safely without raw
        diagnostics, source snippets, authors, emails, messages, diffs, remotes,
        absolute private paths, or sibling raw output.
      - Table, JSON, and Markdown outputs have deterministic Go line-history
        goldens and repeated-output checks.
      - README, help, and explain text accurately describe Zig and Go
        current-line Git evidence as opt-in provider enrichment.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands: []
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
