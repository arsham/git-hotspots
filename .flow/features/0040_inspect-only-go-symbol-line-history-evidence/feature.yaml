schema: flow-feature.v1
feature:
  id: "0040"
  slug: inspect-only-go-symbol-line-history-evidence
  title: Inspect-only Go symbol line-history evidence
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Go inspect-only symbol output works, and the current-line Git evidence model is provider-neutral, but Go symbols still cannot opt into `--symbol-line-history` even though Zig symbols can.
  outcome: Enable current-line Git evidence for inspected Go symbols by reusing the existing provider-agnostic blame/range path while preserving the current semantics as evidence at HEAD, not symbol history.
  acceptance:
    - "`git-hotspots --inspect path.go --symbols --symbol-line-history` attaches current-line Git evidence to supported Go symbols for the resolved in-scope inspected file."
    - "The evidence uses current matched file line ranges at HEAD and does not claim historical symbol lineage, `git log -L` tracing, ownership, risk, quality, or developer performance."
    - "Plain Go `--symbols` output without `--symbol-line-history` remains byte-stable except for explicitly approved wording or fixture isolation changes."
    - "Existing Zig `--symbols --symbol-line-history` behaviour and no-provider outputs remain stable."
    - "Go symbol kinds and caveats remain those accepted by Feature 0039; grouped const/var names, package symbols, generated/build-tag/cgo caveats, and bare method names stay honestly caveated."
    - "Dirty inspected Go files degrade without inventing pseudo-commit evidence, while dirty unrelated files do not block current-line evidence for the inspected path."
    - "Shallow and partial repository states add explicit current-line evidence caveats and never auto-fetch."
    - "Unsupported, empty, invalid, missing-current, unavailable, symlink/non-regular, and too-large Go cases degrade safely without raw diagnostics, source snippets, authors, emails, messages, diffs, remotes, absolute private paths, or sibling raw output."
    - "Table, JSON, and Markdown outputs have deterministic Go line-history goldens and repeated-output checks."
    - "README, help, and explain text accurately describe Zig and Go current-line Git evidence as opt-in provider enrichment."
planning:
  state: ready
  summary: Add Go current-line Git evidence by enabling the existing symbol-line-history path for Go inspect symbols. Keep the feature narrow, current-line-only, and privacy-safe.
  brief_sync:
    status: updated
    reason: Supports B001 provider enrichment while preserving deterministic file-level Git evidence as product truth.
    checked_at: 2026-05-24T17:44:00.000Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Follow-up provider slice for B001. It extends existing opt-in symbol-line-history evidence from Zig to Go without adding true symbol history or broader provider execution.
    checked_at: 2026-05-24T17:44:00.000Z
