schema: flow-feature.v1
feature:
  id: "0117"
  slug: github-ci-pipeline-hardening
  title: GitHub CI pipeline hardening
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: GitHub Actions exists but needs a durable hardening slice to ensure
    hosted CI matches the project validation baseline and proof gates without
    duplicating stale logic or introducing release/package/network side effects.
  outcome: A minimal, maintainable GitHub CI workflow that runs the authoritative
    project validation/proof aggregate for pushes to master and pull requests,
    with minimal permissions and no publishing or release side effects.
  acceptance:
    - CI runs on push to master and pull requests.
    - CI uses full history when project validation requires Git-history evidence.
    - CI installs the pinned supported Zig toolchain.
    - CI runs the authoritative full validation/proof aggregate or an equivalent
      project-owned aggregate with no missing admitted provider lane.
    - CI keeps permissions minimal and introduces no publish, release, tag,
      package, secret, or remote-mutation steps.
    - "Local hook behaviour remains unchanged: pre-commit fast gate and pre-push
      validate-all."
    - No runtime, CLI, schema, provider, scoring, cache, network, telemetry,
      release, or package behaviour changes.
    - Implementation passes git diff --check, zig build test, zig build
      validate, and zig build validate-all when proof orchestration changes.
planning:
