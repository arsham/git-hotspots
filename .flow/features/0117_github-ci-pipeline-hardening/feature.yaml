design:
  rough_shape:
    - Inspect the existing GitHub Actions workflow and project validation
      commands before editing.
    - Prefer calling project-owned aggregate validation over duplicated CI-only
      proof lists when equivalent.
    - Keep workflow permissions read-only and step names evidence-oriented.
    - Update only CI/docs/validation references needed to keep the CI contract
      truthful.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: CI baseline inventory
      goal: Map existing CI workflow, local hook gates, and build validation/proof
        commands before editing.
      owner_phase: runner
      execution_context:
        - "Anchors: .github/workflows/ci.yml, .githooks/pre-commit,
          .githooks/pre-push, build.zig, tools/validate.sh."
        - "In scope: read and compare hosted CI, pre-commit, pre-push, validate,
          validate-all, and provider proof steps."
        - "Out of scope: changing runtime code, provider code, release/package
          automation, or tag behaviour."
        - "Protected: local-first/no-network runtime boundary; minimal GitHub
          permissions; no secrets."
        - "Dependencies: none."
        - "Validation/evidence: record the command/step comparison and any gap
          found in commit message or run handoff."
        - "Review focus: CI changes must be based on actual project command
          surfaces, not guesses."
        - "Escalate if: an admitted provider has no project-owned proof step or
          validation command ownership is ambiguous."
        - "Done boundary: runner knows exactly whether CI should simplify,
          expand, or remain mostly unchanged."
      verification_commands:
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: done
      title: Harden CI workflow
      goal: Apply the minimal workflow changes needed to align CI with the project
        validation baseline and proof aggregate.
      owner_phase: runner
      execution_context:
        - "Anchors: .github/workflows/ci.yml primarily; docs only if existing CI
          references become stale."
        - "In scope: workflow trigger/permission/setup/validation-step edits;
          step naming cleanup; aggregate proof alignment."
        - "Out of scope: publishing, releases, tags, artefact upload, package
          build/publish, runtime product changes."
        - "Protected: no CLI/report/provider/schema/scoring changes; no
          duplicated shell validation bodies in workflow."
        - "Dependencies: P1 inventory must identify the exact desired workflow
          shape."
        - "Validation/evidence: workflow diff plus local validation commands; no
          remote CI run is required unless available without extra side
          effects."
        - "Review focus: minimality, maintainability, and equivalence to
          project-owned validation commands."
        - "Escalate if: CI needs secrets, remote mutation, package publishing,
          or release automation to satisfy the request."
        - "Done boundary: workflow is clear, minimal, and aligned with local
          validation baseline."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
    - id: P3
      depends_on:
        - P2
      status: done
      title: Validation and close-out proof
      goal: Prove the CI hardening change is safe, local-first, and complete enough
        for review.
      owner_phase: runner
      execution_context:
        - "Anchors: .github/workflows/ci.yml, build.zig, tools/validate.sh,
          local hooks."
        - "In scope: run full local validation, confirm no forbidden workflow
          side effects, and leave durable review evidence."
        - "Out of scope: waiting for hosted GitHub CI unless a run is naturally
          available; publishing or tagging."
        - "Protected: repo clean state; no release/package/tag/remote mutation."
        - "Dependencies: P2 implemented."
        - "Validation/evidence: git diff --check, zig build test, zig build
          validate, and zig build validate-all if CI aggregate/proof
          orchestration changed."
        - "Review focus: reviewer should independently inspect workflow and run
          credible local gates."
        - "Escalate if: local validation fails or workflow cannot be verified
          without remote side effects."
        - "Done boundary: atomic runner commit exists and review handoff
          includes commands run and forbidden side-effect check."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
        - zig build validate-all
