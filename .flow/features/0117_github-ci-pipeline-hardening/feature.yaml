      - treat runner evidence as untrusted until independently checked
      - confirm CI uses validate-all or justified equivalent without missing
        admitted provider lanes
      - confirm no publish/release/tag/package/remote mutation steps were added
  decision_budget:
    allowed_local_decisions:
      - safe workflow simplification inside dispatched scope
      - local CI step naming/detail changes that do not alter project contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
      - CI aggregate equivalence judgement that stays inside validation baseline
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - need for secrets, publishing, tag, release, package, or remote mutation
    protected_surfaces:
      - runtime CLI behaviour
      - report schema
      - provider semantics
      - scoring or ranking
      - cache/network/telemetry
      - release creation
      - tag creation or push
      - package publishing
      - remote mutation beyond normal CI checkout/setup
  fallback_path: deferred_reconcile_decision
  notes: null
