    - Find existing version anchors and package metadata owners.
    - Apply the smallest consistent version bump.
    - Run validation for version consistency, docs/man, package anchors, and
      whitespace.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Version metadata bump
      goal: Update all owned version/package metadata surfaces consistently.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, README/docs/man/package metadata/version anchors
          discovered by validation."
        - "In scope: version/package metadata and directly required docs/man
          anchors."
        - "Out of scope: tag creation, package publish, release announcement,
          runtime behaviour."
        - "Protected: CLI/report/scoring/provider semantics."
        - "Dependencies: 0100 closed."
        - "Done boundary: all version anchors agree."
      verification_commands:
        - git diff --check
        - zig build validate
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Consistency review
      goal: Verify no release side effect and all metadata agrees.
      owner_phase: reviewer
      execution_context:
        - "Review focus: version consistency and absence of tag/publish side
          effects."
        - "Escalate if: tag already exists or version choice is ambiguous."
      verification_commands:
        - git tag --list 'v*'
        - git ls-remote --tags origin 'v*'
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
