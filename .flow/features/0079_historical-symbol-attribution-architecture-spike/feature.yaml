        source_ref: prd.md#non-goals[1]
        text: No user-facing historical-symbol CLI or report implementation.
        category: non_goal
        packet_refs:
          - P1
        verification: null
        required_for_close_out: false
      - id: REQ-021
        source_ref: prd.md#non-goals[2]
