design:
  rough_shape:
    - "Use current code seams as evidence: file-level history from git log
      --numstat --find-renames=40%, current-only provider records,
      project-symbol reports over retained ranked files, and current-line blame
      evidence over HEAD ranges."
    - Write a concise architecture document under docs/ that separates
      current-symbol evidence, current-line Git evidence, and future true
      historical hunk-to-symbol attribution.
    - Compare rejected/deferred approaches including HEAD blame, git log -L,
      checking out historical worktrees, and LSP/ctags/reference-provider
      semantics.
    - "Choose a no-checkout local pipeline: candidate files from existing
      file-level history, hunk/diff ingestion for selected revisions, historical
      blobs via Git plumbing, provider parsing from source bytes, hunk-to-symbol
      range intersection, aggregation with confidence caveats."
    - Define provider seam changes needed for historical snapshots without
      requiring every provider to redesign scoring or reports.
    - Define fixture and smoke evidence for later implementation, but keep this
      spike architecture-only unless small read-only probes are needed to
      validate Git plumbing assumptions.
    - Keep public wording local-first and evidence-only; no bug prediction,
      code-quality score, developer ranking, ownership, author metrics, raw
      source snippets, parser diagnostics, private paths, or private report
      dumps.
    - Defer relation/reference analysis, cross-language symbol resolution,
      semantic symbol lineage, persistent cache, and production runtime output
      to later features.
