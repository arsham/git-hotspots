        packet_refs: []
        verification: null
        required_for_close_out: false
      - id: REQ-028
        source_ref: prd.md#edge-cases[1]
        text: "E1: A hunk touches lines that do not intersect any parsed symbol. The
          design must route that evidence to file-level fallback, module/file
          pseudo-symbol, or an unattributed bucket with lower confidence instead
          of inventing a symbol."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-029
        source_ref: prd.md#edge-cases[2]
        text: "E2: A hunk deletes a symbol that no longer exists in the post-image. The
          design must parse the pre-image or mark the symbol as
          historical-only/deleted with lower confidence."
        category: edge_case
        packet_refs:
          - P1
        verification: null
        required_for_close_out: true
      - id: REQ-030
        source_ref: prd.md#edge-cases[3]
        text: "E3: A hunk adds a new symbol that did not exist in the pre-image. The
          design must parse the post-image and attribute added lines to the new
          symbol when ranges are valid."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-031
        source_ref: prd.md#edge-cases[4]
        text: "E4: A commit renames a file and edits a symbol in the same change. The
          design must state how existing file rename edges are used, and where
          symbol confidence is lowered because symbol identity is not
          semantically proven."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-032
        source_ref: prd.md#edge-cases[5]
        text: "E5: A symbol is renamed without moving much code. The design must not
          treat the rename as proven lineage unless the future implementation
          has explicit evidence; it should define a lower-confidence matching or
          separate historical/current symbols."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-033
        source_ref: prd.md#edge-cases[6]
        text: "E6: A symbol moves within a file or across files. The design must state
          whether range overlap, name/kind/nesting, or file lineage can suggest
          continuity and which cases remain separate symbols."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-034
        source_ref: prd.md#edge-cases[7]
        text: "E7: A provider cannot parse a historical blob because the historical
          syntax is invalid or unsupported. The design must preserve file
          evidence, mark provider failure, and lower symbol confidence."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-035
        source_ref: prd.md#edge-cases[8]
        text: "E8: A changed file is binary, generated, too large, missing from the blob
          store, or filtered by scope. The design must define skip/fallback
          behaviour and caveats."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-036
        source_ref: prd.md#edge-cases[9]
        text: "E9: Merge commits or large commits touch many files. The design must
          specify whether merge diffs are included, simplified, or skipped and
          how large-commit caveats propagate."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-037
        source_ref: prd.md#edge-cases[10]
        text: "E10: A repository is shallow or partial. The design must preserve
          local-first behaviour, not auto-fetch, and report incomplete
          evidence."
        category: edge_case
        packet_refs: []
        verification: null
        required_for_close_out: true
