    supporting_context:
      - source_ref: prd.md#problem[1]
        text: "git-hotspots now has two symbol layers: inspect/project current-symbol
          reports over HEAD files, and optional current-line Git evidence via
          git blame --incremental over current symbol ranges. That is useful,
          but it is still not true historical symbol attribution. It can say
          which current symbols sit inside hot current files; it cannot say
          which historical functions, methods, types, or modules were touched by
          specific commits or hunks across local Git history."
      - source_ref: prd.md#problem[2]
        text: B002 asks for symbol-granular hotspot evidence that is provider-neutral,
          performant, deterministic, and honest. The next step should not jump
          straight into a production attribution engine. The architecture needs
          a bounded design spike that proves how to use local Git history and
          provider output together without checking out every commit,
          overclaiming rename or move lineage, or turning provider output into
          semantic truth.
      - source_ref: prd.md#outcome[1]
        text: "Produce a durable architecture decision and proof plan for true
          historical symbol attribution. The feature should leave the repository
          with one concise architecture document that future implementation
          features can execute against:
          docs/historical-symbol-attribution-architecture.md."
      - source_ref: prd.md#outcome[2]
        text: The architecture should choose and justify a first implementation path for
          historical symbol evidence. It should define the data model, Git
          traversal strategy, provider seam changes, attribution semantics,
          confidence model, performance bounds, validation fixtures, and
          non-goals needed before a runtime engine is implemented.
      - source_ref: prd.md#outcome[3]
        text: "The expected direction is a no-checkout, local-only pipeline:"
      - source_ref: prd.md#outcome[4]
        text: start from existing file-level history and scope filters;
      - source_ref: prd.md#outcome[5]
        text: collect changed file revisions and hunks for candidate files;
      - source_ref: prd.md#outcome[6]
        text: read historical blobs through Git plumbing such as git cat-file --batch or
          equivalent local commands;
      - source_ref: prd.md#outcome[7]
        text: parse only relevant historical file snapshots with the registered symbol
          provider;
      - source_ref: prd.md#outcome[8]
        text: intersect changed hunk ranges with revision-local symbol ranges; and
      - source_ref: prd.md#outcome[9]
        text: aggregate deterministic symbol evidence with explicit confidence caveats.
      - source_ref: prd.md#outcome[10]
        text: The spike may include small read-only prototype probes or fixture
          experiments to validate assumptions, but it must not add a user-facing
          historical-symbol CLI, change file scoring, or introduce a production
          cache/index.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 12 refs outside default requirement rows.
  acceptance_contract:
    outcome: Produce a public-safe architecture document for historical
      hunk-to-symbol attribution that selects a deterministic no-checkout,
      local-only first implementation path, defines the required Git traversal,
      provider seam, symbol identity, attribution/confidence semantics,
      performance bounds, validation fixtures, and next runtime slice, and
      leaves existing CLI/runtime behaviour unchanged.
    acceptance:
      - "`docs/historical-symbol-attribution-architecture.md` exists and is the
        primary architecture-spike deliverable."
      - The architecture document clearly distinguishes current-symbol evidence,
        HEAD current-line Git evidence, and future true historical
        hunk-to-symbol attribution.
      - The document compares HEAD blame, git log -L, historical checkout,
        historical blob parsing plus hunk intersection, and
        semantic/reference-provider approaches, with explicit
        accept/reject/defer rationale.
      - The selected first implementation path is deterministic, local-only,
        no-checkout by default, provider-neutral, performance-bounded, and
        cache-optional rather than cache-dependent.
      - The Git traversal contract covers revision/range selection,
        scope/include/exclude filters, rename edges, hunk representation, blob
        access, commit ordering, shallow/partial history, binary/large/generated
        files, and merge/large-commit caveats.
      - The provider seam design explains how current providers can parse
        historical source bytes identified by commit/blob/path while preserving
        provider evidence fields, failure states, confidence, and caveats.
      - The symbol identity/confidence model covers duplicate names, nested
        symbols, deleted symbols, file renames, symbol renames, symbol moves,
        splits/merges, parse failures, and historical-only/current-symbol
        relationships as confidence-lowering cases.
      - The hunk attribution semantics cover added, deleted, modified,
        whole-file add/delete, binary, and unattributed changes without
        fabricating symbol precision.
      - The future aggregate/report shape names symbol-level evidence fields,
        parent file links, sample commits, current/historical status,
        confidence/caveats, and deterministic sorting without introducing bug
        prediction, code-quality scoring, ownership, or developer ranking.
      - The validation plan names fixture cases and real-repository smoke
        expectations with privacy-safe evidence and no raw private report
        output.
      - "Existing runtime behaviour remains unchanged: no
        CLI/report/schema/scoring/provider execution changes beyond adding
        documentation and Flow artefacts."
      - Flow ready/dispatch checks pass for an architecture-only spike with
        packetized documentation/proof work and no implementation handoff unless
        explicitly approved.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
