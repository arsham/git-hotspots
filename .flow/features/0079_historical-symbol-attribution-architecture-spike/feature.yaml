          source bytes from a (commit, blob, path) identity instead of only
          reading a working-tree path, while preserving provider name, version,
          freshness, failure, confidence, configuration fingerprint, and
          caveats."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-011
        source_ref: prd.md#requirements[11]
        text: "R6: Define revision-local symbol identity separately from report-level
          symbol identity. At minimum, cover provider, commit or blob identity,
          path, kind, name, range, nesting/context when available, and
          confidence. The design must describe how duplicate names, nested
          symbols, deleted symbols, renamed files, renamed symbols, moved
          symbols, split symbols, and merged symbols lower confidence."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-012
        source_ref: prd.md#requirements[12]
        text: "R7: Define hunk-to-symbol attribution semantics. The design must state
          how added lines, deleted lines, modified lines, binary changes,
          whole-file additions or deletions, and parse failures map to symbols
          or file-level fallback. It must not fabricate symbol precision when a
          hunk cannot be attributed."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-013
        source_ref: prd.md#requirements[13]
        text: "R8: Define symbol hotspot aggregate fields for a future report. Include
          change frequency, churn-like line pressure where available, recency,
          sample commit ids, provider state, evidence caveats, confidence,
          parent file links, historical-only or current-symbol status, and
          deterministic sort inputs. The design may reuse file scoring concepts,
          but must not claim a finished scoring replacement."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-014
        source_ref: prd.md#requirements[14]
        text: "R9: Define performance bounds and stop conditions. The architecture must
          cover candidate file limits, commit/hunk limits, file-size limits,
          provider failure limits, memory ownership, streaming or batching
          strategy, progress reporting, and an explicit no-cache path. Any cache
          discussion must be future optimisation only."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-015
        source_ref: prd.md#requirements[15]
        text: "R10: Define privacy and public-claim boundaries. Architecture and
          examples must not include absolute local paths, remotes, author
          identities, commit messages, source snippets from private
          repositories, parser diagnostics, raw private reports,
          ownership/productivity metrics, bug prediction, code-quality scoring,
          or developer ranking claims."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-016
        source_ref: prd.md#requirements[16]
        text: "R11: Define validation fixtures for future implementation. The fixture
          plan must cover at least simple function edits, nested symbols,
          duplicate names, file rename, symbol rename, symbol move, deleted
          file, whole-file add/delete, binary change, unsupported language,
          provider parse failure, large file skip, shallow or partial history
          caveat, and deterministic output ordering."
        category: requirement
        packet_refs:
          - P2
        verification: null
        required_for_close_out: true
      - id: REQ-017
        source_ref: prd.md#requirements[17]
        text: "R12: Define real-repository smoke expectations for future implementation.
          The plan must use this repository and one suitable sibling or local
          repository when available, with privacy-safe labels and bounded counts
          only."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-018
        source_ref: prd.md#requirements[18]
        text: "R13: Identify the first runtime implementation slice after the spike. The
          follow-up slice must be small enough to dispatch independently, and
          the spike must state what remains deferred: relation/reference
          analysis, cross-language resolution, semantic ownership, full symbol
          lineage, persistent cache, and broad provider plugin infrastructure."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
      - id: REQ-019
        source_ref: prd.md#requirements[19]
        text: "R14: Keep existing runtime behaviour unchanged. This spike must not alter
          CLI semantics, report schemas, provider extraction behaviour, file
          ranking, current symbol output, current-line history, validation
          fixtures, or public docs except for adding the architecture document
          and any required Flow artefacts."
        category: requirement
        packet_refs: []
        verification: null
        required_for_close_out: true
