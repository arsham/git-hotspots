  acceptance_contract:
    outcome: Add deterministic Zig relationship fixture/golden coverage for
      realistic mixed-kind and uncertainty evidence, with provider-cap coverage
      if stable, without runtime or public contract changes.
    acceptance:
      - A realistic Zig relationship golden or fixture update is committed.
      - The coverage represents at least one realistic gap from
        docs/relationship-output-sample-realism-audit.md.
      - Provider-cap omission is covered if deterministic; otherwise a stable
        explicit reason is recorded.
      - JSON schema and public CLI behaviour remain unchanged.
      - Runtime provider algorithms, relationship semantics, scoring, ranking,
        confidence, caps, cache, network, telemetry, release, tag, remote,
        package, and publish behaviour remain unchanged.
      - Validation passes with git diff --check, zig build test, and zig build
        validate.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify Zig golden representativeness against the 0110 audit basis
      - verify no runtime or public contract drift
  decision_budget:
    allowed_local_decisions:
      - safe fixture or golden restructuring inside dispatched scope
      - local validation assertion changes that do not alter runtime contracts
    deferred_reconcile_triggers:
      - provider-cap omission cannot be stabilised in public fixture but
        explicit reason is recorded
      - minor fixture strategy trade-off stays inside acceptance
    hard_planner_escalation_triggers:
      - runtime or provider algorithm change appears necessary
      - JSON schema or CLI change appears necessary
      - provider-cap coverage would require brittle or private-repo dependent
        counts
      - protected-surface mutation outside dispatch envelope
    protected_surfaces:
      - runtime behaviour
      - CLI flags and options
      - JSON schema and report fields
      - relationship provider algorithms and admission
      - relationship semantics sorting and caps
      - scoring ranking and confidence
      - cache network telemetry release tag remote package and publish behaviour
      - private repository paths remotes identities diagnostics and raw reports
  fallback_path: deferred_reconcile_decision
  notes: null
