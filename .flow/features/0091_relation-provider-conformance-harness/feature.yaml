intent:
  problem: Relation provider additions currently rely on repeated fixture patterns
    and public report checks; adding Go, Lua, or Zig without a shared
    conformance harness would increase drift risk across caveats, caps,
    failures, privacy, and deterministic ordering.
  outcome: A reusable internal conformance harness proves provider-neutral
    relationship evidence behaviour across existing lanes and becomes the
    admission bar for future providers without changing public support claims.
  acceptance:
    - Shared relation provider conformance checks cover supported relation
      kinds, unresolved and unknown evidence, unsupported languages, provider
      failure, cap behaviour, duplicate merging, caveats, privacy, and
      deterministic ordering.
    - Existing public relationship lanes are exercised through the harness where
      practical without changing public report semantics.
    - zig build test and zig build validate include or preserve the conformance
      checks.
    - Public CLI/report/docs/help/man/scoring behaviour does not drift in this
      feature.
