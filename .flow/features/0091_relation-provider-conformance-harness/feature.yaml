      - protected-surface mutation outside dispatch envelope
      - public support claim changes
    protected_surfaces:
      - public CLI flags
      - public report schema
      - README/user guide/man capability claims
      - file ranking and scoring
      - network telemetry or cache defaults
  fallback_path: deferred_reconcile_decision
  notes: Serial batch head. Build internal conformance harness only; no new
    language support claims.
