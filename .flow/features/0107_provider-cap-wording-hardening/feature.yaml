schema: flow-feature.v1
feature:
  id: "0107"
  slug: provider-cap-wording-hardening
  title: Provider cap wording hardening
  lane: standard
  status: shaping
  autonomy_default: ask
intent:
  problem: Relationship human outputs now include compact caveats and uncertainty
    summaries, but display-limit omissions and provider-cap omissions can still
    look too similar in table and Markdown wording.
  outcome: Table and Markdown relationship reports make display-limit omissions
    and provider-cap omissions visibly distinct while preserving JSON
    compatibility, provider cap algorithms, display-limit behaviour,
    relationship semantics, and all scoring/ranking/provider-admission surfaces.
  acceptance:
    - Table relationship output distinguishes display-limit omissions from
      provider-cap omissions.
    - Markdown relationship output distinguishes display-limit omissions from
      provider-cap omissions.
    - Display-limit wording reads as human presentation sampling, not missing
      provider evidence.
    - Provider-cap wording reads as partial provider evidence, not merely hidden
      rows.
    - JSON schema, JSON fields, and per-record relationship evidence remain
      compatible.
    - No CLI flags, scoring/ranking/confidence, provider admission, relationship
      semantics, cap algorithms, cache/network/telemetry,
      release/tag/remote/package behaviour change.
planning:
  state: shaped
  summary: B002 follow-up from the 0104 audit after 0105 caveat compaction and
    0106 uncertainty summaries. This slice hardens human wording only for the
    display-limit versus provider-cap distinction.
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Feature 0107 is a B002 follow-up slice from the 0104 audit after 0105
      caveat compaction and 0106 uncertainty summaries. It hardens human
      omission wording only, preserving JSON, provider algorithms, cap
      behaviour, scoring/ranking, provider admission, relation semantics, and
      release/remote/package surfaces.
    checked_at: 2026-05-31T19:23:28.499Z
