design:
  rough_shape:
    - Find the current table and Markdown wording seam for relationship
      display-limit and provider-cap omissions.
    - Adjust human wording so display/sample omissions and provider partialness
      are visibly distinct without changing JSON or algorithms.
    - Update golden fixtures, docs/man wording, and validation assertions for
      the distinction.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Locate omission wording seams
      goal: Identify table and Markdown rendering seams and fixture cases for
        display-limit and provider-cap omission wording without behaviour
        changes.
      owner_phase: runner
      execution_context:
        - "Anchors: src/report_table.zig, src/report_markdown.zig,
          src/report_relation_summary.zig,
          fixtures/expected/symbol-relationships*.{txt,md}."
        - "In scope: map existing display-limit and provider-cap wording/data
          flow; choose minimal helper or wording refactor inside human
          renderers."
        - "Out of scope: JSON renderer/model/schema, provider algorithms, cap
          limits, ordering, CLI options, scoring/ranking/provider admission."
        - "Protected: existing JSON fixtures and relationship record semantics
          must remain compatible."
        - "Dependencies: none."
        - "Validation/evidence: record file seams and fixture cases in durable
          evidence; no behavioural commit required before P2."
        - "Review focus: prove implementation target is human-output wording
          only."
        - "Escalate if: distinguishing wording requires data not already
          available to human renderers or would require JSON/model/schema
          changes."
        - "Done boundary: renderer seam and fixture coverage plan are clear
          enough for P2."
      verification_commands:
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Implement human omission wording distinction
      goal: Change table and Markdown wording so display-limit omissions and
        provider-cap omissions are visibly distinct while preserving data and
        semantics.
      owner_phase: runner
      execution_context:
        - "Anchors: src/report_table.zig, src/report_markdown.zig,
          src/report_relation_summary.zig."
        - "In scope: human wording/helper changes for display/sample omission
          versus provider partialness; small internal refactor if needed."
        - "Out of scope: changing counts, caps, record inclusion, JSON output,
          CLI flags, provider behaviour, scoring/ranking/confidence, relation
          kinds."
        - "Protected: table/Markdown remain deterministic and evidence-only;
          JSON remains compatible."
        - "Dependencies: P1 seam selection."
        - "Validation/evidence: targeted fixture regeneration or assertions for
          table/Markdown distinction; JSON compatibility check."
        - "Review focus: wording is distinct, accurate, concise, and not
          overclaiming."
        - "Escalate if: implementation requires changing provider cap algorithm
          or public JSON fields."
        - "Done boundary: code compiles and human outputs distinguish both
          omission types."
      verification_commands:
        - zig build test
        - tests/integration.sh ./zig-out/bin/git-hotspots
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Fixtures docs and validation
      goal: Update fixtures, docs/man wording, and validation checks so the
        distinction is durable and public claims stay bounded.
      owner_phase: runner
      execution_context:
        - "Anchors: fixtures/expected/symbol-relationships*.{txt,md},
          tests/integration.sh, tools/validate.sh, README.md,
          docs/user-guide.md, man/git-hotspots.1."
        - "In scope: golden fixture updates, integration/validation assertions,
          public docs/man wording for display-limit versus provider-cap
          distinction."
        - "Out of scope: CHANGELOG/release notes unless a release boundary is
          later approved; package metadata; remote/tag/release side effects."
        - "Protected: docs must preserve local-first deterministic evidence
          framing and avoid
          call-graph/dependency/ownership/quality/developer/performance/bug-pre\
          diction claims."
        - "Dependencies: P2 output wording."
        - "Validation/evidence: git diff --check, zig build test, zig build
          validate; reviewer must independently discover and run credible
          lint/test gates."
        - "Review focus: public docs and fixtures match behaviour without
          broadening claims."
        - "Escalate if: docs require a product-positioning change or release
          note decision."
        - "Done boundary: validation passes and no protected surface drift is
          observed."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
  output_contract:
    surfaces:
      - relationship table output
      - relationship Markdown output
      - README.md
      - docs/user-guide.md
      - man/git-hotspots.1
      - fixtures and validation assertions
    protected_surfaces:
      - JSON schema and JSON relationship fields
      - per-record relationship evidence and caveats
      - CLI flags and option validation
      - file/symbol scoring ranking and confidence
      - provider admission matrix
      - relationship semantics and provider cap algorithms
