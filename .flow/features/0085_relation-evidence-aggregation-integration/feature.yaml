      - Performance and cap behaviour are proven by fixtures and privacy-safe
        real-repository smoke evidence.
      - Existing public scoring, ranking, reports, docs, and CLI behaviour
        remain stable.
      - B002 is linked and validates; independent delegated review is required
        for close-out.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - git diff --check
      - zig build validate
      - flow validate --target feature:0085
      - flow validate --target brief:B002
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - confirm aggregation remains internal bounded deterministic and caveated
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - public output change
      - unbounded repository graph discovery
    protected_surfaces:
      - requires 0084 closed before execute
      - no public CLI flags or help changes
      - no table JSON Markdown report schema changes
      - no explain output changes
      - no scoring ranking or cache truth changes
      - no network telemetry remote enrichment runtime LLM or hosted service
  fallback_path: deferred_reconcile_decision
  notes: null
