intent:
  problem: Feature 0084 can prove relation candidates in isolation, but
    git-hotspots still needs an internal aggregation path that attaches those
    candidates to retained hotspot evidence with deterministic limits and
    caveats before any public report contract is safe.
  outcome: Wire relation candidates into the bounded internal analysis pipeline
    for retained ranked file and current-symbol candidates, preserving public
    output while proving aggregation, limits, performance, caveats, and
    real-repository smoke.
  acceptance:
    - Internal relation aggregation is wired into analysis for bounded retained
      file/current-symbol candidates.
    - Aggregation owns deduplication, caveat merging, omitted counts,
      deterministic sorting, and provider failure retention.
    - Relation evidence remains internal/test-only and absent from public table,
      JSON, Markdown, explain, help, and docs surfaces.
    - Performance and cap behaviour are proven by fixtures and privacy-safe
      real-repository smoke evidence.
    - Existing public scoring, ranking, reports, docs, and CLI behaviour remain
      stable.
    - B002 is linked and validates; independent delegated review is required for
      close-out.
