    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Feature 0041 recorded tree-sitter-python as a plausible future grammar but
          left it in conditionalpython state. The remaining blockers include
          exact immutable source identity, license and notice verification,
          generated parser and scanner provenance, BOM selection, source-size
          evidence, core compatibility, offline validation, and no-provider
          output stability. Python runtime support should not proceed until the
          source import itself is reviewable and local-first.
      - source_ref: prd.md#outcome[1]
        text: A pinned tree-sitter-python source set is vendored under
          third_party/tree-sitter-python/<revision>/ with provenance,
          imported-file manifest, license/notice handling, and source-import
          evidence. The repository still has no Python runtime support after
          this feature; it only has reviewed local source inputs for a later
          Python build/extraction proof.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: A narrow pinned tree-sitter-python source import is committed with
      provenance, notices, source-size evidence, and no-provider stability
      proof, while Python build/runtime/provider behaviour remains deferred.
    acceptance:
      - Import a narrow pinned tree-sitter-python source set under
        third_party/tree-sitter-python/<revision>/.
      - Record exact upstream source identity, selected immutable revision,
        archive or checkout basis, checksum or per-file manifest evidence, and
        vendored path.
      - Preserve upstream license/notice text and update THIRD_PARTY_NOTICES.md
        with public repo-relative attribution.
      - Add PROVENANCE.md, IMPORTED_FILES.tsv, and a source-import evidence
        document covering generated parser/scanner provenance, BOM/exclusions,
        Tree-sitter core compatibility, source-size measurements, offline
        validation, and no-provider output stability.
      - Stop as blocked rather than closing if immutable revision,
        license/notice, generated parser/scanner provenance, core compatibility,
        BOM narrowness, or no-provider stability cannot be proven.
      - Do not add Python build/link proof, runtime provider behaviour, provider
        registry entries, CLI flags, report schema fields, scoring changes,
        cache changes, test fixtures, CI changes, release or package work.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - changed-path scan for source-import-only scope
      - provenance/license/BOM scan
      - generated parser/scanner provenance check
      - zig build validate
      - zig build tree-sitter-build-proof
      - zig build tree-sitter-symbol-proof
      - zig build validate -Dcloseout=true -Dsmoke-repo <local-sibling-path>
        -Dsmoke-label sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
