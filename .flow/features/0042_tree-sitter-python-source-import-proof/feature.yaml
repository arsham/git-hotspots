schema: flow-feature.v1
feature:
  id: "0042"
  slug: tree-sitter-python-source-import-proof
  title: Tree-sitter Python source import proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Feature 0041 admitted tree-sitter-python only conditionally; the
    repository still lacks pinned Python grammar source, license/notice proof,
    generated parser/scanner provenance, BOM, size, compatibility, and
    no-provider stability evidence.
  outcome: A narrow pinned tree-sitter-python source import is committed with
    provenance, notices, source-size evidence, and no-provider stability proof,
    while Python build/runtime/provider behaviour remains deferred.
  acceptance:
    - Import a narrow pinned tree-sitter-python source set under
      third_party/tree-sitter-python/<revision>/.
    - Record exact upstream source identity, selected immutable revision,
      archive or checkout basis, checksum or per-file manifest evidence, and
      vendored path.
    - Preserve upstream license/notice text and update THIRD_PARTY_NOTICES.md
      with public repo-relative attribution.
    - Add PROVENANCE.md, IMPORTED_FILES.tsv, and a source-import evidence
      document covering generated parser/scanner provenance, BOM/exclusions,
      Tree-sitter core compatibility, source-size measurements, offline
      validation, and no-provider output stability.
    - Stop as blocked rather than closing if immutable revision, license/notice,
      generated parser/scanner provenance, core compatibility, BOM narrowness,
      or no-provider stability cannot be proven.
    - Do not add Python build/link proof, runtime provider behaviour, provider
      registry entries, CLI flags, report schema fields, scoring changes, cache
      changes, test fixtures, CI changes, release or package work.
planning:
  state: ready
  summary: Shape a narrow tree-sitter-python source import and provenance proof,
    following the Go source-import precedent while explicitly deferring Python
    build/runtime/provider work.
