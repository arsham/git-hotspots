        text: Normal CLI behaviour remains unchanged. No user-visible symbol output
          exists in this feature.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 4 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add an internal, test-only Tree-sitter Zig current-symbol extraction
      proof that maps in-memory Zig source to provider.CurrentSymbolEvidence for
      a repo-relative path, with deterministic ranges, ordering, and failure or
      unsupported behaviour, while preserving all existing CLI output unchanged.
    acceptance:
      - Internal extractor/proof exists for Zig current-symbol extraction from
        in-memory source and a repo-relative path.
      - Extractor uses only vendored local Tree-sitter core and tree-sitter-zig
        sources.
      - At least named Zig function declarations are extracted into
        provider.CurrentSymbolEvidence or a directly compatible internal result
        shape.
      - Supported symbol subset and range convention are documented in code or
        docs.
      - Deterministic ordering and deterministic current ranges are covered by
        tests.
      - Empty, invalid or partial Zig, and unsupported non-Zig input are handled
        without crashes, snippets, raw parser diagnostics, absolute paths, or
        private details.
      - "No user-facing symbols surface is added: no --symbols, no report schema
        change, no inspect semantic change, no scoring or ranking change."
      - Normal no-provider table, JSON, Markdown, and inspect outputs remain
        byte-stable.
      - Required validation passes, including zig build validate, zig build
        tree-sitter-build-proof, and any new symbol proof step.
      - Close-out smoke uses this repo and sibling-local-repo with privacy-safe
        label-only evidence.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - zig build validate
      - zig build tree-sitter-build-proof
      - new symbol proof step if added
      - git diff --check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
