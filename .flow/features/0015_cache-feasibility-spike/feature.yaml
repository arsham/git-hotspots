design:
  rough_shape:
    - Create a docs-oriented feature, likely docs/cache-feasibility.md or
      docs/performance-cache-decision.md, as the primary artefact.
    - Use current CLI commands and existing progress output to collect bounded
      performance observations; do not add instrumentation unless explicitly
      shaped later.
    - Keep sibling/local repo evidence label-only, such as sibling-local-repo,
      and do not commit raw reports or absolute paths.
    - Capture cache as a later implementation candidate only if evidence
      justifies it; otherwise prefer streaming ingestion or continued no-cache
      guidance.
    - Preserve deterministic stdout/report schemas and local-first runtime
      behaviour.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Performance and cache decision evidence
      goal: Produce a privacy-safe performance/profile and cache decision note without
        implementing runtime cache behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: docs/performance-cache-decision.md or similarly named docs
          artefact; README only if a tiny link is justified;
          .flow/project-memory.md only if a durable cross-feature decision
          changes."
        - "In scope: profile current large-repo behaviour using existing CLI;
          document cache goals/non-goals, privacy policy, invalidation inputs,
          candidate UX, alternatives, recommendation, and next-feature
          boundary."
        - "Out of scope: runtime cache, persistent cache files, database
          dependencies, cache commands/flags, output schema changes, scoring
          changes, Git traversal rewrite, providers, CI, release packaging,
          network, telemetry, or commercial/SaaS content."
        - "Protected: deterministic local Git truth remains canonical; cache is
          optimisation only; no source blobs, diffs, commit messages, author
          identities, absolute paths, private repo names, raw sibling reports,
          remotes, or telemetry in committed artefacts."
        - "Dependencies: current CLI and validation workflow through Feature
          0014; approved sibling/local repo may be used only with label
          sibling-local-repo."
        - "Validation/evidence: run zig build validate; git diff --check; run
          privacy/prohibited-content scans over new docs; collect bounded
          timing/count evidence for this repo and sibling-local-repo without raw
          private output."
        - "Review focus: verify no runtime implementation slipped in; verify
          cache decision is explicit, evidence-backed, privacy-safe, and does
          not overclaim performance or product correctness."
        - "Escalate if: cache implementation seems necessary, benchmark requires
          private raw output, invalidation cannot be specified, or any
          default/product-truth cache semantics are proposed."
        - "Done boundary: durable docs record current evidence, candidate
          decisions, recommendation/defer decision, validation commands, and
          next implementation boundary clearly enough for a future planner."
      verification_commands:
        - zig build validate
        - git diff --check
        - privacy/prohibited-content scan over new docs
