    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Large-repo runs can be slow enough that cache is tempting, but current
          evidence is not enough to prove cache is the smallest safe
          optimisation. A runtime cache would add invalidation, privacy, schema,
          determinism, storage, and operator UX risk before we know whether the
          bottleneck is Git execution, full-buffer log capture, parsing,
          aggregation, co-change expansion, sorting, file stats, or rendering.
      - source_ref: prd.md#problem[2]
        text: This feature records the decision evidence first. It does not implement
          cache.
      - source_ref: prd.md#outcome[1]
        text: Produce a durable performance profile and cache decision record that a
          future planner can use to decide whether to implement cache, streaming
          Git ingestion, or another optimisation. The record must keep cache as
          a local-only performance optimisation, never product truth.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Produce a durable performance profile and cache decision record. The
      feature should document current bottleneck evidence, cache goals and
      non-goals, candidate storage/key/invalidation/privacy approaches,
      alternatives such as streaming Git ingestion and bounded history recipes,
      and a clear recommendation for the next optimisation feature.
    acceptance:
      - No runtime cache, persistent cache files, cache schema, SQLite
        dependency, cache command, or cache flag is implemented in this feature.
      - A durable design note records cache purpose as performance optimisation
        only; fresh local Git analysis remains canonical product truth.
      - The design note records allowed and forbidden cached data, explicitly
        forbidding source blobs, diffs, commit messages, author identities,
        absolute local paths, private repo names, remotes, raw sibling reports,
        and telemetry data.
      - The design note records candidate cache keys and invalidation inputs,
        including HEAD or analysed range, --since, scope/include/exclude
        filters, inspect target when relevant, scoring version, output-relevant
        config, tool version, cache schema version, and future provider-version
        placeholders.
      - The design note compares at least no-cache, metadata/result cache, and
        streaming Git ingestion directions, and states which direction is
        recommended, deferred, or blocked.
      - The design note records candidate local cache location and operator
        controls, including disable and clear/status UX, without committing
        implementation.
      - A privacy-safe performance profile is collected from this repo and one
        approved sibling/local repo using labels only, bounded timings/counts
        only, and no raw private output.
      - The profile distinguishes what can be measured now from what remains
        unknown, such as Git subprocess time versus
        parse/aggregate/co-change/render time if not separately instrumented.
      - README/public docs are not cluttered unless a small non-speculative note
        is necessary; no commercial, hosted, SaaS, pricing, sales,
        bug-prediction, quality-score, or developer-ranking claims are added.
      - The close-out evidence includes zig build validate, git diff --check,
        and privacy/prohibited-content scans over new design/profile docs.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build validate
      - git diff --check
      - privacy/prohibited-content scan over new docs
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
