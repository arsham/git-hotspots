feature:
  id: "0015"
  slug: cache-feasibility-spike
  title: Cache feasibility spike
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Large-repo runs can be slow enough that cache is tempting, but current
    evidence does not identify the bottleneck. Implementing cache now would add
    invalidation, privacy, schema, determinism, and UX risk before proving cache
    is the smallest useful optimisation.
  outcome: Produce a durable performance profile and cache decision record. The
    feature should document current bottleneck evidence, cache goals and
    non-goals, candidate storage/key/invalidation/privacy approaches,
    alternatives such as streaming Git ingestion and bounded history recipes,
    and a clear recommendation for the next optimisation feature.
  acceptance:
    - No runtime cache, persistent cache files, cache schema, SQLite dependency,
      cache command, or cache flag is implemented in this feature.
    - A durable design note records cache purpose as performance optimisation
      only; fresh local Git analysis remains canonical product truth.
    - The design note records allowed and forbidden cached data, explicitly
      forbidding source blobs, diffs, commit messages, author identities,
      absolute local paths, private repo names, remotes, raw sibling reports,
      and telemetry data.
    - The design note records candidate cache keys and invalidation inputs,
      including HEAD or analysed range, --since, scope/include/exclude filters,
      inspect target when relevant, scoring version, output-relevant config,
      tool version, cache schema version, and future provider-version
      placeholders.
    - The design note compares at least no-cache, metadata/result cache, and
      streaming Git ingestion directions, and states which direction is
      recommended, deferred, or blocked.
    - The design note records candidate local cache location and operator
      controls, including disable and clear/status UX, without committing
      implementation.
    - A privacy-safe performance profile is collected from this repo and one
      approved sibling/local repo using labels only, bounded timings/counts
      only, and no raw private output.
    - The profile distinguishes what can be measured now from what remains
      unknown, such as Git subprocess time versus
      parse/aggregate/co-change/render time if not separately instrumented.
    - README/public docs are not cluttered unless a small non-speculative note
      is necessary; no commercial, hosted, SaaS, pricing, sales, bug-prediction,
      quality-score, or developer-ranking claims are added.
    - The close-out evidence includes zig build validate, git diff --check, and
      privacy/prohibited-content scans over new design/profile docs.
