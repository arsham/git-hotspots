  acceptance_contract:
    outcome: Add an explicit --scope all|project analysis flag. The default remains
      all and preserves current unfiltered behaviour. The project preset is
      opt-in and currently expands only to the built-in literal exclude prefix
      .flow/. Reports disclose the selected scope, effective prefixes, and
      bounded omitted counts across table, JSON, and Markdown, including inspect
      output.
    acceptance:
      - Unflagged git-hotspots output remains equivalent to --scope all and
        keeps all tracked Git-history paths in the evidence universe unless
        explicit include/exclude filters are provided.
      - --scope all is accepted as an explicit default scope and does not add
        built-in include or exclude prefixes.
      - --scope project is accepted as an opt-in project-oriented preset and
        currently expands only to the built-in literal exclude prefix .flow/.
      - --scope accepts only lowercase all and project; missing, unknown,
        repeated, or case-mismatched values fail with clear stderr and non-zero
        exit status.
      - "Preset exclusions combine with repeatable --include-prefix and
        --exclude-prefix flags: includes narrow the candidate universe, preset
        excludes and explicit excludes remove paths, and excludes win over
        includes regardless of flag order."
      - Effective scope metadata is disclosed in JSON, table, and Markdown,
        including selected scope, effective include prefixes, effective exclude
        prefixes, filters_active, outside-include counts, and excluded
        path/change counts.
      - No raw omitted path list is emitted; reports show bounded counts and
        effective prefixes only.
      - The project preset filters before aggregation, scoring, co-change
        evidence, ranking, limiting, and inspect selection.
      - Project-scoped results do not leak .flow/ paths into result paths,
        co-change paths, Markdown hotspot/evidence/co-change lines, table rows,
        or inspect matches.
      - --scope project output is equivalent to --exclude-prefix .flow/ for
        result rows, co-change evidence, scores, confidence, caveats, and
        bounded evidence commits.
      - --scope all --inspect can inspect a .flow/ path with evidence, while
        --scope project --inspect for the same path fails generically as outside
        the selected scope.
      - Existing explicit include/exclude prefix semantics remain literal
        repo-relative prefixes, not globs, pathspecs, gitignore rules, regexes,
        generated-file detection, or project configuration.
      - Existing normal table, JSON, Markdown, --inspect, --explain, --version,
        and prefix-filter behaviours remain stable except intentional
        help/docs/golden changes for scope metadata and preset support.
      - README and --explain describe scope presets as deterministic convenience
        filters that change the evidence universe; they do not imply hidden
        quality intelligence, generated-code detection, or global top results
        under scoped runs.
      - zig build validate covers scope preset parsing, fixture goldens,
        determinism, JSON validity, Markdown semantic/privacy assertions,
        inspect interactions, prohibited-claim scans, and real-repo smoke.
      - Close-out real-repo smoke covers this repo and the configured
        sibling-local-repo label without committing private paths, raw sibling
        reports, remotes, author identities, commit messages, source snippets,
        hosted/commercial plans, bug-prediction claims, code-quality scores,
        developer rankings, or productivity analytics.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope project
        --format json
      - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope project
        --format markdown
      - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope all --format
        json
      - zig build validate
      - zig build validate -Dcloseout=true
        -Dsmoke-repo=<operator-provided-local-repo>
        -Dsmoke-label=sibling-local-repo
      - git diff --check
      - git status --short --branch
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
