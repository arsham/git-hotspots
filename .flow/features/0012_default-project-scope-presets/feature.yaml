design:
  rough_shape:
    - Add a ScopePreset model with default all and opt-in project.
    - Project preset initially expands only to the literal exclude prefix .flow/.
    - Combine preset excludes with explicit include/exclude prefixes before
      aggregation and scoring.
    - Disclose selected scope and effective prefixes in all report formats.
    - Keep docs explicit that scoped reports change the evidence universe.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Scope preset contract
      goal: Add the --scope all|project CLI/config contract and expand project to
        deterministic literal prefixes without changing scoring or Git
        traversal.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig, src/git.zig; src/scoring.zig is
          protected."
        - "In scope: parse --scope all|project, default to all, reject
          missing/unknown/repeated/case-mismatched scope values, represent
          selected scope in config/model, expand project to effective exclude
          prefix .flow/."
        - "Out of scope: hidden default filtering, globs, pathspecs, gitignore
          import, generated/vendor/build detection, config files, provider
          classification, scoring changes, Git traversal redesign."
        - "Protected: existing include/exclude prefix validation, excludes-win
          precedence, inspect selection timing, scoring formulas, confidence
          thresholds, no network/telemetry/cache/provider behaviour."
        - "Dependencies: Feature 0004 exclude-prefix semantics, Feature 0006
          include-prefix semantics, Feature 0011 inspect after scoped analysis."
        - "Validation/evidence: parser/unit tests for default all, explicit all,
          project, missing value, unknown value, repeated flag, case mismatch,
          and flag-order independence."
        - "Review focus: project preset is opt-in, expands only to .flow/, and
          unflagged output remains all tracked Git-history evidence."
        - Escalate if implementation needs broader path classification, default
          filtering, generated-file detection, repository config discovery, or
          scoring changes.
        - "Done boundary: CLI accepts the chosen scope contract and internal
          effective prefixes are deterministic and inspectable by
          reports/tests."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Preset output and parity
      goal: Expose selected scope and effective prefixes in table, JSON, and Markdown
        while proving project preset parity with explicit .flow/ exclusion.
      owner_phase: runner
      execution_context:
        - "Anchors: src/report.zig, tests/integration.sh, fixtures/expected/*,
          tools/setup-fixtures.sh if fixture coverage needs adjustment."
        - "In scope: JSON/table/Markdown scope metadata, golden fixture updates,
          parity checks between --scope project and --exclude-prefix .flow/,
          inspect success/failure under all/project, no raw omitted path lists."
        - "Out of scope: report schema version bump unless required, separate
          scoring semantics for scoped reports, outputting omitted path names,
          source snippets, commit messages, author data."
        - "Protected: normal no-scope outputs remain equivalent to --scope all;
          existing reports stay deterministic; project-scoped output must not
          leak .flow/ into results/cochanges/evidence."
        - "Validation/evidence: fixture goldens for project scope, all scope,
          and inspect interactions; repeated output diffs; JSON validity;
          Markdown semantic checks; table row scans for leaks."
        - "Review focus: scope metadata is clear enough that scoped reports are
          not mistaken for global top results, and project preset equals
          explicit .flow/ exclusion."
        - Escalate if disclosure requires breaking report consumers beyond
          additive scope metadata or if preset cannot be represented as literal
          prefixes.
        - "Done boundary: preset reports are deterministic, disclosed,
          leak-free, and parity-proven across table, JSON, Markdown, and
          inspect."
      verification_commands:
        - zig build
        - zig build test
        - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope project
          --format json
        - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope project
          --format markdown
        - ./zig-out/bin/git-hotspots --repo fixtures/scope --scope all --format
          json
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Docs validation and real-repo smoke
      goal: Document the preset honestly and add it to the canonical validation ladder
        and privacy-safe real-repo close-out workflow.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, src/explain.zig, tests/integration.sh,
          tools/validate.sh, docs/real-repo-validation.md only if a privacy-safe
          note is useful."
        - "In scope: help/docs updates, explain text update, validate rungs for
          this-repo all/project reports and close-out sibling-local-repo smoke,
          prohibited-claim and privacy scans."
        - "Out of scope: CI, releases, packaging, providers, cache, public
          third-party case studies, hosted/commercial content, scoring
          redesign."
        - "Protected: README stays visitor-facing and avoids Flow process
          clutter except where .flow/ is an explicit CLI example; docs must not
          claim bug prediction, quality scoring, developer ranking,
          generated-code detection, or hidden intelligence."
        - "Validation/evidence: zig build validate; close-out validate with
          sibling-local-repo when available; git diff --check; scans for private
          paths/raw sibling output/prohibited claims."
        - "Review focus: public docs state that project scope is opt-in,
          currently excludes only .flow/, and changes the evidence universe."
        - Escalate if docs require naming private repos, publishing raw private
          reports, or broadening product claims.
        - "Done boundary: docs and validation cover all/project/project+inspect
          behaviour and the repo is clean after close-out."
      verification_commands:
        - zig build validate
        - zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-provided-local-repo>
          -Dsmoke-label=sibling-local-repo
        - git diff --check
        - git status --short --branch
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
