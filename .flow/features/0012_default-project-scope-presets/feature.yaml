schema: flow-feature.v1
feature:
  id: "0012"
  slug: default-project-scope-presets
  title: Default project scope presets
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Unscoped hotspot reports intentionally show all tracked Git-history
    evidence, but public demos and day-to-day runs can be dominated by
    repository process artefacts such as .flow/. Users need a deterministic
    opt-in project-oriented scope preset that improves first-run usefulness
    without silently hiding evidence or changing the default evidence universe.
  outcome: Add an explicit --scope all|project analysis flag. The default remains
    all and preserves current unfiltered behaviour. The project preset is opt-in
    and currently expands only to the built-in literal exclude prefix .flow/.
    Reports disclose the selected scope, effective prefixes, and bounded omitted
    counts across table, JSON, and Markdown, including inspect output.
  acceptance:
    - Unflagged git-hotspots output remains equivalent to --scope all and keeps
      all tracked Git-history paths in the evidence universe unless explicit
      include/exclude filters are provided.
    - --scope all is accepted as an explicit default scope and does not add
      built-in include or exclude prefixes.
    - --scope project is accepted as an opt-in project-oriented preset and
      currently expands only to the built-in literal exclude prefix .flow/.
    - --scope accepts only lowercase all and project; missing, unknown,
      repeated, or case-mismatched values fail with clear stderr and non-zero
      exit status.
    - "Preset exclusions combine with repeatable --include-prefix and
      --exclude-prefix flags: includes narrow the candidate universe, preset
      excludes and explicit excludes remove paths, and excludes win over
      includes regardless of flag order."
    - Effective scope metadata is disclosed in JSON, table, and Markdown,
      including selected scope, effective include prefixes, effective exclude
      prefixes, filters_active, outside-include counts, and excluded path/change
      counts.
    - No raw omitted path list is emitted; reports show bounded counts and
      effective prefixes only.
    - The project preset filters before aggregation, scoring, co-change
      evidence, ranking, limiting, and inspect selection.
    - Project-scoped results do not leak .flow/ paths into result paths,
      co-change paths, Markdown hotspot/evidence/co-change lines, table rows, or
      inspect matches.
    - --scope project output is equivalent to --exclude-prefix .flow/ for result
      rows, co-change evidence, scores, confidence, caveats, and bounded
      evidence commits.
    - --scope all --inspect can inspect a .flow/ path with evidence, while
      --scope project --inspect for the same path fails generically as outside
      the selected scope.
    - Existing explicit include/exclude prefix semantics remain literal
      repo-relative prefixes, not globs, pathspecs, gitignore rules, regexes,
      generated-file detection, or project configuration.
    - Existing normal table, JSON, Markdown, --inspect, --explain, --version,
      and prefix-filter behaviours remain stable except intentional
      help/docs/golden changes for scope metadata and preset support.
    - README and --explain describe scope presets as deterministic convenience
      filters that change the evidence universe; they do not imply hidden
      quality intelligence, generated-code detection, or global top results
      under scoped runs.
    - zig build validate covers scope preset parsing, fixture goldens,
      determinism, JSON validity, Markdown semantic/privacy assertions, inspect
      interactions, prohibited-claim scans, and real-repo smoke.
    - Close-out real-repo smoke covers this repo and the configured
      sibling-local-repo label without committing private paths, raw sibling
      reports, remotes, author identities, commit messages, source snippets,
      hosted/commercial plans, bug-prediction claims, code-quality scores,
      developer rankings, or productivity analytics.
planning:
  state: ready
  summary: Feature 0012 adds conservative scope presets. Unflagged runs remain all
    tracked Git-history paths. --scope all is an explicit spelling of that
    default. --scope project is an opt-in convenience preset that currently
    excludes only .flow/ and is disclosed as such in report metadata and docs.
    The feature does not add globs, gitignore import, generated/vendor
    detection, config files, scoring changes, providers, cache, CI, release, or
    hidden default exclusions.
  brief_sync:
    status: updated
    reason: "Feature 0012 remains within B001: deterministic local-first file-level
      evidence, explicit scope disclosure, no
      providers/cache/network/telemetry/author metrics, and hotspots framed as
      investigation prompts."
    checked_at: 2026-05-22T17:43:15.154Z
