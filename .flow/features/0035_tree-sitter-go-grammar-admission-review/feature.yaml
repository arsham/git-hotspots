    - id: P1
      title: Go grammar admission review document
      goal: Add one docs-only admission review for tree-sitter-go that records
        upstream identity, provenance, license, compatibility, query, and future
        validation gates before source import.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: docs/tree-sitter-go-grammar-admission.md,
          docs/tree-sitter-multi-language-query-strategy.md,
          docs/tree-sitter-dependency-vendoring-plan.md,
          docs/tree-sitter-vendoring-readiness.md."
        - "In scope: one documentation-only Go grammar admission review with
          candidate identity, license/notice, generated parser provenance,
          compatibility, BOM, excluded file classes, source-size/build-impact,
          query fixture gates, and decision state."
        - "In scope: explicit statements that Go runtime support is not
          implemented and current runtime Tree-sitter support remains Zig-only."
        - "Out of scope: third_party source import, source/build/test/fixture
          changes, build.zig.zon, CI changes, provider registry, CLI flags,
          report schema changes, scoring, cache, runtime Go provider behaviour,
          custom user queries, LSP, release or package work."
        - "Protected: local-first behaviour, no network/telemetry/upload/remote
          enrichment, no background provider execution, no bug prediction,
          code-quality scoring, developer ranking, maintainer judgement, or
          commercial strategy."
        - "Dependencies: Feature 0034 language strategy is complete and names Go
          as the first non-Zig language candidate subject to admission gates."
        - "Validation/evidence: git diff --check; zig build validate; docs-only
          changed-path scan; no tree-sitter-go source import scan;
          prohibited-claim/privacy/local-first scan over changed docs."
        - "Review focus: admission gates are concrete enough to shape the next
          Go source-import feature without overclaiming Go runtime support."
        - "Escalate if: implementation requires source import, build/runtime
          changes, provider registry, CLI/report schema changes, custom query
          execution, LSP integration, or unsupported public Go support claims."
        - "Done boundary: admission document exists, no protected surfaces
          changed, validation passes, and future import/runtime sequencing is
          explicit."
      anchors:
        - docs/tree-sitter-go-grammar-admission.md
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/tree-sitter-dependency-vendoring-plan.md
        - docs/tree-sitter-vendoring-readiness.md
      in_scope:
        - One docs-only Go grammar admission review document.
        - Future Go source-import and provider validation gates.
        - Explicit Go runtime deferral and decision state.
      out_of_scope:
        - Go grammar import or vendored source changes.
        - Runtime Go provider, CLI, report schema, scoring, cache, CI, release,
          or package changes.
        - Custom query execution or LSP integration.
      protected_surfaces:
        - Runtime CLI behaviour and report schema.
        - File-level Git evidence truth.
        - Local-first and privacy boundaries.
        - Existing Zig provider behaviour.
        - Third-party vendored source state.
      validation_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for docs-only scope
        - no tree-sitter-go source import scan
        - prohibited-claim and privacy scan over changed docs
      review_focus:
        - Go admission gates are concrete.
        - No runtime support is claimed.
        - Future sequencing is explicit.
        - Public repo boundaries are preserved.
      escalation_triggers:
        - Source import or build changes are needed.
        - Runtime Go provider behaviour is needed.
        - Public docs imply Go support exists.
        - Admission facts cannot be stated without unsupported guesses.
      done_boundary: One docs-only Go admission artefact is committed and
        independently reviewable.
