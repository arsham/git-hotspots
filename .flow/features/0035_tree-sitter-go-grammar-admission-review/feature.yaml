design:
  rough_shape:
    - Add one Go grammar admission review document.
    - Keep the feature documentation-only and use it to gate a later
      tree-sitter-go source-import feature.
    - Explicitly defer Go source import, build proof, extraction proof, runtime
      provider output, custom queries, and LSP.
