schema: flow-feature.v1
feature:
  id: "0035"
  slug: tree-sitter-go-grammar-admission-review
  title: Tree-sitter Go grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The multi-language strategy names Go as the preferred first non-Zig
    Tree-sitter language, but the repository has no Go grammar admission record
    proving upstream identity, license, generated-source provenance,
    compatibility, source-size, or query readiness.
  outcome: A documentation-only Go grammar admission review records the gates and
    decision state required before any future tree-sitter-go source import or
    runtime provider work.
  acceptance:
    - Add docs/tree-sitter-go-grammar-admission.md as the single public
      admission review artefact.
    - The document records candidate upstream identity, immutable revision or
      blocker, checksum requirement, proposed vendored path, BOM expectations,
      excluded file classes, and Tree-sitter core compatibility requirements.
    - The document records license/notice, generated parser provenance,
      local-first build supply-chain, source-size, build-impact, query, fixture,
      and no-provider stability gates for future Go work.
    - The document states that Go runtime support is not implemented and current
      runtime Tree-sitter support remains Zig-only.
    - The document preserves file-level Git evidence as product truth and frames
      future Go symbols as optional, current-only, inspect-oriented, additive,
      caveated provider evidence.
    - The document ends with an explicit decision state and named blockers for a
      later Go source-import feature.
    - No third_party, source, test, fixture, build, CI, CLI, report schema,
      scoring, cache, provider runtime, provider registry, release, package, or
      network behaviour changes are made.
