feature:
  id: "0118"
  slug: ci-workflow-reliability-proof
  title: CI workflow reliability proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Hosted GitHub Actions has not yet proven the cleaned CI workflow change
    that switched CI to the project-owned validate-all aggregate.
  outcome: Confirm the pushed GitHub Actions workflow passes on the hosted runner,
    or capture a narrow repair target if it fails.
  acceptance:
    - Current master is pushed to origin without force-push or
      tag/release/package side effects.
    - The GitHub Actions run for the pushed commit is inspected and its
      conclusion is recorded durably.
    - If hosted CI passes, evidence includes commit SHA, workflow name, run
      identifier or URL, conclusion, and checked command surface.
    - If hosted CI fails or cannot be inspected, the failure or access blocker
      is captured and routed to a narrow follow-up instead of broadening this
      slice.
    - Repository state is clean after the proof except for intentional Flow
      close-out state during reconcile.
