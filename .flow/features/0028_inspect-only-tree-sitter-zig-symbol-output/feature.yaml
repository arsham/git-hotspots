design:
  rough_shape:
    - Add reusable runtime Tree-sitter Zig symbol extraction for one current
      repo-relative .zig file.
    - Add --symbols as an inspect-only flag.
    - Attach provider/symbol evidence to inspect output in table, JSON, and
      Markdown only when requested.
    - Preserve file-level scoring/ranking and no-symbol output bytes.
    - Validate graceful unsupported/failure states and privacy-safe evidence.
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  packets:
    - id: P1
      title: Runtime symbol module and build safety
      goal: Promote the proven Tree-sitter Zig extractor into reusable runtime code
        and prove product build/no-symbol output stability before exposing any
        CLI symbol surface.
      depends_on: []
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, src/provider.zig, candidate
          src/tree_sitter_zig.zig, tests/tree_sitter_symbol_proof.zig,
          third_party/tree-sitter-core, third_party/tree-sitter-zig."
        - "In scope: reusable current-file Zig symbol extraction,
          owned/lifetime-safe provider output, vendored-source build wiring if
          needed, build/binary impact evidence, and tests for supported/failure
          states."
        - "Out of scope: --symbols CLI output, report rendering, scoring/ranking
          changes, provider registry, cache, network, parser generation, system
          Tree-sitter dependencies, all-file parsing."
        - "Protected: normal no-provider table/JSON/Markdown/inspect output
          bytes, local-first/no-network posture, source-install smoke, provider
          current-only semantics."
        - "Dependencies: Features 0021, 0025, 0026, and 0027 are complete."
        - "Validation/evidence: zig fmt, zig build test, zig build, zig build
          validate, zig build tree-sitter-build-proof, zig build
          tree-sitter-symbol-proof, no-provider byte parity, build/binary impact
          notes."
        - "Review focus: runtime module is lifetime-safe, parser resources are
          cleaned up, failures degrade without diagnostics/snippets, and no
          user-visible output changes in this packet."
        - "Escalate if: build requires global packages, network, parser
          generation, submodules, major source-install degradation, or schema/UX
          decisions outside inspect-only symbols."
        - "Done boundary: runtime extractor tests pass, no-symbol output is
          stable, build impact is recorded, and product CLI output is
          unchanged."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - git diff --check
    - id: P2
      title: Inspect-only CLI and report output
      goal: Add `--symbols` for `--inspect PATH` only and render additive provider
        symbol evidence in table, JSON, and Markdown.
      depends_on:
        - P1
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig, src/report.zig,
          src/provider.zig, source extractor module, fixtures/expected,
          tests/integration.sh."
        - "In scope: --symbols parser, invalid-combination errors, inspect-only
          provider execution, table/JSON/Markdown symbols output, success and
          degradation fixtures."
        - "Out of scope: default provider execution, all-file parsing, symbol
          scoring/ranking, historical symbol lineage, provider registry, cache,
          multi-language support."
        - "Protected: file-level Git analysis remains unchanged; no-symbol
          output bytes remain stable; no parser diagnostics/source
          snippets/private paths enter output."
        - "Dependencies: P1 runtime module and build-safety evidence."
        - "Validation/evidence: fixture goldens for symbol success/degradation,
          no-symbol parity, invalid combinations, unsupported/non-Zig,
          empty/invalid/missing-current cases."
        - "Review focus: JSON schema matches PRD, human formats disclose
          provider/current-only caveats, failures preserve file evidence, and
          --symbols cannot run outside inspect."
        - "Escalate if: symbol output needs scoring, rank, global provider
          registry, default parsing, broad schema changes, or unsupported
          privacy-risking diagnostics."
        - "Done boundary: all accepted formats produce deterministic output and
          invalid/failure cases are covered."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - git diff --check
    - id: P3
      title: Validation docs and close-out evidence
      goal: Complete docs, validation automation, privacy/prohibited scans, and real
        repository close-out evidence for inspect-only symbol output.
      depends_on:
        - P2
      status: pending
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/provider-symbol-evidence-contract.md or
          tree-sitter evidence docs, tests/integration.sh, tools/validate.sh,
          fixtures/expected."
        - "In scope: help/docs/explain disclosure, validation integration,
          privacy/prohibited scans, real-repo smoke using this repo and
          sibling-local-repo label, no-symbol byte-stability proof."
        - "Out of scope: release packaging, CI, cache, provider registry,
          multi-language, tree-sitter source version changes, parser
          generation."
        - "Protected: OSS/publicity boundary, no bug
          prediction/code-quality/developer-ranking claims, no private path/raw
          report/source snippet leakage."
        - "Dependencies: P1 and P2 complete."
        - "Validation/evidence: full close-out ladder, tree-sitter proof steps,
          close-out validate with sibling-local-repo, committed evidence uses
          labels/bounded counts only."
        - "Review focus: public docs are accurate and not overclaiming;
          validation proves no-provider stability and symbol output determinism;
          privacy boundary holds."
        - "Escalate if: sibling smoke cannot run, docs imply provider truth
          replaces Git truth, or validation needs unplanned network/global
          dependencies."
        - "Done boundary: feature satisfies PRD acceptance, close-out validation
          passes, reviewer can prove all required rows, and repo is clean."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - zig build validate
        - zig build tree-sitter-build-proof
        - zig build tree-sitter-symbol-proof
        - git diff --check
        - zig build validate -Dcloseout=true -Dsmoke-repo <local-sibling-path>
          -Dsmoke-label sibling-local-repo
