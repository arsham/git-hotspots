    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The project has proven pinned vendored Tree-sitter sources, an offline
          build proof, and an internal Zig current-symbol extraction proof.
          Users still cannot ask why an inspected hot Zig file is interesting at
          the current-symbol level. Exposing symbols too broadly would risk
          turning optional provider evidence into hidden product truth, so the
          first user-visible symbol feature must be narrow, opt-in,
          inspect-only, and clearly caveated.
      - source_ref: prd.md#outcome[1]
        text: "Add opt-in Tree-sitter Zig symbol enrichment for inspected files only:"
      - source_ref: prd.md#outcome[2]
        text: "``sh git-hotspots --inspect PATH --symbols ``"
      - source_ref: prd.md#outcome[3]
        text: When PATH resolves through the existing inspect/scope/rename-alias logic
          to an in-scope current .zig file, the report includes current
          working-tree Zig function symbols extracted by the vendored
          Tree-sitter parser. File-level Git history remains the ranking and
          scoring truth. Symbol evidence is additive, current-only,
          provider-labelled, and failure-tolerant.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 4 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add opt-in Tree-sitter Zig symbol enrichment for inspected files only
      via `git-hotspots --inspect PATH --symbols`, preserving file-level Git
      evidence as product truth while adding current working-tree function
      symbols with provider state, confidence, caveats, and graceful failure
      behaviour.
    acceptance:
      - --symbols exists and is accepted only with --inspect PATH.
      - --symbols without --inspect exits non-zero with deterministic stderr.
      - Existing --inspect restrictions remain unchanged, including rejection
        with --limit and normal inspect-not-found errors.
      - Provider execution is opt-in, inspect-only, and parses only the matched
        in-scope current .zig file.
      - Provider uses only vendored local Tree-sitter core and tree-sitter-zig
        sources; no system parser package, network, submodule, parser
        generation, telemetry, upload, cache, or background analysis is
        introduced.
      - Symbol evidence is current working-tree enrichment only and never
        changes file score, rank, confidence, co-change evidence, lineage,
        scope, or inclusion/exclusion semantics.
      - Supported symbol subset is named Zig function declarations with
        deterministic ordering and one-based inclusive line ranges.
      - Table, JSON, and Markdown include provider state and symbols only when
        --symbols is present.
      - JSON symbol output includes provider envelope, current-only state,
        failure, freshness, confidence, caveats, local provenance, and ordered
        symbol rows.
      - Non-Zig, empty Zig, invalid or partial Zig, missing current file, and
        provider failure/degradation cases preserve file evidence and show
        provider caveats without raw diagnostics or snippets.
      - No-provider table, JSON, Markdown, and plain inspect outputs remain
        byte-for-byte stable.
      - Validation passes, including Tree-sitter proof steps and close-out smoke
        for this repo and sibling-local-repo with privacy-safe label-only
        evidence.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - zig build validate
      - zig build tree-sitter-build-proof
      - zig build tree-sitter-symbol-proof
      - git diff --check
      - zig build validate -Dcloseout=true -Dsmoke-repo <local-sibling-path>
        -Dsmoke-label sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
