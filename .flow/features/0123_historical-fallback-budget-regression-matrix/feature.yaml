  acceptance_contract:
    outcome: Historical-symbol tests or validation prove unsupported, skipped, and
      failed provider-state budget behaviour, preserving 0122 semantics without
      widening runtime attribution rules.
    acceptance:
      - Regression coverage proves unsupported provider states do not consume
        provider-failure budget before later supported Zig attribution.
      - Regression coverage proves skipped provider states do not consume
        provider-failure budget when a deterministic skipped case is available,
        or records a narrow no-case proof if not.
      - Regression coverage proves failed provider states still consume
        provider-failure budget.
      - timed_out and unavailable remain documented as uncovered without new
        injection seams.
      - No public interface, schema, scoring, provider admission, release, tag,
        package, remote, network, telemetry, or cache behaviour changes.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify unsupported and skipped do not consume provider-failure budget
      - verify failed still consumes provider-failure budget
      - verify constructed skipped case is deterministic and not a
        timeout/unavailable seam
      - verify historical provider-state and fallback-pressure validation still
        pass
  decision_budget:
    allowed_local_decisions:
      - test helper names
      - exact constructed skipped fallback variant among no text hunks or
        unavailable side
      - docs metadata wording that preserves current truth
    deferred_reconcile_triggers:
      - skipped constructed case needs no-case proof despite planning decision
      - docs metadata alignment needed after tests
      - minor test helper trade-off inside protected surfaces
    hard_planner_escalation_triggers:
      - runtime semantics must change to add the regression
      - nearest-symbol or attribution expansion would be required
      - timeout or unavailable injection seam is introduced
      - JSON schema or CLI change would be required
    protected_surfaces:
      - runtime attribution semantics
      - JSON schema
      - CLI flags
      - provider admission
      - scoring/ranking
      - release/tag/package/remote/network/telemetry/cache behaviour
      - timeout/unavailable seams
  fallback_path: deferred_reconcile_decision
  notes: null
