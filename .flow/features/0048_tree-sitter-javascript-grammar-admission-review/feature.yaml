schema: flow-feature.v1
feature:
  id: "0048"
  slug: tree-sitter-javascript-grammar-admission-review
  title: Tree-sitter JavaScript grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: "JavaScript is the next high-value Tree-sitter language family, but it
    has broader runtime and syntax risk than Go or Python: CommonJS and ESM,
    JSX, anonymous exports, generated bundles, Node monorepo paths, and multiple
    extensions. The repository needs an admission record before any
    tree-sitter-javascript source import or runtime provider work."
  outcome: Add a documentation-only JavaScript grammar admission review that
    records upstream identity, JS/JSX scope, license, generated parser/scanner,
    Tree-sitter core compatibility, BOM, source-size, query, fixture, monorepo,
    and validation gates.
  acceptance:
    - Add docs/tree-sitter-javascript-grammar-admission.md as the single public
      admission review artefact.
    - The document records candidate upstream identity for
      tree-sitter-javascript, immutable revision or blocker, checksum
      requirement, proposed vendored path, BOM expectations, excluded file
      classes, and Tree-sitter core compatibility requirements.
    - The document records whether JSX is admitted with JavaScript or deferred;
      if deferred, .jsx remains unsupported until a later shaped feature.
    - The document records license and notice gates, generated parser and
      scanner provenance gates, local-first build supply-chain gates,
      source-size and build-impact gates, query fixture expectations, and
      no-provider stability gates for future JavaScript work.
    - The document states JavaScript runtime support is not implemented and
      current runtime Tree-sitter support remains Zig, Go, and Python only.
    - The document frames future JavaScript symbols as optional, current-only,
      inspect-oriented, additive, caveated provider evidence.
    - The document records Node as runtime context only, not a provider or
      parser identity.
    - The document records monorepo behaviour as inspect-path-only and
      extension-based; it must not imply package.json, workspace, bundler,
      dependency graph, module resolution, LSP, or repo-wide scanning.
    - No third_party, source, test, fixture, build, CI, CLI, report schema,
      scoring, cache, provider runtime, provider registry, release, package,
      network, telemetry, or background behaviour changes are made.
