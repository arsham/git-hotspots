          docs/tree-sitter-python-grammar-admission.md"
        - "In scope: one documentation-only JavaScript grammar admission review
          with candidate identity, immutable revision/checksum gates,
          license/notice, generated parser/scanner provenance, core ABI
          compatibility, BOM/excluded file classes, source-size/build-impact,
          JS/JSX scope decision, query fixture gates, monorepo path behaviour,
          Node-as-context-only language boundary, and decision state"
        - "Out of scope: third_party/tree-sitter-javascript import,
          source/build/test/fixture changes, build.zig.zon, CI changes, provider
          registry, CLI flags, report schema changes, scoring, cache, runtime
          JavaScript provider behaviour, custom user queries,
