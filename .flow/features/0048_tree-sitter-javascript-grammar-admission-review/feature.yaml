        - "In scope: one documentation-only JavaScript grammar admission review with candidate identity, immutable revision/checksum gates, license/notice, generated parser/scanner provenance, core ABI compatibility, BOM/excluded file classes, source-size/build-impact, JS/JSX scope decision, query fixture gates, monorepo path behaviour, Node-as-context-only language boundary, and decision state"
        - "Out of scope: third_party/tree-sitter-javascript import, source/build/test/fixture changes, build.zig.zon, CI changes, provider registry, CLI flags, report schema changes, scoring, cache, runtime JavaScript provider behaviour, custom user queries, package.json/workspace/dependency analysis, LSP, release/package work"
        - "Protected: local-first behaviour, no network/telemetry/upload/remote enrichment, no background provider execution, no bug prediction/code-quality scoring/developer ranking/maintainer judgement, existing Zig/Go/Python provider behaviour"
        - "Dependencies: Feature 0034 language strategy is complete and identifies JavaScript as a future candidate subject to admission gates"
        - "Validation/evidence: git diff --check; zig build validate; docs-only changed-path scan; no tree-sitter-javascript source import scan; prohibited-claim/privacy/local-first scan over changed docs"
        - "Review focus: admission gates are concrete enough to shape the next JavaScript source-import feature without overclaiming JavaScript runtime support"
        - "Escalate if: implementation requires source import, build/runtime changes, provider registry, CLI/report schema changes, custom query execution, package/module analysis, LSP integration, Node provider identity, or unsupported public JavaScript support claims"
        - "Done boundary: admission document exists, no protected surfaces changed, validation passes, and future import/runtime sequencing is explicit"
      anchors:
        - docs/tree-sitter-javascript-grammar-admission.md
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/tree-sitter-go-grammar-admission.md
        - docs/tree-sitter-python-grammar-admission.md
      in_scope:
        - One docs-only JavaScript grammar admission review document.
        - Future JavaScript source-import and provider validation gates.
        - Explicit JavaScript runtime deferral and decision state.
      out_of_scope:
        - JavaScript grammar import or vendored source changes.
        - Runtime JavaScript provider, CLI, report schema, scoring, cache, CI,
