        - "Escalate if: implementation requires source import, build/runtime
          changes, provider registry, CLI/report schema changes, custom query
          execution, package/module analysis, LSP integration, Node provider
          identity, or unsupported public JavaScript support claims"
        - "Done boundary: admission document exists, no protected surfaces
          changed, validation passes, and future import/runtime sequencing is
          explicit"
      anchors:
        - docs/tree-sitter-javascript-grammar-admission.md
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/tree-sitter-go-grammar-admission.md
        - docs/tree-sitter-python-grammar-admission.md
      in_scope:
        - One docs-only JavaScript grammar admission review document.
        - Future JavaScript source-import and provider validation gates.
        - Explicit JavaScript runtime deferral and decision state.
      out_of_scope:
        - JavaScript grammar import or vendored source changes.
        - Runtime JavaScript provider, CLI, report schema, scoring, cache, CI,
          release, or package changes.
        - Custom query execution, LSP, package/module analysis, or workspace
          discovery.
      protected_surfaces:
        - Runtime CLI behaviour and report schema.
        - File-level Git evidence truth.
        - Local-first and privacy boundaries.
        - Existing Zig, Go, and Python provider behaviour.
        - Third-party vendored source state.
      validation_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for docs-only scope
        - no tree-sitter-javascript source import scan
        - prohibited-claim and privacy scan over changed docs
      review_focus:
        - JavaScript admission gates are concrete.
        - No runtime support is claimed.
        - Future sequencing is explicit.
        - Node is context only, not a provider.
        - Public repo boundaries are preserved.
      escalation_triggers:
        - Source import or build changes are needed.
        - Runtime JavaScript provider behaviour is needed.
        - Public docs imply JavaScript support exists.
        - Admission facts cannot be stated without unsupported guesses.
      done_boundary: One docs-only JavaScript admission artefact is committed and
        independently reviewable.
