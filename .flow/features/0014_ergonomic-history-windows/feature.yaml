schema: flow-feature.v1
feature:
  id: "0014"
  slug: ergonomic-history-windows
  title: Large-repo history recipes
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Large repositories can take noticeably longer to analyse across full
    reachable history. Users need clear guidance for deterministic bounded runs
    using the CLI options that already exist, without changing the default
    full-history product contract or adding ambiguous named history-window
    syntax prematurely.
  outcome: Add public documentation for large-repository recipes using existing
    --since REV, --scope, --include-prefix, and --progress options. Preserve all
    runtime behaviour, including default full-history analysis when --since is
    omitted. Defer named history-window syntax until deterministic semantics and
    validation cost are worth the product surface.
  acceptance:
    - README includes a concise large-repository recipe section.
    - Recipes use existing supported options only and do not introduce named
      history-window syntax as product behaviour.
    - Recipes include a project-focused bounded run using --scope project,
      --since HEAD~500, and --progress.
    - Recipes include a source-focused bounded run using --include-prefix src/
      and a bounded --since revision.
    - Docs clearly say omitting --since keeps full reachable local history.
    - Docs frame bounded runs as exploratory scopes, not more correct answers or
      hidden defaults.
    - Runtime CLI behaviour, scoring, filtering, progress, inspect, report
      schemas, and validation commands remain unchanged except for docs-only
      wording if needed.
    - README remains visitor-facing and free of Flow process exposition,
      commercial strategy, bug-prediction claims, objective quality-score
      claims, and developer-ranking claims.
    - If real-repo evidence docs change, committed content remains privacy-safe
      and contains no private path, repo name, remote URL, author identity,
      commit message, source snippet, or raw sibling report.
