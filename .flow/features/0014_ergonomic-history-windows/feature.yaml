design:
  rough_shape:
    - Keep runtime unchanged; this is a documentation and usage-guidance slice.
    - Add README large-repo recipes using existing --since REV, --scope,
      --include-prefix, and --progress options.
    - Preserve named history-window shortcuts as a deferred design candidate,
      not implemented product syntax.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Public large-repo recipes
      goal: Document practical deterministic command recipes for large
        repositories using existing CLI options only.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md; optional docs/real-repo-validation.md only if a
          privacy-safe clarification is useful."
        - "In scope: large-repo recipes using --since HEAD~500, --since
          HEAD~1000, --scope project, --include-prefix src/, --progress, and
          existing report formats."
        - "Out of scope: named history-window syntax, changing defaults, date or
          duration parsing, cache, streaming, providers, CI, releases, network,
          telemetry, and performance claims."
        - "Protected: runtime code, scoring, report schemas, validation scripts,
          help text, and existing CLI behaviour unless a docs mismatch requires
          a docs-only correction."
        - "Dependencies: existing --since REV behaviour, project scope presets,
          include-prefix filters, and progress feedback."
        - "Validation/evidence: zig build validate, git diff --check, help
          smoke, README scans for unsupported syntax and prohibited claims."
        - "Review focus: docs are public, polished, deterministic, and do not
          imply bounded windows are hidden defaults or superior truth."
        - Escalate if useful docs require new runtime syntax, runtime behaviour
          changes, private repo details, or broader performance claims.
        - "Done boundary: README gives users concrete large-repo recipes and the
          repo validates cleanly with no unsupported product promises."
      verification_commands:
        - zig build validate
        - git diff --check
        - ./zig-out/bin/git-hotspots --help
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
    required_packet_fields:
