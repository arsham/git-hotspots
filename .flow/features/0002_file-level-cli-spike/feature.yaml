  acceptance_contract:
    outcome: A minimal Zig CLI spike analyses a local Git repository, ranks
      project-relative file paths by explainable file-level Git-history
      evidence, and emits deterministic human-table and JSON reports suitable
      for review by humans and future tooling.
    acceptance:
      - A minimal Zig project builds and exposes a git-hotspots executable with
        --help plus --repo, --limit, --format table|json, and --since REV
        options.
      - Running against a non-git directory, bare/empty repo, or repo with no
        commits exits clearly without panic or network access.
      - The CLI analyses only local Git history and never fetches, pulls,
        pushes, uploads, contacts remotes, or emits telemetry.
      - Default output is a human-readable table of top file-level hotspots
        rendered from the same model as JSON.
      - --format json emits deterministic JSON with schema version, tool/version
        placeholder, repo HEAD or range metadata, shallow/partial-history flags,
        analysed commit count, and ranked file results.
      - Each result uses project-relative paths and includes score breakdown,
        change count, churn, recency evidence, current size when available,
        co-change summary, confidence, caveats, and bounded evidence examples.
      - Repeated JSON runs for the same repo/ref/config/tool version are
        byte-identical, including stable tie-breakers and no
        wall-clock-dependent recency.
      - Shallow or partial history is detected and reported as scoped/incomplete
        with auto_fetch false; the tool does not contact remotes to fix missing
        history.
      - Default output excludes author names, author emails, developer ranking,
        productivity analytics, bug-prediction language, and objective
        code-quality scoring.
      - Tests cover Git parsing and ranking fixtures for basic hot/cold files,
        churn versus frequency, recency tie-breaking, co-change evidence,
        rename/delete/binary cases, shallow history, large commit caveats,
        empty/non-git errors, and paths with spaces or unicode.
      - Validation evidence includes zig fmt --check, zig build test, zig build,
        git diff --check, deterministic JSON diff, privacy/local-first scan,
        shallow-clone proof, and a bounded performance smoke on a medium fixture
        or available local repo.
      - Docs or help text explain that hotspots are investigation prompts and
        state the spike's limitations without mentioning monetisation, hosted
        product strategy, unsupported providers, or bug prediction.
      - "Close-out validation includes real-repository smoke runs after the
        executable exists: this repository and at least one suitable
        sibling/local repository when available; fixture-only validation is not
        sufficient once the CLI can run."
      - Real-project smoke evidence records exact commands, selected repo
        labels, result summaries, and any skipped-target reason without
        committing absolute local paths or private repository details.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build run -- --help
      - git diff --check
      - zig build
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
        /tmp/git-hotspots-a.json && ./zig-out/bin/git-hotspots --repo
        fixtures/basic --format json > /tmp/git-hotspots-b.json && diff -u
        /tmp/git-hotspots-a.json /tmp/git-hotspots-b.json
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
