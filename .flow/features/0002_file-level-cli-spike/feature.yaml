schema: flow-feature.v1
feature:
  id: "0002"
  slug: file-level-cli-spike
  title: File-level CLI spike
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: git-hotspots has project-level direction but no executable proof that
    local Git history can produce useful, deterministic file-level hotspot
    reports. The first implementation slice must validate that core evidence
    loop without introducing provider, cache, network, telemetry, or
    hosted-product complexity.
  outcome: A minimal Zig CLI spike analyses a local Git repository, ranks
    project-relative file paths by explainable file-level Git-history evidence,
    and emits deterministic human-table and JSON reports suitable for review by
    humans and future tooling.
  acceptance:
    - A minimal Zig project builds and exposes a git-hotspots executable with
      --help plus --repo, --limit, --format table|json, and --since REV options.
    - Running against a non-git directory, bare/empty repo, or repo with no
      commits exits clearly without panic or network access.
    - The CLI analyses only local Git history and never fetches, pulls, pushes,
      uploads, contacts remotes, or emits telemetry.
    - Default output is a human-readable table of top file-level hotspots
      rendered from the same model as JSON.
    - --format json emits deterministic JSON with schema version, tool/version
      placeholder, repo HEAD or range metadata, shallow/partial-history flags,
      analysed commit count, and ranked file results.
    - Each result uses project-relative paths and includes score breakdown,
      change count, churn, recency evidence, current size when available,
      co-change summary, confidence, caveats, and bounded evidence examples.
    - Repeated JSON runs for the same repo/ref/config/tool version are
      byte-identical, including stable tie-breakers and no wall-clock-dependent
      recency.
    - Shallow or partial history is detected and reported as scoped/incomplete
      with auto_fetch false; the tool does not contact remotes to fix missing
      history.
    - Default output excludes author names, author emails, developer ranking,
      productivity analytics, bug-prediction language, and objective
      code-quality scoring.
    - Tests cover Git parsing and ranking fixtures for basic hot/cold files,
      churn versus frequency, recency tie-breaking, co-change evidence,
      rename/delete/binary cases, shallow history, large commit caveats,
      empty/non-git errors, and paths with spaces or unicode.
    - Validation evidence includes zig fmt --check, zig build test, zig build,
      git diff --check, deterministic JSON diff, privacy/local-first scan,
      shallow-clone proof, and a bounded performance smoke on a medium fixture
      or available local repo.
    - Docs or help text explain that hotspots are investigation prompts and
      state the spike's limitations without mentioning monetisation, hosted
      product strategy, unsupported providers, or bug prediction.
