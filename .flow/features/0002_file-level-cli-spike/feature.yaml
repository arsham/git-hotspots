design:
  rough_shape:
    - Use Zig 0.16.0 for the spike unless implementation discovers a blocking
      toolchain issue; stop and reshape before switching languages.
    - "Expose a minimal command surface: git-hotspots [--repo PATH] [--limit N]
      [--format table|json] [--since REV]. Defaults: repo '.', limit 10, table
      output, full reachable history."
    - Use local Git CLI subprocess output as the first evidence source. Prefer
      machine-readable and NUL-safe output where practical; do not fetch, pull,
      push, upload, contact remotes, or use telemetry.
    - Keep one evidence model that both table and JSON render from; JSON is the
      canonical validation output for tests.
    - "Score file-level hotspots from deterministic components: change count,
      churn additions plus deletions, recency relative to selected HEAD or
      analysed commit timestamps, current file size, co-change summary,
      confidence, and caveats."
    - "Use stable tie-breakers: score descending, then path ascending. Keep
      numeric formatting stable and JSON key order deterministic."
    - Detect shallow or partial history and report incomplete scope; never
      auto-fetch to improve history.
    - Keep providers, tree-sitter, LSP, ctags, cache/database schema, GitHub
      Actions, release automation, Markdown report generation, author metrics,
      and hosted/commercial strategy out of this feature.
    - Generate Git fixture repositories in tests or scripts rather than checking
      in .git directories; use fixed timestamps and dummy local author data.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Minimal Zig CLI scaffold
      goal: Create the smallest buildable Zig CLI with basic options, help, and clear
        repository validation errors.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, src/main.zig, optional src/cli.zig, README.md
          only if usage text must be adjusted."
        - "In scope: Zig 0.16.0-compatible build, executable named git-hotspots,
          --help, --repo PATH, --limit N, --format table|json, --since REV
          parsing, clear non-git/empty-repo errors."
        - "Out of scope: Git history aggregation, ranking algorithm beyond
          placeholders, providers, cache, release packaging, package manager
          setup beyond minimal Zig build."
        - "Protected: no network-capable dependency, no telemetry, no source
          upload, no commercial/hosted docs, no public README process clutter."
        - "Dependencies: Feature 0001 project direction is committed; B001
          remains source capability brief."
        - "Validation/evidence: zig fmt --check build.zig src tests if present;
          zig build test; zig build run -- --help; run with --repo against a
          non-git temp directory and verify clear failure."
        - "Review focus: minimality, correct option names/defaults, error
          handling without panic, no overbuilt architecture."
        - "Escalate if: Zig/toolchain setup blocks progress, a dependency
          manager/release strategy becomes necessary, or language choice becomes
          disputed."
        - "Done boundary: executable builds, help works, option parsing is
          covered by tests or equivalent checks, and invalid repo handling is
          clear."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build run -- --help
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Local Git history ingestion
      goal: Stream local Git history into per-path aggregate file statistics without
        providers or cache.
      owner_phase: runner
      execution_context:
        - "Anchors: src/git.zig, src/model.zig, src/main.zig, tests or test
          fixture helpers."
        - "In scope: Git repo resolution, HEAD/range metadata, --since REV range
          handling, streamed git history parsing, per-path change count,
          additions/deletions churn, last-changed timestamp/commit, current file
          size, shallow/partial detection, dirty-worktree caveat if surfaced."
        - "Out of scope: libgit2, database/cache, remote fetch, provider
          parsing, perfect rename/symbol identity, author identity metrics, full
          content indexing."
        - "Protected: project-relative paths only in output model; no author
          names/emails by default; no auto-fetch; bounded aggregate memory
          rather than full history retention."
        - "Dependencies: P1 CLI options and error taxonomy exist."
        - "Validation/evidence: synthetic temp repo tests with fixed commit
          timestamps; repeated run stable; shallow fixture reports incomplete
          history; paths with spaces/unicode parse correctly;
          binary/rename/delete cases produce caveats rather than crashes."
        - "Review focus: Git output parsing safety, bounded memory posture,
          local-only behaviour, deterministic metadata."
        - "Escalate if: implementing this requires libgit2, cache schema, remote
          access, rename-perfect history, or full repository content indexing."
        - "Done boundary: file aggregate model is populated from local Git
          history and fixture tests prove core edge cases."
      verification_commands:
        - zig build test
        - zig build
        - git diff --check
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Ranking, scoring, and explanations
      goal: Turn file aggregates into deterministic hotspot rows with modest score
        breakdowns and caveats.
      owner_phase: runner
      execution_context:
        - "Anchors: src/scoring.zig, src/model.zig, tests/golden fixtures."
        - "In scope: first scoring formula, documented tie-breakers,
          confidence/caveat assignment, bounded co-change summary, evidence
          examples, deterministic ordering."
        - "Out of scope: ML/AI judgement, bug prediction, objective code-quality
          scoring, developer ranking, complexity analysis, provider-derived
          symbol metrics."
        - "Protected: score must be explainable from raw components; recency
          must be relative to analysed commit timestamps or selected HEAD, not
          wall clock; output must remain deterministic."
        - "Dependencies: P2 aggregate evidence model."
        - "Validation/evidence: unit tests for fixed fixture rankings,
          equal-score tie cases, co-change caps, large commit caveats,
          deterministic repeated JSON model if reporter exists."
        - "Review focus: honest framing, deterministic formula, stable
          tie-breaks, no false precision."
        - "Escalate if: useful ranking seems to require providers, author
          analytics, cache, AI/ML, or language-aware complexity."
        - "Done boundary: hotspot rows can be produced with stable order, score
          breakdown, confidence, caveats, and evidence."
      verification_commands:
        - zig build test
        - zig build
        - git diff --check
    - id: P4
      depends_on:
        - P3
      status: planned
      title: Table and JSON output contract
      goal: Render hotspot rows as a human table and deterministic JSON, then document
        usage and limitations.
      owner_phase: runner
      execution_context:
        - "Anchors: src/report.zig, src/main.zig, README.md, optional
          docs/cli-spike.md, tests/golden JSON."
        - "In scope: --format table default output, --format json canonical
          output, stable JSON schema, visible caveats, CLI examples,
          limitations, validation command documentation if helpful."
        - "Out of scope: Markdown reports, agent prompt templates, GitHub
          Actions, release automation, public case-study campaign,
          hosted/commercial strategy."
        - "Protected: table and JSON render the same evidence model; JSON fields
          are stable enough for spike tests; docs remain public/OSS-safe and do
          not promise unsupported providers or formats."
        - "Dependencies: P3 hotspot rows."
        - "Validation/evidence: zig fmt --check; zig build test; zig build;
          fixture table and JSON smoke; deterministic JSON diff; jq or
          equivalent JSON validity check if available; prohibited-claims/content
          scan; privacy/local-first scan for author emails, absolute paths,
          fetch/pull/push/telemetry/http."
        - "Review focus: output clarity, schema stability, caveats visibility,
          README polish, no unsupported promises."
        - "Escalate if: docs drift into roadmap/SaaS/sales content, output
          requires a report templating system, or JSON schema needs unresolved
          product decisions."
        - "Done boundary: table and JSON outputs work on fixtures and at least
          one real local repo; limitations are documented; close-out evidence is
          fresh."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build
        - git diff --check
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
          /tmp/git-hotspots-a.json && ./zig-out/bin/git-hotspots --repo
          fixtures/basic --format json > /tmp/git-hotspots-b.json && diff -u
          /tmp/git-hotspots-a.json /tmp/git-hotspots-b.json
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  output_contract:
    primary_output: table
    canonical_validation_output: json
    json_shape:
      schema_version: string
      tool_version: string or placeholder
      analysis:
        repo: project-relative or provided path label
        head: commit oid when available
        range: selected range or full reachable history
        history:
          is_shallow: boolean
          is_partial: boolean
          auto_fetch: false
          analysed_commit_count: number
          earliest_seen_commit: oid or null
      results:
        - path: project-relative path
          score: number
          rank: number
          metrics:
            change_count: number
            churn: number
            additions: number
            deletions: number
            last_changed: commit/timestamp evidence
            current_size: number or null
            co_change_count: number
          confidence: high|medium|low
          caveats:
            - strings
          evidence:
            - bounded evidence records
    prohibited_content:
      - absolute paths in shareable default output
      - author names or emails by default
      - developer ranking
      - bug prediction
      - objective code-quality judgement
      - network/telemetry fields
    consumers:
      - human CLI users
      - tests/golden JSON
      - future agent-ready exporters
