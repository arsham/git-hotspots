design:
  rough_shape:
    - Add a Config progress boolean and parse --progress as an analysis flag.
    - Thread a privacy-safe progress sink through the analysis path and renderer
      boundary without changing report stdout.
    - Emit only bounded coarse phase lines and a final elapsed-time line to
      stderr when --progress is set.
    - Extend validation to prove stdout stability, stderr-only progress, JSON
      validity, privacy-safe progress text, and real-repo close-out smoke.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: CLI progress contract
      goal: Add the --progress analysis flag and configuration contract without
        changing report output or analysis semantics.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig; parser/unit tests near existing
          CLI tests."
        - "In scope: add config progress boolean, parse --progress, document in
          help, reject with --explain and --version, preserve default silent
          success behaviour."
        - "Out of scope: automatic progress, --quiet, timing fields in report
          outputs, streaming parser, cache, performance optimisation, providers,
          network, telemetry."
        - "Protected: existing --repo, --limit, --format, --since, --scope,
          include/exclude, --inspect, --explain, --version, and --help
          behaviours except intentional help text additions."
        - "Dependencies: Feature 0003 validation workflow and existing CLI
          parser structure."
        - "Validation/evidence: parser/unit tests for default disabled, enabled,
          flag-order independence, and invalid standalone combinations."
        - "Review focus: --progress is opt-in, analysis-only, and cannot affect
          stdout by itself."
        - Escalate if requested behaviour becomes automatic progress, TTY
          detection, or changes to report schemas.
        - "Done boundary: CLI accepts --progress for analysis commands, rejects
          invalid combinations, and existing commands without the flag behave as
          before."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: done
      title: Stderr phase feedback
      goal: Emit bounded privacy-safe phase feedback and elapsed timing to stderr only
        when --progress is enabled.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/git.zig, tests/integration.sh."
        - "In scope: thread a progress sink or equivalent through analysis, emit
          coarse phases such as checking repository, reading Git history,
          scoring files, rendering report, and done, with final elapsed time on
          stderr."
        - "Out of scope: percentages, ETA, live commit counts, progress bars,
          spinners, carriage-return updates, streaming git log parsing, changing
          Git stdout limits, scoring changes, report schema changes."
        - "Protected: stdout for table, JSON, and Markdown remains byte-stable;
          scoring, ranking, tie-breaks, confidence, scope filtering,
          include/exclude, inspect, and Git traversal remain unchanged."
        - "Dependencies: P1 configuration contract."
        - "Validation/evidence: integration checks capture stdout and stderr
          separately, compare stdout with and without --progress, assert JSON
          validity, and scan stderr for bounded phase lines and privacy safety."
        - "Review focus: progress never leaks into stdout, never emits paths or
          private evidence, and remains useful despite coarse buffered Git
          history ingestion."
        - Escalate if implementation requires streaming process supervision,
          changing git log arguments, or exposing file/repo paths in progress
          output.
        - "Done boundary: --progress provides visible stderr phase feedback on
          fixture and repo runs while preserving existing stdout reports
          exactly."
      verification_commands:
        - zig build
        - zig build test
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --progress --format
          json > /tmp/git-hotspots-progress.json 2>
          /tmp/git-hotspots-progress.stderr
    - id: P3
      depends_on:
        - P2
      status: done
      title: Validation docs and real-repo smoke
      goal: Make progress feedback durable in validation and public docs with
        privacy-safe close-out evidence.
      owner_phase: runner
      execution_context:
        - "Anchors: tests/integration.sh, tools/validate.sh, README.md,
          docs/real-repo-validation.md only if a privacy-safe note is useful."
        - "In scope: add validation rungs for progress enabled/disabled,
          stdout/stderr separation, stderr privacy scans, standalone mode
          checks, JSON validity, deterministic stdout, this-repo smoke, and
          sibling-local-repo close-out smoke."
        - "Out of scope: CI, release, packaging, cache, providers, performance
          benchmarks, raw sibling reports, private paths, remotes, authors,
          commit messages, source snippets, hosted/commercial plans."
        - "Protected: README stays public and non-judgemental; validation
          summaries use labels and bounded counts only."
        - "Dependencies: P2 progress behaviour."
        - "Validation/evidence: zig build validate, close-out validate with
          sibling-local-repo, git diff --check, prohibited-claim scan, stderr
          privacy scan, clean git status."
        - "Review focus: docs tell users progress is opt-in stderr feedback for
          long runs; validation proves progress helps without changing product
          truth or leaking private information."
        - Escalate if close-out needs private repo names, absolute paths, raw
          report dumps, or broader performance claims.
        - "Done boundary: canonical validation and docs cover --progress,
          real-repo close-out passes, and all committed evidence remains
          privacy-safe."
      verification_commands:
        - zig build validate
        - zig build validate -Dcloseout=true
          -Dsmoke-repo=<operator-provided-local-repo>
          -Dsmoke-label=sibling-local-repo
        - git diff --check
