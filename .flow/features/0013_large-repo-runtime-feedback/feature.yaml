schema: flow-feature.v1
feature:
  id: "0013"
  slug: large-repo-runtime-feedback
  title: Large-repo runtime feedback
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Large local repositories can take long enough to analyse that a user
    may wonder whether git-hotspots is still working. Current reports stay
    deterministic, but the CLI gives no runtime feedback while Git history is
    being read and scored.
  outcome: Add an opt-in --progress analysis flag that writes bounded coarse phase
    and elapsed-time feedback to stderr only. Existing table, JSON, and Markdown
    stdout reports remain byte-stable, local-first, and schema-stable. The
    feature does not add automatic progress, cache, streaming parsing,
    performance optimisation, providers, telemetry, or report timing fields.
  acceptance:
    - --progress is opt-in and successful analysis without it remains
      stderr-silent except pre-existing error behaviour.
    - --progress writes bounded coarse phase messages and a final elapsed-time
      line to stderr only.
    - Table, JSON, and Markdown stdout for equivalent commands are byte-for-byte
      equal with and without --progress.
    - JSON output with --progress remains valid JSON and does not gain timing or
      progress fields.
    - --progress is rejected with --explain and with --version; --help,
      --version, and --explain do not emit progress phase lines.
    - Progress messages do not include repo paths, file paths, raw omitted path
      lists, commit hashes, commit messages, remotes, author identities, source
      snippets, report rows, ANSI spinners, or carriage-return progress bars.
    - --progress works with --repo, --since, --scope, include/exclude prefixes,
      --inspect, and all report formats without changing scoring, filtering,
      ranking, co-change, or inspect behaviour.
    - Help and README document --progress as opt-in local stderr feedback for
      long runs.
    - zig build validate covers progress enabled and disabled, stdout/stderr
      separation, JSON validity with progress enabled, deterministic stdout,
      stderr privacy scans, no progress for standalone modes, this-repo smoke,
      and close-out sibling-local-repo smoke.
    - Close-out evidence records only privacy-safe labels, command shapes,
      pass/fail status, bounded counts, dirty/scope/progress flags, elapsed
      summary, commit count, and tracked-file count for sibling-local-repo.
planning:
  state: ready
  summary: Feature 0013 adds opt-in stderr-only runtime feedback for long
    analyses. --progress prints coarse phase messages and a final elapsed-time
