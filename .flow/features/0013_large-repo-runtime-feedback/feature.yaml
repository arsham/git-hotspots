  acceptance_contract:
    outcome: Add an opt-in --progress analysis flag that writes bounded coarse phase
      and elapsed-time feedback to stderr only. Existing table, JSON, and
      Markdown stdout reports remain byte-stable, local-first, and
      schema-stable. The feature does not add automatic progress, cache,
      streaming parsing, performance optimisation, providers, telemetry, or
      report timing fields.
    acceptance:
      - --progress is opt-in and successful analysis without it remains
        stderr-silent except pre-existing error behaviour.
      - --progress writes bounded coarse phase messages and a final elapsed-time
        line to stderr only.
      - Table, JSON, and Markdown stdout for equivalent commands are
        byte-for-byte equal with and without --progress.
      - JSON output with --progress remains valid JSON and does not gain timing
        or progress fields.
      - --progress is rejected with --explain and with --version; --help,
        --version, and --explain do not emit progress phase lines.
      - Progress messages do not include repo paths, file paths, raw omitted
        path lists, commit hashes, commit messages, remotes, author identities,
        source snippets, report rows, ANSI spinners, or carriage-return progress
        bars.
      - --progress works with --repo, --since, --scope, include/exclude
        prefixes, --inspect, and all report formats without changing scoring,
        filtering, ranking, co-change, or inspect behaviour.
      - Help and README document --progress as opt-in local stderr feedback for
        long runs.
      - zig build validate covers progress enabled and disabled, stdout/stderr
        separation, JSON validity with progress enabled, deterministic stdout,
        stderr privacy scans, no progress for standalone modes, this-repo smoke,
        and close-out sibling-local-repo smoke.
      - Close-out evidence records only privacy-safe labels, command shapes,
        pass/fail status, bounded counts, dirty/scope/progress flags, elapsed
        summary, commit count, and tracked-file count for sibling-local-repo.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --progress --format
        json > /tmp/git-hotspots-progress.json 2>
        /tmp/git-hotspots-progress.stderr
      - zig build validate
      - zig build validate -Dcloseout=true
        -Dsmoke-repo=<operator-provided-local-repo>
        -Dsmoke-label=sibling-local-repo
      - git diff --check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
