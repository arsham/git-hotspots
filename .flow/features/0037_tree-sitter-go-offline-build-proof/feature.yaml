schema: flow-feature.v1
feature:
  id: "0037"
  slug: tree-sitter-go-offline-build-proof
  title: Tree-sitter Go offline build proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The tree-sitter-go source import is proven by provenance, but we have
    not yet proven that the imported parser compiles, links, and parses with the
    existing vendored Tree-sitter core in this Zig build.
  outcome: Add an isolated non-product Go Tree-sitter build proof that compiles
    the vendored Go parser with the existing vendored core, parses a tiny
    in-memory Go snippet, and records local/offline evidence without adding Go
    provider runtime behaviour.
  acceptance:
    - Dedicated command `zig build tree-sitter-go-build-proof` exists and passes.
    - The proof compiles repo-local Tree-sitter core and tree-sitter-go parser
      sources only.
    - The proof parses a tiny in-memory Go snippet and verifies a stable root
      kind without source snippets from private repos.
    - Existing Zig proof commands still pass.
    - No Go provider runtime, CLI/report/schema/scoring/cache behaviour is added.
    - No-provider table, JSON, Markdown, and inspect outputs remain byte-stable.
    - Public evidence documents local/offline build proof, CI decision,
      no-provider stability, and privacy-safe close-out smoke.
planning:
  state: ready
  summary: Add a non-product offline build proof for tree-sitter-go using the
    existing vendored Tree-sitter core. The feature stops before Go symbol
