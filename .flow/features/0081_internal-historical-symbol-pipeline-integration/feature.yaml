    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Feature 0080 proved the internal historical hunk attribution engine in
          isolated fixture paths, but the main analysis pipeline still does not
          know how to feed bounded ranked-file candidates into that engine or
          prove that integration stays local-first, deterministic, privacy-safe,
          and public-output neutral.
      - source_ref: prd.md#problem[2]
        text: Before exposing historical symbol hotspots to users, the project needs an
          internal integration slice that wires the engine into the analysis
          data flow for retained ranked-file candidates, records caveated
          internal evidence, proves bounded performance, and demonstrates that
          existing CLI/report/schema/scoring surfaces do not drift.
      - source_ref: prd.md#outcome[1]
        text: Add an internal/test-only historical symbol pipeline integration. The
          feature should derive a deterministic candidate file set from existing
          file-level analysis results, run the 0080 no-checkout hunk attribution
          engine under explicit bounds, retain internal aggregate evidence and
          caveats in a future-consumable shape, and validate the path with
          fixtures plus real-repository smoke evidence. It must not expose a
          public CLI flag, report field, scoring change, or docs/man promise.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add an internal/test-only historical symbol pipeline integration that
      derives deterministic candidates from retained ranked file results, runs
      the 0080 engine under explicit bounds, retains caveated internal aggregate
      evidence, proves fixture plus real-repo behaviour, and leaves public
      CLI/report/scoring/docs surfaces unchanged.
    acceptance:
      - Internal pipeline code connects existing file-level analysis results to
        the historical hunk attribution engine for bounded retained ranked-file
        candidates; it is callable from tests and future report wiring but not
        exposed through a public CLI flag or report field.
      - Candidate selection is deterministic and respects existing repository,
        range, scope, include, exclude, inspect, and limit semantics without
        rescoring files or widening the evidence universe.
      - Explicit bounds cover candidate files, commits, changed file entries,
        hunks, blob bytes, provider failures, aggregate records, and sample
        commits; exceeded bounds produce internal caveats rather than unbounded
        work.
      - "Integration uses only local Git objects and local provider parsing: no
        checkout of historical commits, fetch, pull, network access, telemetry,
        upload, runtime LLM judgement, or mandatory cache."
      - Internal aggregate evidence preserves parent path, symbol identity when
        available, revision-local range/status, change count, added/deleted
        pressure, latest timestamp, bounded sample commit ids, provider state,
        confidence, caveats, fallback counts, and deterministic sort basis.
      - Existing public CLI behaviour, table/JSON/Markdown reports, explain
        text, current project-symbol reports, current-line history reports,
        file-level scoring/ranking, docs/man promises, and public golden
        fixtures remain unchanged except for internal validation additions.
      - Fixture proof exercises the integrated pipeline path over simple edit,
        deleted symbol/file, rename plus edit, unsupported/provider failure,
        binary skip, large skip, unattributed fallback, truncation caveat, and
        deterministic repeated runs.
      - Real-repository smoke evidence exercises the internal integration on
        this repository with privacy-safe labels and bounded counts only,
        without absolute paths, remotes, author identities, emails, commit
        messages, parser diagnostics, source snippets, or raw private reports.
      - Close-out validation includes git diff whitespace checks, Zig
        formatting, targeted integration proof when added, zig build test, zig
        build validate, public-surface non-regression, and independent review of
        internal-only/local-first/privacy-safe boundaries.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - git diff --check
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify internal-only boundary and public-output non-regression
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - any need for CLI/report/docs/man public output changes
    protected_surfaces:
      - public CLI flags and diagnostics
      - public table JSON and Markdown report schemas
      - file-level score and rank semantics
      - current project-symbol and current-line-history output
      - README user-guide developer-guide and man page public promises
      - privacy-safe validation evidence
  fallback_path: deferred_reconcile_decision
  notes: Feature 0081 is the prerequisite internal pipeline integration for B002.
    It must not expose public CLI/report/docs surfaces; feature 0082 remains
    serially dependent on 0081 close-out.
