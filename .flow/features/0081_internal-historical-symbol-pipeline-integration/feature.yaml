schema: flow-feature.v1
feature:
  id: "0081"
  slug: internal-historical-symbol-pipeline-integration
  title: Internal historical symbol pipeline integration
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Feature 0080 proved the internal historical hunk attribution engine in
    isolated fixtures, but the main analysis pipeline still cannot feed bounded
    ranked-file candidates into it or prove integration performance without
    changing public output.
  outcome: Add an internal/test-only historical symbol pipeline integration that
    derives deterministic candidates from retained ranked file results, runs the
    0080 engine under explicit bounds, retains caveated internal aggregate
    evidence, proves fixture plus real-repo behaviour, and leaves public
    CLI/report/scoring/docs surfaces unchanged.
  acceptance:
    - Internal pipeline code connects existing file-level analysis results to
      the historical hunk attribution engine for bounded retained ranked-file
      candidates; it is callable from tests and future report wiring but not
      exposed through a public CLI flag or report field.
    - Candidate selection is deterministic and respects existing repository,
      range, scope, include, exclude, inspect, and limit semantics without
      rescoring files or widening the evidence universe.
    - Explicit bounds cover candidate files, commits, changed file entries,
      hunks, blob bytes, provider failures, aggregate records, and sample
      commits; exceeded bounds produce internal caveats rather than unbounded
      work.
    - "Integration uses only local Git objects and local provider parsing: no
      checkout of historical commits, fetch, pull, network access, telemetry,
      upload, runtime LLM judgement, or mandatory cache."
    - Internal aggregate evidence preserves parent path, symbol identity when
      available, revision-local range/status, change count, added/deleted
      pressure, latest timestamp, bounded sample commit ids, provider state,
      confidence, caveats, fallback counts, and deterministic sort basis.
    - Existing public CLI behaviour, table/JSON/Markdown reports, explain text,
      current project-symbol reports, current-line history reports, file-level
      scoring/ranking, docs/man promises, and public golden fixtures remain
      unchanged except for internal validation additions.
    - Fixture proof exercises the integrated pipeline path over simple edit,
      deleted symbol/file, rename plus edit, unsupported/provider failure,
      binary skip, large skip, unattributed fallback, truncation caveat, and
      deterministic repeated runs.
    - Real-repository smoke evidence exercises the internal integration on this
      repository with privacy-safe labels and bounded counts only, without
      absolute paths, remotes, author identities, emails, commit messages,
      parser diagnostics, source snippets, or raw private reports.
    - Close-out validation includes git diff whitespace checks, Zig formatting,
      targeted integration proof when added, zig build test, zig build validate,
      public-surface non-regression, and independent review of
      internal-only/local-first/privacy-safe boundaries.
