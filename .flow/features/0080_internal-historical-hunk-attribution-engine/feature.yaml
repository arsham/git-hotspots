    protected_surfaces:
      - public CLI flags and command semantics
      - public table JSON Markdown report schemas
      - file-level scoring and ranking semantics
      - current project-symbol and current-line-history outputs
      - README user guide man page public promises
      - privacy/prohibited-claim validation surfaces
