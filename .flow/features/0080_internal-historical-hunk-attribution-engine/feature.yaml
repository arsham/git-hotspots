          file-level/fallback evidence and add a caveat rather than silently
          continuing unbounded work."
        category: requirement
        packet_refs:
          - P2
        verification: null
        required_for_close_out: true
      - id: REQ-006
        source_ref: prd.md#requirements[6]
        text: "R6: Add a provider byte-input seam for historical snapshots. The seam
