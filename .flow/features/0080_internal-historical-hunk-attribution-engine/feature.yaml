design:
  rough_shape:
    - Add internal historical attribution data models for Git hunk records, blob
      sides, revision-local symbol observations, attribution records, aggregate
      records, confidence/caveats, fallback buckets, and deterministic ordering.
    - Add a provider byte-input seam in provider_selection/tree-sitter common
      code that dispatches by repo-relative path and source bytes, with
      historical input identity based on commit/blob/path and no dependency on
      the working tree at that revision.
    - Add a no-checkout Git hunk/blob reader that uses local Git plumbing or
      local commands to obtain bounded commit/file entries, old/new blob ids,
      and zero-context or otherwise explicit hunk line intervals for candidate
      files.
    - Add an attribution engine that parses old blobs for deleted intervals and
      new blobs for added intervals, intersects line ranges with revision-local
      symbols, records fallback/unattributed evidence, and aggregates stable
      internal results.
    - Add generated fixture repository cases and targeted Zig tests/proof target
      for simple edit, deletion, rename plus edit, provider failure/unsupported,
      binary skip, large skip, unattributed fallback, and deterministic
      ordering.
    - "Keep the feature internal: do not wire results into CLI flags, public
      report schemas, scoring, explain output, docs/man user promises,
      current-symbol output, current-line history, or release/package surfaces."
    - Use docs/historical-symbol-attribution-architecture.md as the
      authoritative architecture constraint, but update public docs only if
      required to clarify that runtime output remains deferred.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Internal model and provider byte-input seam
      goal: Create revision-local historical symbol data structures and a
        provider-neutral source-byte parsing seam without changing current
        public provider/report contracts.
      owner_phase: runner
      execution_context:
        - "Anchors: src/provider.zig, src/provider_selection.zig,
          src/tree_sitter_common.zig, src/tree_sitter_*.zig as needed,
          src/main.zig test imports."
        - "In scope: internal
          HistoricalProviderInput/RevisionSymbolEvidence-style model, historical
          input identity commit/blob/path, source-byte dispatch by supported
          path, provider failure/confidence/caveat propagation, and tests
          proving current-only contracts remain separate."
        - "Out of scope: public report schema, CLI flags, scoring, semantic
          lineage, LSP/ctags providers, dependency/reference providers, parser
          diagnostics or snippets."
        - "Protected: CurrentSymbolEvidence semantics and existing
          inspect/project symbol output must remain current-only and
          backward-compatible."
        - "Dependencies: feature 0079 architecture document is the design
          authority."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test or targeted provider seam tests; existing symbol golden outputs
          unchanged under zig build validate."
        - "Review focus: seam is provider-neutral and future languages inherit
          support through provider registration/source parsing rather than
          per-language history logic."
        - "Escalate if: implementation requires changing public provider
          evidence fields, exposing historical output, or adding semantic
          provider dependencies."
        - "Done boundary: internal historical source parsing can return
          revision-local symbols/provider state from source bytes with
          deterministic identity and no public output drift."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: done
      title: No-checkout Git hunk/blob reader
      goal: Read bounded local Git changed-file, hunk, and blob identity evidence for
        candidate files without checking out historical commits.
      owner_phase: runner
      execution_context:
        - "Anchors: new src/git_hunks.zig or equivalent, src/git_runner.zig,
          src/git.zig/git_log.zig patterns, tools/setup-fixtures.sh for
          generated repos."
        - "In scope: local Git command/plumbing invocation, deterministic
          commit/file/hunk order, old/new blob ids, old/new paths, status,
          binary/missing states, size/commit/file/hunk/provider bounds, caveat
          records, and memory cleanup."
        - "Out of scope: merge-parent policy beyond first-slice
          skip/simplification, public report rendering, full repository-wide
          unbounded traversal, auto-fetch, checkout, persistent cache."
        - "Protected: existing file-level git analyze/log parser behaviour and
          scope/include/exclude semantics must not regress."
        - "Dependencies: P1 types needed for downstream attribution; 0079 Git
          traversal contract."
        - "Validation/evidence: unit/fixture tests over generated local repos;
          zig build test; git diff --check."
        - "Review focus: no checkout, no network, bounded IO/CPU, deterministic
          parsing, privacy-safe caveats."
        - "Escalate if: Git output parsing cannot provide blob ids/hunks
          deterministically without a different contract, or
          merge/partial/shallow handling requires new product decisions."
        - "Done boundary: tests can obtain bounded hunk/blob records for fixture
          commits including modify, delete, rename+edit, binary, and large/skip
          cases."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P3
      depends_on:
        - P1
        - P2
      status: done
      title: Attribution and aggregate engine
      goal: Intersect pre/post hunk line intervals with revision-local symbols and
        produce deterministic caveated internal aggregate evidence.
      owner_phase: runner
      execution_context:
        - "Anchors: new src/historical_symbol_attribution.zig or equivalent,
          src/provider.zig, src/git_hunks.zig, src/main.zig test imports."
        - "In scope: deleted intervals against old/pre-image symbols, added
          intervals against new/post-image symbols, modified as delete+add,
          multiple-symbol overlap, no-symbol fallback, statuses,
          confidence/caveats, bounded sample commit ids, added/deleted pressure,
          recency, deterministic sort."
        - "Out of scope: public scoring replacement, semantic rename/move proof,
          reference/call/dependency graph, cross-file symbol lineage,
          current-line blame replacement."
        - "Protected: no commit messages/authors/source snippets/parser
          diagnostics in aggregate records; no public report wiring."
        - "Dependencies: P1 provider seam and P2 hunk/blob reader."
        - "Validation/evidence: targeted attribution tests for simple edit,
          deletion, unattributed fallback, deterministic sort, and provider
          failure/binary/large caveats."
        - "Review focus: honest fallback instead of fabricated precision; memory
          ownership; deterministic ordering and bounded samples."
        - "Escalate if: attribution needs semantic lineage, nearest-symbol
          guessing, or public output changes to satisfy tests."
        - "Done boundary: internal aggregate proves hunk-to-symbol attribution
          over fixture inputs and can be consumed by future public-report
          shaping."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P4
      depends_on:
        - P1
        - P2
        - P3
      status: done
      title: Fixture proof and validation harness
      goal: Add generated local fixture repositories and proof tests/build integration
        for the first internal historical attribution slice.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/setup-fixtures.sh,
          tests/historical_symbol_attribution_proof.zig or equivalent,
          build.zig, fixtures/ generated directories, tools/validate.sh if a new
          proof target must join validation."
        - "In scope: deterministic fixture commits for simple edit, deleted
          symbol/file, file rename plus edit, unsupported/provider failure,
          binary skip, large skip, no-symbol fallback, deterministic repeated
          run; add targeted build proof if useful; keep evidence public-safe."
        - "Out of scope: raw private reports, sibling repo validation, public
          expected JSON/Markdown report fixtures for historical symbols, broad
          docs/man updates."
        - "Protected: existing fixture setup and integration golden outputs must
          remain stable unless the change is an intentional internal test
          addition."
        - "Dependencies: P1-P3 complete enough for fixtures to exercise real
          code paths."
        - "Validation/evidence: targeted proof target if added; zig build test;
          zig build validate; repeated-run determinism assertion."
        - "Review focus: fixture coverage maps to PRD requirements and does not
          rely on synthetic-only model tests when Git hunk/blob behaviour is
          claimed."
        - "Escalate if: fixture generation requires private paths,
          non-deterministic dates, network/global tooling, or broad
          integration-golden churn."
        - "Done boundary: normal validation proves the internal engine with
          generated local repos and all required fixture cases."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
    - id: P5
      depends_on:
        - P4
      status: done
      title: Close-out public-surface and validation proof
      goal: Run the full close-out ladder and prove the feature remains internal,
        local-first, deterministic, and public-surface safe.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, man/git-hotspots.1,
          tests/integration.sh, tools/validate.sh, fixtures/expected as
          protected surfaces; feature PRD and B002 as comparison basis."
        - "In scope: verify no public CLI/report/schema/scoring behaviour
          changed, run required validation, update only necessary Flow or
          optional clarifying docs, and record privacy/prohibited-claim
          evidence."
        - "Out of scope: starting the next public report feature, closing B002,
          history cleanup, publishing, pushing, or adding sibling private raw
          evidence."
        - "Protected: user-facing docs/help/man/golden outputs should not drift
          unless explicitly justified as internal-test validation maintenance."
        - "Dependencies: P4 fixture proof complete."
        - "Validation/evidence: git diff --check; zig fmt --check build.zig src
          tests; targeted proof; zig build test; zig build validate; independent
          reviewer repeats or inspects key proof."
        - "Review focus: internal-only boundary, acceptance coverage, no
          prohibited claims, no hidden public behaviour drift."
        - "Escalate if: close-out requires changing user-facing CLI/report
          contracts or updating B002 scope beyond this internal engine slice."
        - "Done boundary: feature is ready for independent review and close-out
          with all acceptance rows proven."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
  output_contract:
    primary_deliverable: Internal historical hunk attribution engine plus
      deterministic fixture proof
    storage: Zig source modules, generated local fixtures, tests/build proof
      targets, and Flow artefacts only; no public report schema or persistent
      cache output in this feature.
    allowed_artefacts:
      - src internal modules for Git hunk/blob reading and attribution
      - provider byte-input seam code
      - tests or proof targets for historical attribution
      - generated fixture repository setup in tools/setup-fixtures.sh if needed
      - optional docs note only when needed to prevent overclaiming
    prohibited_public_surfaces:
      - new CLI flags or commands
      - public JSON/Markdown/table report fields
      - file scoring or rank semantics changes
      - current project-symbol output changes
      - current-line history output changes
      - man-page user promises for historical symbol reports
      - persistent cache as product truth
    privacy_prohibited:
      - absolute local paths
      - remotes
      - authors or emails
      - commit messages
      - private repository names
      - source snippets from private repositories
      - parser diagnostics
      - raw private reports
      - ownership/productivity metrics
      - bug prediction
      - code-quality scoring
      - developer ranking
    consumers:
      - unit and fixture tests
      - future public-report feature shaping
      - human maintainers reviewing internal engine behaviour
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
