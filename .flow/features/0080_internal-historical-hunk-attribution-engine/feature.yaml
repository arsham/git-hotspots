schema: flow-feature.v1
feature:
  id: "0080"
  slug: internal-historical-hunk-attribution-engine
  title: Internal historical hunk attribution engine and fixture proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Feature 0079 selected a no-checkout historical blob plus
    hunk-intersection architecture for B002, but git-hotspots still only has
    file-level Git evidence, current-symbol evidence over HEAD/working-tree
    files, and current-line blame over current symbol ranges. The project needs
    the first bounded runtime proof that historical Git hunks can be attributed
    to revision-local symbols without exposing a premature public report surface
    or overclaiming semantic lineage.
  outcome: "Implement an internal/test-only historical hunk attribution slice:
    read bounded local Git hunk/blob evidence without checkout, parse historical
    source bytes through the existing Tree-sitter provider family, intersect
    added/deleted hunk ranges with pre/post revision-local symbols, aggregate
    caveated deterministic internal evidence, and prove the behaviour with
    generated fixtures while leaving public CLI/report/scoring behaviour
    unchanged."
  acceptance:
    - Internal historical hunk attribution code exists behind test/internal
      surfaces only; no public CLI flag, report field, export schema, file
      scoring change, or man-page surface is added.
    - The Git reader obtains local commit/file hunk evidence and old/new blob
      identities without checking out historical commits, fetching, using the
      network, requiring telemetry, or depending on a persistent cache.
    - Git hunk/blob records carry deterministic commit, parent, old/new path,
      old/new blob, change status, ordered hunks, old/new line intervals,
      binary/missing/large/merge states, and caveats where applicable.
    - A provider byte-input seam can parse historical source bytes identified by
      repo-relative path plus commit/blob identity through the existing
      Tree-sitter provider family, while keeping current-only public provider
      evidence separate.
    - Deleted old-line intervals are attributed against pre-image symbols; added
      new-line intervals are attributed against post-image symbols; modified
      hunks are handled as delete plus add; unattributed ranges fall back to
      file/module/unattributed evidence without nearest-symbol guessing.
    - Internal aggregate records include parent file path, symbol kind/name,
      revision-local range, current/historical/deleted/unknown status,
      attributed change count, added/deleted line pressure, recency or latest
      timestamp where available, bounded sample commit ids, provider state,
      confidence, caveats, fallback counts, and deterministic sort inputs.
    - Fixture proof covers simple edit, deleted symbol or deleted file, file
      rename plus edit, unsupported/provider-failure fallback, binary skip,
      large file skip, no-symbol/unattributed fallback, and deterministic
      ordering over repeated runs.
    - Committed artefacts do not include absolute local paths, remotes, authors,
      emails, commit messages, parser diagnostics, source snippets from private
      repositories, private repo names, ownership/productivity metrics, bug
      prediction, code-quality scoring, or developer ranking claims.
    - Existing current CLI, table/JSON/Markdown reports, explain output, current
      project-symbol reports, current-line history reports, file-level
      ranking/scoring, and existing golden fixtures remain unchanged except for
      internal test/build additions.
    - Close-out validation includes git diff whitespace checks, Zig formatting,
      targeted historical attribution proof if added, zig build test, zig build
      validate, and independent review of public-surface non-regression.
