    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Feature 0079 selected the architecture for true historical hunk-to-symbol
          attribution, but the runtime still only has file-level Git evidence,
          current-symbol evidence over HEAD or the working tree, and
          current-line blame evidence over current symbol ranges. The project
          still cannot attribute local Git hunks to revision-local symbols in
          old and new blobs.
      - source_ref: prd.md#problem[2]
        text: "B002 needs this capability to become language-extensible and performant
          without overclaiming semantic lineage. The first runtime slice should
          therefore be an internal engine and fixture proof, not a public report
          change. It must prove the hard parts: no-checkout Git hunk/blob
          reading, a provider byte-input seam, pre/post symbol range
          intersection, confidence/caveats, and deterministic fixture evidence."
      - source_ref: prd.md#outcome[1]
        text: Implement an internal/test-only historical hunk attribution slice. The
          feature should add internal code that can read bounded local Git
          hunk/blob evidence for candidate files without checkout, parse
          historical source bytes through existing Tree-sitter provider logic,
          attribute added and deleted hunk ranges to revision-local symbols,
          aggregate caveated symbol evidence, and prove the behaviour with
          deterministic fixtures.
      - source_ref: prd.md#outcome[2]
        text: The feature must not add a user-facing historical-symbol CLI, public JSON
          or Markdown report fields, file scoring changes, current-symbol output
          changes, current-line history behaviour changes, network access,
          telemetry, remote enrichment, runtime AI judgement, or mandatory cache
          truth.
