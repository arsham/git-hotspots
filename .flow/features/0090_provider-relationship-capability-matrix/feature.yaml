          man page wording, inspect output, and validation assertions can drift
          or overclaim.
      - source_ref: prd.md#outcome[1]
        text: Update the provider capability matrix and validation harness so
          relationship support is explicit per language and kept in sync across
          public documentation, help/explain/inspect surfaces, fixtures, and
          validation. The feature is a claim-safety and drift-prevention slice
          after the TypeScript/JavaScript and Rust provider proofs close.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Update provider capability documentation and validation so relationship
      support is explicit per language and synchronized across public surfaces
      after the provider proofs close.
    acceptance:
      - README, user guide, developer guide, man page, and provider capability
        text accurately distinguish symbol, current-line history,
        historical-symbol, and relationship support per language.
      - Unsupported, internal-only, and public opt-in relationship support are
        distinguished clearly.
      - Help, explain, inspect, and validation checks prevent provider
        capability claim drift.
      - --symbol-relationships remains opt-in, requires --symbols, is
        local-only, and has no scoring effect.
      - JSON, Markdown, and table fixture checks cover provider list, caveats,
        deterministic ordering, omitted counts, and privacy constraints after
        language expansion.
      - Default output compatibility is preserved when --symbol-relationships is
        not requested.
      - B002 records the durable matrix/validation rule for future relationship
        providers but is not closed.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - zig build test
      - flow validate --target feature:0090
      - flow validate --target brief:B002
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces:
      - new provider implementation
      - new CLI flags
      - new report schema
      - scoring/ranking
      - network/telemetry
      - cache truth
      - browser UI
  fallback_path: deferred_reconcile_decision
  notes: null
