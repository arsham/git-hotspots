intent:
  problem: Lua source import alone does not prove the vendored parser and scanner
    compile and link against the repository Tree-sitter core. The build boundary
    must be proven before query, extraction, or runtime inspect work proceeds.
  outcome: A deterministic offline Lua parser/scanner build proof exists using
    only repository-local vendored inputs and the existing Tree-sitter core,
    while Lua runtime provider behaviour remains absent.
  acceptance:
    - Add a deterministic offline build proof for the Lua parser/scanner sources
      imported by Feature 0065.
    - Use the existing vendored Tree-sitter core and stop if a core update is
      required.
    - Record public evidence for source paths, proof targets, validation,
      no-provider stability, and privacy-safe smoke validation.
    - Preserve no Lua runtime provider, inspect output, query fixtures,
      extraction, default report, schema, scoring, cache, CI, package/release,
      LuaRocks, module/package-path, LSP, network, telemetry, upload, or
      remote-enrichment behaviour.
    - Stop as blocked if Feature 0065 did not leave an exact vendored source
      path or the build cannot be proven from repository-local inputs.
