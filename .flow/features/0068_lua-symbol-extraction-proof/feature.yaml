feature:
  id: "0068"
  slug: lua-symbol-extraction-proof
  title: Lua symbol extraction proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: A Lua query contract proves captures, but current symbol evidence needs
    a separate internal extraction proof before user-facing Lua inspect output
    can be trusted.
  outcome: Lua query captures map into the existing symbol evidence model
    deterministically in proof targets, with names, kinds, ranges, ordering,
    caveats, metadata, and failure states proven while runtime Lua output
    remains absent.
  acceptance:
    - Map approved Lua query captures into internal symbol evidence in
      deterministic proof targets.
    - Prove names, kinds, source/display ranges, ordering, duplicate handling,
      provider/query metadata, confidence/caveat states, parse failures,
      unsupported paths, empty/invalid files, and ambiguous dynamic Lua cases.
    - Document supported mappings, skipped mappings, caveats, proof target
      names, validation commands, and runtime-not-implemented status.
    - Preserve no user-facing Lua inspect output, provider registry, default
      report, report schema, scoring, cache, LuaRocks/package/module analysis,
      LSP, network, telemetry, upload, or remote enrichment.
    - Stop for planning if extraction requires new public symbol kinds, parser
      files outside the admitted BOM, or runtime/module interpretation.
