schema: flow-feature.v1
feature:
  id: "0009"
  slug: public-alpha-readiness
  title: Public alpha readiness
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The repository has a useful local CLI alpha, but it is not ready for
    public OSS use because it lacks an explicit license, still reports the spike
    version marker, has no `--version` surface, and does not yet document alpha
    install and contribution expectations.
  outcome: Prepare the repository for a narrow source-available public alpha by
    adding Apache-2.0 licensing, alpha version identity, `--version`, minimal
    install and contribution docs, and alpha readiness validation without adding
    packaging, release automation, CI, hosted strategy, or new hotspot analysis
    behaviour.
  acceptance:
    - A root `LICENSE` file contains the Apache-2.0 license with copyright
      holder `Arsham Shirvani` and year `2026` recorded in the repo where
      appropriate.
    - README includes a compact license note, alpha status, install-from-source
      guidance, Git/Zig prerequisites, current limitations, and validation
      guidance without promising packaged releases or hosted services.
    - "A lightweight `CONTRIBUTING.md` explains the alpha contribution posture:
      issues and small focused PRs are welcome, contributors should run `zig
      build validate`, and changes must preserve local-first/no-telemetry
      defaults and avoid diagnostic overclaims."
    - Version identity is centralised in source and the public alpha version is
      `0.1.0-alpha.1`; JSON and Markdown report metadata use that version.
    - "`git-hotspots --version` exits 0 outside a Git repository, prints a
      deterministic version line, and rejects analysis-flag combinations clearly
      if the implementation chooses standalone semantics."
    - Existing analysis behaviour, scoring, filtering, report schemas apart from
      intentional version metadata, fixtures, and validation outputs remain
      stable.
    - Public docs and runtime text do not add commercial, SaaS, hosted-product,
      pricing, sales, bug-prediction, objective quality-score,
      technical-debt-score, author-metric, maintainer-judgement,
      developer-ranking, productivity-analytics, or AI/LLM-judgement claims.
    - Public alpha readiness does not add package registries, binary release
      automation, Homebrew, GitHub Actions, release tags, provider/cache design,
      network access, telemetry, upload, remote enrichment, or author metrics.
    - Close-out evidence includes `zig build validate`, close-out validation
      with a privacy-safe sibling smoke repo or explicit approved skip reason,
      help/version/explain smoke, install-from-source smoke in a clean
      disposable copy, docs/prohibited-claim scans, license/version checks, and
      git hygiene checks.
