  acceptance_contract:
    outcome: Prepare the repository for a narrow source-available public alpha by
      adding Apache-2.0 licensing, alpha version identity, `--version`, minimal
      install and contribution docs, and alpha readiness validation without
      adding packaging, release automation, CI, hosted strategy, or new hotspot
      analysis behaviour.
    acceptance:
      - A root `LICENSE` file contains the Apache-2.0 license with copyright
        holder `Arsham Shirvani` and year `2026` recorded in the repo where
        appropriate.
      - README includes a compact license note, alpha status,
        install-from-source guidance, Git/Zig prerequisites, current
        limitations, and validation guidance without promising packaged releases
        or hosted services.
      - "A lightweight `CONTRIBUTING.md` explains the alpha contribution
        posture: issues and small focused PRs are welcome, contributors should
        run `zig build validate`, and changes must preserve
        local-first/no-telemetry defaults and avoid diagnostic overclaims."
      - Version identity is centralised in source and the public alpha version
        is `0.1.0-alpha.1`; JSON and Markdown report metadata use that version.
      - "`git-hotspots --version` exits 0 outside a Git repository, prints a
        deterministic version line, and rejects analysis-flag combinations
        clearly if the implementation chooses standalone semantics."
      - Existing analysis behaviour, scoring, filtering, report schemas apart
        from intentional version metadata, fixtures, and validation outputs
        remain stable.
      - Public docs and runtime text do not add commercial, SaaS,
        hosted-product, pricing, sales, bug-prediction, objective quality-score,
        technical-debt-score, author-metric, maintainer-judgement,
        developer-ranking, productivity-analytics, or AI/LLM-judgement claims.
      - Public alpha readiness does not add package registries, binary release
        automation, Homebrew, GitHub Actions, release tags, provider/cache
        design, network access, telemetry, upload, remote enrichment, or author
        metrics.
      - Close-out evidence includes `zig build validate`, close-out validation
        with a privacy-safe sibling smoke repo or explicit approved skip reason,
        help/version/explain smoke, install-from-source smoke in a clean
        disposable copy, docs/prohibited-claim scans, license/version checks,
        and git hygiene checks.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build run -- --help
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
