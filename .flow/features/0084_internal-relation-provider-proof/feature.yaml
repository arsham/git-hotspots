      - Unresolved targets remain explicit unresolved endpoints with caveats
        rather than fabricated mappings.
      - Unsupported language, parser failure, oversized input, cap reached, and
        provider unavailable cases degrade without breaking existing hotspot
        analysis.
      - Existing public CLI flags, help, report schemas, explain output,
        scoring, ranking, docs, packaging, and cache truth do not change.
      - Fixtures prove relation kinds, unresolved targets, nested contains,
        import/include, unsupported/failure/cap cases, and deterministic
        ordering.
      - B002 is linked and validates; independent delegated review is required
        for close-out.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - git diff --check
      - zig build validate
      - flow validate --target feature:0084
      - flow validate --target brief:B002
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
