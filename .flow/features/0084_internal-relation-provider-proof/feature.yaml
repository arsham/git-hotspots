schema: flow-feature.v1
feature:
  id: "0084"
  slug: internal-relation-provider-proof
  title: Internal relation provider proof
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: The relationship architecture exists, but git-hotspots has no runtime
    proof that a local provider can emit relation candidates safely. Without a
    narrow internal proof, public relation output would risk overclaiming
    call-graph truth, widening runtime cost, or duplicating provider-specific
    aggregation logic.
  outcome: Add an internal/test-only provider-neutral relation model and one
    bounded local Tree-sitter-backed provider proof. It must emit caveated
    relation candidates for a small set of relation kinds while preserving all
    public CLI/report/scoring surfaces.
  acceptance:
    - Internal provider-neutral relation model and one syntax provider proof
      exist with test-only or inspect-internal access.
    - Relation kinds cover contains, reference, call, import_include,
      unresolved, and unknown where honestly supported by the selected provider
      proof.
    - Unresolved targets remain explicit unresolved endpoints with caveats
      rather than fabricated mappings.
    - Unsupported language, parser failure, oversized input, cap reached, and
      provider unavailable cases degrade without breaking existing hotspot
      analysis.
    - Existing public CLI flags, help, report schemas, explain output, scoring,
      ranking, docs, packaging, and cache truth do not change.
    - Fixtures prove relation kinds, unresolved targets, nested contains,
      import/include, unsupported/failure/cap cases, and deterministic ordering.
    - B002 is linked and validates; independent delegated review is required for
      close-out.
