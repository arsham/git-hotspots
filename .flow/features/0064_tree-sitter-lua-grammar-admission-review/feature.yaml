schema: flow-feature.v1
feature:
  id: "0064"
  slug: tree-sitter-lua-grammar-admission-review
  title: Tree-sitter Lua grammar admission review
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Lua is one of the original language interests and is likely simpler
    than Rust, but a future provider still needs admission before source import
    or runtime work. Lua symbol extraction must handle table-oriented patterns
    without implying runtime execution, module resolution, package loading, LSP,
    dependency analysis, or repo-wide symbol scans.
  outcome: Add a documentation-only Lua grammar admission review that records
    upstream identity, Lua scope, license, generated parser and scanner
    provenance, Tree-sitter core compatibility, BOM, source-size, query,
    fixture, monorepo, and validation gates.
  acceptance:
    - Add docs/tree-sitter-lua-grammar-admission.md as the single public
      admission review artefact.
    - The document records candidate upstream identity for tree-sitter-lua,
      immutable revision or blocker, checksum requirement, proposed vendored
      path, BOM expectations, excluded file classes, and Tree-sitter core
      compatibility requirements.
    - The document records license and notice gates, generated parser and
      scanner provenance gates, local-first build supply-chain gates,
      source-size and build-impact gates, query fixture expectations, and
      no-provider stability gates for future Lua work.
    - The document states Lua runtime support is not implemented and current
      runtime Tree-sitter support remains limited to already implemented
      inspect-only languages.
    - The document frames future Lua symbols as optional, current-only,
      inspect-oriented, additive, caveated provider evidence.
    - The document records monorepo behaviour as inspect-path-only and
      extension-based; it must not imply require/module resolution, package path
      analysis, runtime execution, LSP, dependency graph, or repo-wide scanning.
    - No third_party, source, test, fixture, build, CI, CLI, report schema,
      scoring, cache, provider runtime, provider registry, release, package,
      network, telemetry, or background behaviour changes are made.
