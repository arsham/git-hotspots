schema: flow-feature.v1
feature:
  id: "0069"
  slug: inspect-only-lua-symbol-output
  title: Inspect-only Lua symbol output
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Lua source, build, query, and extraction proofs do not expose
    user-visible symbols. Runtime exposure must be a narrow inspect-only step
    that preserves default file-level reports and existing provider behaviour.
  outcome: Explicit inspect-symbol requests for .lua paths produce deterministic
    current Lua symbol evidence with caveats and provider metadata, while
    default reports and existing provider outputs remain stable.
  acceptance:
    - Wire Lua into inspect-only symbol output for explicitly requested .lua
      paths.
    - Preserve default table, JSON, Markdown, no-provider, and existing language
      symbol outputs.
    - Emit current-only optional provider evidence with provider metadata,
      caveats, deterministic ordering, and sanitized diagnostics.
    - Support JSON, Markdown, and table inspect outputs consistently with
      existing providers, including escaping Markdown-sensitive names and paths.
    - Do not add module/package/require resolution, LuaRocks, runtime execution,
      dependency inference, LSP, schema/scoring/cache changes, network,
      telemetry, upload, or remote enrichment.
