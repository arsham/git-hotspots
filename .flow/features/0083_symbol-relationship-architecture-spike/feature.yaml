    supporting_context:
      - source_ref: prd.md#problem[1]
        text: 'git-hotspots can now expose current symbol evidence, historical
          hunk-to-symbol attribution, and an opt-in historical symbol hotspot
          report. The next B002 capability question is how to answer: "which
          symbols are referenced by, used by, or otherwise related to hot
          places?"'
      - source_ref: prd.md#problem[2]
        text: That question is useful for investigation and agent handoff, but it is
          also risky. Relation evidence can easily be mistaken for a full call
          graph, dependency graph, type-aware semantic truth, ownership, bug
          prediction, or code-quality scoring. The project needs a
          provider-neutral architecture before adding runtime relation analysis
          or public CLI output.
      - source_ref: prd.md#outcome[1]
        text: Produce a documentation-only architecture spike at
          docs/symbol-relationship-architecture.md. The document should define a
          local-first, deterministic, provider-neutral relation evidence model
          that can attach future reference/use/dependency-like evidence to
          existing file, current-symbol, and historical-symbol hotspot results
          without changing scoring truth or public runtime behaviour in this
          feature.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Produce docs/symbol-relationship-architecture.md as a
      documentation-only architecture spike for deterministic, local-first,
      provider-neutral relation evidence attached to existing hotspot results.
      The feature must not add runtime relation analysis, public CLI/report
      fields, scoring changes, dependencies, cache truth, or output changes.
    acceptance:
      - Architecture document exists at docs/symbol-relationship-architecture.md
        and is the only product artefact added by this feature.
      - The document defines relation evidence as optional investigation context
        attached to file, current-symbol, and historical-symbol hotspot results,
        not as scoring truth, bug prediction, ownership, code-quality judgement,
        or semantic certainty.
      - The design is provider-neutral and covers relation provider
        inputs/outputs, endpoint identities, relation kinds,
        confidence/freshness/failure/caveats, deterministic aggregation, and
        performance limits.
      - The design compares candidate approaches and selects a narrow
        local-first first runtime successor without adding runtime
        implementation in this feature.
      - No CLI flags, report schema, fixtures, runtime provider execution,
        dependencies, cache files, scoring changes, or browser-visible UI work
        are added.
      - B002 is linked and updated with the durable relation-architecture
        decision, but B002 is not closed.
      - Validation includes git diff whitespace checks, Flow feature and brief
        validation, zig build validate, and independent review.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - flow validate --target feature:0083
      - flow validate --target brief:B002
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify architecture document against dispatch comparison basis
      - confirm no public runtime or report surface changed
  decision_budget:
    allowed_local_decisions:
      - safe documentation structure choices inside
        docs/symbol-relationship-architecture.md
      - local wording changes that preserve evidence-only and local-first
        constraints
    deferred_reconcile_triggers:
      - minor non-contract documentation trade-off worth reviewer visibility
      - successor implementation recommendation refinement that stays inside
        acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - any CLI/report/runtime/scoring/cache/network change
      - claims of call graph truth ownership bug prediction code quality or
        developer ranking
    protected_surfaces:
      - docs/symbol-relationship-architecture.md only product deliverable
      - no CLI flags
      - no report schema fields
      - no runtime provider execution
      - no scoring or ranking changes
      - no cache truth
      - no network telemetry remote enrichment or hosted services
  fallback_path: deferred_reconcile_decision
  notes: null
