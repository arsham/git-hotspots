feature:
  id: "0083"
  slug: symbol-relationship-architecture-spike
  title: Symbol relationship architecture spike
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: git-hotspots can expose current symbol evidence, historical
    hunk-to-symbol attribution, and an opt-in historical symbol report, but it
    does not yet have a safe architecture for answering which symbols are
    referenced by, used by, or related to hot places. Without a provider-neutral
    design, relation evidence risks being mistaken for a full call graph,
    dependency graph, ownership signal, bug prediction, or code-quality score.
  outcome: Produce docs/symbol-relationship-architecture.md as a
    documentation-only architecture spike for deterministic, local-first,
    provider-neutral relation evidence attached to existing hotspot results. The
    feature must not add runtime relation analysis, public CLI/report fields,
    scoring changes, dependencies, cache truth, or output changes.
  acceptance:
    - Architecture document exists at docs/symbol-relationship-architecture.md
      and is the only product artefact added by this feature.
    - The document defines relation evidence as optional investigation context
      attached to file, current-symbol, and historical-symbol hotspot results,
      not as scoring truth, bug prediction, ownership, code-quality judgement,
      or semantic certainty.
    - The design is provider-neutral and covers relation provider
      inputs/outputs, endpoint identities, relation kinds,
      confidence/freshness/failure/caveats, deterministic aggregation, and
      performance limits.
    - The design compares candidate approaches and selects a narrow local-first
      first runtime successor without adding runtime implementation in this
      feature.
    - No CLI flags, report schema, fixtures, runtime provider execution,
      dependencies, cache files, scoring changes, or browser-visible UI work are
      added.
    - B002 is linked and updated with the durable relation-architecture
      decision, but B002 is not closed.
    - Validation includes git diff whitespace checks, Flow feature and brief
      validation, zig build validate, and independent review.
