    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Rust Tree-sitter work has reached the point where admission, source
          import, offline build proof, and a test-only Rust query contract
          exist, but the runtime CLI still does not expose Rust as an
          inspect-only symbol provider. Public help, README, user guide, man
          page, explanation text, capability-matrix validation, and provider
          selection currently list Zig, Go, Python, JavaScript, Lua, TypeScript,
          and TSX but omit Rust.
      - source_ref: prd.md#problem[2]
        text: "That leaves the Rust lane in an awkward half-complete state: the
          repository has vendored Rust grammar evidence and query fixtures,
          while users and downstream agents cannot ask for deterministic current
          Rust symbol evidence through the normal --inspect PATH --symbols
          path."
      - source_ref: prd.md#outcome[1]
        text: Complete the first runtime Rust provider lane by adding inspect-only,
          current-working-tree Rust symbol evidence for repo-relative .rs files,
          backed by the already-vendored tree-sitter-rust source and
          project-owned Rust query contract. The feature keeps Rust provider
          output additive to file-level Git history, includes current-line Git
          evidence when the existing --symbol-line-history flag is requested,
          and updates docs, help, fixtures, validation, and provider capability
          matrices so public claims match runtime behaviour.
      - source_ref: prd.md#outcome[2]
        text: "Rust support remains narrow: no Cargo, crate graph, module resolution,
          macro expansion, cfg evaluation, type checking, LSP, dependency
          analysis, true symbol history, scoring changes, cache requirement,
          repo-wide scanning, network access, telemetry, upload, or remote
          enrichment."
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 4 refs outside default requirement rows.
  acceptance_contract:
    outcome: git-hotspots supports inspect-only, current-working-tree Rust symbol
      evidence for repo-relative .rs files through the normal --inspect PATH
      --symbols path, with existing current-line Git evidence available through
      --symbol-line-history. Rust output is deterministic, additive provider
      enrichment with provenance, confidence, freshness, failure state, caveats,
      privacy-safe failures, synchronized docs/help/tests, and no Cargo,
      semantic Rust, scoring, cache, network, telemetry, upload, or repo-wide
      behaviour.
    acceptance:
      - Product runtime contains a Rust Tree-sitter extractor for repo-relative
        .rs inspect paths using only vendored Tree-sitter core and
        tree-sitter-rust sources plus a project-owned query asset.
      - Rust provider evidence reports provider name, version, contract version,
        query/config fingerprint, local input identity, freshness, failure
        state, confidence, local provenance, and caveats in the existing
        provider model.
      - --inspect PATH --symbols emits current-only Rust symbol evidence for .rs
        files after normal inspect scoring and scope selection, without changing
        score, rank, confidence, co-change evidence, Git rename lineage,
        selected scope, include/exclude semantics, or report schemas.
      - Rust symbol mapping covers source-file module rows, inline or external
        modules, freestanding functions, impl and trait methods, structs, tuple
        structs, unit structs, enums, traits, consts, statics, and enum variants
        where the query can name them syntactically.
      - Unsupported, unavailable, too-large, symlinked, missing, empty, invalid,
        partial, generated, macro-heavy, cfg-heavy, and external-module Rust
        cases are deterministic and caveated without parser diagnostics, source
        snippets, absolute paths, remotes, author identities, commit messages,
        private repo names, or raw private reports.
      - --inspect PATH --symbols --symbol-line-history works for Rust symbols
        through the existing current-line Git evidence path and remains
        current-line evidence for HEAD ranges, not true symbol history, semantic
        lineage, ownership, git log -L, scoring, or bug prediction.
      - README.md, docs/user-guide.md, docs/developer-guide.md,
        man/git-hotspots.1, terminal help, --explain output,
        tests/integration.sh, tools/validate.sh, and capability-matrix
        validation all agree on Rust support and its boundaries.
      - Validation includes Rust symbol proof, runtime fixture outputs for
        JSON/Markdown/table, symbol-limit and current-line history coverage,
        validate-all provider proof aggregation, prohibited-claim/privacy scans,
        and privacy-safe real-repository smoke evidence.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig fmt --check build.zig src tests
      - zig build tree-sitter-rust-build-proof
      - zig build tree-sitter-rust-query-proof
      - zig build tree-sitter-rust-symbol-proof
      - zig build test
      - for file in tools/*.sh tests/*.sh; do sh -n "$file" || exit 1; done
      - zig build validate
      - zig build validate-all
      - focused Rust --inspect PATH --symbols JSON/Markdown/table smoke
      - focused Rust --inspect PATH --symbols --symbol-line-history
        JSON/Markdown/table smoke
      - zig build validate -Dcloseout=true -Dsmoke-label=<privacy-safe-label>
        -Dsmoke-repo=<local-sibling-path> or documented accepted skip reason
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify docs help explain man tests validation and runtime output agree
        on Rust capability and boundaries
      - verify Rust line-history remains current-line evidence only
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - need for Cargo workspace crate module macro cfg type LSP dependency
        graph or non-local input analysis
      - need for report schema scoring cache network telemetry upload repo-wide
        provider release or package scope
    protected_surfaces:
      - src/provider_selection.zig and build.zig provider wiring
      - src/tree_sitter_rust.zig and src/queries/rust-symbols.scm
      - README.md docs/user-guide.md docs/developer-guide.md man/git-hotspots.1
        src/cli.zig src/explain.zig
      - tests/integration.sh tools/validate.sh tools/setup-fixtures.sh
        fixtures/expected
      - provider privacy local-first non-claim boundaries
      - no-provider outputs and non-Rust provider outputs
  fallback_path: deferred_reconcile_decision
  notes: "Judge review synthesis chose one standard feature with two serial
    packets: P1 product Rust extractor/proof and P2 runtime Rust --symbols plus
    --symbol-line-history with docs fixtures validation and smoke evidence.
    Splitting line history separately was rejected because the current
    line-history path attaches generically after symbols exist."
