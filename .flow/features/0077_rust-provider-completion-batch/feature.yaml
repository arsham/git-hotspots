design:
  rough_shape:
    - "Reuse prior Rust prerequisites: 0063 admission, 0071 source import, 0072
      offline build proof, and 0073 query contract. Do not redo source
      admission/build/query planning inside this feature."
    - Add src/tree_sitter_rust.zig and src/queries/rust-symbols.scm by adapting
      the test-only Rust query proof into production provider extraction
      patterns used by Lua/TypeScript, preserving Rust-specific caveats.
    - Add an internal Rust symbol proof step that exercises the product
      extractor against local fixtures before runtime provider selection is
      wired.
    - Wire provider_selection and addTreeSitterProviders so .rs inspect paths
      use Rust only after normal inspect matching; no-provider output and
      unsupported fallback semantics must stay stable.
    - Because current-line history attaches language-agnostically after symbol
      ranges exist, complete Rust --symbols and Rust --symbol-line-history in
      the same runtime packet rather than half-shipping Rust symbols without
      line-history docs/tests.
    - Update public docs/help/explain/man and validation matrices in the same
      packet as runtime wiring so supported-language claims never drift.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Rust product extractor and symbol proof
      goal: Create the product Rust Tree-sitter extraction module and proof target
        without exposing runtime Rust symbols yet.
      owner_phase: runner
      execution_context:
        - "Anchors: src/tree_sitter_rust.zig, src/queries/rust-symbols.scm,
          tests/tree_sitter_rust_symbol_proof.zig,
          tests/fixtures/tree_sitter_rust_query/* or a product rust-symbol
          fixture copy, build.zig, docs/tree-sitter-rust-query-contract.md."
        - "In scope: adapt the proven Rust query contract into production
          extraction code, provider metadata/version/fingerprint, deterministic
          symbol ordering/ranges, failure/caveat handling, fixture-backed symbol
          proof, and validate-all proof dependency."
        - "Out of scope: provider_selection runtime wiring, public help/docs
          Rust claims, report schema changes, scoring,
          Cargo/workspace/crate/module resolution, macro expansion, cfg
          evaluation, type checking, LSP, custom user queries, cache, network,
          telemetry, upload, repo-wide scans."
        - "Protected: existing no-provider outputs and non-Rust provider
          outputs; Rust proof uses repository-local vendored Tree-sitter sources
          only; failure output remains privacy-safe."
        - "Dependencies: completed Rust admission/source/build/query features
          0063, 0071, 0072, and 0073; existing provider model and Tree-sitter
          common helpers."
        - "Validation/evidence: git diff --check; zig fmt --check build.zig src
          tests; zig build tree-sitter-rust-build-proof; zig build
          tree-sitter-rust-query-proof; zig build tree-sitter-rust-symbol-proof;
          zig build test or narrower equivalent if P1 does not touch runtime
          selection."
        - "Review focus: product extractor faithfully preserves the query
          contract, caveats semantic Rust limits, owns memory safely, and does
          not expose runtime claims prematurely."
        - "Escalate if: the product extractor needs new public schema fields,
          custom user queries, semantic Rust analysis, Cargo/module data, core
          Tree-sitter updates, or non-local inputs."
        - "Done boundary: Rust extraction proof passes using product code,
          validate-all can depend on it, and runtime CLI still has no
          unsupported public Rust claim drift."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build tree-sitter-rust-build-proof
        - zig build tree-sitter-rust-query-proof
        - zig build tree-sitter-rust-symbol-proof
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: done
      title: Runtime Rust symbols, line history, docs, and validation
      goal: Wire Rust into inspect-only runtime provider selection and align public
        docs, fixtures, validation, and real-repository smoke evidence for both
        --symbols and --symbol-line-history.
      owner_phase: runner
      execution_context:
        - "Anchors: src/provider_selection.zig, build.zig
          addTreeSitterProviders, src/cli.zig, src/explain.zig, README.md,
          docs/user-guide.md, docs/developer-guide.md, man/git-hotspots.1,
          tests/integration.sh, tools/setup-fixtures.sh, tools/validate.sh,
          fixtures/expected/*rust*."
        - "In scope: .rs provider selection, runtime JSON/Markdown/table Rust
          symbol outputs, symbol-limit behaviour, current-line history for Rust
          ranges, unsupported/unavailable/invalid/generate/cfg/macro caveats,
          rename aliases, docs/help/explain/man language lists, capability
          matrix checks, prohibited-claim/privacy scans, validate-all
          aggregation, and privacy-safe real-repo smoke evidence."
        - "Out of scope: new CLI flags, report schema changes beyond existing
          provider data, scoring or ranking changes,
          Cargo/workspace/crate/module resolution, macro expansion, cfg/feature
          evaluation, type checking, LSP, dependency graphs, true symbol
          history, ownership, cache, network, telemetry, upload, release/package
          work."
        - "Protected: successful non-Rust reports and no-provider inspect
          outputs remain stable; --help and --explain remain repo-independent;
          Rust line-history wording says current-line Git evidence only; public
          docs remain OSS/local-first and avoid quality/developer judgement
          claims."
        - "Dependencies: P1 product extractor proof; existing language-agnostic
          current-line history path; existing docs/help drift rules."
        - "Validation/evidence: git diff --check; zig fmt --check build.zig src
          tests; sh -n tools/*.sh tests/*.sh when shell changes; zig build test;
          focused Rust runtime smokes for --symbols and --symbols
          --symbol-line-history in JSON/Markdown/table; zig build validate; zig
          build validate-all; close-out validation with this-repo plus a
          privacy-safe sibling/local smoke or explicit accepted unavailable
          reason."
        - "Review focus: docs, help, explain, matrix validation, and runtime
          output agree exactly; Rust support is useful but narrow; no semantic
          Rust or true-history claim leaks into public artefacts."
        - "Escalate if: runtime support cannot be validated without broad schema
          changes, new CLI semantics, semantic Rust analysis, package/module
          resolution, network access, private output, or unrelated
          provider/cache/release changes."
        - "Done boundary: Rust appears consistently in runtime provider output
          and public capability surfaces, all validation gates pass, and
          privacy-safe smoke evidence is recorded without committing absolute
          local paths or raw private reports."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - for file in tools/*.sh tests/*.sh; do sh -n "$file" || exit 1; done
        - zig build tree-sitter-rust-symbol-proof
        - zig build test
        - zig build validate
        - zig build validate-all
        - focused Rust --inspect PATH --symbols JSON/Markdown/table smoke
        - focused Rust --inspect PATH --symbols --symbol-line-history
          JSON/Markdown/table smoke
        - zig build validate -Dcloseout=true -Dsmoke-label=<privacy-safe-label>
          -Dsmoke-repo=<local-sibling-path> or documented accepted skip reason
  output_contract:
    artifacts:
      - src/tree_sitter_rust.zig product extractor
      - src/queries/rust-symbols.scm project-owned runtime Rust query
      - tests/fixtures rust-symbol fixture repo and expected JSON/Markdown/table
        outputs
      - build.zig Rust symbol proof wiring and validate-all dependency
      - updated help/explain/README/user-guide/developer-guide/man capability
        claims
      - tools/validate.sh capability, privacy, prohibited-claim, and real-smoke
        coverage
    prohibited_content:
      - Cargo or crate graph analysis claims
      - module resolution or macro expansion claims
      - type checking or LSP claims
      - true symbol history, ownership, scoring, bug-prediction, or
        developer-ranking claims
      - parser diagnostics or source snippets in failures
      - absolute local paths, remotes, author identities, commit messages, raw
        private reports, private repo names
      - network access, telemetry, upload, remote enrichment, cache
        requirements, or repo-wide provider scans
    consumers:
      - CLI users inspecting Rust files
      - coding agents consuming deterministic reports
      - Flow runner/reviewer
      - future provider work
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
