  acceptance_contract:
    outcome: A design-only strategy document defines how future Tree-sitter
      languages and query support may be admitted without changing runtime
      behaviour in this feature.
    acceptance:
      - Add one strategy document for Tree-sitter multi-language and query
        support.
      - The document covers Go, Python, Lua, JavaScript, TypeScript, Rust, Node
        as JavaScript or TypeScript runtime context, monorepos, and future
        grammars.
      - The document defines language admission criteria, query ownership,
        built-in query requirements, deterministic language detection, provider
        failure states, validation gates, and future sequencing.
      - Custom user query execution is explicitly deferred unless a later
        feature accepts a safe local-only contract.
      - The strategy preserves inspect-only provider execution by default and
        does not introduce repo-wide provider scanning.
      - The strategy preserves file-level Git evidence as product truth and
        keeps provider evidence additive, current-only, caveated, and optional.
      - No runtime, source, test, fixture, build, third-party, CLI, report
        schema, scoring, cache, CI, release, or package behaviour changes are
        made.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands: []
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
