design:
  rough_shape:
    - Add docs/tree-sitter-multi-language-query-strategy.md as a strategy and
      admission contract.
    - Keep the feature docs-only and use it to sequence future one-language
      provider spikes.
    - Defer custom query execution while defining the safe contract it would
      need.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: false
  packets:
    - id: P1
      title: Multi-language and query strategy document
      goal: Add one docs-only strategy artefact for future Tree-sitter language
        admission, built-in query ownership, monorepo behaviour, and deferred
        custom query support.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: docs/tree-sitter-multi-language-query-strategy.md,
          docs/provider-symbol-evidence-contract.md,
          docs/tree-sitter-zig-provider-spike.md."
        - "In scope: define language admission criteria, language priority,
          deterministic path-based detection, built-in query ownership, capture
          schema, symbol-kind mapping, failure states, validation gates,
          monorepo inspect-only behaviour, and custom-query deferral contract."
        - "In scope: cover Go, Python, Lua, JavaScript, TypeScript, Rust, and
          Node as JavaScript or TypeScript runtime context, without claiming
          runtime support exists yet."
        - "Out of scope: new grammar imports, source/build/test/runtime changes,
          provider registry, CLI flags, report schema changes, repo-wide
          parsing, cache, LSP, custom query execution, scoring changes, or
          release work."
        - "Protected: file-level Git evidence remains product truth; providers
          remain optional additive current-only enrichers; no network,
          telemetry, upload, remote enrichment, or background provider
          execution."
        - "Dependencies: existing provider contract and Zig inspect-only symbol
          provider are complete."
        - "Validation/evidence: git diff --check; zig build validate; docs-only
          changed-path scan; prohibited-claim/privacy/local-first scan over
          changed docs."
        - "Review focus: the strategy is concrete enough to shape one-language
          future provider spikes and cautious enough not to overpromise
          multi-language or custom-query support."
        - "Escalate if: implementation requires parser/runtime/build changes,
          custom query execution, provider registry design, repo-wide scan
          semantics, or LSP integration."
        - "Done boundary: strategy document exists, no protected surfaces
          changed, validation passes, and future sequencing is explicit."
      anchors:
        - docs/tree-sitter-multi-language-query-strategy.md
        - docs/provider-symbol-evidence-contract.md
        - docs/tree-sitter-zig-provider-spike.md
      in_scope:
        - One docs-only Tree-sitter language/query strategy document.
        - Future language admission and sequencing rules.
        - Monorepo inspect-only behaviour guidance.
        - Custom-query deferral and future safe-contract requirements.
      out_of_scope:
        - New language parser implementation.
        - Custom user query execution.
        - Provider registry, repo-wide parsing, cache, LSP, CI, release, or
          report schema changes.
      protected_surfaces:
        - Runtime CLI behaviour and report schema.
        - File-level Git evidence truth.
        - Local-first and privacy boundaries.
        - Existing Zig provider behaviour.
      validation_commands:
        - git diff --check
        - zig build validate
        - changed-path scan for docs-only scope
        - prohibited-claim and privacy scan over changed docs
      review_focus:
        - concrete language admission criteria
        - custom query support safely deferred
        - no unsupported runtime claims
        - monorepo behaviour remains inspect-only and path-based
      escalation_triggers:
        - Strategy requires runtime/parser/build changes.
        - Strategy implies repo-wide provider scanning by default.
        - Strategy claims support for languages not implemented yet.
        - Strategy enables arbitrary user queries without a later safety feature.
      done_boundary: One docs-only strategy artefact is committed and independently
        reviewable.
