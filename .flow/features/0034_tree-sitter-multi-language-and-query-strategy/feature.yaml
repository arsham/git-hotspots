schema: flow-feature.v1
feature:
  id: "0034"
  slug: tree-sitter-multi-language-and-query-strategy
  title: Tree-sitter multi-language and query strategy
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: The project now has an opt-in Zig Tree-sitter provider, but adding more
    languages or custom queries without a shared strategy would multiply
    vendoring, query, validation, privacy, and monorepo support risks.
  outcome: A design-only strategy document defines how future Tree-sitter
    languages and query support may be admitted without changing runtime
    behaviour in this feature.
  acceptance:
    - Add one strategy document for Tree-sitter multi-language and query support.
    - The document covers Go, Python, Lua, JavaScript, TypeScript, Rust, Node as
      JavaScript or TypeScript runtime context, monorepos, and future grammars.
    - The document defines language admission criteria, query ownership,
      built-in query requirements, deterministic language detection, provider
      failure states, validation gates, and future sequencing.
    - Custom user query execution is explicitly deferred unless a later feature
      accepts a safe local-only contract.
    - The strategy preserves inspect-only provider execution by default and does
      not introduce repo-wide provider scanning.
    - The strategy preserves file-level Git evidence as product truth and keeps
      provider evidence additive, current-only, caveated, and optional.
    - No runtime, source, test, fixture, build, third-party, CLI, report schema,
      scoring, cache, CI, release, or package behaviour changes are made.
planning:
  state: ready
  summary: Shape a design-only language and query strategy before importing more
    Tree-sitter grammars or exposing user custom queries.
