intent:
  problem: Rust build proof does not define supported symbol captures, kind
    mapping, ranges, ordering, caveats, or fixture coverage for Rust syntax.
  outcome: Add a project-owned Rust query contract and proof fixtures for stable
    inspect-oriented syntax while Rust runtime symbol output remains absent.
  acceptance:
    - Add project-owned Rust query fixtures and proof target coverage for the
      supported syntactic subset.
    - Define capture names, symbol-kind mapping, ranges, deterministic ordering,
      provider/query metadata, and caveats for skipped or ambiguous Rust syntax.
    - Add public evidence at docs/tree-sitter-rust-query-contract.md.
    - Do not add Rust runtime provider output, provider registry wiring, custom
      user queries, CLI flags, report schema, scoring, cache, CI, package,
      Cargo/crate/module analysis, macro expansion, type checking, LSP, network,
      telemetry, upload, or remote enrichment.
    - Preserve existing language provider outputs and no-provider outputs.
