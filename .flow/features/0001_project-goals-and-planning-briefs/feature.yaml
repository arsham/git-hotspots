  acceptance_contract:
    outcome: "Future planners can recover the git-hotspots direction from durable
      artefacts alone: B001 remains the capability source, Feature 0001 records
      execution-ready documentation scope, project memory captures cross-feature
      constraints, and public docs explain the OSS goals without monetisation or
      overclaiming."
    acceptance:
      - Feature 0001 is explicitly documentation and durable-context work only;
        it does not create CLI code, package manifests, scoring implementations,
        provider APIs, SaaS plans, pricing, telemetry, hosted dashboards, or
        developer-ranking features.
      - "Durable artefacts preserve the tagline: Before you refactor, ask Git
        where the pain is."
      - "Durable artefacts state the public thesis: a deterministic, local-first
        hotspot intelligence CLI for developers and coding agents."
      - "Durable artefacts state file-level Git-history evidence comes first:
        churn, change frequency, recency, co-change, size, confidence, and
        explainable evidence."
      - Durable artefacts state providers are later optional enrichers,
        including possible tree-sitter, LSP, ctags, dependency, blame/history,
        and test or coverage providers.
      - Durable artefacts state agent-ready exports consume deterministic
        evidence and do not make LLMs runtime truth.
      - Public-facing artefacts frame hotspots as investigation prompts, not
        accusations, quality scores, bug predictions, or developer-performance
        metrics.
      - Public-facing artefacts keep repository positioning
        OSS/publicity-oriented and contain no monetisation, pricing,
        hosted-SaaS, or sales strategy.
      - "Operational constraints are captured compactly: no network or telemetry
        by default, cache as optional optimisation not truth, author metrics
        absent/anonymised/opt-in, shallow or partial history marked incomplete,
        provider failures degrade gracefully."
      - A future implementation planner can identify the next feature boundary
        for a file-level Zig CLI spike without reading the original chat.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - flow validate --target feature:0001 --format json
      - git diff --check
      - grep -RniE 'moneti[sz]ation|pricing|SaaS|sales strategy|predicts
        bugs|bug prediction|developer ranking|performance metric' README.md docs
        .flow/features/0001_project-goals-and-planning-briefs
        .flow/project-memory.md || true
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
