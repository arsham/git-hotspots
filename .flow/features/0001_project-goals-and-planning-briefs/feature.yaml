schema: flow-feature.v1
feature:
  id: "0001"
  slug: project-goals-and-planning-briefs
  title: Project goals and planning briefs
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: The project has a strong capability brief, but future sessions still
    need implementation-neutral project-goal artefacts that preserve the public
    thesis, non-goals, safety constraints, and next planning path without
    relying on chat history.
  outcome: "Future planners can recover the git-hotspots direction from durable
    artefacts alone: B001 remains the capability source, Feature 0001 records
    execution-ready documentation scope, project memory captures cross-feature
    constraints, and public docs explain the OSS goals without monetisation or
    overclaiming."
  acceptance:
    - Feature 0001 is explicitly documentation and durable-context work only; it
      does not create CLI code, package manifests, scoring implementations,
      provider APIs, SaaS plans, pricing, telemetry, hosted dashboards, or
      developer-ranking features.
    - "Durable artefacts preserve the tagline: Before you refactor, ask Git
      where the pain is."
    - "Durable artefacts state the public thesis: a deterministic, local-first
      hotspot intelligence CLI for developers and coding agents."
    - "Durable artefacts state file-level Git-history evidence comes first:
      churn, change frequency, recency, co-change, size, confidence, and
      explainable evidence."
    - Durable artefacts state providers are later optional enrichers, including
      possible tree-sitter, LSP, ctags, dependency, blame/history, and test or
      coverage providers.
    - Durable artefacts state agent-ready exports consume deterministic evidence
      and do not make LLMs runtime truth.
    - Public-facing artefacts frame hotspots as investigation prompts, not
      accusations, quality scores, bug predictions, or developer-performance
      metrics.
    - Public-facing artefacts keep repository positioning OSS/publicity-oriented
      and contain no monetisation, pricing, hosted-SaaS, or sales strategy.
    - "Operational constraints are captured compactly: no network or telemetry
      by default, cache as optional optimisation not truth, author metrics
      absent/anonymised/opt-in, shallow or partial history marked incomplete,
      provider failures degrade gracefully."
    - A future implementation planner can identify the next feature boundary for
      a file-level Zig CLI spike without reading the original chat.
