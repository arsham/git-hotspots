design:
  rough_shape:
    - Use B001 as the source capability brief and avoid duplicating all of it;
      link to it from Feature 0001 and public docs.
    - Create or update concise public project-goal documentation that states
      thesis, tagline, users, value, non-goals, safe claims, and first-layer
      evidence.
    - Create or update a small future-planning/handoff artefact that records
      next candidate implementation features, validation gates, and known
      exclusions.
    - Update .flow/project-memory.md with compact cross-feature constraints and
      planning heuristics that future Flow sessions must preserve.
    - Keep the feature implementation as one planning/docs pass with no runtime
      code or toolchain lock-in.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Feature authority and brief alignment
      goal: Materialise Feature 0001 as the docs/durable-context authority linked to
        B001, with acceptance, non-goals, and Flow-owned handoff scope.
      owner_phase: runner
      execution_context:
        - "Anchors:
          .flow/features/0001_project-goals-and-planning-briefs/feature.yaml,
          .flow/features/0001_project-goals-and-planning-briefs/prd.md,
          .flow/briefs/B001_local-first-hotspot-intelligence-cli.yaml."
        - "In scope: preserve B001 as source thesis, complete Feature 0001
          docs-only scope, record acceptance and non-goals, and keep brief
          alignment current."
        - "Out of scope: CLI implementation, toolchain setup, scoring
          algorithms, provider APIs, monetisation, SaaS, telemetry, and runtime
          LLM behaviour."
        - "Protected: public thesis, tagline, OSS/publicity boundary, no
          overclaiming, and deterministic local-first product truth."
        - "Dependencies: none beyond existing B001."
        - "Validation/evidence: flow validate --target feature:0001 --format
          json, flow brief show --brief B001 --format json --view full, and a
          read-through proving no contradiction with B001."
        - "Review focus: feature and PRD say enough for a fresh planner without
          duplicating B001 wholesale."
        - "Escalate if: docs-only scope would require runtime
          command/API/toolchain choices or commercial positioning."
        - "Done boundary: Feature 0001 has linked B001, clear acceptance, clear
          packet scope, and current brief-alignment evidence."
      verification_commands:
        - flow validate --target feature:0001 --format json
    - id: P2
      depends_on:
        - P1
      status: done
      title: Public project goals documentation
      goal: Produce concise OSS-safe project-goal documentation for readers and future
        contributors.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md or docs/project-goals.md, .flow/project-memory.md
          for cross-feature constraints."
        - "In scope: tagline, thesis, target users, user value, safe claims,
          non-goals, first-layer file evidence, future provider direction, and
          agent-ready export framing."
        - "Out of scope: detailed architecture, exhaustive UX, launch strategy,
          monetisation, SaaS, pricing, or implementation-specific command
          flags."
        - "Protected: hotspots are investigation prompts; no bug prediction,
          code-quality score, developer ranking, or judgemental OSS case-study
          language."
        - "Dependencies: P1 scope and acceptance must be stable first."
        - "Validation/evidence: markdown read-through and content scan for
          prohibited claims and prohibited commercial content."
        - "Review focus: public docs are clear, truthful, modest, and useful
          without requiring chat context."
        - "Escalate if: public docs need a decision between README vs docs/
          structure or expose private commercial strategy."
        - "Done boundary: an OSS reader can understand what git-hotspots is, why
          it exists, what it will not claim, and how future work will start."
      verification_commands:
        - git diff --check
        - grep -RniE 'moneti[sz]ation|pricing|SaaS|sales strategy|predicts
          bugs|bug prediction|developer ranking|performance metric' README.md
          docs .flow/features/0001_project-goals-and-planning-briefs
          .flow/project-memory.md || true
    - id: P3
      depends_on:
        - P2
      status: done
      title: Future planning handoff
      goal: Create a compact handoff for the next implementation-planning session
        without overbuilding the roadmap.
      owner_phase: runner
      execution_context:
        - "Anchors: .flow/project-memory.md,
          .flow/features/0001_project-goals-and-planning-briefs/prd.md, optional
          docs/future-plan.md or equivalent concise handoff artefact."
        - "In scope: next candidate feature boundary for a file-level Zig CLI
          spike, validation gates, deferred provider topics, cache/privacy
          guardrails, and open questions."
        - "Out of scope: detailed packet plans for future implementation,
          dependency lock-in, package manager setup, release automation, SaaS
          roadmap, or paid product strategy."
        - "Protected: keep future plan implementation-neutral unless already
          agreed; do not turn provider architecture into first-sprint scope."
        - "Dependencies: public goals doc must exist so handoff can reference
          instead of duplicate it."
        - "Validation/evidence: fresh-session sufficiency audit from durable
          state only, plus flow validate --target feature:0001 --format json."
        - "Review focus: future planner can continue with next feature shaping
          without original chat and without inheriting stale or commercial
          assumptions."
        - "Escalate if: next-step handoff needs business strategy, hosted
          product assumptions, or a toolchain choice beyond the agreed Zig
          preference for later consideration."
        - "Done boundary: durable state names the next likely implementation
          feature and its major guardrails while keeping Feature 0001
          docs-only."
      verification_commands:
        - flow validate --target feature:0001 --format json
  output_contract:
    storage: Repository-local planning and documentation artefacts only.
    artefacts:
