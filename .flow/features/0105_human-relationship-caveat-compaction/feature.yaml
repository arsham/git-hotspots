schema: flow-feature.v1
feature:
  id: "0105"
  slug: human-relationship-caveat-compaction
  title: Human relationship caveat compaction
  lane: standard
  status: shaping
  autonomy_default: ask
intent:
  problem: Relationship evidence is useful but table and Markdown reports repeat
    the same caveat text across many relationship rows, making human output
    noisy even though the caveats must remain visible.
  outcome: Human relationship output groups repeated caveat text into
    deterministic compact summaries with row references while preserving JSON
    schema, record-level caveats, provider support claims, scoring, ranking, and
    all relationship semantics.
  acceptance:
    - Table relationship output uses compact caveat presentation instead of
      repeating identical full caveat text on many rows.
    - Markdown relationship output uses compact caveat presentation instead of
      repeating identical full caveat text on many rows.
    - JSON report schema and per-record relationship caveats remain compatible
      and present.
    - No CLI flags, scoring, ranking, provider admission, relationship
      semantics, release/tag/remote/package behaviour, network behaviour,
      telemetry, or cache semantics change.
    - README, user guide, man page, fixtures, integration checks, and validation
      are updated where human caveat presentation changes.
