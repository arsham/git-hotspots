    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Feature 0104 found that relationship evidence is broadly useful but noisy
          in human table and Markdown output because the same caveat text
          repeats on many relationship rows. JSON needs per-record caveats for
          machine consumers, but human surfaces should make repeated caveats
          easier to scan without weakening the syntax-evidence warning.
      - source_ref: prd.md#outcome[1]
        text: Human table and Markdown relationship output present repeated relationship
          caveats through deterministic compact summaries and row references,
          while JSON schema and record-level caveats remain unchanged. Users can
          still see that relationship rows are caveated syntax evidence, but
          repeated text no longer dominates the human report.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Human relationship output groups repeated caveat text into
      deterministic compact summaries with row references while preserving JSON
      schema, record-level caveats, provider support claims, scoring, ranking,
      and all relationship semantics.
    acceptance:
      - Table relationship output uses compact caveat presentation instead of
        repeating identical full caveat text on many rows.
      - Markdown relationship output uses compact caveat presentation instead of
        repeating identical full caveat text on many rows.
      - JSON report schema and per-record relationship caveats remain compatible
        and present.
      - No CLI flags, scoring, ranking, provider admission, relationship
        semantics, release/tag/remote/package behaviour, network behaviour,
        telemetry, or cache semantics change.
      - README, user guide, man page, fixtures, integration checks, and
        validation are updated where human caveat presentation changes.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - rg -n "relationship|caveat|caveats" src tests fixtures docs man
        README.md tools/validate.sh
      - zig build test
      - git diff --check
      - zig build validate
      - tools/flow-closeout-check.sh --smoke-skip-reason <privacy-safe reason if
        no sibling smoke is selected>
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify table and Markdown caveat compaction improves readability without
        hiding caveats
      - verify JSON schema and per-record caveats remain compatible and present
      - verify fixtures docs and validation align without expanding support
        claims
  decision_budget:
    allowed_local_decisions:
      - safe internal rendering refactor inside dispatched scope
      - local marker naming that preserves deterministic caveat references
      - fixture wording updates that do not broaden claims
    deferred_reconcile_triggers:
      - minor human-output wording tradeoff worth reviewer visibility
      - implementation tradeoff that preserves JSON and all protected surfaces
    hard_planner_escalation_triggers:
      - JSON schema or record-caveat change
      - CLI flag or option change
      - provider admission or relationship semantic change
      - scoring/ranking/confidence change
      - uncertainty summary or cap wording redesign beyond minimal caveat
        references
      - deduplication or filtering rule
      - release tag remote package network telemetry or cache behaviour change
    protected_surfaces:
      - JSON schema and per-record relationship caveats
      - CLI flags and option combinations
      - file and symbol scoring/ranking/confidence
      - provider admission matrix
      - relationship semantics and provider evidence model
      - release state tags remotes and packages
      - network telemetry and cache behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
