            0094. Public claims remain local-first, deterministic, caveated,
            evidence-only, and must not imply call-graph truth, dependency
            proof, type checking, ownership, code-quality judgement, developer
            metrics, bug prediction, scoring changes, cache truth, network
            access, or telemetry."
          - "Shape a serial quality/performance hardening batch after public
            symbol and relationship provider support: 0096 performance budget
            and benchmark harness, 0097 provider failure and caveat audit, 0098
            large-repository sampling and bounds, then 0099 symbol and
            relationship workflow docs polish. The batch preserves local-first
            deterministic evidence, public claim restraint, and no runtime
            network/cache truth defaults."
          - "Relationship precision follow-up selected for feature 0104: run a
            docs-only relationship output noise audit before changing
