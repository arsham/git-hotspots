intent:
  problem: Relationship evidence is public for Python only, while several
    languages have current-symbol and parser proof surfaces. Expanding providers
    without a durable rubric risks inconsistent caveats, validation gaps, or
    public overclaims.
  outcome: Add docs/relation-provider-expansion-strategy.md as a planning-only
    strategy document that ranks near-term relationship provider expansion,
    defines the shared admission and validation rubric, and confirms the serial
    batch order.
  acceptance:
    - Strategy document exists at docs/relation-provider-expansion-strategy.md.
    - The document compares TypeScript, JavaScript, Rust, Go, Lua, Zig, and
      Python follow-up expansion using a shared rubric.
    - The document selects a serial implementation order for the next
      provider-expansion batch and explains the trade-offs.
    - The minimum acceptance bar for future relationship providers is explicit
      and includes relation kinds, unresolved/unknown fallbacks, caps, caveats,
      deterministic sorting, and no scoring effect.
    - The common validation bar is explicit and includes targeted provider
      proof, fixture proof, zig build test, zig build validate, and privacy-safe
      real-repo smoke or skip reason.
    - No runtime provider code, CLI/report output, scoring, cache, network,
      telemetry, or browser-visible UI changes are added.
    - B002 is linked and updated with the durable provider-expansion batch
      decision but not closed.
