schema: flow-feature.v1
feature:
  id: "0003"
  slug: one-command-validation-workflow
  title: One-command validation workflow
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0002 proved the file-level CLI spike, but its close-out
    validation still exists as a checklist spread across PRD text, integration
    scripts, reviewer memory, and ad-hoc real-repo smoke commands. Future
    implementation features need a canonical validation workflow so Arsham and
    agents do not manually remember the full ladder or accidentally omit
    privacy-safe real-repository smoke evidence.
  outcome: Provide a canonical project-local validation workflow centered on `zig
    build validate`, backed by a small helper script when useful, that runs the
    existing fixture/test/build checks and supports close-out real-repository
    smoke validation with privacy-safe evidence.
  acceptance:
    - A documented canonical command exists for project validation, preferably
      `zig build validate`, and it is the command future Flow contracts should
      use for full local validation.
    - The validation workflow runs formatting checks, `zig build test`, `zig
      build`, `git diff --check`, script syntax checks, deterministic fixture
      JSON checks, shallow/partial assertions, privacy/path checks, and a
      bounded fixture performance smoke or documented portable equivalent.
    - "`zig build test` remains the fast unit/integration gate; `zig build
      validate` is the fuller close-out gate."
    - The workflow runs real-repository smoke against this repository by default
      once the executable exists.
    - Close-out mode requires either an explicit sibling/local smoke repository
      with a privacy-safe label or an explicit skip reason; it must not silently
      omit the second real-repo smoke target.
    - Validation output includes a copyable privacy-safe evidence summary with
      labels, command results, caveats, fallback tools, and no absolute private
      paths, raw private report dumps, source snippets, author identities, or
      private repo names.
    - "The workflow remains local-only: no fetch, pull, push, upload, telemetry,
      remote enrichment, CI service dependency, provider runtime, cache,
      packaging, or release automation is introduced."
    - Public docs mention the validation workflow briefly without exposing Flow
      internals or adding hosted/commercial strategy, bug-prediction,
      code-quality scoring, or developer-ranking claims.
    - Feature 0002 behaviour and output contracts remain protected; product
      scoring, Git parsing, and report semantics change only if validation
      exposes a concrete bug that stays inside this feature scope and is covered
      by tests.
planning:
  state: ready
  summary: "Narrow implementation feature: add a canonical validation command and
    helper workflow for full project validation, including fixture checks,
    deterministic/privacy/shallow evidence, and close-out real-repo smoke mode.
    Do not change product behaviour except for validation-only fixes required to
    make the workflow honest."
  brief_sync:
    status: unchanged
    reason: Feature 0003 is a follow-up implementation workflow for B001 boundaries;
