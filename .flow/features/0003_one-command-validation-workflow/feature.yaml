  acceptance_contract:
    outcome: Provide a canonical project-local validation workflow centered on `zig
      build validate`, backed by a small helper script when useful, that runs
      the existing fixture/test/build checks and supports close-out
      real-repository smoke validation with privacy-safe evidence.
    acceptance:
      - A documented canonical command exists for project validation, preferably
        `zig build validate`, and it is the command future Flow contracts should
        use for full local validation.
      - The validation workflow runs formatting checks, `zig build test`, `zig
        build`, `git diff --check`, script syntax checks, deterministic fixture
        JSON checks, shallow/partial assertions, privacy/path checks, and a
        bounded fixture performance smoke or documented portable equivalent.
      - "`zig build test` remains the fast unit/integration gate; `zig build
        validate` is the fuller close-out gate."
      - The workflow runs real-repository smoke against this repository by
        default once the executable exists.
      - Close-out mode requires either an explicit sibling/local smoke
        repository with a privacy-safe label or an explicit skip reason; it must
        not silently omit the second real-repo smoke target.
      - Validation output includes a copyable privacy-safe evidence summary with
        labels, command results, caveats, fallback tools, and no absolute
        private paths, raw private report dumps, source snippets, author
        identities, or private repo names.
      - "The workflow remains local-only: no fetch, pull, push, upload,
        telemetry, remote enrichment, CI service dependency, provider runtime,
        cache, packaging, or release automation is introduced."
      - Public docs mention the validation workflow briefly without exposing
        Flow internals or adding hosted/commercial strategy, bug-prediction,
        code-quality scoring, or developer-ranking claims.
      - Feature 0002 behaviour and output contracts remain protected; product
        scoring, Git parsing, and report semantics change only if validation
        exposes a concrete bug that stays inside this feature scope and is
        covered by tests.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig build validate
      - zig build test
      - git diff --check
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
        /tmp/git-hotspots-a.json
      - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
        /tmp/git-hotspots-b.json
      - diff -u /tmp/git-hotspots-a.json /tmp/git-hotspots-b.json
      - zig build validate -Dcloseout=true -Dsmoke-repo=<local-sibling-repo>
        -Dsmoke-label=sibling-local-repo
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
