design:
  rough_shape:
    - Add a `validate` build step in `build.zig` that invokes a repo-local
      helper such as `tools/validate.sh` with documented options for default and
      close-out modes.
    - Keep `zig build test` focused on unit and integration fixtures; make `zig
      build validate` the fuller close-out-oriented command.
    - "Have the helper run existing checks first, then explicit evidence checks:
      deterministic JSON diff, shallow/partial proof, privacy-safe path/source
      scans, performance smoke, and real-repo smoke."
    - Support close-out options for a sibling/local repo and label, plus an
      explicit skip-reason path when no suitable local repo is available.
    - Document the workflow in README or a small docs file without turning
      public docs into Flow process notes.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Canonical validation command
      goal: Add the smallest canonical validation entrypoint, preferably `zig build
        validate`, backed by a local helper script that runs the current
        format/build/test/diff checks.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, tools/validate.sh, tests/integration.sh."
        - "In scope: add a validate build step and helper script; run fmt, build
          test, build, git diff --check, and script syntax checks."
        - "Out of scope: CI matrix, release automation, package scaffolding,
          provider/cache validation, network or telemetry checks beyond local
          source/output scans."
        - "Protected: `zig build test` remains a fast unit/integration gate;
          existing CLI behaviour should not change."
        - "Dependencies: Feature 0002 is done and provides the executable spike
          and integration fixtures."
        - "Validation/evidence: `zig build validate` succeeds locally; `zig
          build test` still succeeds; `git diff --check` passes."
        - "Review focus: command is canonical, local, portable, and does not
          require hidden manual checklist steps for the basic validation mode."
        - "Escalate if: Zig build options cannot support an honest command
          surface without awkward hidden state or new dependencies."
        - "Done boundary: a future runner can run one documented command for
          baseline validation."
      verification_commands:
        - zig build validate
        - zig build test
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Evidence completeness checks
      goal: Expand the validation workflow to cover deterministic output,
        shallow/partial proof, privacy/path scans, and bounded fixture
        performance smoke with portable fallbacks.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, tests/integration.sh,
          fixtures/expected/basic.json, fixtures/*."
        - "In scope: deterministic JSON diff, JSON validity using Python
          fallback if jq is unavailable, shallow/partial assertions,
          path/privacy checks, fixture medium timing with `/usr/bin/time` or
          portable elapsed fallback."
        - "Out of scope: broad benchmarking, coverage, profiling, CI artifacts,
          static-analysis tooling, or expanding product features."
        - "Protected: scans must be semantic/allowlisted enough not to fail on
          safe docs such as 'does not fetch'."
        - "Dependencies: P1 validation entrypoint exists."
        - "Validation/evidence: `zig build validate` reports each rung and exits
          non-zero on failure; repeated fixture JSON is identical; privacy
          checks verify no absolute paths or author identities in default
          output."
        - "Review focus: the command covers the Feature 0002 close-out ladder
          rather than only wrapping `zig build test`."
        - "Escalate if: validation exposes product contract drift that requires
          reshaping rather than validation-only fixes."
        - "Done boundary: baseline validation produces an evidence summary for
          all non-real-repo rungs."
      verification_commands:
        - zig build validate
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
          /tmp/git-hotspots-a.json
        - ./zig-out/bin/git-hotspots --repo fixtures/basic --format json >
          /tmp/git-hotspots-b.json
        - diff -u /tmp/git-hotspots-a.json /tmp/git-hotspots-b.json
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Real-repo smoke mode and docs
      goal: Add close-out mode for privacy-safe real-repository smoke validation and
        document how future agents should use it.
      owner_phase: runner
      execution_context:
        - "Anchors: build.zig, tools/validate.sh, README.md, AGENTS.md only if a
          local guardrail needs tightening."
        - "In scope: run this repo by default; support explicit sibling/local
          repo path and privacy-safe label; require skip reason in close-out
          mode when no sibling repo is supplied."
        - "Out of scope: committing raw smoke reports, private repo names,
          absolute local paths, Flow process logs, public case studies, GitHub
          Actions, or release packaging."
        - "Protected: README stays visitor-facing and OSS-safe; no
          hosted/commercial strategy or overclaiming."
        - "Dependencies: P2 evidence rungs pass."
        - "Validation/evidence: `zig build validate -Dcloseout=true` with
          sibling repo options, or documented equivalent, emits privacy-safe
          labels and summaries; default mode smokes this repo."
        - "Review focus: close-out cannot accidentally skip the second real-repo
          smoke without an explicit reason, and evidence is safe to paste into
          Flow/review summaries."
        - "Escalate if: local sibling repo selection requires committing private
          paths or repo-specific assumptions."
        - "Done boundary: future implementation features can cite the canonical
          command and evidence summary instead of manually listing the full
          ladder."
      verification_commands:
        - zig build validate
        - zig build validate -Dcloseout=true -Dsmoke-repo=<local-sibling-repo>
          -Dsmoke-label=sibling-local-repo
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  output_contract:
    canonical_commands:
      - zig build test
      - zig build validate
    primary_validation_command: zig build validate
    closeout_mode: Requires this-repo smoke plus sibling/local repo options or an
      explicit skip reason.
    evidence_summary: Copyable privacy-safe rung summary with labels and fallback notes.
    prohibited_content:
      - absolute private paths
      - private repository names
      - raw private report dumps
      - source snippets
      - author names or emails
      - hosted/commercial strategy
      - Flow process clutter in README
