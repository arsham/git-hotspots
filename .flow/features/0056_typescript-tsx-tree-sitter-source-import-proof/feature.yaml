        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: A narrow pinned tree-sitter-typescript source import is committed with
      TypeScript and TSX provenance, notices, source-size evidence, extension
      admission state, and no-provider stability proof, while TypeScript/TSX
      build/runtime/provider behaviour remains deferred.
    acceptance:
      - Import a narrow pinned tree-sitter-typescript source set under
        third_party/tree-sitter-typescript/<revision>/.
      - Record exact upstream source identity, selected immutable revision,
        archive or checkout basis, checksum or per-file manifest evidence, and
        vendored path.
      - Preserve upstream license/notice text and update THIRD_PARTY_NOTICES.md
        with public repo-relative attribution.
      - Add PROVENANCE.md, IMPORTED_FILES.tsv, and a source-import evidence
        document covering TypeScript and TSX parser/scanner provenance,
        BOM/exclusions, Tree-sitter core compatibility, extension admission
        state, source-size measurements, offline validation, and no-provider
        output stability.
      - Stop as blocked rather than closing if immutable revision,
        license/notice, generated parser/scanner provenance, core compatibility,
        BOM narrowness, TSX decision, or no-provider stability cannot be proven.
      - Do not add TypeScript/TSX build/link proof, runtime provider behaviour,
        provider registry entries, CLI flags, report schema fields, scoring
        changes, cache changes, query fixtures, CI changes,
        Node/package/workspace/module/tsconfig analysis, release, package,
        network, telemetry, or remote enrichment behaviour.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - changed-path scan for source-import-only scope
      - provenance/license/BOM scan
      - generated parser/scanner provenance check
      - extension admission or deferral check
      - no-provider output stability check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - confirm TypeScript/TSX source import remains provenance-only and does
        not add build/runtime/provider output
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
