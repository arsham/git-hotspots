      - source_ref: prd.md#problem[1]
        text: Feature 0049 recorded tree-sitter-typescript as a plausible future grammar
          but left implementation blocked on exact immutable source identity,
          license and notice verification, generated TypeScript and TSX
          parser/scanner provenance, BOM selection, extension admission proof,
          source-size evidence, core compatibility, offline validation, and
          no-provider output stability. TypeScript/TSX runtime support should
          not proceed until the source import itself is reviewable and
          local-first.
      - source_ref: prd.md#outcome[1]
        text: A pinned tree-sitter-typescript source set is vendored under
          third_party/tree-sitter-typescript/<revision>/ with provenance,
          imported-file manifest, license/notice handling, TypeScript and TSX
          extension admission evidence, and source-import evidence. The
          repository still has no TypeScript or TSX runtime support after this
          feature; it only has reviewed local source inputs for later build,
          query, and extraction proofs.
