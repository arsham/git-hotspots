feature:
  id: "0020"
  slug: provider-contract-and-symbol-evidence-design
  title: Provider contract and symbol evidence design
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Provider and symbol evidence boundaries are not durable yet, so a
    future tree-sitter or LSP feature could accidentally become core runtime
    truth, harden the wrong abstraction, alter file-level scoring, or imply
    unsupported symbol-history claims.
  outcome: Create a design-only provider and symbol evidence contract that
    preserves file-level Git history as product truth and bounds future provider
    work before any provider implementation is added.
  acceptance:
    - docs/provider-symbol-evidence-contract.md defines provider envelope,
      provenance, freshness, confidence, failure state, caveats, symbol
      attachment, report behaviour, and future validation expectations.
    - The feature makes no runtime provider, registry, CLI, dependency, source,
      test, fixture, cache, report schema, or scoring change.
    - Provider evidence is explicitly optional enrichment attached to existing
      file-level results, not replacement product truth.
    - Future tree-sitter work is bounded as a spike with one language, current
      working-tree symbol spans, confidence/caveats, and no historical symbol
      lineage or scoring change.
    - Repository artefacts remain OSS/publicity-oriented and contain no hosted,
      pricing, sales, or commercial strategy.
planning:
  state: ready
  summary: Design-only provider/symbol evidence guardrail. Do not implement
    provider code in this feature; produce the contract needed to shape a later
    tree-sitter spike safely.
  brief_sync:
