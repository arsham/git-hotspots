    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The project is approaching language-aware hotspot work, but provider
          boundaries are not yet durable. Without a provider-neutral contract,
          the first tree-sitter or LSP feature could accidentally become core
          runtime truth, harden the wrong abstraction, alter file-level scoring,
          or imply unsupported symbol-history claims.
      - source_ref: prd.md#outcome[1]
        text: Create a design-only provider and symbol evidence contract that future
          provider features can use. The contract must preserve deterministic
          file-level Git history as product truth, define minimum provider
          metadata and degradation semantics, and bound the next tree-sitter
          spike before any provider code is implemented.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Create a design-only provider and symbol evidence contract that
      preserves file-level Git history as product truth and bounds future
      provider work before any provider implementation is added.
    acceptance:
      - docs/provider-symbol-evidence-contract.md defines provider envelope,
        provenance, freshness, confidence, failure state, caveats, symbol
        attachment, report behaviour, and future validation expectations.
      - The feature makes no runtime provider, registry, CLI, dependency,
        source, test, fixture, cache, report schema, or scoring change.
      - Provider evidence is explicitly optional enrichment attached to existing
        file-level results, not replacement product truth.
      - Future tree-sitter work is bounded as a spike with one language, current
        working-tree symbol spans, confidence/caveats, and no historical symbol
        lineage or scoring change.
      - Repository artefacts remain OSS/publicity-oriented and contain no
        hosted, pricing, sales, or commercial strategy.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands: []
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
