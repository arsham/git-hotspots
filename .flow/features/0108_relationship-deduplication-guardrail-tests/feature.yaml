feature:
  id: "0108"
  slug: relationship-deduplication-guardrail-tests
  title: Relationship deduplication guardrail tests
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Relationship outputs can contain duplicate-looking source/target
    endpoint pairs that carry different relation kinds or evidence bases. Future
    cleanup could accidentally collapse those meaningful records.
  outcome: Durable tests prove duplicate-looking relationship records with
    meaningful differentiators are preserved, without changing JSON, human
    output wording, provider semantics, scoring, ranking, CLI flags, or
    release/package surfaces.
  acceptance:
    - Duplicate-looking relationship records with different relation kinds are
      preserved in tested output.
    - Duplicate-looking relationship records with different evidence basis are
      preserved when current fixtures expose such a case.
    - Any exact-duplicate fixture added documents current exact-duplicate
      behaviour without creating a new production deduplication rule.
    - JSON schema, output fields, ordering, record caveats, and relationship
      evidence remain compatible.
    - Human table and Markdown wording remain unchanged except fixture content
      needed to prove the guardrail.
    - No provider algorithms, provider admission, relation semantics, scoring,
      ranking, confidence, caps, CLI flags, cache, network, telemetry, release,
      tag, remote, package, or publish behaviour changes.
