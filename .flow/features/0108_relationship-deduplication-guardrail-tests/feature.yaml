    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The relationship output noise audit found no exact duplicate relationship
          records in sampled JSON outputs. It did find repeated source and
          target endpoint pairs with different relation kinds or evidence bases,
          such as nested symbols that produce both contains and reference or
          call evidence. Those records are meaningful under the current evidence
          contract, but they are easy targets for a future over-broad
          deduplication pass.
      - source_ref: prd.md#outcome[1]
        text: Tests lock the current relationship evidence contract so duplicate-looking
          records remain preserved when relation kind, direction, provider, or
          evidence basis differs. Any exact duplicate fixture introduced for the
          guardrail must be handled according to the current implementation
          contract and documented by the test expectation. The work is
          intentionally test-focused and must not alter relationship semantics
          or output contracts unless a tiny test helper is needed.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Durable tests prove duplicate-looking relationship records with
      meaningful differentiators are preserved, without changing JSON, human
      output wording, provider semantics, scoring, ranking, CLI flags, or
      release/package surfaces.
    acceptance:
      - Duplicate-looking relationship records with different relation kinds are
        preserved in tested output.
      - Duplicate-looking relationship records with different evidence basis are
        preserved when current fixtures expose such a case.
      - Any exact-duplicate fixture added documents current exact-duplicate
        behaviour without creating a new production deduplication rule.
      - JSON schema, output fields, ordering, record caveats, and relationship
        evidence remain compatible.
      - Human table and Markdown wording remain unchanged except fixture content
        needed to prove the guardrail.
      - No provider algorithms, provider admission, relation semantics, scoring,
        ranking, confidence, caps, CLI flags, cache, network, telemetry,
        release, tag, remote, package, or publish behaviour changes.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - tests/integration.sh ./zig-out/bin/git-hotspots
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - confirm guardrail tests fail accidental broad deduplication without
        changing production semantics
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
      - test-only helper when existing fixtures cannot prove the guardrail
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
      - exact duplicate fixture cannot be constructed without documenting
        current behaviour
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - production relationship aggregation or output semantics change required
        to make tests pass
    protected_surfaces:
      - JSON schema and fields
      - relationship record ordering and evidence semantics
      - human table and Markdown wording
      - provider algorithms and provider admission
      - relation kind/direction semantics
      - scoring ranking confidence and caps
      - CLI flags and options
      - cache network telemetry release tag remote package and publish behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
