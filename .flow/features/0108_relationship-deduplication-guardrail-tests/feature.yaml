design:
  rough_shape:
    - Find existing fixtures or integration outputs that already contain
      repeated source/target endpoint pairs with different relation kinds or
      evidence bases.
    - Add targeted assertions or golden fixture checks proving those records
      remain distinct and present.
    - If exact duplicates are constructible without production changes, assert
      current behaviour only as documentation of the current contract.
    - Wire the guardrail into normal validation through existing integration or
      test paths.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Locate duplicate-looking evidence cases
      goal: Find current fixture or integration outputs with repeated endpoints that
        differ by relation kind or evidence basis, without changing production
        behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: tests/integration.sh;
          fixtures/expected/symbol-relationships*.json|md|txt; relationship
          providers that emit contains/reference/call combinations."
        - "In scope: inspect existing fixture outputs and add the smallest
          durable assertion target."
        - "Out of scope: production deduplication, output schema changes,
          provider algorithm changes, wording changes."
        - "Protected: JSON compatibility, human wording, provider admission,
          scoring/ranking/confidence, relation semantics, CLI flags."
        - "Dependencies: none."
        - "Validation/evidence: record exact fixture/output paths or integration
          command snippets that prove the cases exist."
        - "Review focus: cases are real current evidence records, not fabricated
          claims."
        - "Escalate if: no existing output can demonstrate the guardrail without
          changing production code."
        - "Done boundary: specific guardrail cases are identified and mapped to
          assertions."
      verification_commands:
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Add guardrail assertions
      goal: Add tests or integration assertions that preserve meaningful
        duplicate-looking records and document exact-duplicate behaviour only if
        needed.
      owner_phase: runner
      execution_context:
        - "Anchors: tests/integration.sh; Zig unit tests only if existing
          integration fixtures cannot prove the contract."
        - "In scope: test-only assertions, fixture checks, narrowly shared test
          helper if necessary."
        - "Out of scope: production relationship aggregation changes and new
          deduplication logic."
        - "Protected: exact public output contract and relation evidence
          semantics."
        - "Dependencies: P1 selected cases."
        - "Validation/evidence: failing-when-collapsed assertions for relation
          kind or evidence-basis differentiators."
        - "Review focus: assertions would catch accidental broad deduplication
          while not overfitting to unrelated formatting."
        - "Escalate if: implementing the test requires changing production
          output semantics."
        - "Done boundary: guardrail tests are committed and meaningful."
      verification_commands:
        - zig build test
        - tests/integration.sh ./zig-out/bin/git-hotspots
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Validation and close-out proof
      goal: Ensure the guardrail runs in normal validation and close-out evidence is
        complete.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh; build.zig validation paths; README/docs
          only if a validation command list needs factual update."
        - "In scope: validation wiring and evidence recording."
        - "Out of scope: public docs narrative changes unless validation command
          documentation is stale."
        - "Protected: no release/tag/remote/package side effects."
        - "Dependencies: P2 tests exist."
        - "Validation/evidence: git diff --check; zig build test; zig build
          validate; reviewer-owned credible gate discovery."
        - "Review focus: normal validation covers the guardrail; repo remains
          clean."
        - "Escalate if: validation cannot run due fixture setup or environment
          blocker."
        - "Done boundary: all required gates pass and close-out evidence is
          durable."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
