        source_ref: prd.md#requirements[7]
        text: "R7: Treat supported and unsupported paths differently in project mode.
          Unsupported ranked files may be counted and caveated in the project
          symbol summary, but they must not produce noisy per-file provider
          failure rows. Ranked files with supported extensions whose current
          file is missing, unreadable, symlinked, too large, or parser-failed
          should produce bounded provider caveats without source snippets,
          parser diagnostics, absolute local paths, remotes, author identities,
          commit messages, or private repository names."
