design:
  rough_shape:
    - Run the existing file-level analysis and scope/limit filtering first; only
      then attach project-level symbol evidence for the ranked result rows that
      remain.
    - Refactor provider selection into a shared path usable by inspect and
      project mode so future language providers automatically become eligible
      for project-level symbol evidence after provider registration and tests.
    - Extend the analysis model with a project-level current-symbol aggregate
      separate from the existing one-file inspect symbol report, preserving
      inspect compatibility.
    - Represent each project symbol with repo-relative file path, parent file
      rank and score/evidence reference, symbol identity fields, current range,
      provider state, confidence, caveats, and optional current-line Git
      evidence.
    - Keep human table and Markdown symbol rows bounded by
      --symbol-limit/default display limit while JSON remains complete for
      analysed ranked files unless an explicit machine cap is separately shaped.
    - Treat unsupported ranked paths as summary counts/caveats, not noisy
      per-file failures; report provider failures only for supported files that
      could reasonably have emitted symbols.
    - Update help, README, user guide, developer guide, man page, explain text,
      integration fixtures, and validation checks together because symbol flag
      semantics change.
    - Defer true historical hunk-to-symbol attribution, symbol rename/move
      lineage, reference graphs, dependency propagation, scoring changes, cache,
      and provider plugin infrastructure.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Shared project-symbol model and collection
      goal: Add the internal model and collection pipeline for project-level
        current-symbol evidence over retained ranked file results while
        preserving inspect compatibility.
      owner_phase: runner
      execution_context:
        - "Anchors: src/model.zig, src/app.zig, src/provider_selection.zig,
          src/git_line_history.zig, src/provider.zig."
        - "In scope: add a project-level symbol aggregate, share provider
          extraction between inspect and project mode, collect symbols only for
          retained ranked rows, attach optional current-line evidence per file,
          and track supported/unsupported/provider-failed summary counts."
        - "Out of scope: report rendering polish, public docs, new language
          providers, historical blob parsing, full-repository pre-ranking scans,
          scoring changes, cache, LSP, ctags, or relation graphs."
        - "Protected: existing file-level ranking, scope/include/exclude
          semantics, inspect-mode symbols, provider current-only semantics,
          local-first/no-telemetry boundary, privacy-safe provider caveats."
        - "Dependencies: none beyond current provider and line-history
          substrate."
        - "Validation/evidence: focused unit tests for aggregate shape, provider
          selection reuse, unsupported skip counts, provider failure caveats,
          and line-history degradation; run zig fmt --check build.zig src tests
          and zig build test."
        - "Review focus: no score/rank mutation, no historical-symbol claims,
          bounded extraction after file ranking, memory cleanup for new
          aggregate ownership."
        - "Escalate if: the implementation needs a machine-output cap,
          persistent cache/index, new provider language, changed report schema
          version, or full-repository symbol scan before ranking."
        - "Done boundary: project analysis can build an in-memory current-symbol
          aggregate for ranked files and inspect mode remains compatible."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: done
      title: CLI and report surfaces
      goal: Expose project-level --symbols command shapes and render deterministic
        current-symbol reports in table, Markdown, and JSON.
      owner_phase: runner
      execution_context:
        - "Anchors: src/cli.zig, src/report_table.zig, src/report_markdown.zig,
          src/report_json.zig, src/report_symbols.zig, src/explain.zig,
          tests/integration.sh."
        - "In scope: relax symbol flag validation for project mode, keep
          --symbol-line-history and --symbol-limit tied to --symbols, render
          project symbol summaries/items with parent file linkage, preserve
          inspect-mode output, and keep no-symbol output unchanged."
        - "Out of scope: docs beyond source help/explain anchors, new scoring
          fields, JSON schema version bump unless unavoidable and explicitly
          justified, reference/use relationships, ownership, or semantic
          dependency output."
        - "Protected: existing CLI diagnostics style, standalone
          help/version/explain precedence, privacy-safe output, current-only
          caveats, JSON completeness for analysed symbols, table/Markdown human
          display limits."
        - "Dependencies: P1 project-symbol aggregate available."
        - "Validation/evidence: integration rows for project --symbols,
          --symbols --symbol-line-history, --symbol-limit, invalid no-symbol
          combinations, inspect compatibility, and no-symbol byte-stability
          where fixture harness supports it."
        - "Review focus: command semantics are clear and diagnostics actionable;
          output is deterministic and does not imply true symbol history."
        - "Escalate if: report output needs a breaking schema/version decision,
          if --limit semantics become ambiguous, or if project symbol extraction
          materially slows basic no-symbol runs."
        - "Done boundary: users can run project-level symbol commands and all
          three report formats expose bounded current-symbol evidence."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
    - id: P3
      depends_on:
        - P2
      status: done
      title: Documentation, fixtures, and validation harness
      goal: Align public docs, manual, fixtures, tests, and validation with
        project-level current-symbol semantics.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, docs/developer-guide.md,
          man/git-hotspots.1, tests/integration.sh, tools/validate.sh, fixture
          expected outputs."
        - "In scope: remove inspect-only-only wording for --symbols, add
          project-level examples and caveats, update provider/current-line
          validation anchors, add table/Markdown/JSON fixtures, add
          privacy/prohibited-claim checks, and document real-repo smoke
          expectations."
        - "Out of scope: commercial claims, hosted/service roadmap, package
          publishing, UI/browser work, new provider capability claims, or raw
          private smoke output."
        - "Protected: hotspots remain investigation prompts, provider output
          remains optional enrichment, no bug
          prediction/code-quality/developer-ranking language, no absolute
          paths/remotes/author identities/source snippets/parser diagnostics."
        - "Dependencies: P2 output and CLI wording are stable enough to
          document."
        - "Validation/evidence: sh -n for shell files if touched, zig build
          validate, and validation anchors proving README/user guide/developer
          guide/man/help/explain agree."
        - "Review focus: public documentation does not overclaim project-level
          current-symbol evidence as historical attribution."
        - "Escalate if: docs need to promise behaviour not implemented in P1/P2
          or validation would require network/global tooling."
        - "Done boundary: docs, CLI text, fixtures, and validation checks agree
          on the project-level current-only symbol boundary."
      verification_commands:
        - for file in tools/*.sh tests/*.sh; do sh -n "$file" || exit 1; done
        - zig build validate
    - id: P4
      depends_on:
        - P3
      status: done
      title: Full validation and real-repository proof
      goal: Prove the completed slice with full local validation and privacy-safe
        real-repository smoke evidence.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, tests/integration.sh, runtime smoke
          commands, final evidence summary in Flow/run state."
        - "In scope: run git diff --check, zig
          fmt/check/test/validate/validate-all, project-level symbol smokes on
          this repository, and one suitable sibling/local repo when available
          using labels and bounded counts only."
        - "Out of scope: committing raw private reports, absolute paths, private
          repo names, remote fetching, package publishing, or fixing unrelated
          repository issues outside the feature boundary."
        - "Protected: evidence-before-claim; fixture-only evidence is not enough
          for real-repo behaviour; validation output must remain privacy-safe."
        - "Dependencies: P1-P3 complete."
        - "Validation/evidence: full close-out command ladder plus privacy-safe
          smoke summaries for table/Markdown/JSON and --symbol-line-history."
        - "Review focus: every PRD requirement and acceptance item has fresh
          evidence or a documented not-applicable finding."
        - "Escalate if: no suitable sibling/local repo is available,
          validate-all fails from unrelated pre-existing issues, or smoke
          evidence would expose private paths or report content."
        - "Done boundary: feature is ready for independent verify/reconcile with
          complete local validation and privacy-safe real-repo smoke evidence."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
        - zig build validate-all
  output_contract:
    storage: Runtime report output only; no persistent cache or project index in
      this feature.
    surfaces:
      - table
      - json
      - markdown
    project_symbol_report:
      semantics:
        - current working-tree symbol evidence for retained ranked file hotspots
        - additive provider evidence only
        - file-level Git-history score/rank/confidence/lineage remain product
          truth
        - not true historical symbol attribution, ownership, bug prediction,
          code-quality scoring, or reference analysis
      item_fields:
        - path
        - parent_file_rank
        - parent_file_score_or_reference
        - symbol.name
        - symbol.kind
        - symbol.current_range
        - provider.name
        - provider.failure/freshness/confidence
        - symbol.confidence
        - caveats
        - current_only
        - optional current_line_history
      summary_fields:
        - ranked_file_count_considered
        - supported_file_count
        - unsupported_file_count
        - provider_failure_count
        - symbol_count
        - shown_count
        - omitted_count
        - display_limit
        - limit_source
        - sort_basis
    privacy_prohibited:
      - absolute local paths
      - remotes
      - author identities
      - commit messages
      - source snippets
      - parser diagnostics
      - raw private report dumps
      - private repository names
    consumers:
      - human terminal readers
      - JSON/Markdown downstream tools and user-chosen agents
      - Flow verification and real-repo smoke summaries
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
