    supporting_context:
      - source_ref: prd.md#problem[1]
        text: "git-hotspots can already report deterministic file hotspots and can
          enrich one inspected file with current working-tree Tree-sitter
          symbols. That leaves symbol evidence useful but too local: users must
          first know which hot file to inspect, then run a second command for
          one path."
      - source_ref: prd.md#problem[2]
        text: The next step should make symbol evidence available from the normal ranked
          hotspot report while staying honest about the current implementation
          boundary. The feature should not claim true historical symbol lineage
          or hunk-to-symbol attribution yet. It should surface current symbols
          inside the already-ranked hot files, and when requested, attach
          current-line Git evidence from HEAD line ranges. This gives humans and
          agents symbol-level investigation prompts without making provider
          output the product truth.
      - source_ref: prd.md#outcome[1]
        text: Allow project analysis commands to use --symbols, optionally with
          --symbol-line-history, without --inspect. The command first computes
          the normal file-level hotspot ranking, then extracts current symbols
          only for the ranked file results that have supported providers.
          Reports expose a project-level current-symbol hotspot section that is
          sorted from deterministic local evidence and clearly tied back to the
          parent file hotspot row.
      - source_ref: prd.md#outcome[2]
        text: "The result is a bounded first implementation slice for B002:"
      - source_ref: prd.md#outcome[3]
        text: file-level Git history remains the scoring and ranking source of truth;
      - source_ref: prd.md#outcome[4]
        text: current symbols are additive evidence for the ranked hot files;
      - source_ref: prd.md#outcome[5]
        text: current-line Git evidence is derived from local git blame --incremental
          over current HEAD symbol line ranges when requested;
      - source_ref: prd.md#outcome[6]
        text: unsupported languages, provider failures, large files, dirty files,
          shallow history, and partial history degrade with caveats rather than
          fabricated precision;
      - source_ref: prd.md#outcome[7]
        text: adding a future language provider to the shared current-symbol provider
          selection path automatically makes project-level symbol reports
          eligible for that language; and
      - source_ref: prd.md#outcome[8]
        text: true historical hunk-to-symbol attribution, rename or move lineage,
          reference graphs, and symbol relationship analysis remain later
          features.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 10 refs outside default requirement rows.
  acceptance_contract:
    outcome: Project analysis may request --symbols, optionally with
      --symbol-line-history and --symbol-limit, without --inspect. The CLI keeps
      file-level Git-history ranking as product truth, then extracts current
      working-tree symbols for the retained ranked file hotspots through the
      shared provider seam, reports deterministic project-level current-symbol
      evidence across table, JSON, and Markdown, and caveats unsupported,
      unavailable, dirty, shallow, partial, or provider-failed cases without
      private data or semantic overclaiming.
    acceptance:
      - Project analysis accepts --symbols without --inspect and keeps the same
        ranked file result universe that the same command would produce without
        --symbols.
      - Project analysis accepts --symbols --symbol-line-history and attaches
        current-line Git evidence for eligible current symbol line ranges;
        --symbol-line-history without --symbols remains invalid.
      - Project analysis accepts --symbol-limit with --symbols; table and
        Markdown apply the human display limit and JSON preserves complete
        analysed symbol evidence unless a separately documented machine cap is
        accepted.
      - Existing inspect-mode --inspect PATH --symbols, --symbol-line-history,
        and --symbol-limit behaviour remains compatible and current-only.
      - Provider extraction runs only for retained ranked result rows after
        scope, since, include/exclude, and limit selection; the feature does not
        parse every tracked file before ranking or parse historical Git blobs.
      - Project-level symbol output is deterministic, local-only,
        provider-neutral, and additive; it does not change file score, rank,
        confidence, co-change evidence, rename lineage, or no-symbol output.
      - Unsupported paths, unavailable files, provider failures, byte-only
        ranges, dirty files, shallow history, and partial history degrade with
        visible caveats and never fabricate symbol precision.
      - Reports expose project-level current-symbol evidence across table,
        Markdown, and JSON with parent file linkage, provider state, symbol
        identity, current range, confidence, caveats, and optional current-line
        history fields.
      - CLI help, diagnostics, README, user guide, developer guide, manual page,
        explain text, tests, and validation checks are updated together to
        remove inspect-only wording and preserve current-only/non-goal wording.
      - Validation includes unit tests, integration fixtures for
        table/Markdown/JSON, no-symbol regression checks,
        privacy/prohibited-claim scans, zig build validate-all, and privacy-safe
        real-repository smoke evidence.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build validate
      - for file in tools/*.sh tests/*.sh; do sh -n "$file" || exit 1; done
      - git diff --check
      - zig build validate-all
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
