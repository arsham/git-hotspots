schema: flow-feature.v1
feature:
  id: "0078"
  slug: symbol-provider-history-attribution
  title: Project-level current-symbol hotspot evidence
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: Current symbol evidence exists only behind --inspect PATH --symbols, so
    users must already know which hot file to drill into before seeing
    symbol-level investigation prompts. B002 needs the first project-level
    symbol slice, but the current code and provider contract are current-only;
    this feature must avoid overclaiming true historical symbol attribution
    while making current symbols visible for the ranked hot files.
  outcome: Project analysis may request --symbols, optionally with
    --symbol-line-history and --symbol-limit, without --inspect. The CLI keeps
    file-level Git-history ranking as product truth, then extracts current
    working-tree symbols for the retained ranked file hotspots through the
    shared provider seam, reports deterministic project-level current-symbol
    evidence across table, JSON, and Markdown, and caveats unsupported,
    unavailable, dirty, shallow, partial, or provider-failed cases without
    private data or semantic overclaiming.
  acceptance:
    - Project analysis accepts --symbols without --inspect and keeps the same
      ranked file result universe that the same command would produce without
      --symbols.
    - Project analysis accepts --symbols --symbol-line-history and attaches
      current-line Git evidence for eligible current symbol line ranges;
      --symbol-line-history without --symbols remains invalid.
    - Project analysis accepts --symbol-limit with --symbols; table and Markdown
      apply the human display limit and JSON preserves complete analysed symbol
      evidence unless a separately documented machine cap is accepted.
    - Existing inspect-mode --inspect PATH --symbols, --symbol-line-history, and
      --symbol-limit behaviour remains compatible and current-only.
    - Provider extraction runs only for retained ranked result rows after scope,
      since, include/exclude, and limit selection; the feature does not parse
      every tracked file before ranking or parse historical Git blobs.
    - Project-level symbol output is deterministic, local-only,
      provider-neutral, and additive; it does not change file score, rank,
      confidence, co-change evidence, rename lineage, or no-symbol output.
    - Unsupported paths, unavailable files, provider failures, byte-only ranges,
      dirty files, shallow history, and partial history degrade with visible
      caveats and never fabricate symbol precision.
    - Reports expose project-level current-symbol evidence across table,
      Markdown, and JSON with parent file linkage, provider state, symbol
      identity, current range, confidence, caveats, and optional current-line
      history fields.
    - CLI help, diagnostics, README, user guide, developer guide, manual page,
      explain text, tests, and validation checks are updated together to remove
      inspect-only wording and preserve current-only/non-goal wording.
    - Validation includes unit tests, integration fixtures for
      table/Markdown/JSON, no-symbol regression checks, privacy/prohibited-claim
      scans, zig build validate-all, and privacy-safe real-repository smoke
      evidence.
