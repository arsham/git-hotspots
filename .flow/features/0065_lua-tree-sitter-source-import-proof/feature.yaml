feature:
  id: "0065"
  slug: lua-tree-sitter-source-import-proof
  title: Lua Tree-sitter source import proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0064 admitted a Lua grammar candidate but did not import
    source. Lua runtime work needs a pinned, reviewable, local-first
    tree-sitter-lua source set before build, query, extraction, or inspect
    output can proceed.
  outcome: A narrow pinned tree-sitter-lua source set is vendored with provenance,
    BOM, license and notice handling, parser and scanner provenance, core
    compatibility, source-size evidence, and explicit proof that Lua runtime
    support is still absent.
  acceptance:
    - Import a narrow immutable tree-sitter-lua source set under
      third_party/tree-sitter-lua/<revision>/.
    - Record source identity, checksum or pinned-checkout basis, BOM, excluded
      file classes, license and notice handling, parser/scanner provenance, core
      compatibility, source-size evidence, and .lua path admission evidence.
    - Add public evidence at docs/tree-sitter-lua-source-import.md.
    - Preserve no runtime provider, build proof, query fixtures, extraction,
      inspect output, report schema, scoring, cache, CI, package/release,
      network, telemetry, upload, remote-enrichment, LuaRocks, package-path,
      module-resolution, or LSP behaviour.
    - Stop as blocked rather than importing unreviewed, incompatible, unpinned,
      or overbroad source.
