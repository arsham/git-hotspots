        file classes, license and notice handling, parser/scanner provenance,
        core compatibility, source-size evidence, and .lua path admission
        evidence.
      - Add public evidence at docs/tree-sitter-lua-source-import.md.
      - Preserve no runtime provider, build proof, query fixtures, extraction,
        inspect output, report schema, scoring, cache, CI, package/release,
        network, telemetry, upload, remote-enrichment, LuaRocks, package-path,
        module-resolution, or LSP behaviour.
      - Stop as blocked rather than importing unreviewed, incompatible,
        unpinned, or overbroad source.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - changed-path scan for source-import-only scope
      - license and notice verification
      - BOM and parser/scanner provenance proof
      - Tree-sitter core compatibility proof
      - source-size and no-provider stability checks
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
