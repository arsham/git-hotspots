      - src/report_json.zig
      - src/report_markdown.zig
      - README.md
      - docs/user-guide.md
      - docs/developer-guide.md
      - man/git-hotspots.1
      - tests/integration.sh
      - tools/validate.sh
      - fixtures/expected
    json_shape: Optional top-level historical symbol evidence object emitted only
      when --historical-symbols is enabled; includes
      basis/current_only=false/local_only=true, summary, bounds/caveats,
      deterministic sort basis, and bounded evidence items.
    human_display: Table and Markdown sections emitted only when enabled; existing
      --symbol-limit limits human historical symbol rows unless shaping is
      revised.
    privacy_prohibited:
      - absolute local paths
      - remotes
      - authors or emails
      - commit messages
      - private repository names
      - source snippets from private repositories
      - parser diagnostics
      - raw private reports
      - ownership/productivity metrics
      - bug prediction
      - code-quality scoring
      - developer ranking
    consumers:
      - human CLI users
      - user-chosen coding agents consuming JSON/Markdown
      - future relation/reference analysis features
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
