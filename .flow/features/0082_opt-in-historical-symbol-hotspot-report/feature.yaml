    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The project can now parse historical hunks internally and should next
          expose the capability to users, but only after the internal pipeline
          integration from feature 0081 proves bounded performance and
          public-output neutrality. The public surface must be opt-in, additive,
          deterministic, local-first, and careful about what historical symbol
          evidence means.
      - source_ref: prd.md#problem[2]
        text: Existing --symbols output is current working-tree enrichment, and
          --symbol-line-history is current-line Git evidence for HEAD ranges.
          Users need a clearly separate report surface for true historical
          hunk-to-symbol evidence, without changing file-level scoring truth or
          implying semantic lineage, bug prediction, ownership, or code-quality
          judgement.
      - source_ref: prd.md#outcome[1]
        text: Add an opt-in public historical symbol hotspot report surface. The planned
          user shape is --historical-symbols used with --symbols; it should run
          the integrated historical symbol pipeline over retained ranked-file
          candidates and render additive table, JSON, and Markdown evidence.
          Existing output without the new flag must remain unchanged.
          Documentation, man page, help, diagnostics, fixtures, integration
          tests, and validation must move together.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add an opt-in public historical symbol hotspot report using
      --historical-symbols with --symbols after feature 0081 is complete. The
      report should render additive deterministic table, JSON, and Markdown
      evidence from the integrated historical pipeline while preserving existing
      output without the flag and updating CLI/docs/man/tests/fixtures together.
    acceptance:
      - A public opt-in --historical-symbols flag is added after feature 0081 is
        done; it requires --symbols and invalid use exits 2 with a concise
        diagnostic and valid command shape.
      - Runs without --historical-symbols preserve existing CLI behaviour,
        table/JSON/Markdown output, explain text, current project-symbol
        reports, current-line history reports, scoring/ranking, and golden
        fixtures.
      - When enabled, the report uses the feature 0081 integrated historical
        pipeline over retained ranked-file candidates and respects existing
        repo/range/scope/include/exclude/inspect/limit semantics without
        checkout or network access.
      - JSON adds an optional historical-symbol evidence object only when
        enabled, with basis metadata, local-only provenance, candidate/bound
        summaries, caveats, deterministic sort basis, and evidence-only item
        fields.
      - Table and Markdown add clearly labelled historical symbol sections only
        when enabled; human rows use the existing --symbol-limit display limit
        unless reshaped, while JSON completeness/boundedness is explicit.
      - Public wording distinguishes current working-tree symbols, current-line
        Git evidence for HEAD ranges, and true historical hunk attribution; it
        does not claim semantic lineage, references, ownership, bug prediction,
        code-quality scoring, or developer ranking.
      - Documentation, man page, help, diagnostics, README, user/developer
        guides, integration tests, tools/validate.sh, expected fixtures,
        provider capability/prohibited-claim checks, and examples are updated
        together where public wording or output changes.
      - Real-repository smoke evidence covers this repo and one suitable
        sibling/local repo when available with privacy-safe labels and bounded
        counts; absence of a sibling is caveated rather than invented.
      - Close-out validation includes git diff whitespace checks, Zig
        formatting, zig build test, zig build validate, deterministic fixture
        proof, JSON validity, default-output non-regression, and independent
        review.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - git diff --check
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify additive opt-in semantics and default-output non-regression
      - verify docs/help/man/tests/fixtures stay synchronized
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
      - execution before feature 0081 is done
      - breaking JSON schema change
      - default-output drift without explicit contract update
    protected_surfaces:
      - default CLI behaviour without --historical-symbols
      - table JSON and Markdown output without --historical-symbols
      - file-level score and rank semantics
      - --symbol-line-history current-line semantics
      - README docs/user-guide.md docs/developer-guide.md man/git-hotspots.1
        tests/integration.sh tools/validate.sh fixtures/expected
      - privacy-safe real-repo validation evidence
  fallback_path: deferred_reconcile_decision
  notes: Feature 0082 is the primary public B002 report slice but must execute
    only after feature 0081 is done. Public changes must be additive, opt-in,
    deterministic, local-first, evidence-only, and synchronized across
    CLI/docs/man/tests/fixtures/validation.
