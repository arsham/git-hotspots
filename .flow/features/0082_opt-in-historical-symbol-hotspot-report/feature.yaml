schema: flow-feature.v1
feature:
  id: "0082"
  slug: opt-in-historical-symbol-hotspot-report
  title: Opt-in historical symbol hotspot report
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: git-hotspots now has current-symbol evidence and an internal historical
    hunk attribution engine, but users still cannot opt into true historical
    symbol hotspot evidence. The public surface must be additive and careful so
    it does not confuse current-line blame, current symbols, or file-level
    scoring with true historical symbol attribution.
  outcome: Add an opt-in public historical symbol hotspot report using
    --historical-symbols with --symbols after feature 0081 is complete. The
    report should render additive deterministic table, JSON, and Markdown
    evidence from the integrated historical pipeline while preserving existing
    output without the flag and updating CLI/docs/man/tests/fixtures together.
  acceptance:
    - A public opt-in --historical-symbols flag is added after feature 0081 is
      done; it requires --symbols and invalid use exits 2 with a concise
      diagnostic and valid command shape.
    - Runs without --historical-symbols preserve existing CLI behaviour,
      table/JSON/Markdown output, explain text, current project-symbol reports,
      current-line history reports, scoring/ranking, and golden fixtures.
    - When enabled, the report uses the feature 0081 integrated historical
      pipeline over retained ranked-file candidates and respects existing
      repo/range/scope/include/exclude/inspect/limit semantics without checkout
      or network access.
    - JSON adds an optional historical-symbol evidence object only when enabled,
      with basis metadata, local-only provenance, candidate/bound summaries,
      caveats, deterministic sort basis, and evidence-only item fields.
    - Table and Markdown add clearly labelled historical symbol sections only
      when enabled; human rows use the existing --symbol-limit display limit
      unless reshaped, while JSON completeness/boundedness is explicit.
    - Public wording distinguishes current working-tree symbols, current-line
      Git evidence for HEAD ranges, and true historical hunk attribution; it
      does not claim semantic lineage, references, ownership, bug prediction,
      code-quality scoring, or developer ranking.
    - Documentation, man page, help, diagnostics, README, user/developer guides,
      integration tests, tools/validate.sh, expected fixtures, provider
      capability/prohibited-claim checks, and examples are updated together
      where public wording or output changes.
    - Real-repository smoke evidence covers this repo and one suitable
      sibling/local repo when available with privacy-safe labels and bounded
      counts; absence of a sibling is caveated rather than invented.
    - Close-out validation includes git diff whitespace checks, Zig formatting,
      zig build test, zig build validate, deterministic fixture proof, JSON
      validity, default-output non-regression, and independent review.
planning:
  state: ready
  summary: B002 primary public-report batch slice after 0081. Add opt-in
