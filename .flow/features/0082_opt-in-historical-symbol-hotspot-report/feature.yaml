design:
  rough_shape:
    - Add --historical-symbols to CLI parsing and model.Config, requiring
      --symbols and preserving --symbol-line-history as a separate current-line
      layer.
    - Wire the flag through app orchestration to the feature 0081 integrated
      historical pipeline after file analysis and current symbol attachment,
      without changing file scores or file order.
    - Extend model.Analysis with an optional public historical symbol report
      only when enabled; render additive table, JSON, and Markdown sections with
      explicit caveats and bounded display.
    - Update README, docs/user-guide.md, docs/developer-guide.md,
      man/git-hotspots.1, help, explain/provider capability wording,
      tests/integration.sh, tools/validate.sh, and expected fixtures together.
    - Add deterministic fixture and real-repo smoke proof for enabled output and
      non-regression proof for disabled/default output.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: CLI/config and orchestration flag
      goal: Add --historical-symbols as an opt-in flag requiring --symbols and wire it
        to the integrated pipeline without changing default output.
      owner_phase: runner
      execution_context:
        - "Anchors: src/cli.zig, src/app.zig, src/model.zig,
          src/historical_symbol_attribution.zig or integration module from
          0081."
        - "In scope: CLI parse/config flag, invalid-combination diagnostic, help
          text, app orchestration, dependency on --symbols, no default
          execution, no score/rank changes."
        - "Out of scope: new cache flags, reference/use analysis, semantic
          lineage flags, broad tuning flags unless planner-approved."
        - "Protected: --symbol-line-history remains current-line HEAD evidence
          and must not be renamed or conflated with --historical-symbols."
        - "Dependencies: feature 0081 must be done before implementation starts."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; targeted CLI misuse tests."
        - "Review focus: opt-in semantics and diagnostics are clear,
          local-first, and backward-compatible."
        - "Escalate if: a different public flag name or dependency model is
          needed."
        - "Done boundary: --historical-symbols is parsed, gated by --symbols,
          and invokes no public output without explicit use."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Additive report model and renderers
      goal: Render deterministic historical symbol evidence in JSON, table, and
        Markdown only when enabled.
      owner_phase: runner
      execution_context:
        - "Anchors: src/model.zig, src/report_json.zig, src/report_table.zig,
          src/report_markdown.zig, src/report_format.zig,
          src/report_symbols.zig."
        - "In scope: optional historical report model, JSON object,
          table/Markdown sections, display counts, --symbol-limit human
          limiting, caveats, sort basis, provider/fallback summaries,
          privacy-safe evidence fields."
        - "Out of scope: file score replacement, default report schema changes
          without flag, author/commit-message/source-snippet fields, semantic
          lineage or references."
        - "Protected: existing output byte-for-byte without --historical-symbols
          unless an explicitly approved fixture harness update is required."
        - "Dependencies: P1 flag and integrated pipeline call."
        - "Validation/evidence: targeted renderer tests; JSON validity;
          deterministic repeated output."
        - "Review focus: additive schema, evidence-only tone, deterministic
          ordering, bounded output size."
        - "Escalate if: public JSON schema needs a breaking version change."
        - "Done boundary: enabled reports expose historical symbols across all
          formats with clear caveats and disabled reports remain unchanged."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
    - id: P3
      depends_on:
        - P1
        - P2
      status: planned
      title: Docs, fixtures, diagnostics, and validation synchronization
      goal: Update every public wording and validation surface required by the new
        CLI/report flag.
      owner_phase: runner
      execution_context:
        - "Anchors: README.md, docs/user-guide.md, docs/developer-guide.md,
          man/git-hotspots.1, src/explain.zig, tests/integration.sh,
          tools/validate.sh, fixtures/expected."
        - "In scope: help/explain/docs/man wording, misuse diagnostics, expected
          table/JSON/Markdown fixtures, provider capability matrix,
          prohibited-claim/privacy checks, examples with project-relative
          paths."
        - "Out of scope: marketing claims, bug prediction/quality
          scoring/developer ranking language, raw private reports, B002
          close-out."
        - "Protected: AGENTS.md rule requiring CLI parsing/help/diagnostic
          wording changes to update tests, validate, README, user/developer
          guides, and man page together."
        - "Dependencies: P1-P2 public behaviour settled."
        - "Validation/evidence: tests/integration.sh via zig build validate;
          docs/man surface checks; prohibited-claim scan."
        - "Review focus: no stale wording says symbol history is out of scope
          without mentioning the new opt-in true historical layer; current-line
          caveats remain clear."
        - "Escalate if: docs need broad repositioning beyond this feature."
        - "Done boundary: all public surfaces agree on flag semantics, evidence
          meaning, limits, and caveats."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build validate
    - id: P4
      depends_on:
        - P3
      status: planned
      title: Full validation and real-repo proof
      goal: Prove enabled output, disabled-output non-regression, determinism,
        privacy, and real-repo smoke before review.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, docs/real-repo-validation.md if updated,
          fixtures/expected, feature PRD, B002."
        - "In scope: full validation ladder, this-repo and sibling/local repo
          smoke with privacy-safe labels, deterministic repeated-run proof, JSON
          validity, acceptance mapping."
        - "Out of scope: publishing, package release, history cleanup,
          relation/reference feature work."
        - "Protected: no absolute local paths, raw private reports, remotes,
          authors/emails, commit messages, source snippets, or parser
          diagnostics in committed artefacts."
        - "Dependencies: P1-P3 complete."
        - "Validation/evidence: git diff --check; zig fmt --check build.zig src
          tests; zig build test; zig build validate; real-repo smoke summaries."
        - "Review focus: user-facing surface is ready, deterministic, additive,
          local-first, and honest about limits."
        - "Escalate if: performance or output size suggests reshaping bounds or
          public flags."
        - "Done boundary: independent reviewer can verify all public and privacy
          acceptance rows without planner chat."
      verification_commands:
        - git diff --check
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build validate
  output_contract:
    primary_deliverable: Opt-in public historical symbol hotspot report exposed by
