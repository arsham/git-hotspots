design:
  rough_shape:
    - Create or update release checklist artefact from prior feature outputs.
    - Record proposed tag target and validation evidence.
    - Run read-only tag/status checks and documentation checks.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Prepare tag checklist
      goal: Write the release/tag checklist with inert commands and approval gate.
      owner_phase: runner
      execution_context:
        - "Anchors: release notes/changelog, version metadata, validation
          evidence, docs/release checklist if present."
        - "In scope: checklist and read-only status/tag checks."
        - "Out of scope: executing tag commands, pushing, publishing,
          announcing."
        - "Dependencies: 0100, 0101, 0102 closed."
        - "Escalate if: proposed tag exists locally/remotely or origin changed
          unexpectedly."
        - "Done boundary: future operator can approve or reject tagging from
          durable checklist."
      verification_commands:
        - git status -sb
        - git tag --list 'v0.1.0-alpha.3'
        - git ls-remote --tags origin 'v0.1.0-alpha.3'
        - git diff --check
    - id: P2
      depends_on:
        - P1
      status: done
      title: Checklist review
      goal: Verify checklist is accurate and no release side effect occurred.
      owner_phase: reviewer
      execution_context:
        - "Review focus: commands are inert documentation, no tag
          exists/created, approval gate explicit."
        - "Protected: no remote mutation beyond read-only checks."
      verification_commands:
        - git tag --points-at HEAD
        - git ls-remote --tags origin 'v0.1.0-alpha.3'
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
