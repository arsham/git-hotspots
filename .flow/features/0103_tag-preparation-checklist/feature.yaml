schema: flow-feature.v1
feature:
  id: "0103"
  slug: tag-preparation-checklist
  title: Tag preparation checklist
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: After release validation, the project needs an explicit tag preparation
    checklist that prevents another accidental tag or remote push.
  outcome: A release/tag checklist names the proposed tag, target, validation
    evidence, and exact approval gate while stopping before any tag or publish
    side effect.
  acceptance:
    - Checklist states proposed tag name, target commit, validation evidence
      references, and rollback/delete-tag notes.
    - Checklist contains inert tag commands but they are not executed.
    - Existing local/remote tags are checked read-only and any conflict blocks
      close-out.
    - Explicit future operator approval is required before tag creation, push,
      package publish, GitHub release, or announcement.
