          license/notice/offline-build considerations, symbol mapping plan,
          provider failure/degradation plan, validation matrix, stop conditions,
          and recommended next implementation slice."
        - "Out of scope: adding tree-sitter or tree-sitter-zig sources,
          build.zig.zon, C build/linking, parser runtime, provider registry, CLI
          flags, report schema fields, file scoring/ranking changes, cache,
          network fetches, telemetry, background analysis, or multi-language
          support."
        - "Protected: current no-provider table/JSON/Markdown output,
          dependency-free source-install workflow, local-first defaults,
          provider contract, file-level Git evidence as product truth, and OSS
