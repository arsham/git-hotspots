design:
  rough_shape:
    - Create a focused feasibility/decision document for tree-sitter Zig symbol
      provider integration.
    - Record local evidence that system tree-sitter exists but no portable
      tree-sitter-zig grammar is currently available in the repo.
    - Choose and justify the next implementation strategy, with vendored pinned
      sources preferred only if license/offline-build risk is acceptable.
    - Define an opt-in inspect-oriented provider surface for a future feature
      without changing current runtime behaviour now.
  packets:
    - id: P1
      title: Tree-sitter Zig provider feasibility record
      goal: Produce a durable local-first feasibility record and next-feature contract
        for tree-sitter Zig symbol evidence without adding parser runtime or
        report behaviour in this feature.
      owner_phase: runner
      depends_on: []
      status: done
      execution_context:
