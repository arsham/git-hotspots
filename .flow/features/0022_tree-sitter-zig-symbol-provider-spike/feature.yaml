schema: flow-feature.v1
feature:
  id: "0022"
  slug: tree-sitter-zig-symbol-provider-spike
  title: Tree-sitter Zig symbol provider feasibility spike
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The provider contract and internal symbol evidence seam exist, but a
    real tree-sitter Zig provider would add parser, C build, grammar vendoring,
    report, and validation risk. The project needs a feasibility decision before
    committing tree-sitter runtime dependencies or public symbol-report
    behaviour.
  outcome: Produce a local-first feasibility record for a future tree-sitter Zig
    symbol provider, including dependency strategy, parser/symbol mapping plan,
    validation matrix, stop conditions, and the recommended next implementation
    slice while preserving current CLI/runtime behaviour.
  acceptance:
    - A new provider feasibility document records the recommended tree-sitter
      Zig implementation path, including whether to vendor pinned tree-sitter
      core and generated Zig grammar C sources or stop before runtime
      integration.
    - The document maps current working-tree Zig symbol evidence to the existing
      `src/provider.zig` seam, including file path, symbol name, kind, current
      range, provider envelope, confidence, caveats, freshness, and failure
      state.
    - The document defines the intended first runtime surface as opt-in and
      inspect-oriented, with no default provider execution and no changes to
      file-level scoring or ranking.
    - Dependency, license, notice, offline-build, source-install, and
      cross-platform risks are assessed without adding tree-sitter, grammar
      sources, build.zig.zon, C build/linking, CLI flags, report schema changes,
      provider registry, cache, network access, telemetry, or background
      analysis in this feature.
    - Validation and close-out requirements are recorded for the future runtime
      provider feature, including byte-stable no-provider outputs, deterministic
      provider output, graceful unavailable/unsupported/failure states, privacy
      scans, and real-repo smoke with privacy-safe labels.
    - Current repository validation still passes and no runtime source, test,
      fixture, build dependency, or public report behaviour changes are made
      unless the PRD explicitly names a documentation-only update.
planning:
  state: ready
  summary: Shape 0022 as a feasibility-first tree-sitter Zig provider spike, not
    runtime parser integration. The feature should produce a durable decision
