design:
  rough_shape:
    - Create a focused feasibility/decision document for tree-sitter Zig symbol
      provider integration.
    - Record local evidence that system tree-sitter exists but no portable
      tree-sitter-zig grammar is currently available in the repo.
    - Choose and justify the next implementation strategy, with vendored pinned
      sources preferred only if license/offline-build risk is acceptable.
    - Define an opt-in inspect-oriented provider surface for a future feature
      without changing current runtime behaviour now.
  packets:
    - id: P1
      title: Tree-sitter Zig provider feasibility record
      goal: Produce a durable local-first feasibility record and next-feature contract
        for tree-sitter Zig symbol evidence without adding parser runtime or
        report behaviour in this feature.
      owner_phase: runner
      depends_on: []
      status: planned
      execution_context:
        - "Anchors: docs/provider-symbol-evidence-contract.md,
          docs/tree-sitter-zig-provider-spike.md or equivalent new doc,
          src/provider.zig, build.zig, README.md, tools/validate.sh."
        - "In scope: feasibility evidence, dependency strategy comparison,
          license/notice/offline-build considerations, symbol mapping plan,
          provider failure/degradation plan, validation matrix, stop conditions,
          and recommended next implementation slice."
        - "Out of scope: adding tree-sitter or tree-sitter-zig sources,
          build.zig.zon, C build/linking, parser runtime, provider registry, CLI
          flags, report schema fields, file scoring/ranking changes, cache,
          network fetches, telemetry, background analysis, or multi-language
          support."
        - "Protected: current no-provider table/JSON/Markdown output,
          dependency-free source-install workflow, local-first defaults,
          provider contract, file-level Git evidence as product truth, and OSS
          publicity boundary."
        - "Dependencies: Feature 0020 provider contract, Feature 0021 provider
          symbol seam, B001 local-first OSS capability brief."
        - "Validation/evidence: git diff --check; zig build validate; scans
          proving no runtime/provider/build dependency/source/test/fixture/CLI
          report schema changes outside the shaped documentation-only scope;
          privacy/prohibited-claim scan for the new document."
        - "Review focus: the decision record is specific enough for a later
          runner to implement the first real tree-sitter Zig provider without
          relying on this chat, and it does not imply symbol evidence exists in
          CLI reports today."
        - "Escalate if: feasibility requires network fetches, global system
          dependencies, vendored third-party code, parser runtime, report schema
          or CLI commitments, scoring changes, or license decisions not already
          approved."
        - "Done boundary: decision record exists, next implementation slice is
          explicit, current validation passes, and no runtime dependency or
          output behaviour was added."
      verification_commands:
        - git diff --check
        - zig build validate
  packet_contract:
