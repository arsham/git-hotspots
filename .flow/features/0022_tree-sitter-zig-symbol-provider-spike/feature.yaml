    supporting_context:
      - source_ref: prd.md#problem[1]
        text: "git-hotspots now has a provider/symbol evidence contract and an internal
          provider seam, but it does not yet know whether a real tree-sitter Zig
          provider can be added without damaging the project goals:
          deterministic local-first analysis, simple source installs, no network
          dependency, and file-level Git evidence as product truth."
      - source_ref: prd.md#problem[2]
        text: "A direct tree-sitter implementation would combine several risks in one
          feature: C build/linking, generated grammar source, license/notice
          handling, report UX, parser correctness, provider failure semantics,
          and validation. Local inspection shows system tree-sitter is installed
          on this machine, but the repository does not contain a pinned
          tree-sitter-zig grammar. Depending on host packages would not be a
          portable source-install story."
      - source_ref: prd.md#outcome[1]
        text: Create a durable feasibility and decision record for the first tree-sitter
          Zig symbol provider. The feature should define the next implementation
          path and stop conditions without adding parser runtime, new build
          dependencies, CLI flags, report schema fields, provider registry,
          cache, or scoring changes.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 3 refs outside default requirement rows.
  acceptance_contract:
    outcome: Produce a local-first feasibility record for a future tree-sitter Zig
      symbol provider, including dependency strategy, parser/symbol mapping
      plan, validation matrix, stop conditions, and the recommended next
      implementation slice while preserving current CLI/runtime behaviour.
    acceptance:
      - A new provider feasibility document records the recommended tree-sitter
        Zig implementation path, including whether to vendor pinned tree-sitter
        core and generated Zig grammar C sources or stop before runtime
        integration.
      - The document maps current working-tree Zig symbol evidence to the
        existing `src/provider.zig` seam, including file path, symbol name,
        kind, current range, provider envelope, confidence, caveats, freshness,
        and failure state.
      - The document defines the intended first runtime surface as opt-in and
        inspect-oriented, with no default provider execution and no changes to
        file-level scoring or ranking.
      - Dependency, license, notice, offline-build, source-install, and
        cross-platform risks are assessed without adding tree-sitter, grammar
        sources, build.zig.zon, C build/linking, CLI flags, report schema
        changes, provider registry, cache, network access, telemetry, or
        background analysis in this feature.
      - Validation and close-out requirements are recorded for the future
        runtime provider feature, including byte-stable no-provider outputs,
        deterministic provider output, graceful unavailable/unsupported/failure
        states, privacy scans, and real-repo smoke with privacy-safe labels.
      - Current repository validation still passes and no runtime source, test,
        fixture, build dependency, or public report behaviour changes are made
        unless the PRD explicitly names a documentation-only update.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
