  slug: typescript-tsx-query-contract-and-fixtures
  title: TypeScript/TSX query contract and fixtures
  lane: standard
  status: done
  autonomy_default: ask
intent:
  problem: TypeScript and TSX parser build proofs do not define which symbols are
    supported, how query captures map to provider evidence, or which fixtures
    prove deterministic TypeScript and TSX semantics.
  outcome: Project-owned TypeScript and TSX query contracts and fixture corpora
    define supported captures, mapping, ranges, ordering, caveats, and
    validation without exposing runtime TypeScript/TSX symbols.
  acceptance:
    - Define project-owned TypeScript and TSX symbol query contracts with
      capture names and supported subsets.
    - Cover .ts, .mts, .cts, .tsx, functions, classes, methods, interfaces, type
      aliases, enums, namespaces where deterministic, imports/exports, JSX
      components, invalid/partial, unsupported, unsafe path, generated/minified,
      empty, and monorepo-style cases.
    - Record range, ordering, symbol-kind mapping, provider/query version, and
      caveat semantics separately enough that TypeScript and TSX can be reviewed
      independently.
    - Add public evidence at docs/tree-sitter-typescript-query-contract.md.
    - Preserve no-provider and existing Zig/Go/Python/JavaScript symbol output
      byte stability.
    - Do not add user-facing TypeScript/TSX symbols, provider registry wiring,
      custom user query execution, package/workspace/module/Node/tsconfig/LSP
      analysis, parser generation, or network/global tool dependency.
