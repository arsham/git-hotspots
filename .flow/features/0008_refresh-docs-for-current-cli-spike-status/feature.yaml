design:
  rough_shape:
    - Rewrite or replace docs/planning-handoff.md as a concise current
      development snapshot.
    - Update .flow/project-memory.md compactly where it refers to the CLI spike
      as future work.
    - Audit README against current --help and --explain; avoid changes unless it
      is stale.
    - Do not touch implementation, validation, fixtures, build, or
      generated-output surfaces.
  packet_contract:
    version: v1
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
  packets:
    - id: P1
      title: Refresh current CLI docs and planning memory
      goal: Bring public docs and durable memory into alignment with the implemented
        CLI state after Features 0002-0007.
      depends_on: []
      status: planned
      owner_phase: runner
      verification_commands:
        - git diff --check
        - ./zig-out/bin/git-hotspots --help
        - ./zig-out/bin/git-hotspots --explain
      execution_context:
        - "Anchors: README.md, docs/planning-handoff.md,
          .flow/project-memory.md. AGENTS.md is protected unless a new durable
          agent rule is genuinely needed."
        - "In scope: remove stale future file-level CLI spike language; describe
          current CLI capabilities and validation workflow; preserve remaining
          guardrails and candidate future seams without choosing a next
          implementation feature."
        - "Out of scope: source/build/test/tool/fixture edits, docs site,
          roadmap commitments, provider/cache/release/CI design,
          commercial/hosted strategy, raw private outputs, Flow run logs in
          public docs."
        - "Protected: README stays visitor-facing and OSS-safe; hotspots remain
          investigation prompts; no stronger diagnostic or people-metric
          claims."
        - "Validation/evidence: steps/checks are git diff --check, changed-path
          scan, --help spot check, --explain spot check, stale-language scan,
          prohibited-claim scan, and zig build validate if README CLI examples
          or validation wording change. Expected observations are clean
          whitespace, docs-only changed paths, help/explain commands exiting 0,
          no stale future-spike text, and only negated guardrail hits for
          prohibited terms. Durable proof location is the runner/reviewer
          close-out evidence for Feature 0008."
        - "Review focus: docs match current CLI truth, no Flow/process clutter
          in README, stale planning handoff claims removed, project memory
          remains compact and cross-feature."
        - "Escalate if: docs require unimplemented behaviour, a next feature
          must be chosen, or implementation/tooling edits appear necessary."
        - "Done boundary: docs and memory are current enough for a fresh
          planner/public visitor without chat history."
