intent:
  problem: Project documentation and durable planning memory still describe the
    file-level CLI spike as future work even though Features 0002-0007 delivered
    the executable CLI, validation workflow, scope filters, Markdown export, and
    explain output.
  outcome: Refresh docs and planning memory so a public visitor or future planner
    sees the current CLI state without stale next-feature guidance, Flow process
    clutter, or commercial/product overclaims.
  acceptance:
    - docs/planning-handoff.md no longer says the file-level CLI spike is future
      work.
    - docs/planning-handoff.md describes current CLI capabilities and validation
      accurately.
    - .flow/project-memory.md no longer points planners at the completed first
      CLI spike.
    - README remains public-facing and is changed only if current CLI truth
      requires it.
    - No implementation, build, test, fixture, validation-script,
      generated-output, provider, cache, release, CI, network, telemetry, or
      runtime behaviour changes are made.
    - No monetisation, SaaS, pricing, sales, hosted-product roadmap,
      bug-prediction, objective quality-score, technical-debt-score,
      author-metric, maintainer-judgement, developer-ranking, or
      productivity-analytics claims are introduced.
    - Validation proves docs-only scope, no stale future-spike language, no
      prohibited positive claims, help/explain availability, and clean
      whitespace.
