feature:
  id: "0088"
  slug: typescript-javascript-relationship-provider-proof
  title: TypeScript and JavaScript relationship provider proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The public relationship report currently supports Python only.
    TypeScript, TSX, and JavaScript have parser and current-symbol proof
    surfaces, but need bounded relation provider support with honest syntax-only
    caveats before public capability claims expand.
  outcome: Add TypeScript, TSX, and JavaScript relationship provider support for
    retained ranked-file candidates behind the existing --symbols
    --symbol-relationships opt-in report, preserving deterministic local
    evidence and no scoring effect.
  acceptance:
    - TypeScript, TSX, and JavaScript relation extraction reuses the shared
      relation model, aggregation, and report surfaces.
    - Supported relation kinds include contains, reference, call,
      import_include, unresolved, and unknown where grammar evidence supports
      them honestly.
    - Dynamic/member/computed/JSX/TSX/type-only constructs degrade with caveats
      or unresolved/unknown endpoints rather than fabricated precision.
    - Default output remains unchanged and --symbol-relationships still requires
      --symbols.
    - Docs, man page, help/explain/capability claims, fixtures, and validation
      are updated only to accurately reflect newly supported relationship
      languages.
    - JSON, Markdown, and table golden fixtures remain deterministic and
      privacy-safe when public output changes.
    - Targeted JavaScript/TypeScript/TSX provider proofs, zig build test, zig
      build validate, Flow validation, and privacy-safe real-repo or skip
      evidence are recorded.
