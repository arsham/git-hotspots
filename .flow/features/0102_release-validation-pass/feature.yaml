design:
  rough_shape:
    - Run release validation commands named by dispatch.
    - Record concise durable evidence in Flow/checklist artefacts.
    - Fix only direct release-blocking validation failures inside scope;
      otherwise stop.
  packets:
    - id: P1
      depends_on: []
      status: done
      title: Release validation evidence
      goal: Run and record the release validation ladder.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, build.zig validation targets,
          release-note/checklist artefacts from prior features."
        - "In scope: validation and direct validation-evidence recording; narrow
          bug/docs fixes only if validation blocks release readiness."
        - "Out of scope: tag creation, publishing, release upload."
        - "Dependencies: 0100 and 0101 closed."
        - "Validation/evidence: include privacy-safe real-repo smoke and bounded
          counts."
        - "Done boundary: validation evidence is durable enough for a fresh
          reviewer."
      verification_commands:
        - git diff --check
        - zig build test
        - zig build validate
    - id: P2
      depends_on:
        - P1
      status: done
      title: Independent validation review
      goal: Verify validation evidence is fresh, bounded, and release-relevant.
      owner_phase: reviewer
      execution_context:
        - "Review focus: no stale evidence, no private output, no tag/publish
          side effect."
        - "Escalate if: validation is flaky or requires weakened checks."
      verification_commands:
        - zig build validate
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
