intent:
  problem: After release notes and metadata are prepared, the repository needs a
    durable release validation pass before any tag decision.
  outcome: Release-readiness validation is run and recorded with privacy-safe
    evidence, proving the repo is ready for an explicit future tag decision.
  acceptance:
    - Full validation ladder and supported source/package dogfood checks pass or
      stop with a concrete blocker.
    - Privacy-safe real-repo smoke evidence is recorded with labels and bounded
      counts only.
    - Deterministic fixtures, performance budgets, provider matrix,
      prohibited-claim, docs/man/help, and local-only checks pass.
    - No tag, remote release, package upload, or publish side effect occurs.
