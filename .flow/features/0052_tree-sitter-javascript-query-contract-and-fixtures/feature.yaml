schema: flow-feature.v1
feature:
  id: "0052"
  slug: tree-sitter-javascript-query-contract-and-fixtures
  title: JavaScript query contract and fixtures
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: JavaScript parser build proof will not define which symbols are
    supported, how query captures map to provider evidence, or which fixtures
    prove deterministic JavaScript and admitted JSX semantics.
  outcome: A project-owned JavaScript query contract and fixture corpus define
    supported captures, mapping, ranges, ordering, caveats, and validation
    without exposing runtime JavaScript symbols.
  acceptance:
    - Define a project-owned JavaScript symbol query contract with capture names
      and supported subset.
    - Cover .js, .mjs, .cjs, admitted .jsx, functions, classes, methods,
      constants/variables, ESM exports, CommonJS exports, anonymous exports,
      generated/minified, empty, invalid/partial, unsupported, unsafe path, and
      monorepo-style cases.
    - Record range, ordering, symbol-kind mapping, provider/query version, and
      caveat semantics.
    - Add public evidence at docs/tree-sitter-javascript-query-contract.md.
    - Preserve no-provider and existing Zig/Go/Python symbol output byte
      stability.
    - Do not add user-facing JavaScript symbols, provider registry wiring,
      custom user query execution, TypeScript/TSX support,
      package/workspace/module/Node/LSP analysis, parser generation, or
      network/global tool dependency.
