  acceptance_contract:
    outcome: Human relationship outputs include a deterministic provider-neutral
      summary of emitted relation kinds, unresolved or unknown totals, and
      display-limit versus provider-cap omissions, while preserving JSON schema,
      per-record evidence, provider claims, and all scoring/ranking semantics.
    acceptance:
      - Table relationship output includes concise relation-kind and
        uncertainty/partialness summary information.
      - Markdown relationship output includes equivalent concise summary
        information.
      - Display-limit omissions and provider-cap omissions are visibly distinct
        in human output.
      - JSON report schema and per-record relationship evidence remain
        compatible and present.
      - No CLI flags, scoring, ranking, provider admission, relationship
        semantics, release/tag/remote/package behaviour, network behaviour,
        telemetry, or cache semantics change.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - rg -n
        "symbol-relationships|relationship|cap|omitted|unknown|unresolved|caveat"
        src tests fixtures README.md docs man tools/validate.sh
      - zig build test
      - git diff --check
      - zig build validate
      - tools/flow-closeout-check.sh --smoke-skip-reason <privacy-safe reason if
        no sibling smoke is selected>
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify table and Markdown summaries improve uncertainty and partialness
        readability without hiding row evidence or caveats
      - verify display-limit and provider-cap omissions are distinct
      - verify JSON schema and record evidence remain compatible and present
      - verify docs and man wording do not expand support or semantic claims
  decision_budget:
    allowed_local_decisions:
      - safe internal rendering helper refactor inside dispatched scope
      - local summary wording that preserves evidence-only meaning
      - fixture wording updates that do not broaden claims
    deferred_reconcile_triggers:
      - minor human-output wording tradeoff worth reviewer visibility
      - implementation tradeoff that preserves JSON and all protected surfaces
    hard_planner_escalation_triggers:
      - JSON schema or record evidence change
      - CLI flag or option change
      - provider admission or relationship semantic change
      - scoring ranking or confidence change
      - deduplication or filtering rule
      - cap algorithm change
      - release tag remote package network telemetry or cache behaviour change
      - unsupported semantic claims such as call graph dependency ownership
        quality or bug prediction
    protected_surfaces:
      - JSON schema and per-record relationship evidence and caveats
      - CLI flags and option combinations
      - file and symbol scoring ranking and confidence
      - provider admission matrix
      - relationship semantics and provider evidence model
      - deduplication and filtering rules
      - release state tags remotes and packages
      - network telemetry and cache behaviour
  fallback_path: deferred_reconcile_decision
  notes: null
