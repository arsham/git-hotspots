    outcome: A pinned tree-sitter-rust source set is vendored with provenance, BOM,
      license, parser/scanner, core-compatibility, size, validation, and
      no-provider evidence, while Rust runtime support remains absent.
    acceptance:
      - Import a narrow pinned tree-sitter-rust source set under a revisioned
        third_party path with provenance and imported-file manifest.
      - Record license, notice, generated parser, scanner, BOM, excluded file
        classes, core compatibility, source-size, and .rs path admission
        evidence.
      - Add public evidence at docs/tree-sitter-rust-source-import.md.
      - Do not add Rust build proof, query fixtures, extraction, runtime
        provider, inspect output, report schema, scoring, cache, CI, package,
        release, network, telemetry, upload, remote enrichment, Cargo, crate
        graph, module resolution, macro expansion, type checking, LSP, or custom
        query execution.
      - Preserve existing provider outputs and no-provider outputs.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build validate
      - changed-path scan for source-import-only scope
      - vendored-path scan proving no runtime/build/query/extraction/provider
        changes
      - license and notice verification
      - BOM and excluded-file-class review
      - parser and scanner provenance proof
      - Tree-sitter core compatibility proof
      - source-size and largest-file measurements
      - no-provider output stability check
      - privacy-safe this-repo smoke
      - privacy-safe sibling-local-repo smoke or bounded no-safe-file finding
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
