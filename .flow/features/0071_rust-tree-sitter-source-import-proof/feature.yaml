feature:
  id: "0071"
  slug: rust-tree-sitter-source-import-proof
  title: Rust Tree-sitter source import proof
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: Feature 0063 admitted Rust conditionally, but Rust source import is
    still blocked until an exact tree-sitter-rust revision, provenance, license,
    scanner/parser, BOM, core compatibility, size, and no-provider stability
    evidence are proven.
  outcome: A pinned tree-sitter-rust source set is vendored with provenance, BOM,
    license, parser/scanner, core-compatibility, size, validation, and
    no-provider evidence, while Rust runtime support remains absent.
  acceptance:
    - Import a narrow pinned tree-sitter-rust source set under a revisioned
      third_party path with provenance and imported-file manifest.
    - Record license, notice, generated parser, scanner, BOM, excluded file
      classes, core compatibility, source-size, and .rs path admission evidence.
    - Add public evidence at docs/tree-sitter-rust-source-import.md.
    - Do not add Rust build proof, query fixtures, extraction, runtime provider,
      inspect output, report schema, scoring, cache, CI, package, release,
      network, telemetry, upload, remote enrichment, Cargo, crate graph, module
      resolution, macro expansion, type checking, LSP, or custom query
      execution.
    - Preserve existing provider outputs and no-provider outputs.
planning:
  state: ready
  summary: Shape the Rust source-import proof as the first implementation step
    after admission, with no build, query, extraction, or runtime exposure.
  brief_sync:
