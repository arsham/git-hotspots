context:
  roadmap_item_id: null
  detached_reason: No active roadmap candidate existed after Feature 0003. Current
    self-smoke showed reports dominated by `.flow/*`; this detached feature
    improves report usefulness before adding providers, cache, or broader UX.
  depends_on_feature_ids:
    - "0002"
    - "0003"
  blocked_by: []
design:
  rough_shape:
    - Extend CLI parsing and help with repeatable `--exclude-prefix PATH`; keep
      existing `--repo`, `--limit`, `--format`, and `--since` behaviour intact.
    - Add scope/filter fields to the shared model/config/report data so table
      and JSON render the same scope metadata from one evidence model.
    - Validate prefixes as repo-relative literals and reject empty, absolute,
      parent-traversal, NUL/control-character, or ambiguous inputs with clear
      stderr errors.
    - Apply filtering at Git-change ingestion before per-file aggregation and
      co-change pair expansion so excluded paths cannot influence ranking or
      visible co-change summaries.
    - Track deterministic bounded exclusion counts, at minimum excluded distinct
      path count and excluded change/numstat row count; do not dump raw excluded
      path lists by default.
    - Add fixtures for noisy `.flow/`-like paths, normal source paths, unusual
      path names, invalid prefixes, deleted/renamed paths, large mixed commits,
      and `--since` ranges containing excluded-only changes.
    - Update validation and README with scoped examples and privacy-safe
      evidence; keep public docs visitor-facing and OSS-safe.
  packets:
    - id: P1
      depends_on: []
      status: planned
      title: Explicit prefix filter contract
      goal: Add repeatable `--exclude-prefix PATH` parsing, validation, config/model
        fields, and help text without changing default unfiltered behaviour.
      owner_phase: runner
      execution_context:
        - "Anchors: src/main.zig, src/model.zig, README.md/help text,
          tests/integration.sh."
        - "In scope: parse repeatable exclude-prefix flags; store normalized
          repo-relative prefixes; reject empty, absolute, parent-traversal, and
          control-character inputs with clear stderr; document no-glob prefix
          semantics."
        - "Out of scope: default exclusions, include flags, config files,
          glob/pathspec/gitignore compatibility, providers, cache, release/CI
          work."
        - "Protected: default command behaviour remains unfiltered when no
          prefix is supplied; existing flags and error handling stay
          compatible."
        - "Dependencies: Feature 0002 executable/report model and Feature 0003
          validation workflow are complete."
        - "Validation/evidence: zig fmt --check build.zig src tests; zig build
          test; invalid-prefix fixture cases; `zig build run -- --help` shows
          the new option."
        - "Review focus: validation is strict and deterministic, user input
          cannot produce absolute/private paths in output, and help text is
          public/OSS-safe."
        - "Escalate if: honest user control appears to require globs,
          include/exclude precedence, config files, or default project scopes."
        - "Done boundary: CLI accepts and validates explicit prefixes but no
          filtered ranking semantics are required until P2."
      verification_commands:
        - zig fmt --check build.zig src tests
        - zig build test
        - zig build run -- --help
    - id: P2
      depends_on:
        - P1
      status: planned
      title: Filtered aggregation and scope metadata
      goal: Apply exclude prefixes before aggregation, ranking, and co-change
        evidence, then expose deterministic scope metadata in table and JSON
        reports.
      owner_phase: runner
      execution_context:
        - "Anchors: src/git.zig, src/model.zig, src/scoring.zig, src/report.zig,
          tests/integration.sh, tools/setup-fixtures.sh,
          fixtures/expected/basic.json."
        - "In scope: filter numstat paths before per-file stats and co-change
          expansion; track excluded distinct path and change counts; ensure
          result limit applies after filtering; emit analysis.scope in JSON and
          a compact table scope line when active."
        - "Out of scope: scoring formula redesign except filtered candidate set,
          raw excluded path lists, default/generated/vendor detection, author
          metrics, cache, providers."
        - "Protected: excluded paths must not appear in results, cochanges,
          table rows, or validation summaries; empty scoped reports are
          successful explainable reports."
        - "Dependencies: P1 CLI/model contract exists."
        - "Validation/evidence: fixtures prove `.flow/` high-churn paths are
          excluded by `--exclude-prefix .flow/`; default unfiltered fixture
          still sees them; deterministic JSON diff passes; empty scoped result
          fixture passes."
        - "Review focus: filtering precedes score/co-change/limit, JSON key
          order remains stable, counts are deterministic and privacy-safe."
        - "Escalate if: filtering cannot be implemented without changing Git
          history semantics, score formulas, or JSON in a breaking way."
        - "Done boundary: scoped reports are correct and transparent in table
          and JSON."
      verification_commands:
        - zig build test
        - zig build validate
        - ./zig-out/bin/git-hotspots --repo . --exclude-prefix .flow/ --limit 10
          --format json
    - id: P3
      depends_on:
        - P2
      status: planned
      title: Validation and public docs
      goal: Extend canonical validation and visitor-facing docs so scope filtering
        stays tested, privacy-safe, and easy to use for public/demo reports.
      owner_phase: runner
      execution_context:
        - "Anchors: tools/validate.sh, tests/integration.sh,
          tools/setup-fixtures.sh, README.md."
        - "In scope: add validation rungs for scoped fixture output, this-repo
          scoped smoke, invalid prefix stderr, no excluded co-change leakage,
          and privacy-safe scope summaries; update README examples succinctly."
        - "Out of scope: Flow process clutter in README, raw private smoke
          outputs, package/release/CI work, hosted/commercial strategy, Markdown
          report format."
        - "Protected: README remains polished and visitor-facing; docs frame
          filters as scope controls over investigation evidence, not quality or
          risk truth."
        - "Dependencies: P2 filtering/reporting behaviour exists."
        - "Validation/evidence: `zig build validate`; close-out mode with
          sibling/local repo or explicit skip reason; `git diff --check`; `flow
          validate --target feature:0004 --format json` after implementation."
        - "Review focus: validation proves real-repo `.flow/` exclusion and
          opt-in unfiltered behaviour without committing absolute local paths,
          private repo names, raw reports, or author identities."
        - "Escalate if: validation needs private artefacts, network/fetch
          behaviour, default exclusions, or new dependencies."
        - "Done boundary: future runs can rely on `zig build validate` to catch
          scope-filter regressions and README explains the feature without
          overclaiming."
      verification_commands:
        - zig build validate
        - zig build test
        - git diff --check
  packet_contract:
    version: v1
    owner_model: phase_owned
    review_sequence:
      - spec_compliance
      - code_quality
    verification_required: true
    required_packet_fields:
      - id
      - title
      - goal
      - depends_on
      - status
      - owner_phase
      - execution_context
      - verification_commands
  output_contract:
    cli_flags:
      - --exclude-prefix PATH (repeatable; repo-relative literal prefix; no glob
        semantics)
    default_scope: unfiltered all tracked Git-history paths unless explicit exclude
      prefixes are supplied
    table_output: When filters are active, include a compact scope line with
      prefixes and excluded counts before ranked results.
    json_output: Include analysis.scope with active boolean, exclude_prefixes array,
      excluded_path_count, excluded_change_count, and caveats when the scoped
      universe is empty or filters are active.
    privacy: Report only project-relative prefixes and bounded counts; do not
      include absolute local paths, private repo names, raw private reports,
      author identities, remote URLs, or raw excluded path dumps.
    deferred:
      - default project scope
      - include filters
      - glob/pathspec/gitignore semantics
      - config files
      - generated/vendor detection
      - provider-driven classification
