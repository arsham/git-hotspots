  acceptance_contract:
    outcome: Add explicit repo-relative path-prefix exclusion for hotspot analysis,
      with visible scope metadata in table and JSON output, so users can produce
      focused reports such as excluding `.flow/` while preserving the unfiltered
      default behaviour and local-first evidence model.
    acceptance:
      - The CLI accepts repeatable `--exclude-prefix PATH` arguments using
        simple repo-relative literal path-prefix semantics; empty, absolute,
        parent-traversal, or control-character inputs fail clearly on stderr
        without panic.
      - Default output remains unfiltered when no exclude prefixes are supplied,
        preserving prior all-tracked-path visibility and deterministic behaviour
        except for additive scope metadata if implemented globally.
      - When exclude prefixes are supplied, filtering happens before
        aggregation, score calculation, co-change calculation, and result
        limiting; excluded paths do not appear in result paths or co-change
        paths.
      - Table output visibly reports active scope when filters are used,
        including the supplied prefixes and bounded exclusion counts, while
        keeping paths project-relative.
      - JSON output includes deterministic `analysis.scope` metadata with active
        filters, supplied exclude prefixes, excluded path/change counts, and no
        absolute paths or raw private report dumps.
      - An empty scoped result set is a valid explainable report, not an
        empty-repository or non-git error.
      - README and help document prefix semantics, scoped examples such as
        excluding `.flow/`, and the fact that filters change the evidence
        universe without implying bug prediction, quality scoring, or developer
        judgement.
      - "Validation proves scoped filtering on fixtures and on this repository:
        `--exclude-prefix .flow/` removes `.flow/**` rows and co-change evidence
        while an unfiltered run can still analyse those paths."
      - The feature introduces no providers, cache/database, config files,
        glob/pathspec/gitignore engine, network access, telemetry, author
        metrics, hosted/commercial content, or scoring formula redesign beyond
        filtered candidate selection.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - zig fmt --check build.zig src tests
      - zig build test
      - zig build run -- --help
      - zig build validate
      - ./zig-out/bin/git-hotspots --repo . --exclude-prefix .flow/ --limit 10
        --format json
      - git diff --check
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
  decision_budget:
    allowed_local_decisions:
      - safe internal refactor inside dispatched scope
      - local implementation detail changes that do not alter contracts
    deferred_reconcile_triggers:
      - minor non-contract deviation worth reviewer visibility
      - implementation trade-off that stays inside acceptance
    hard_planner_escalation_triggers:
      - scope or acceptance change
      - dependency or prerequisite change
      - protected-surface mutation outside dispatch envelope
    protected_surfaces: []
  fallback_path: deferred_reconcile_decision
  notes: null
