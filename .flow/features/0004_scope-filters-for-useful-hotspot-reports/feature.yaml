schema: flow-feature.v1
feature:
  id: "0004"
  slug: scope-filters-for-useful-hotspot-reports
  title: Scope filters for useful hotspot reports
  lane: standard
  status: ready
  autonomy_default: ask
intent:
  problem: The file-level CLI spike is executable and validated, but reports
    currently aggregate every Git-tracked path with no user-controlled scope. On
    this repository, Flow lifecycle artefacts dominate the top results, which
    makes public, demo, and source-oriented reports noisy. Users need a small
    deterministic way to exclude known local workflow or generated path prefixes
    without hiding evidence silently or introducing a broad ignore/config
    system.
  outcome: Add explicit repo-relative path-prefix exclusion for hotspot analysis,
    with visible scope metadata in table and JSON output, so users can produce
    focused reports such as excluding `.flow/` while preserving the unfiltered
    default behaviour and local-first evidence model.
  acceptance:
    - The CLI accepts repeatable `--exclude-prefix PATH` arguments using simple
      repo-relative literal path-prefix semantics; empty, absolute,
      parent-traversal, or control-character inputs fail clearly on stderr
      without panic.
    - Default output remains unfiltered when no exclude prefixes are supplied,
      preserving prior all-tracked-path visibility and deterministic behaviour
      except for additive scope metadata if implemented globally.
    - When exclude prefixes are supplied, filtering happens before aggregation,
      score calculation, co-change calculation, and result limiting; excluded
      paths do not appear in result paths or co-change paths.
    - Table output visibly reports active scope when filters are used, including
      the supplied prefixes and bounded exclusion counts, while keeping paths
      project-relative.
    - JSON output includes deterministic `analysis.scope` metadata with active
      filters, supplied exclude prefixes, excluded path/change counts, and no
      absolute paths or raw private report dumps.
    - An empty scoped result set is a valid explainable report, not an
      empty-repository or non-git error.
    - README and help document prefix semantics, scoped examples such as
      excluding `.flow/`, and the fact that filters change the evidence universe
      without implying bug prediction, quality scoring, or developer judgement.
    - "Validation proves scoped filtering on fixtures and on this repository:
      `--exclude-prefix .flow/` removes `.flow/**` rows and co-change evidence
      while an unfiltered run can still analyse those paths."
    - The feature introduces no providers, cache/database, config files,
      glob/pathspec/gitignore engine, network access, telemetry, author metrics,
      hosted/commercial content, or scoring formula redesign beyond filtered
      candidate selection.
planning:
  state: ready
  summary: Narrow implementation feature for explicit path-prefix scope filters.
    Add repeatable `--exclude-prefix PATH`, apply it before aggregation,
    ranking, limiting, and co-change evidence, disclose active scope and
    exclusion counts, and validate with fixtures plus real-repo smoke. Defaults
    remain unfiltered; default project scopes, includes, globs, config files,
    gitignore emulation, providers, cache, and scoring redesign are deferred.
  brief_sync:
    status: unchanged
    reason: Feature 0004 is a follow-up implementation slice within B001 boundaries;
      B001 remains current and does not require edits.
    checked_at: 2026-05-22T01:57:01.801Z
  brief_alignment:
    status: aligned
    role: follow_up
    summary: Feature 0004 improves B001's local-first file-level reporting by adding
      explicit scope controls while preserving deterministic evidence and
      deferring providers/cache/default ignore policy.
    checked_at: 2026-05-22T01:57:01.801Z
