    supporting_context:
      - source_ref: prd.md#problem[1]
        text: The relationship fixture set now covers many admitted provider lanes, but
          the coverage expectations are implicit. The 0110 realism audit and
          0111 Zig golden work showed that fixture representativeness can drift
          silently when a lane is small, when a cap is not stable enough for a
          public golden, or when a lane lacks uncertainty and omission coverage.
      - source_ref: prd.md#outcome[1]
        text: Add a durable validation or documentation matrix that records expected
          relationship-golden coverage categories per admitted lane. The matrix
          should help future provider/report changes preserve representative
          fixture coverage without changing runtime behaviour or public evidence
          semantics.
    notes:
      - Extracted requirements from PRD requirement, acceptance, behaviour,
        constraint, edge-case, verification, or case sections.
      - Supporting context and structural headings are not close-out required;
        kept 2 refs outside default requirement rows.
  acceptance_contract:
    outcome: Add a durable relationship fixture realism matrix and validation hook
      covering admitted relationship goldens without changing runtime, provider,
      CLI, JSON, scoring, or release surfaces.
    acceptance:
      - Matrix covers Python, JavaScript, Go, Lua, Rust, TSX, TypeScript, and
        Zig relationship goldens.
      - Matrix records relation-kind diversity, unknown/unresolved coverage,
        human display omissions, provider-cap coverage or rationale, caveat
        diversity, and duplicate-looking guard coverage where relevant.
      - Validation detects or explicitly reviews matrix drift.
      - Runtime/provider/CLI/JSON/scoring/cache/network/telemetry/release/tag/remote/package/publish
        surfaces remain unchanged.
      - git diff --check, zig build test, and zig build validate pass.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify all admitted relationship lanes are covered by the matrix
      - verify provider-cap absence has lane-level rationale, not only a global
        note
      - verify validation detects or reviews matrix drift
      - verify no runtime or public contract drift
  decision_budget:
    allowed_local_decisions:
      - choose docs versus validation metadata placement inside dispatched scope
      - add lane-level provider-cap rationale where deterministic cap coverage
        is absent
      - adjust validation assertion wording without changing runtime contract
    deferred_reconcile_triggers:
      - a lane has limited diversity but explicit rationale is recorded
      - provider-cap absence is lane-specific and explained without golden
        changes
    hard_planner_escalation_triggers:
      - runtime/provider/CLI/JSON/schema/scoring change appears necessary
      - provider-cap coverage would require brittle private or oversized fixture
        assumptions
      - matrix cannot cover all admitted lanes
      - protected surface drift
    protected_surfaces:
      - runtime behaviour
      - CLI flags and options
      - JSON schema and report fields
      - relationship provider algorithms and admission
      - relationship semantics sorting and caps
      - scoring ranking and confidence
      - cache network telemetry release tag remote package and publish behaviour
      - private paths remotes identities diagnostics raw reports and commit
        messages
  fallback_path: deferred_reconcile_decision
  notes: null
