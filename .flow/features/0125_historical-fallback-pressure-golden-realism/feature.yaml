  acceptance_contract:
    outcome: The fixture either demonstrates multi-hunk fallback pressure
      deterministically or records a tracked no-change proof explaining why
      current real-repo audit evidence remains sufficient.
    acceptance:
      - A deterministic multi-hunk fallback-pressure fixture/golden is added, or
        a tracked no-change proof explains why not.
      - Historical-symbol JSON, Markdown, table goldens, docs, and validation
        agree after the change or proof.
      - "Mixed parsed revision behaviour from feature 0124 remains preserved:
        symbol-intersecting hunks remain attributed and only unmatched hunks
        contribute fallback pressure."
      - Unsupported, skipped, and failed whole-file fallback semantics remain
        unchanged.
      - No CLI, schema, scoring, ranking, provider admission,
        release/tag/package/remote, network, telemetry, or cache behaviour
        changes.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify selected fixture-or-proof branch against PRD
      - inspect historical-symbol goldens together if changed
      - verify 0124 mixed parsed revision behaviour remains protected
      - run credible validation gates independently
  decision_budget:
    allowed_local_decisions:
      - choose fixture branch if deterministic and safe
      - choose tracked no-change proof if fixture seam is brittle
      - small docs or validation anchor updates matching chosen branch
    deferred_reconcile_triggers:
      - fixture branch selection and rationale
      - minor docs or validation anchor adjustment inside acceptance
    hard_planner_escalation_triggers:
      - runtime attribution behaviour change
      - CLI or schema change
      - provider admission change
      - nearest-symbol guessing
      - timeout or unavailable injection
      - brittle environment-dependent fixture requirement
    protected_surfaces:
      - runtime attribution behaviour
      - CLI flags
      - JSON schema
      - scoring and ranking
      - provider admission
      - release tag package remote state
      - network telemetry cache behaviour
      - nearest-symbol guessing
      - timeout or unavailable injection
  fallback_path: deferred_reconcile_decision
  notes: null
