intent:
  problem: After internal relation provider and aggregation proof, users still
    need a safe opt-in public way to inspect relationship evidence. Adding this
    too early or too broadly could drift default reports, overclaim dependency
    truth, or leave docs/tests inconsistent.
  outcome: Add an explicit opt-in public relationship report surface after 0084
    and 0085 close. Output must be additive, bounded, deterministic, caveated,
    privacy-safe, and evidence-only across table, JSON, Markdown, docs, man
    page, tests, and validation.
  acceptance:
    - An explicit opt-in CLI/report surface exposes relation evidence; default
      output remains unchanged.
    - JSON, table, and Markdown outputs expose bounded relation evidence with
      endpoints, relation kind, evidence basis, confidence, caveats, omitted
      counts where relevant, and deterministic ordering.
    - Invalid combinations produce actionable diagnostics without full usage
      dumps.
    - README, user guide, developer guide if needed, man page, integration
      tests, fixtures, and validation are updated together.
    - Public wording treats relationships as investigation prompts, not
      call-graph truth, dependency proof, ownership, code-quality judgement,
      developer metrics, or bug prediction.
    - Real-repository close-out smoke records only privacy-safe labels and
      bounded counts.
    - B002 is linked and validates; independent delegated review is required for
      close-out.
