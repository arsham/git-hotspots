  acceptance_contract:
    outcome: Reduce one concrete avoidable historical-symbol fallback case with
      deterministic evidence, or produce a source-backed no-change proof if the
      selected case cannot be improved safely.
    acceptance:
      - Selected fallback case is explicitly identified and justified from
        current fixture or this-repo evidence.
      - Runtime change, if any, reduces fallback only through deterministic
        revision-local evidence and never nearest-symbol guessing.
      - Table, JSON, and Markdown goldens are updated together when behaviour
        changes.
      - Provider-state and fallback-pressure validation continue to pass.
      - No runtime change branch is allowed only with a source-backed proof and
        no hidden implementation opportunity.
  validation_contract:
    ladders:
      - V2_atomic_commit
      - V3_final_packet
      - V4_close_out
    review_sequence:
      - spec_compliance
      - code_quality
    packet_verification_commands:
      - git diff --check
      - zig build test
      - zig build validate
    reviewer_must_repeat: true
    claim_classes: []
    evidence_policy:
      parity_claims: null
      synthetic_only_is_insufficient: false
    route_matrix:
      required: false
      routes: []
    resolution_matrix:
      required: false
      cases: []
    operator_examples:
      required: false
      cases: []
  ownership:
    reviewer_expectations:
      - verify acceptance against dispatch comparison basis
      - treat runner evidence as untrusted until independently checked
      - verify selected case is deterministic and source-backed
      - verify no unsafe attribution or nearest-symbol guessing
      - verify provider-state and fallback-pressure guards still pass
      - verify table JSON and Markdown goldens update together if behaviour
        changes
  decision_budget:
    allowed_local_decisions:
      - choose the single deterministic fallback case inside P1
      - choose the no-runtime-change proof branch if no safe case exists
      - local implementation details that preserve schema and evidence semantics
    deferred_reconcile_triggers:
      - no-change proof branch selected
      - minor implementation trade-off inside acceptance
      - fixture/docs metadata alignment needed after implementation
    hard_planner_escalation_triggers:
      - nearest-symbol or adjacency guessing would be required
      - schema or CLI change would be required
      - provider admission or scoring/ranking change would be required
      - more than one attribution case is needed
      - timeout or unavailable provider state seam is introduced
    protected_surfaces:
      - JSON schema
      - CLI flags
      - provider admission
      - scoring/ranking
      - release/tag/package/remote/network/telemetry/cache behaviour
      - unsupported/skipped/failed fallback honesty
      - no nearest-symbol guessing
  fallback_path: deferred_reconcile_decision
  notes: null
