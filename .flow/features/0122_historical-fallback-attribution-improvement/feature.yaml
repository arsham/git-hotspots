    fallback is honest, but we need one narrow deterministic product
    improvement, or an explicit proof that no safe improvement exists, before
    broader attribution work.
  outcome: Reduce one concrete avoidable historical-symbol fallback case with
    deterministic evidence, or produce a source-backed no-change proof if the
    selected case cannot be improved safely.
  acceptance:
