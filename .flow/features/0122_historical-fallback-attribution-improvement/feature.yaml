      fixture or this-repo evidence.
    - Runtime change, if any, reduces fallback only through deterministic
      revision-local evidence and never nearest-symbol guessing.
    - Table, JSON, and Markdown goldens are updated together when behaviour
      changes.
    - Provider-state and fallback-pressure validation continue to pass.
    - No runtime change branch is allowed only with a source-backed proof and no
      hidden implementation opportunity.
