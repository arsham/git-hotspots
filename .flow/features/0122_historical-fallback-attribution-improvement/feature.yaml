    supporting_context:
      - source_ref: prd.md#problem[1]
        text: Historical-symbol evidence now covers successful, unsupported, skipped,
          and failed provider states, but real-repository audits still show
          fallback hunk pressure can be high. Some fallback pressure is expected
          and honest, but the next product improvement should determine whether
          one narrow attribution case can reduce avoidable fallback without
          guessing.
      - source_ref: prd.md#problem[2]
        text: The implementation must improve precision only where evidence is
          deterministic. It must not infer nearest symbols for unsafe hunks,
          invent historical lineage, or turn fallback pressure into scoring,
          ranking, ownership, dependency, or bug prediction claims.
      - source_ref: prd.md#outcome[1]
        text: Reduce one concrete, audit-backed historical-symbol fallback case by
          improving revision-local hunk-to-symbol attribution or by proving that
          no safe improvement exists for that case.
      - source_ref: prd.md#outcome[2]
        text: The delivered change should be small enough to explain in fixtures and
          should preserve all existing provider-state, fallback-pressure, and
          caveat semantics.
